<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Phiếu trả lời</title>
  <style>
    :root{--ink:#17302f;--muted:#64726f;--teal:#1f675f;--teal2:#174d48;--soft:#e8f2ee;--ivory:#f4f2ec;--line:#d5dfdb;--white:#fff;--red:#a64035;--redbg:#fff0ed;--green:#277154;--greenbg:#eaf6ef;--font:Arial,"Segoe UI",Roboto,"Noto Sans",sans-serif}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:hidden;background:var(--ivory);color:var(--ink);font-family:var(--font)}
    button,input,select{font-family:var(--font);font-size:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(31,103,95,.22);outline-offset:2px}
    [hidden]{display:none!important}
    .frame{height:100%;padding:10px;display:grid;grid-template-rows:64px minmax(0,1fr);gap:10px}
    .topbar{min-width:0;padding:8px 14px;display:flex;align-items:center;gap:18px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.96);box-shadow:0 7px 22px rgba(20,55,51,.06)}
    .brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
    .brand-badge{display:grid;width:40px;height:40px;place-items:center;border-radius:50%;background:var(--teal);color:#fff;font-size:14px;font-weight:800}
    .brand-copy{display:grid;gap:2px}
    .brand-copy strong{font-size:17px;line-height:1.05}
    .eyebrow,.student span,.progress span,.gate label>span,.sheet-title,.saved{color:var(--teal);font-size:10px;font-weight:800;line-height:1.2;letter-spacing:.04em}
    .student{min-width:0;margin-left:auto;display:grid;text-align:right}
    .student strong{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
    .student small{color:var(--muted);font-size:11px}
    .progress{width:min(320px,28vw);display:grid;gap:6px}
    .progress>div{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
    .progress strong{color:var(--teal);font-size:20px}
    .track{height:8px;overflow:hidden;border-radius:99px;background:#dde7e3}
    .track i{display:block;width:0;height:100%;border-radius:inherit;background:var(--teal);transition:width .2s ease}
    .workspace{min-width:0;min-height:0;display:grid;grid-template-columns:minmax(0,1.42fr) minmax(440px,.9fr);gap:10px}
    body:not(.session-confirmed) .workspace{grid-template-columns:minmax(0,1fr)}
    body:not(.session-confirmed) .doc-pane{display:none}
    body:not(.session-confirmed) .right-pane{grid-column:1/-1}
    .doc-pane,.right-pane{min-width:0;min-height:0;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 12px 32px rgba(20,55,51,.08);overflow:hidden}
    .doc-pane{display:grid;grid-template-rows:42px minmax(0,1fr)}
    .doc-head{padding:0 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#f7faf8;color:var(--teal);font-size:10px;font-weight:800;letter-spacing:.04em}
    .doc-head a{color:var(--teal);text-decoration:none}
    .doc-pane iframe{width:100%;height:100%;border:0;background:#fff}
    .right-pane{position:relative}
    .gate{width:100%;height:100%;padding:clamp(22px,4vw,50px);display:flex;flex-direction:column;justify-content:center}
    .gate .kicker{margin:0 0 9px;color:var(--teal);font-size:11px;font-weight:800;letter-spacing:.04em}
    .gate h1{margin:0 0 10px;font-size:clamp(28px,2.4vw,38px);font-weight:800;line-height:1.08;letter-spacing:-.02em}
    .gate>p{margin:0 0 24px;color:var(--muted);font-size:14px;line-height:1.55}
    .gate label{display:grid;gap:8px;margin-bottom:14px}
    .gate input,.gate select{width:100%;height:56px;padding:0 15px;border:1px solid #c7d4cf;border-radius:10px;background:#fff;color:var(--ink);font-size:17px}
    .primary{min-height:52px;padding:0 18px;border:0;border-radius:10px;background:var(--teal);color:#fff;font-size:11px;font-weight:800;letter-spacing:.03em}
    .primary:hover{background:var(--teal2)}
    .primary:disabled{cursor:not-allowed;opacity:.55}
    .gate .primary{width:100%;margin-top:4px}
    .notice{margin:0 0 13px;padding:10px 12px;border:1px solid #efc4bc;border-radius:9px;background:var(--redbg);color:var(--red);font-size:12px;font-weight:700;line-height:1.4}
    .sheet{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
    .tabs{padding:9px;display:flex;gap:5px;overflow-x:auto;border-bottom:1px solid var(--line);background:#f7faf8;scrollbar-width:thin}
    .tabs button{flex:1 0 58px;height:42px;border:1px solid #cedad5;border-radius:9px;background:#fff;color:var(--muted);font-size:10px;font-weight:800}
    .tabs button.active{border-color:var(--teal);background:var(--teal);color:#fff}
    .tabs button.done:after{margin-left:4px;content:"✓";color:var(--green)}
    .tabs button.active.done:after{color:#fff}
    .sheet-head{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .sheet-head h2{margin:4px 0 0;font-size:25px;line-height:1;font-weight:800}
    .sheet-head>b{padding:6px 9px;border-radius:99px;background:var(--soft);color:var(--teal);font-size:11px}
    .rows{min-height:0;padding:11px 12px 18px;display:grid;align-content:start;gap:9px;overflow-y:auto;overscroll-behavior:contain;scrollbar-color:#aac1b8 transparent;scrollbar-width:thin}
    .answer-row{min-height:64px;display:grid;grid-template-columns:56px minmax(0,1fr);align-items:stretch;border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden}
    .answer-row.answered{border-color:#9fc6b7;box-shadow:0 0 0 2px rgba(31,103,95,.05)}
    .qnum{display:grid;place-items:center;border-right:1px solid var(--line);background:var(--soft);color:var(--teal);font-size:21px;font-weight:800}
    .answer-row input,.answer-row select{width:calc(100% - 20px);height:48px;margin:8px 10px;padding:0 14px;border:1px solid #c7d4cf;border-radius:8px;background:#fbfdfc;color:var(--ink);font-size:18px}
    .answer-row input:focus,.answer-row select:focus{border-color:var(--teal);background:#fff;outline:0;box-shadow:0 0 0 3px rgba(31,103,95,.1)}
    .letters{padding:8px 10px;display:grid;grid-template-columns:repeat(var(--choice-count,4),minmax(38px,1fr));gap:6px}
    .letters button{height:48px;border:1px solid #cbd8d3;border-radius:8px;background:#fbfdfc;color:var(--teal);font-weight:800}
    .letters button.selected{border-color:var(--teal);background:var(--teal);color:#fff}
    .sheet-foot{padding:9px 11px;display:flex;align-items:center;gap:7px;border-top:1px solid var(--line);background:#fff;box-shadow:0 -6px 18px rgba(20,55,51,.04)}
    .saved{margin-right:auto}
    .sheet-foot button{min-height:44px;padding:0 13px;border:1px solid #c8d5d0;border-radius:8px;background:#fff;color:var(--teal);font-size:10px;font-weight:800}
    .sheet-foot button:disabled{cursor:not-allowed;opacity:.35}
    .sheet-foot .grade{border-color:var(--teal);background:var(--teal);color:#fff}
    .result{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
    .result-head{padding:18px;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:15px;border-bottom:1px solid var(--line)}
    .score{display:flex;align-items:baseline;color:var(--teal)}
    .score strong{font-size:48px;line-height:1;font-weight:800}
    .score span{color:var(--muted);font-size:19px;font-weight:700}
    .result-head h2{margin:2px 0 5px;font-size:22px;font-weight:800}
    .result-head p{margin:0;color:var(--muted);font-size:12px}
    .sync{margin-top:5px;color:var(--green);font-size:11px;font-weight:700}
    .sync.error{color:var(--red)}
    .review-tools{padding:11px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);background:#f7faf8}
    .wrong-list{margin:0;color:var(--red);font-size:12px;line-height:1.5}
    .wrong-list strong{display:block;margin-bottom:2px;font-size:10px;letter-spacing:.04em}
    .review-filters{display:flex;gap:6px;flex:0 0 auto}
    .review-filters button{min-height:36px;padding:0 11px;border:1px solid #c8d5d0;border-radius:8px;background:#fff;color:var(--teal);font-size:10px;font-weight:800}
    .review-filters button.active{border-color:var(--teal);background:var(--teal);color:#fff}
    .reviews{min-height:0;padding:11px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;scrollbar-gutter:stable}
    .review{flex:0 0 auto;display:grid;grid-template-columns:64px minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
    .review.wrong{border-color:#ecc6bf}
    .review-num{padding:12px 4px;display:grid;align-content:start;justify-items:center;gap:6px;border-right:1px solid var(--line);background:var(--greenbg);color:var(--green)}
    .review.wrong .review-num{background:var(--redbg);color:var(--red)}
    .review-num strong{font-size:22px;font-weight:800}
    .review-num span{font-size:9px;font-weight:800}
    .review-body{padding:14px 15px}
    .review-answers{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;color:var(--muted);font-size:14px;line-height:1.45}
    .review-answers b{color:var(--ink)}
    .review-answers .correct{color:var(--green);font-size:16px}
    .explain{margin:12px 0 0;padding:12px 13px;border-left:4px solid var(--teal);background:var(--soft);color:#263f3c;font-size:14px;line-height:1.65}
    .explain strong{display:block;margin-bottom:5px;color:var(--teal);font-size:11px;letter-spacing:.05em}
    .explain p{margin:0}
    .result-foot{padding:10px 12px;display:grid;grid-template-columns:1fr;gap:8px;border-top:1px solid var(--line);background:#fff}
    .secondary{min-height:52px;padding:0 14px;border:1px solid #c8d5d0;border-radius:10px;background:#fff;color:var(--teal);font-size:10px;font-weight:800}
    @media(max-width:850px){
      html,body{height:auto;min-height:100%;overflow:auto}
      .frame{height:auto;min-height:100vh;grid-template-rows:auto auto}
      .topbar{flex-wrap:wrap}
      .student{order:3;width:100%;margin:0;text-align:left}
      .progress{margin-left:auto;width:45%}
      .workspace{grid-template-columns:1fr}
      .doc-pane{height:58vh;min-height:430px}
      .right-pane{height:78vh;min-height:620px}
    }
    @media(max-width:520px){
      .frame{padding:6px;gap:6px}
      .brand-copy strong{font-size:14px}.eyebrow{font-size:8px}
      .progress{width:100%}
      .workspace{gap:6px}
      .doc-pane{height:52vh}
      .right-pane{height:82vh}
      .gate{padding:24px 16px}
      .tabs{padding:6px;gap:3px}
      .tabs button{height:39px;font-size:9px}
      .sheet-head{padding:12px}
      .rows{padding:8px;gap:7px}
      .answer-row{grid-template-columns:48px minmax(0,1fr)}
      .saved{display:none}
      .sheet-foot button{flex:1;padding:0 8px}
      .review-tools{align-items:stretch;flex-direction:column}
      .review-filters button{flex:1}
      .result-foot{grid-template-columns:1fr}
    }
  </style>

</head>

    const TEST = APP.test;

    const questions = Array.from({length:TOTAL}, (_,index) => index + 1);
    const norm = value => String(value || "").normalize("NFKC").trim().toLowerCase().replace(/[’‘]/g,"'").replace(/[.!?]+$/g,"").trim().replace(/\s+/g," ");
    const contractionRules = [
      {pattern:/\bcan't\b/,replacements:["cannot"]},
      {pattern:/\bcan not\b/,replacements:["cannot"]},
      {pattern:/\bwon't\b/,replacements:["will not"]},
      {pattern:/\bshan't\b/,replacements:["shall not"]},
      {pattern:/\b([a-z]+)n't\b/,replacements:["$1 not"]},
      {pattern:/\bi'm\b/,replacements:["i am"]},
      {pattern:/\b(you|we|they|there)'re\b/,replacements:["$1 are"]},
      {pattern:/\b(i|you|we|they|he|she|it)'ll\b/,replacements:["$1 will"]},
      {pattern:/\b(i|you|we|they)'ve\b/,replacements:["$1 have"]},
      {pattern:/\b(i|you|we|they|he|she|it|there|that|what|who|where|when|how)'d\b/,replacements:["$1 had","$1 would"]},
      {pattern:/\b(he|she|it|there|that|what|who|where|when|how)'s\b/,replacements:["$1 is","$1 has"]},
      {pattern:/\blet's\b/,replacements:["let us"]}
    ];
    function answerForms(value){
      let forms = new Set([norm(value)]);
      contractionRules.forEach(rule => {
        const expanded = new Set(forms);
        forms.forEach(form => {
          if(rule.pattern.test(form)) rule.replacements.forEach(replacement => expanded.add(form.replace(rule.pattern,replacement)));
        });
        forms = expanded;
      });
      return forms;
    }
    function equivalent(left,right){
      const leftForms = answerForms(left);

    function verifyAnswerNormalization(){

        ["can't afford","cannot afford"],
        ["can't afford","can not afford"],
        ["I'm interested","I am interested"],
        ["I'd finished","I had finished"],
        ["I'd prefer","I would prefer"],
        ["he's waiting","he is waiting"],
        ["she's finished","she has finished"],
        ["in the direction of.","in the direction of"]

    function buildReview(answerSnapshot){
      let score = 0;

        if(correct) score++;
        return {...solution,submitted,correct};
      });

      const wrongOnly = mode === "wrong";
      document.querySelectorAll("#reviews .review").forEach(card => {
        card.hidden = wrongOnly && card.dataset.correct === "true";
      });
      $("showWrong").classList.toggle("active",wrongOnly);
      $("showAll").classList.toggle("active",!wrongOnly);
      $("showWrong").setAttribute("aria-pressed",String(wrongOnly));
      $("showAll").setAttribute("aria-pressed",String(!wrongOnly));
      $("reviews").scrollTop = 0;
    }

    function grade(){
      if(graded) return;
      if(!sessionConfirmed || !validIdentity(identity)){
        lockQuestionSurface();
        $("sheet").hidden = true;
        $("gate").hidden = false;
        $("gateNotice").textContent = "Xác nhận lại họ tên và lớp trước khi làm bài.";
        $("gateNotice").hidden = false;
        return;
      }
      const missing = questions.filter(number => !norm(answers[number]));
      if(missing.length){
        const first = locate(missing[0]);
        current = first.sectionIndex;
        renderTabs();
        renderRows();
        alert(`Còn ${missing.length} câu chưa điền. Bắt đầu từ EX ${first.exercise}, câu ${first.local}.`);
        return;
      }
      graded = true;
      $("grade").disabled = true;
      const answerSnapshot = {...answers};
      const result = buildReview(answerSnapshot);
      const completedAttemptId = attemptId;
      const record = {attemptId:completedAttemptId,completedAt:new Date().toISOString(),score:result.score,percent:result.percent,answers:answerSnapshot,identity:{...identity}};
      if(!history.some(item => item.attemptId === completedAttemptId)){
        history.push({attemptId:record.attemptId,completedAt:record.completedAt,score:record.score,percent:record.percent});
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(-50)));
      }
      localStorage.setItem(LAST_KEY, JSON.stringify(record));
      localStorage.removeItem(ACTIVE_KEY);
      showResult(record,false);
      postScore({attemptId:completedAttemptId,score:result.score,percent:result.percent,wrong:result.wrong,identity:{...identity},answers:answerSnapshot});
    }

    function showResult(record,restored){
      if(!sessionConfirmed || !validIdentity(identity) || !completeAnswers(record.answers) || !revealQuestionSurface()) return;
      const result = buildReview(record.answers || {});
      $("gate").hidden = true;
      $("sheet").hidden = true;
      $("result").hidden = false;
      $("progress").hidden = true;
      identity = record.identity || identity;
      showStudent();
      $("score").textContent = result.score;
      $("resultTitle").textContent = result.score === TOTAL ? `Hoàn thành ${TOTAL}/${TOTAL}` : `${result.wrong} câu cần sửa`;
      $("resultMeta").textContent = `Điểm ${result.score}/${TOTAL} · ${result.percent}%`;
      setSync(restored ? (localStorage.getItem(sentKey(record.attemptId)) ? "Đã lưu điểm" : "Điểm của lượt gần nhất") : "Đang lưu điểm…");
      $("wrongList").replaceChildren();
      const wrongLabel = document.createElement("strong");
      wrongLabel.textContent = result.wrong ? "CÂU SAI" : "KẾT QUẢ";
      $("wrongList").append(wrongLabel,document.createTextNode(result.wrong ? formatWrongList(result.review) : "Không có câu sai."));
      $("showWrong").textContent = `CÂU SAI (${result.wrong})`;
      $("showWrong").hidden = result.wrong === 0;
      $("showAll").textContent = `TẤT CẢ (${TOTAL})`;
      $("reviews").innerHTML = "";
      result.review.forEach(item => {
        const place = locate(item.globalNumber);
        const card = document.createElement("article");
        card.className = `review${item.correct ? "" : " wrong"}`;
        card.dataset.correct = String(item.correct);
        const number = document.createElement("div");
        number.className = "review-num";
        const numberStrong = document.createElement("strong");
        numberStrong.textContent = place.local;
        const exercise = document.createElement("span");
        exercise.textContent = `EX ${place.exercise}`;
        const status = document.createElement("span");
        status.textContent = item.correct ? "ĐÚNG" : "SAI";
        number.append(numberStrong,exercise,status);
        const body = document.createElement("div");
        body.className = "review-body";
        const answersLine = document.createElement("div");
        answersLine.className = "review-answers";
        const mine = document.createElement("span");
        mine.textContent = "Em: ";
        const mineAnswer = document.createElement("b");
        mineAnswer.textContent = item.submitted;
        mine.append(mineAnswer);
        const key = document.createElement("span");
        key.textContent = "Đáp án: ";
        const keyAnswer = document.createElement("b");
        keyAnswer.className = "correct";
        keyAnswer.textContent = item.displayAnswer;
        key.append(keyAnswer);
        answersLine.append(mine,key);
        const explanation = document.createElement("div");
        explanation.className = "explain";
        const explanationTitle = document.createElement("strong");
        explanationTitle.textContent = "GIẢI THÍCH";
        const explanationText = document.createElement("p");
        explanationText.textContent = item.explanation || "Chưa có giải thích cho câu này.";
        explanation.append(explanationTitle,explanationText);
        body.append(answersLine,explanation);
        card.append(number,body);
        $("reviews").append(card);
      });
      setReviewFilter(result.wrong ? "wrong" : "all");
      if(restored && !localStorage.getItem(sentKey(record.attemptId))){
        setSync("Đang lưu điểm…");
        postScore({attemptId:record.attemptId,score:result.score,percent:result.percent,wrong:result.wrong,identity:{...identity},answers:{...record.answers}});
      }
    }

    const sentKey = id => `${STORAGE_PREFIX}:${TEST.testId}:sent:${id}`;

    function canPostScore(snapshot){
      if(!sessionConfirmed || submitting || !snapshot || !snapshot.attemptId || snapshot.attemptId !== attemptId) return false;
      if(!validIdentity(snapshot.identity) || !sameIdentity(snapshot.identity,identity) || !completeAnswers(snapshot.answers)) return false;
      const verified = buildReview(snapshot.answers);
      return Number(snapshot.score) === verified.score && Number(snapshot.percent) === verified.percent && Number(snapshot.wrong) === verified.wrong;
    }

    function postScore(snapshot){
      if(!canPostScore(snapshot)){
        setSync("Chưa lưu được điểm.",true);
        return;
      }
      const key = sentKey(snapshot.attemptId);
      if(localStorage.getItem(key)){
        setSync("Đã lưu điểm");
        return;
      }
      submitting = true;
      $("retry").disabled = true;
      const target = $("scoreTarget");
      const form = document.createElement("form");
      form.method = "POST";
      form.action = FORM_URL;
      form.target = target.name;
      form.hidden = true;
      const values = {
        [ENTRIES.name]:snapshot.identity.name,
        [ENTRIES.total]:String(TOTAL),
        [ENTRIES.assignmentCode]:`${APP.course.courseName} - Test Unit ${TEST.unitNumber}`,
        [ENTRIES.lesson]:`${APP.course.courseName} – Unit ${TEST.unitNumber}`,
        [ENTRIES.activity]:`${TEST.topic} – Bài kiểm tra làm lại`,
        [ENTRIES.className]:snapshot.identity.className,
        [ENTRIES.percent]:String(snapshot.percent),
        [ENTRIES.score]:String(snapshot.score),
        [ENTRIES.wrong]:String(snapshot.wrong)
      };
      Object.entries(values).forEach(([name,value]) => {
        const input = document.createElement("input");
        input.name = name;
        input.value = value;
        form.append(input);
      });
      document.body.append(form);
      let settled = false;
      const finish = success => {
        if(settled) return;
        settled = true;
        submitting = false;
        $("retry").disabled = false;
        if(success){
          localStorage.setItem(key,new Date().toISOString());
          setSync("Đã lưu điểm");
        }else{
          setSync("Chưa lưu được điểm. Vui lòng kiểm tra mạng.",true);
        }
        form.remove();
      };
      target.addEventListener("load", () => finish(true), {once:true});
      form.submit();
      setTimeout(() => finish(false),12000);
    }

    $("retry").onclick = () => {
      if(submitting) return;
      startAttempt();
    };
    $("showWrong").onclick = () => setReviewFilter("wrong");
    $("showAll").onclick = () => setReviewFilter("all");

    verifyAnswerNormalization();
    load();
  </script>
  <script src="../../vf-course-navigation.53e975c9a910.js"></script>
