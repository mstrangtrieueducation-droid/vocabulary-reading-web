    <header class="app-header">
      <div class="app-title"><span class="brand-mark" aria-hidden="true">RI2</span><div><p class="app-kicker" id="app-course">READING INTENSIVE</p><h1 id="app-title">Làm lại đề</h1></div></div>

  <script id="ri2-unit-data" type="application/json">{"unit":8,"title":"READING INTENSIVE 2 · UNIT 8","testCode":"RI2-U08","total":64,"studentPreviewUrl":"https://docs.google.com/document/d/1VUKgBs7-33zddKajjbzTIgxIlQAuc0G1Xv94PHZzssk/preview","sections":[{"exercise":1,"count":15,"inputKind":"matching","choices":["A","B","C","D","E","F","G","H","I","K","L","M","O","P","Q"],"instruction":"Ex 1: Match the words in Column A with their correct definitions in Column B. Write the letter of the definition next to the corresponding word.","questions":[{"number":1,"answer":"K","context":"perception (n)","explanation":"Giải thích của cô: Perception: Cách bạn hiểu hoặc giải thích một điều gì đó.\nPerception là danh từ chỉ cách một người nhận biết, hiểu hoặc diễn giải sự vật. Định nghĩa K ‘The way you understand or interpret something’ tương ứng trực tiếp."},{"number":2,"answer":"H","context":"voyage (n)","explanation":"Giải thích của cô: Voyage: Một chuyến đi dài, đặc biệt là bằng đường biển hoặc trong không gian.\nVoyage là danh từ chỉ hành trình dài, thường bằng tàu biển hoặc tàu vũ trụ. Hai dấu hiệu này đều có trong định nghĩa H."},{"number":3,"answer":"M","context":"statue (n)","explanation":"Giải thích của cô: Statue: Một bức tượng lớn, thường được tạc bằng đá, kim loại hoặc các vật liệu khác, biểu thị một người hoặc động vật.\nStatue là danh từ chỉ hình người hoặc con vật được tạc/đúc bằng đá, kim loại hay vật liệu khác. Vì vậy ghép với định nghĩa M."},{"number":4,"answer":"O","context":"log (v)","explanation":"Giải thích của cô: Log: Chặt cây lấy gỗ, đặc biệt là để xây dựng hoặc các mục đích sử dụng khác.\nLog ở nghĩa động từ là đốn cây để lấy gỗ. Định nghĩa O nêu đúng hành động ‘cut down trees for wood’ và mục đích sử dụng gỗ."},{"number":5,"answer":"F","context":"administer (v)","explanation":"Giải thích của cô: Administer: Quản lý hoặc tổ chức một cái gì đó, đặc biệt là một quá trình hoặc một nhóm.\nAdminister là động từ chỉ điều hành, quản lý hoặc tổ chức một quy trình/nhóm. Nội dung này trùng chính xác với F."},{"number":6,"answer":"Q","context":"abandon (v)","explanation":"Giải thích của cô: Abandon: Rời bỏ thứ gì đó hoặc ai đó phía sau, thường là vì bạn không còn muốn hoặc không thể chăm sóc chúng nữa.\nAbandon là động từ chỉ bỏ lại người/vật, thường không quay lại chăm sóc. Định nghĩa Q diễn đạt đầy đủ nghĩa và hoàn cảnh ấy."},{"number":7,"answer":"A","context":"mineral (n)","explanation":"Giải thích của cô: Mineral: Khoáng chất, một chất tự nhiên thường được tìm thấy trong lòng đất và có cấu trúc hóa học cụ thể.\nMineral là danh từ chỉ chất tự nhiên có cấu trúc hóa học xác định, thường tìm thấy trong đất/đá. Vì vậy A là định nghĩa tương ứng."},{"number":8,"answer":"C","context":"consent (v)","explanation":"Giải thích của cô: Consent: Đồng ý với một điều gì đó, thường là sau khi đã suy nghĩ kỹ.\nConsent ở đây là động từ nghĩa là đồng ý/cho phép sau khi cân nhắc. Định nghĩa C nêu trực tiếp hành động ‘agree to something’."},{"number":9,"answer":"E","context":"abundant (a)","explanation":"Giải thích của cô: Abundant: Nhiều, dồi dào, có sẵn với số lượng lớn hoặc dễ tìm kiếm.\nAbundant là tính từ chỉ có rất nhiều hoặc dồi dào. Định nghĩa E ‘available in large quantities or easy to find’ khớp chính xác."},{"number":10,"answer":"B","context":"objective (n)","explanation":"Giải thích của cô: Objective: Mục tiêu, điều mà bạn muốn đạt được.\nObjective ở nghĩa danh từ là mục tiêu cần đạt. Vì B định nghĩa ‘A goal or something you want to achieve’, B là cặp tương ứng."},{"number":11,"answer":"P","context":"intentional (a)","explanation":"Giải thích của cô: Intentional: Cố ý, một điều gì đó được làm có mục đích chứ không phải do tai nạn.\nIntentional là tính từ mô tả hành động có chủ đích, không vô tình. Định nghĩa P đối chiếu đúng ‘on purpose’ với ‘not by accident’."},{"number":12,"answer":"L","context":"permit (v)","explanation":"Giải thích của cô: Permit: Cho phép điều gì đó xảy ra hoặc cấp quyền cho phép làm điều gì đó.\nPermit là động từ chỉ cho phép hoặc cấp quyền. Vì vậy từ này khớp với L: ‘To allow something to happen or to give permission.’"},{"number":13,"answer":"I","context":"undertake (v)","explanation":"Giải thích của cô: Undertake: Bắt đầu làm hoặc đảm nhận một nhiệm vụ hoặc trách nhiệm.\nUndertake là động từ chỉ nhận và bắt đầu thực hiện một công việc hay trách nhiệm. Định nghĩa I nêu đúng cả hai nét nghĩa ‘begin’ và ‘take on’."},{"number":14,"answer":"G","context":"observatory (n)","explanation":"Giải thích của cô: Observatory: Đài thiên văn, nơi hoặc tòa nhà để mọi người nghiên cứu các vì sao, hành tinh và các thứ khác trong không gian.\nObservatory là danh từ chỉ cơ sở được trang bị để quan sát, nghiên cứu thiên thể. Định nghĩa G liệt kê đúng stars, planets và other things in space."},{"number":15,"answer":"D","context":"journalism (n)","explanation":"Giải thích của cô: Journalism: Ngành báo chí, hoạt động báo cáo hoặc viết tin tức cho báo, tạp chí hoặc truyền hình.\nJournalism là danh từ chỉ hoạt động thu thập, viết và đưa tin qua báo chí hoặc truyền hình. Nội dung ấy trùng với định nghĩa D."}]},{"exercise":2,"count":10,"inputKind":"text","choices":[],"instruction":"Ex 2: Fill in the blanks with the following words: goal, journal, perceived, plentiful, allowance, observant, intent, prior, soldiers, scatter. ","questions":[{"number":16,"answer":"plentiful","context":"There was a __________ supply of food at the event, and everyone had plenty to eat.","explanation":"Plentiful là tính từ nghĩa là dồi dào, bổ nghĩa cho supply. Câu hoàn chỉnh: ‘There was a plentiful supply of food at the event, and everyone had plenty to eat.’ Vế sau ‘everyone had plenty’ xác nhận lượng thức ăn rất nhiều."},{"number":17,"answer":"perceived","context":"The manager __________ the plan to be too impractical.","explanation":"Cấu trúc perceive + object + to be nghĩa là nhận định một vật là thế nào. Câu ở quá khứ: ‘The manager perceived the plan to be too impractical.’ Too impractical là đánh giá của người quản lý, không phải một hành động của kế hoạch."},{"number":18,"answer":"journal","context":"She regularly reads a __________ that publishes articles on the latest developments in science and technology.","explanation":"Sau mạo từ a cần danh từ số ít; journal là tạp chí chuyên ngành có các bài nghiên cứu/bài viết. Câu hoàn chỉnh: ‘She regularly reads a journal that publishes articles on the latest developments in science and technology.’ Mệnh đề quan hệ định nghĩa rõ loại ấn phẩm."},{"number":19,"answer":"goal","context":"The __________ of the project is to improve the quality of life for all residents in the area.","explanation":"Sau The cần danh từ làm chủ ngữ; goal nghĩa là mục tiêu. Câu hoàn chỉnh: ‘The goal of the project is to improve the quality of life for all residents in the area.’ Cụm to improve ... nêu nội dung mục tiêu."},{"number":20,"answer":"prior","context":"______ research is required before beginning any new scientific experiment.","explanation":"Prior là tính từ nghĩa là có trước, bổ nghĩa cho research. Câu hoàn chỉnh: ‘Prior research is required before beginning any new scientific experiment.’ Từ before trong vế sau củng cố quan hệ thời gian ‘nghiên cứu trước’."},{"number":21,"answer":"soldiers","context":"The __________ of the army followed orders without hesitation during the operation.","explanation":"Sau The và trước of the army cần danh từ số nhiều chỉ người; soldiers là binh sĩ. Câu hoàn chỉnh: ‘The soldiers of the army followed orders without hesitation during the operation.’ Động từ followed không đánh dấu số, nhưng nghĩa ‘quân đội’ đòi hỏi một nhóm người."},{"number":22,"answer":"intent","context":"She is __________ on being accepted into Harvard University.","explanation":"Cấu trúc be intent on + V-ing nghĩa là quyết tâm làm/đạt điều gì. Câu hoàn chỉnh: ‘She is intent on being accepted into Harvard University.’ Being accepted là mục tiêu mà cô ấy kiên quyết theo đuổi."},{"number":23,"answer":"allowance","context":"I couldn't have managed at college if I hadn't had an ____________ from my parents.","explanation":"Sau an cần danh từ đếm được số ít; allowance là khoản tiền được cấp đều đặn để chi tiêu. Câu hoàn chỉnh: ‘I couldn't have managed at college if I hadn't had an allowance from my parents.’ Nguồn tiền từ cha mẹ giúp người nói trang trải đại học."},{"number":24,"answer":"scatter","context":"They decided to __________ the papers on the table, making it harder to find anything.","explanation":"Sau decided to dùng động từ nguyên mẫu; scatter là rải làm các vật phân tán. Câu hoàn chỉnh: ‘They decided to scatter the papers on the table, making it harder to find anything.’ Mệnh đề kết quả xác nhận giấy tờ bị rải lộn xộn."},{"number":25,"answer":"observant","context":"He was very __________ and noticed even the smallest details in the room.","explanation":"Sau was very cần tính từ; observant nghĩa là tinh ý, chú ý kỹ. Câu hoàn chỉnh: ‘He was very observant and noticed even the smallest details in the room.’ Việc nhận ra chi tiết nhỏ là biểu hiện trực tiếp của phẩm chất này."}]},{"exercise":3,"count":10,"inputKind":"mcq","choices":["A","B","C","D"],"instruction":"Ex 3: Read the passage below and choose the correct word from the options to fill in the blanks.","questions":[{"number":26,"answer":"D","context":"Throughout history, great explorers have ventured into unknown lands, unveiling new territories and (26) ______ groundbreaking discoveries that shaped the world we live in today.","explanation":"Collocation make a discovery nghĩa là thực hiện/có một khám phá. Dạng V-ing making song song với unveiling sau dấu phẩy: ‘unveiling new territories and making groundbreaking discoveries’. Holding, taking và doing không kết hợp tự nhiên với discoveries."},{"number":27,"answer":"C","context":"One of the most famous explorers, Christopher Columbus, is credited with \"discovering\" the Americas in 1492, (27) ______ indigenous peoples had already lived there for centuries.","explanation":"Though mở mệnh đề nhượng bộ: Columbus được ghi công ‘khám phá’ châu Mỹ mặc dù người bản địa đã sống ở đó nhiều thế kỷ. So và because tạo quan hệ nguyên nhân sai; but cũng có thể tạo tương phản, nhưng though nhấn mạnh sự nhượng bộ phù hợp với cách đặt từ ‘discovering’ trong ngoặc kép."},{"number":28,"answer":"D","context":"His (28) ______ connected Europe to the New World, opening up the Atlantic for trade, colonization, and cultural exchange.","explanation":"Voyages là các chuyến đi dài bằng biển, đúng với những hành trình của Columbus vượt Đại Tây Dương và chủ ngữ số nhiều đi với connected. Excursions là chuyến đi ngắn, vacations là kỳ nghỉ; travels có nghĩa rộng nhưng voyages chính xác hơn trong bối cảnh hàng hải."},{"number":29,"answer":"B","context":"Columbus’s discoveries led to the establishment of European colonies and the global spread of goods, ideas, and diseases, forever changing the (29) ______ of history.","explanation":"Cụm cố định the course of history nghĩa là tiến trình/dòng chảy lịch sử. Duration và length chỉ độ dài thời gian; stage là một giai đoạn, không kết hợp với change theo cách diễn đạt này."},{"number":30,"answer":"D","context":"His detailed accounts of the East (30) ______ Europeans to seek new trade routes and explore the vast potential of Asia.","explanation":"Cấu trúc inspire somebody to do something: những ghi chép của Marco Polo truyền cảm hứng cho người châu Âu tìm tuyến thương mại mới. Told và required mang nghĩa bảo/yêu cầu; attracted phải đi với giới từ to và danh từ/V-ing, không dùng object + to-infinitive ở nghĩa này."},{"number":31,"answer":"B","context":"In the 19th century, explorers like David Livingstone ventured into the (31) ______ of Africa, discovering new rivers and mapping unknown territories.","explanation":"Cụm the heart of a place nghĩa là vùng trung tâm/sâu bên trong một khu vực: ‘ventured into the heart of Africa’. Lung, body và face không tạo thành thành ngữ địa lý tương ứng."},{"number":32,"answer":"C","context":"His work brought attention to the African continent, (32) ______ to further exploration and eventually European colonization.","explanation":"Sau dấu phẩy dùng V-ing leading để nêu kết quả của toàn mệnh đề trước: công việc của Livingstone thu hút chú ý, dẫn tới thám hiểm thêm và sau cùng là thuộc địa hóa. Led/lead là động từ chia sẽ cần chủ ngữ; leads không hòa hợp với cấu trúc phân từ."},{"number":33,"answer":"B","context":"These explorers not only expanded the geographical knowledge of the world but also facilitated the (33) ______ of cultures and goods.","explanation":"The exchange of cultures and goods là sự trao đổi văn hóa và hàng hóa, đúng với việc các nhà thám hiểm kết nối các vùng. Transformation là sự biến đổi, delivery là giao hàng; trade có thể dùng cho goods nhưng không tự nhiên với cultures như exchange."},{"number":34,"answer":"A","context":"Their findings had (34) ______ impacts on global trade, politics, and social development.","explanation":"Profound impacts là những tác động sâu sắc, lâu dài; phù hợp với ba lĩnh vực global trade, politics và social development. Heavy, high và extreme không phải collocation tự nhiên với impacts trong câu này."},{"number":35,"answer":"B","context":"While their journeys often came at the (35) ______ of indigenous peoples' cultures and lands, their discoveries laid the foundation for the modern, interconnected world.","explanation":"Cụm cố định at the cost of nghĩa là với cái giá/tổn thất là điều gì. Câu thừa nhận hành trình của họ gây tổn hại đến văn hóa và đất của người bản địa; worth, value và price không đi trong cấu trúc này."}]},{"exercise":4,"count":8,"inputKind":"text","choices":[],"instruction":"Ex 4: Fill in the blanks with ONE suitable word.","questions":[{"number":36,"answer":"with","context":"Ibn Battuta, a famous Moroccan traveler, began his journey in 1325 from Tangier (36) __________ the intention of making a pilgrimage to Mecca.","explanation":"Cụm with the intention of + V-ing nghĩa là với ý định làm gì. Ibn Battuta rời Tangier với ý định hành hương tới Mecca, nên giới từ with hoàn chỉnh cấu trúc."},{"number":37,"answer":"left","context":"He (37) __________ behind his friends and family, embarking on an adventurous quest that would span three decades.","explanation":"Phrasal verb leave behind nghĩa là bỏ lại phía sau. Hành động bắt đầu năm 1325 nên dùng quá khứ left: ‘He left behind his friends and family, embarking on ...’."},{"number":38,"answer":"far","context":"His travels covered over 44 modern countries, (38) __________ exceeding the journeys of other explorers like Marco Polo.","explanation":"Far đứng trước comparative participle exceeding để nhấn mạnh mức vượt rất lớn: ‘far exceeding the journeys of other explorers’. Cụm phân từ bổ sung kết quả so sánh cho quãng đường qua hơn 44 quốc gia."},{"number":39,"answer":"parts","context":"Although he is celebrated in many (39) __________ of the world, his name is particularly well-known in his hometown, (40) __________ places like a square, hotel, café, and even a ferry boat are named after him.","explanation":"Cụm many parts of the world nghĩa là nhiều nơi trên thế giới. Many đòi danh từ đếm được số nhiều, nên parts vừa đúng cấu trúc vừa phù hợp nghĩa địa lý."},{"number":40,"answer":"where","context":"Although he is celebrated in many (39) __________ of the world, his name is particularly well-known in his hometown, (40) __________ places like a square, hotel, café, and even a ferry boat are named after him.","explanation":"Tiền ngữ his hometown là nơi chốn; mệnh đề sau cần trạng từ quan hệ nơi các địa danh được đặt tên theo ông. Vì vậy dùng where: ‘his hometown, where places like a square ... are named after him.’"},{"number":41,"answer":"Despite","context":"(41) __________ being wounded, he survived with divine protection.","explanation":"Sau khoảng trống là being wounded, một cụm V-ing; Despite + noun/V-ing diễn tả nhượng bộ: dù bị thương, ông vẫn sống sót. Although sẽ phải đi với một mệnh đề có chủ ngữ và động từ chia."},{"number":42,"answer":"to","context":"He embarked on a journey (42) __________ China, but misfortune struck when a storm destroyed most of his ships and possessions.","explanation":"Journey to + địa điểm là chuyến đi tới nơi đó. Câu ‘He embarked on a journey to China’ cho biết đích đến; on đã thuộc cụm embark on phía trước, không thay thế giới từ to chỉ hướng."},{"number":43,"answer":"which","context":"Ibn Battuta wrote a book detailing his experiences, (43) __________ has since been translated into many languages, allowing people worldwide to learn about his incredible travels and discoveries.","explanation":"Dấu phẩy mở mệnh đề quan hệ không xác định bổ sung cho a book: cuốn sách ấy về sau được dịch ra nhiều ngôn ngữ. Which làm chủ ngữ của has been translated; who chỉ người, where chỉ nơi, that không dùng sau dấu phẩy trong mệnh đề này."}]},{"exercise":5,"count":21,"inputKind":"mcq","choices":["A","B","C","D"],"instruction":"Ex 5: Read the following passages and answer the questions.","questions":[{"number":44,"answer":"C","context":"Đoạn văn chủ yếu thảo luận về điều gì?","explanation":"Giải thích của cô: Đoạn văn chủ yếu thảo luận về điều gì?\nBài tập trung vào trường phái tranh phong cảnh Hudson River trong bối cảnh hội họa Bắc Mỹ thế kỷ XIX: sự hình thành tên gọi, xung đột thế hệ và đặc điểm nhóm họa sĩ. Trong các lựa chọn, C ‘North American landscape paintings’ bao quát nhất; A, B và D chỉ là chi tiết hoặc phạm vi hẹp."},{"number":45,"answer":"B","context":"Trước năm 1870, loại tranh nào được coi là tiêu biểu nhất cho nghệ thuật Mỹ?","explanation":"Giải thích của cô: Trước năm 1870, loại tranh nào được coi là tiêu biểu nhất cho nghệ thuật Mỹ?\nĐoạn 1 nói nhóm cũ chuyên về landscape và trước khi tên Hudson River school hình thành, trường phái này từng được gọi là ‘the most representative school of American art’. Vì vậy B (Landscape painting) đúng; figural và impressionistic thuộc thế hệ trẻ, historical không được nêu."},{"number":46,"answer":"D","context":"Từ \"struggle\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"struggle\" gần nghĩa nhất với từ nào?\nStruggle giữa thế hệ nghệ sĩ cũ và mới để khẳng định phong cách đại diện là một cuộc cạnh tranh, nên gần nhất với competition (D). Connection, distance và communication không thể hiện xung đột giành vị thế."},{"number":47,"answer":"B","context":"Từ \"monopolized\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"monopolized\" gần nghĩa nhất với từ nào?\n‘A mode ... monopolized by landscape subject matter’ nghĩa là phong cách bị đề tài phong cảnh chiếm lĩnh gần như hoàn toàn, tương đương dominated (B). Alarmed, repelled và pursued không diễn đạt sự chi phối."},{"number":48,"answer":"D","context":"Chức năng của Viện Hàn lâm Thiết kế Quốc gia đối với các họa sĩ sinh trước năm 1835 là gì?","explanation":"Giải thích của cô: Chức năng của Viện Hàn lâm Thiết kế Quốc gia đối với các họa sĩ sinh trước năm 1835 là gì?\nCác họa sĩ lớn tuổi ‘were securely established in and fostered by’ National Academy of Design. Fostered nghĩa là được hỗ trợ, nuôi dưỡng phát triển, nên D đúng; bài không nói viện hòa giải, giám sát kỹ thuật hay quy định đề tài."},{"number":49,"answer":"C","context":"Từ \"it\" ở dòng 7 của đoạn 1 ám chỉ cái gì?","explanation":"Giải thích của cô: Từ \"it\" ở dòng 7 của đoạn 1 ám chỉ cái gì?\nTrong ‘their prospects for patronage ... were uncertain, and they sought to attract it’, it thay cho patronage—sự bảo trợ mà họ muốn thu hút. Matter, technique và country không phải thứ có thể attract theo mạch ý này."},{"number":50,"answer":"C","context":"Từ \"flattering\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"flattering\" gần nghĩa nhất với từ nào?\nTên gọi ban đầu ‘was not intended as flattering’, tức không nhằm khen ngợi/tán dương. Complimentary (C) gần nghĩa nhất; expressive, serious và flashy không mang nghĩa lời khen."},{"number":51,"answer":"A","context":"Thế hệ họa sĩ trẻ hơn đã nhận được sự đào tạo nghệ thuật ở đâu?","explanation":"Giải thích của cô: Thế hệ họa sĩ trẻ hơn đã nhận được sự đào tạo nghệ thuật ở đâu?\nBài nói trực tiếp ‘The younger painters returning home from training in Europe’. Do đó A đúng; Adirondacks, Vermont và New Hampshire được nêu như địa điểm phác họa của nhóm Academicians, không phải nơi thế hệ trẻ đào tạo."},{"number":52,"answer":"D","context":"Ý chính của bài đọc là gì?","explanation":"Giải thích của cô: Ý chính của bài đọc là gì?\nNgay câu đầu nêu television has transformed politics, rồi các đoạn triển khai thay đổi trong tuyển chọn ứng viên, truyền thông, diễn ngôn, kỹ năng công dân và sự kiện dàn dựng. Vì vậy D bao quát toàn bài; A trái với phần mất thông tin, B và C không được chứng minh."},{"number":53,"answer":"C","context":"Từ \"disseminated\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"disseminated\" gần nghĩa nhất với từ nào?\nTrong ‘the way in which information is disseminated’, disseminated nghĩa là được phổ biến/truyền rộng, gần nhất với spread (C). Analyzed là phân tích, discussed là thảo luận, stored là lưu trữ."},{"number":54,"answer":"A","context":"Có thể suy ra điều gì về các đảng phái chính trị trước khi có truyền hình?","explanation":"Giải thích của cô: Có thể suy ra điều gì về các đảng phái chính trị trước khi có truyền hình?\nTruyền hình cho công dân tiếp cận trực tiếp ứng viên và vì thế ‘diminished the role of the political party’ trong tuyển chọn ứng viên lớn. Suy ra trước đó các đảng có ảnh hưởng nhiều hơn, tức A; bài không cung cấp dữ liệu về tiền hay số thành viên."},{"number":55,"answer":"B","context":"Từ \"accelerated\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"accelerated\" gần nghĩa nhất với từ nào?\nTelevision ‘accelerated the citizen's focus on character’ nghĩa là làm mức độ/xu hướng tập trung vào tính cách tăng nhanh hơn. Trong các lựa chọn, increased (B) gần nhất; allowed, required và started không thể hiện sự gia tốc."},{"number":56,"answer":"C","context":"Tác giả nhắc đến \"stump speech\" như một ví dụ của?","explanation":"Giải thích của cô: Tác giả nhắc đến \"stump speech\" như một ví dụ của?\nBài định nghĩa stump speech là bài diễn văn của chính trị gia lưu động, kéo dài nhiều giờ và ‘characterized nineteenth-century political discourse’. Vì vậy C đúng. Nó không phải pseudo-event, tranh luận tương tác hay kiểu diễn văn truyền hình."},{"number":57,"answer":"D","context":"Cụm từ \"given way to\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Cụm từ \"given way to\" gần nghĩa nhất với từ nào?\nCâu đối chiếu stump speech dài với quảng cáo 30 giây và sound bite 10 giây hiện nay; dạng cũ đã nhường chỗ/bị thay thế bởi dạng mới. Vì vậy D ‘been replaced by’ đúng, không phải thêm hấp dẫn, sửa đổi hay bắt chước."},{"number":58,"answer":"A","context":"Từ \"that\" trong câu 4 của đoạn 2 ám chỉ cái gì?","explanation":"Giải thích của cô: Từ \"that\" trong câu 4 của đoạn 2 ám chỉ cái gì?\nCấu trúc ‘the audience for speeches is not that standing in front ... but rather the viewing audience’ dùng that để thay cho audience, tránh lặp từ. Broadcast news, politician và advertisement không thể là nhóm người đứng phía trước."},{"number":59,"answer":"B","context":"So với bài phát biểu trên tivi, diễn thuyết truyền thống thành công hơn ở việc?","explanation":"Giải thích của cô: So với bài phát biểu trên tivi, diễn thuyết truyền thống thành công hơn ở việc?\nĐoạn 3 nói trong 15–30 giây, người nói ‘cannot establish the historical context’ cùng nguyên nhân và phương án thay thế. Vì vậy diễn ngôn truyền thống làm tốt hơn việc đặt vấn đề vào bối cảnh lịch sử (B); các lựa chọn khác không được bài đối chiếu."},{"number":60,"answer":"A","context":"Tác giả nói \"politicians assert but do not argue\" nhằm ngụ ý điều gì?","explanation":"Giải thích của cô: Tác giả nói \"politicians assert but do not argue\" nhằm ngụ ý điều gì?\nAssert là khẳng định một mệnh đề, còn argue là trình bày lý lẽ để bảo vệ nó. Sound bite quá ngắn khiến chính trị gia đưa ra tuyên bố mà không nêu nguyên nhân/lập luận, đúng với A; câu không nói họ mạnh lập trường hơn, thích hay ghét giải thích."},{"number":61,"answer":"C","context":"Từ \"Reliance\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"Reliance\" gần nghĩa nhất với từ nào?\n‘Reliance on television’ là sự dựa dẫm/phụ thuộc vào truyền hình, gần nhất với dependence (C). Abundance là sự dồi dào, clarification là làm rõ, information là thông tin."},{"number":62,"answer":"D","context":"Mục đích của đoạn văn số 4 là để gợi ý rằng?","explanation":"Giải thích của cô: Mục đích của đoạn văn số 4 là để gợi ý rằng?\nĐoạn nói chính trị ngày càng trực quan trong khi trường học chủ yếu dạy phân tích chữ; để là công dân có hiểu biết cần ‘a new set of skills’. Suy ra người dân phải học đánh giá hình ảnh chính trị trực quan (D), không phải chính trị gia cần hấp dẫn hay cá nhân hơn."},{"number":63,"answer":"B","context":"Theo đoạn 5, các sự kiện chính trị dàn dựng được tạo ra nhằm mục đích gì?","explanation":"Giải thích của cô: Theo đoạn 5, các sự kiện chính trị dàn dựng được tạo ra nhằm mục đích gì?\nPseudo-events được định nghĩa là sự kiện ‘designed to attract media coverage’. Vì vậy mục tiêu là giúp chính trị gia có thêm độ phủ truyền hình (B); bài không nói tạo thời gian bàn vấn đề, gặp trực tiếp hay tranh luận."},{"number":64,"answer":"A","context":"Phát biểu nào sau đây được ủng hộ bởi bài đọc?","explanation":"Giải thích của cô: Phát biểu nào sau đây được ủng hộ bởi bài đọc?\nCâu cuối nói sound bites và câu trả lời trong tranh luận ‘increasingly sound like advertisements’, nên A được hỗ trợ trực tiếp. B không có bằng chứng; C trái với việc truyền hình tăng chú ý vào character; D trái với nhận xét diễn văn ngắn mất chi tiết."}]}]}</script>

  <script>/* RI2 grading is deliberately deterministic: only approved keys and explicit

(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else if (typeof define === "function" && define.amd) define([], factory);
  else root.RI2Grading = factory();
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  const SMALL = Object.freeze({ zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5,
    six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12,
    thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17,
    eighteen: 18, nineteen: 19 });
  const TENS = Object.freeze({ twenty: 20, thirty: 30, forty: 40, fifty: 50,
    sixty: 60, seventy: 70, eighty: 80, ninety: 90 });
  const SCALES = Object.freeze({ thousand: 1000, million: 1000000, billion: 1000000000 });
  const ORDINALS = Object.freeze({ zeroth: "zero", first: "one", second: "two", third: "three",
    fourth: "four", fifth: "five", sixth: "six", seventh: "seven", eighth: "eight",
    ninth: "nine", tenth: "ten", eleventh: "eleven", twelfth: "twelve", thirteenth: "thirteen",
    fourteenth: "fourteen", fifteenth: "fifteen", sixteenth: "sixteen", seventeenth: "seventeen",
    eighteenth: "eighteen", nineteenth: "nineteen", twentieth: "twenty", thirtieth: "thirty",
    fortieth: "forty", fiftieth: "fifty", sixtieth: "sixty", seventieth: "seventy",
    eightieth: "eighty", ninetieth: "ninety", hundredth: "hundred", thousandth: "thousand",
    millionth: "million", billionth: "billion" });
  const own = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
  const cardinalWord = word => own(SMALL, word) || own(TENS, word) || own(SCALES, word) || word === "hundred";
  const numericWord = word => cardinalWord(word) || own(ORDINALS, word);

  function inputText(value) {
    if (typeof value === "string") return value;
    if (typeof value === "number" && Number.isFinite(value)) return String(value);
    return "";
  }

  function basicText(value) {
    return inputText(value).normalize("NFKC").toLowerCase()
      .replace(/[\u200B-\u200D\uFEFF\u00AD]/g, "")
      .replace(/[‘’‛ʼ′]/g, "'")
      .replace(/[‐‑‒–—―−]/g, "-")
      .replace(/\s+/g, " ").trim();
  }

  function unwrap(value) {
    const pairs = { '"': '"', "'": "'", "“": "”", "‘": "’", "(": ")", "[": "]", "{": "}" };
    let result = value.trim();
    // Only a balanced wrapper is presentation punctuation, not a missing bracket.
    for (let depth = 0; depth < 4 && result.length > 1; depth += 1) {
      if (pairs[result[0]] !== result[result.length - 1]) break;
      result = result.slice(1, -1).trim();
    }
    return result;
  }

  function meridiem(value) {
    return value.replace(/(?<![a-z])([ap])\s*\.?\s*m\s*\.?(?![a-z])/g, "$1m");
  }

  function policyFor(expected, question) {
    const text = basicText(expected);
    const timeText = meridiem(text);
    const time = /\bo\s*'?\s*clock\b/.test(timeText) ? "oclock"
      : /(?<![a-z])[ap]m(?![a-z])/.test(timeText) ? "meridiem"
      : /\b\d{1,2}\s*:\s*\d{2}\b/.test(timeText) ? "clock" : "none";
    let numbers = /\d/.test(text);
    // Standalone One/First and anaphoric "the one" are grammatical keys in RI2.
    // A caller may explicitly opt in for a numeric-only word answer.
    const quantity = text.replace(/^(?:at least|more than|less than|nearly|about|approximately|over|under|up to|around)\s+/, "");
    const words = quantity.replace(/-/g, " ").split(/\s+/);
    let length = 0;
    while (length < words.length && (numericWord(words[length]) || words[length] === "and")) length += 1;
    const qualifier = quantity !== text;
    const grammaticalTail = /^(?:of|that|which|who|whom|to|by|with|for|as|than)$/;
    if (length > 0 && (qualifier || (length < words.length && !grammaticalTail.test(words[length])) || length > 1)) numbers = true;
    if (question && typeof question.numberFormatting === "boolean") numbers = question.numberFormatting;
    return { numbers, time, degrees: /°|º|˚|\bdegrees\b/.test(inputText(expected).toLowerCase()) };
  }

  function surface(value, policy) {
    let text = inputText(value);
    if (policy.degrees) text = text.replace(/[º˚]/g, "°");
    text = meridiem(basicText(unwrap(text)));
    // A single final sentence mark is harmless; internal numeric punctuation stays.
    text = text.replace(/[.!?,;:]$/, "").trim();
    text = unwrap(text)
      .replace(/(?<=[a-z])\s*-\s*(?=[a-z0-9])|(?<=[0-9])\s*-\s*(?=[a-z])/g, " ")
      .replace(/%/g, " percent ")
      .replace(/\bper\s+cent\b/g, "percent")
      .replace(/\s*\/\s*/g, "/")
      .replace(/\s*,\s*/g, ", ");
    if (policy.time === "oclock") text = text.replace(/\bo\s*'?\s*clock\b/g, "oclock");
    return text.replace(/\s+/g, " ").trim();
  }

  function parseCardinal(words) {
    let total = 0, group = 0, previous = "start", previousSmall = -1, lastScale = Infinity;
    for (const word of words) {
      if (word === "and") {
        if (previous !== "hundred" && previous !== "scale") return null;
        previous = "and";
      } else if (own(SMALL, word)) {
        const number = SMALL[word];
        if (number === 0 ? words.length !== 1 : number < 10
          ? !["start", "tens", "hundred", "scale", "and"].includes(previous)
          : !["start", "hundred", "scale", "and"].includes(previous)) return null;
        group += number;
        previous = number < 10 ? "small" : "teen";
        previousSmall = number;
      } else if (own(TENS, word)) {
        if (!["start", "hundred", "scale", "and"].includes(previous)) return null;
        group += TENS[word]; previous = "tens"; previousSmall = -1;
      } else if (word === "hundred") {
        if (previous !== "small" || previousSmall < 1 || previousSmall > 9 || group > 9) return null;
        group *= 100; previous = "hundred"; previousSmall = -1;
      } else {
        const scale = SCALES[word];
        if (!scale || !group || previous === "and" || scale >= lastScale) return null;
        total += group * scale; group = 0; previous = "scale"; previousSmall = -1; lastScale = scale;
      }
    }
    const number = total + group;

  }

  function cleanExplanation(value) {
    return plainText(value).replace(/^Giải thích của cô\s*:\s*/i, "");
  }

  function setReviewMode(mode, questionNumber) {
    reviewMode = mode === "all" ? "all" : "wrong";
    renderAnswers();
    $("answer-scroll").scrollTop = 0;
    if (questionNumber !== undefined) {
      const card = [...document.querySelectorAll("[data-question]")].find((item) => item.dataset.question === String(questionNumber));
      if (card) {
        card.scrollIntoView({ block: "start" });
        card.focus({ preventScroll: true });
      }
    }
  }

  function renderResultSummary() {
    const target = $("result-summary");
    target.replaceChildren();
    target.hidden = !attempt.submittedAt || !attempt.grade || !attempt.grade.complete;
    if (target.hidden) return;
    const grade = attempt.grade;
    const box = node("section", "result-summary");
    box.setAttribute("aria-labelledby", "result-heading");
    box.appendChild(node("p", "result-kicker", "KẾT QUẢ"));
    const numbers = node("div", "result-numbers");
    const score = node("div", "result-score", String(grade.score));
    score.appendChild(node("small", "", " / " + grade.total));
    numbers.append(score, node("div", "result-percent", String(grade.percent) + "%"));
    box.appendChild(numbers);
    const title = node("h3", "", grade.score === grade.total ? "Hoàn thành tất cả các câu" : grade.wrong.length + " câu cần sửa");
    title.id = "result-heading";
    box.appendChild(title);
    if (grade.wrong.length) {
      const wrongLabel = node("p", "result-wrong-label", "CÂU SAI");
      const jumps = node("div", "wrong-jumps");
      grade.wrong.forEach((result) => {
        const button = node("button", "", String(result.number));
        button.type = "button";
        button.setAttribute("aria-label", "Xem câu sai " + result.number);
        button.addEventListener("click", () => setReviewMode("wrong", result.number));
        jumps.appendChild(button);
      });
      box.append(wrongLabel, jumps);
    }
    const toggles = node("div", "review-toggle");
    const wrongButton = node("button", reviewMode === "wrong" ? "active" : "", "CÂU SAI (" + grade.wrong.length + ")");
    wrongButton.type = "button";
    wrongButton.hidden = grade.wrong.length === 0;
    wrongButton.setAttribute("aria-pressed", String(reviewMode === "wrong"));
    wrongButton.addEventListener("click", () => setReviewMode("wrong"));
    const allButton = node("button", reviewMode === "all" ? "active" : "", "TẤT CẢ (" + grade.total + ")");
    allButton.type = "button";
    allButton.setAttribute("aria-pressed", String(reviewMode === "all"));
    allButton.addEventListener("click", () => setReviewMode("all"));
    toggles.append(wrongButton, allButton);
    box.appendChild(toggles);
    target.appendChild(box);
  }

  function renderDelivery() {
    const target = $("delivery-status");
    target.replaceChildren();
    const pending = !!attempt && ["sending", "pending"].includes(attempt.delivery && attempt.delivery.state);
    $("new-attempt").disabled = pending;
    $("new-attempt").textContent = pending ? "ĐANG LƯU ĐIỂM…" : "LÀM MỘT LƯỢT MỚI ↻";
    const state = attempt.delivery && attempt.delivery.state;
    target.hidden = !attempt || !attempt.submittedAt || !["unconfirmed", "not-configured", "test-mode"].includes(state);
    if (target.hidden) return;
    const messages = {
      unconfirmed: ["Chưa lưu được điểm", "Vui lòng kiểm tra mạng hoặc báo giáo viên."],
      "not-configured": ["Chưa lưu được điểm", "Vui lòng báo giáo viên."],
      "test-mode": ["CHẾ ĐỘ KIỂM THỬ — không ghi điểm", ""]
    };
    const message = messages[state] || messages.unconfirmed;
    target.className = "delivery" + (["unconfirmed", "not-configured"].includes(state) ? " is-warning" : "");
    target.appendChild(node("strong", "", message[0]));
    if (message[1]) target.appendChild(node("span", "", message[1]));
  }

  async function withSubmissionLock(action) {
    if (navigator.locks && typeof navigator.locks.request === "function") {
      let actionStarted = false;
      try {
        return await navigator.locks.request(storageBase + ":submit:" + attempt.id, { mode: "exclusive" }, () => {
          actionStarted = true;
          return action();
        });
      } catch (error) {
        if (actionStarted) throw error;
        // Some embedded/partitioned contexts expose Web Locks but reject access.
        return action();
      }
    }
    return action();
  }

  async function submitAttempt(event) {
    event.preventDefault();
    if (!attempt || attempt.submittedAt || submitting) return;
    $("form-error").hidden = true;
    if (answeredCount() !== questions.length) {
      $("form-error").textContent = "Bạn cần trả lời đủ toàn bộ câu trước khi chấm bài.";
      $("form-error").hidden = false;
      const missing = questions.find((question) => !plainText(attempt.answers[String(question.number)]));
      const input = missing && $("answer-" + missing.number);
      if (input) input.focus();
      return;
    }
    submitting = true;
    renderAnswers();
    let shouldSend = false;
    try {
      shouldSend = await withSubmissionLock(() => {
        const saved = readStorage(attemptKey(attempt.id));
        if (validStoredAttempt(saved) && saved.submittedAt) {
          attempt = saved;
          if (["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) attempt.delivery = { state: "unconfirmed", reason: "already-submitted" };
          return false;
        }
        const grade = globalThis.RI2Grading.gradeAttempt(unit, attempt.answers);
        if (!grade.complete) throw new Error("incomplete");
        attempt.grade = grade;
        attempt.submittedAt = new Date().toISOString();
        attempt.delivery = { state: "sending", attemptedAt: attempt.submittedAt };
        persist();
        return true;
      });
    } catch (_) {
      $("form-error").textContent = "Chưa thể chấm bài. Các câu trả lời vẫn được giữ; vui lòng kiểm tra lại hoặc báo giáo viên.";
      $("form-error").hidden = false;
    } finally {
      submitting = false;
      renderAnswers();
      if (attempt.submittedAt) {
        $("answer-scroll").scrollTop = 0;
        $("answer-scroll").focus({ preventScroll: true });
      }
    }
    if (shouldSend) await sendScore(attempt.id);
  }

  function configuredFormSink() {
    if (course.testing === true) return null;
    const sink = course.scoreSink;
    if (!sink || sink.kind !== "google-form" || !sink.entries || typeof sink.formResponseUrl !== "string") return null;
    try {
      const url = new URL(sink.formResponseUrl);
      if (url.protocol !== "https:" || url.hostname !== "docs.google.com" || !/^\/forms\/d\/(?:e\/)?[^/]+\/formResponse\/?$/.test(url.pathname)) return null;
      const required = ["name", "total", "assignmentCode", "lesson", "activity", "className", "percent", "score", "wrong"];
      if (required.some((field) => !/^entry\.\d+$/.test(sink.entries[field] || ""))) return null;
      return sink;
    } catch (_) { return null; }
  }

  function scoreBody(sink, snapshot) {
    const grade = snapshot.grade;
    const values = {
      name: snapshot.identity.name,
      className: snapshot.identity.className,
      total: String(grade.total),
      assignmentCode: plainText(unit.testCode),
      lesson: unitLabel(),
      activity: "Làm lại đề · Lượt " + snapshot.number + " · Mã lượt " + snapshot.id + " · " + snapshot.submittedAt,
      percent: String(grade.percent),
      score: String(grade.score),
      wrong: grade.wrong.length ? grade.wrong.map((result) => "Câu " + result.number + ": " + plainText(result.actual) + " → " + plainText(result.answer)).join("\n") : "Không có câu sai"
    };
    const body = new URLSearchParams();
    Object.keys(values).forEach((field) => body.set(sink.entries[field], values[field]));
    // Only use additional form mappings when explicitly supplied by the course configuration.
    const optional = { attemptId: snapshot.id, attemptNumber: String(snapshot.number), submittedAt: snapshot.submittedAt, startedAt: snapshot.startedAt };
    Object.keys(optional).forEach((field) => { if (/^entry\.\d+$/.test(sink.entries[field] || "")) body.set(sink.entries[field], optional[field]); });
    return body;
  }

  async function sendScore(id) {
    if (!attempt || attempt.id !== id || !attempt.submittedAt) return;
    if (course.testing === true) {
      attempt.delivery = { state: "test-mode" };
      persist();
      renderDelivery();
      return;
    }
    const sink = configuredFormSink();
    if (!sink) {
      attempt.delivery = { state: "not-configured" };
      persist();
      renderDelivery();
      return;
    }
    const snapshot = JSON.parse(JSON.stringify(attempt));
    const controller = typeof AbortController === "function" ? new AbortController() : null;
    const timeout = controller ? setTimeout(() => controller.abort(), 25000) : null;
    try {
      // Google Forms is intentionally no-cors: an opaque response is NOT a storage confirmation.
      await fetch(sink.formResponseUrl, { method: "POST", mode: "no-cors", credentials: "omit", body: scoreBody(sink, snapshot), ...(controller ? { signal: controller.signal } : {}) });
      snapshot.delivery = { state: "sent-unverified", attemptedAt: snapshot.delivery.attemptedAt, requestFinishedAt: new Date().toISOString() };
    } catch (_) {
      snapshot.delivery = { state: "unconfirmed", attemptedAt: snapshot.delivery.attemptedAt, reason: "network" };
    } finally {
      if (timeout !== null) clearTimeout(timeout);
    }
    try { localStorage.setItem(attemptKey(id), JSON.stringify(snapshot)); } catch (_) { storageAvailable = false; }
    if (attempt && attempt.id === id) {
      attempt.delivery = snapshot.delivery;
      persist();
      renderDelivery();
    }
  }

  function startNewAttempt() {
    if (!attempt || !attempt.submittedAt || submitting || ["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) return;
    attempt = createAttempt(Number(attempt.number || 1) + 1);
    reviewMode = "wrong";
    persist({ makeCurrent: true });
    $("form-error").hidden = true;
    renderAnswers();
    $("answer-scroll").scrollTop = 0;
    const first = questions[0] && $("answer-" + questions[0].number);
    if (first) first.focus({ preventScroll: true });
  }

  function receiveStorageUpdate(event) {
    if (!attempt || !storageBase || event.key !== attemptKey(attempt.id) || !event.newValue) return;
    try {
      const saved = JSON.parse(event.newValue);
      if (!validStoredAttempt(saved) || !saved.submittedAt) return;
      attempt = saved;
      if (["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) attempt.delivery = { state: "unconfirmed", reason: "another-tab" };
      renderAnswers();
    } catch (_) { /* Ignore unrelated or incomplete browser-storage events. */ }
  }

  initialize();
}());
</script></body>
</html>
