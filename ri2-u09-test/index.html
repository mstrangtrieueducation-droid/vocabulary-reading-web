  <script id="ri2-unit-data" type="application/json">{"unit":9,"title":"READING INTENSIVE 2 · UNIT 9","testCode":"RI2-U09","total":62,"studentPreviewUrl":"https://docs.google.com/document/d/16FAfAzle7jtkt4XEbdP2HljO9b1MbOxEUDt7Emi3q9I/preview","sections":[{"exercise":1,"count":15,"inputKind":"matching","choices":["A","B","C","D","E","F","G","H","I","K","L","M","O","P","Q"],"instruction":"Ex 1: Match the words in Column A with their correct definitions in Column B. Write the letter of the definition next to the corresponding word.","questions":[{"number":1,"answer":"G","context":"address (v)","explanation":"Giải thích của cô: Address: Giải quyết, xử lý một vấn đề hoặc một sự việc.\n\nĐộng từ address trong ngữ cảnh vấn đề mang nghĩa “giải quyết/xử lý”. Vì vậy từ này khớp chính xác với định nghĩa G: “To deal with a problem or issue.”; không phải nghĩa “ghi địa chỉ” thường gặp của address."},{"number":2,"answer":"O","context":"inspire (v)","explanation":"Giải thích của cô: Inspire: Truyền cảm hứng, làm cho ai đó cảm thấy hào hứng hoặc có động lực để làm điều gì đó.\n\nInspire là động từ chỉ việc khơi dậy hứng thú hoặc động lực ở người khác. Nó nối với định nghĩa O: “To make someone feel excited or motivated to do something.”—cả excited và motivated đều là dấu hiệu nghĩa trực tiếp."},{"number":3,"answer":"Q","context":"identical (a)","explanation":"Giải thích của cô: Identical: Giống hệt nhau, hoàn toàn giống nhau về mọi mặt.\n\nTính từ identical diễn tả hai hay nhiều thứ giống nhau hoàn toàn, không chỉ tương tự. Do đó đáp án là Q: “Exactly the same in every way.”; cụm exactly the same là cách diễn đạt tương đương trực tiếp."},{"number":4,"answer":"E","context":"boundary (n)","explanation":"Giải thích của cô: Boundary: Ranh giới, một đường thẳng hoặc giới hạn phân chia hai khu vực hoặc hai thứ.\n\nBoundary là danh từ chỉ đường ranh hoặc giới hạn ngăn cách. Định nghĩa E, “A line or limit that separates two areas or things.”, chứa đủ hai nét nghĩa line/limit và separates nên khớp chính xác."},{"number":5,"answer":"A","context":"coincidence (n)","explanation":"Giải thích của cô: Coincidence: Sự trùng hợp, khi hai điều xảy ra cùng một lúc một cách tình cờ, không phải do lên kế hoạch trước.\n\nCoincidence là danh từ chỉ sự trùng hợp ngẫu nhiên. Định nghĩa A nói hai việc xảy ra cùng lúc “by chance, not because they were planned”, đúng đúng hai dấu hiệu cốt lõi của từ này."},{"number":6,"answer":"K","context":"rewarding (a)","explanation":"Giải thích của cô: Rewarding: Bổ ích, đáng giá, đem lại cảm giác thỏa mãn hoặc hạnh phúc vì nó có ích hoặc giúp đỡ được nhiều.\n\nRewarding là tính từ mô tả một hoạt động đem lại sự mãn nguyện vì có giá trị hoặc hữu ích. Vì thế nó khớp K: “Something that gives you a feeling of satisfaction or happiness because it is useful or helpful.”—không nhất thiết liên quan đến phần thưởng vật chất."},{"number":7,"answer":"B","context":"clumsy (a)","explanation":"Giải thích của cô: Clumsy: Vụng về, một người lóng ngóng hoặc không vững vàng, thường xuyên làm rơi đồ hoặc mắc lỗi.\n\nClumsy là tính từ chỉ sự vụng về, thiếu khéo léo hoặc phối hợp động tác kém. Định nghĩa B nêu đúng biểu hiện “awkward or unsteady” và “drops things or makes mistakes”, nên đây là cặp tương ứng."},{"number":8,"answer":"I","context":"colleague (n)","explanation":"Giải thích của cô: Colleague: Đồng nghiệp, một người mà bạn làm việc cùng.\n\nColleague là danh từ chỉ người làm việc cùng mình trong nghề nghiệp hoặc tổ chức. Nó khớp trực tiếp với I: “A person you work with.”—phạm vi hẹp hơn peer, vốn nhấn mạnh cùng tuổi hoặc cùng địa vị."},{"number":9,"answer":"C","context":"adolescent (n)","explanation":"Giải thích của cô: Adolescent: Thanh thiếu niên, một người trẻ đang trong quá trình trưởng thành, thường ở độ tuổi từ 13 đến 18.\n\nAdolescent ở đây là danh từ chỉ người trong giai đoạn chuyển tiếp từ trẻ em sang người lớn. Định nghĩa C nêu rõ “in the process of growing up” và độ tuổi 13–18, nên khớp chính xác."},{"number":10,"answer":"M","context":"peer (n)","explanation":"Giải thích của cô: Peer: Bạn đồng trang lứa, một người có cùng độ tuổi hoặc có cùng địa vị xã hội với bạn.\n\nPeer là danh từ chỉ người ngang hàng về tuổi tác, địa vị hoặc năng lực. Vì vậy đáp án là M: “A person who is the same age or has the same social status as you.”; hai vế same age/same social status diễn đạt đúng nghĩa từ."},{"number":11,"answer":"P","context":"realize (v)","explanation":"Giải thích của cô: Realize: Nhận ra, nhận thức được điều gì đó hoặc hiểu nó một cách rõ ràng.\n\nRealize là động từ chỉ khoảnh khắc trở nên ý thức hoặc hiểu rõ một sự thật. Nó tương ứng với P: “To become aware of something or to understand it clearly.”; become aware là cụm đồng nghĩa trực tiếp."},{"number":12,"answer":"L","context":"impulse (n)","explanation":"Giải thích của cô: Impulse: Sự bốc đồng, một cảm giác hoặc khao khát mạnh mẽ đột ngột muốn làm điều gì đó mà không suy nghĩ kỹ lưỡng.\n\nImpulse là danh từ chỉ thôi thúc bất chợt dẫn đến hành động thiếu cân nhắc. Định nghĩa L có đủ các tín hiệu “sudden strong feeling or desire” và “without thinking carefully”, nên khớp hoàn toàn."},{"number":13,"answer":"F","context":"genetic (a)","explanation":"Giải thích của cô: Genetic: Thuộc về di truyền, liên quan đến gen hoặc được thừa hưởng từ cha mẹ của bạn.\n\nGenetic là tính từ thuộc lĩnh vực gen và sự di truyền. Định nghĩa F—“Related to genes or inherited from your parents.”—nhắc trực tiếp genes và inherited, nên là đáp án duy nhất phù hợp."},{"number":14,"answer":"D","context":"separate (v)","explanation":"Giải thích của cô: Separate: Chia tách, phân chia hoặc giữ các thứ rời xa nhau.\n\nSeparate ở đây là động từ mang nghĩa làm cho các vật không còn ở cùng nhau hoặc giữ chúng cách biệt. Vì thế từ nối với D: “To divide or keep things apart.”; divide và keep apart đều là cách diễn đạt đồng nghĩa."},{"number":15,"answer":"H","context":"confirmation (n)","explanation":"Giải thích của cô: Confirmation: Sự xác nhận, hành động đảm bảo điều gì đó là đúng hoặc chính xác, hoặc nhận được sự chấp thuận cho điều gì.\n\nConfirmation là danh từ chỉ sự xác nhận tính đúng đắn hoặc sự chấp thuận chính thức. Định nghĩa H nêu “making sure something is true or correct” và “receiving approval”, đúng cả hai nét nghĩa của từ."}]},{"exercise":2,"count":10,"inputKind":"text","choices":[],"instruction":"Ex 2: Fill in the blanks with the following words: cope, teenager, degrade, impulse, inspiration, rewarding, extreme, adopt, coworker, separate.","questions":[{"number":16,"answer":"degrade","context":"The way some companies treat their employees can ______ their self-esteem and morale.","explanation":"Sau động từ khuyết thiếu can cần động từ nguyên mẫu, nên dùng degrade (v): làm suy giảm/làm tổn hại. Ngữ cảnh nói cách đối xử của công ty có thể hạ thấp lòng tự trọng và tinh thần nhân viên. Câu hoàn chỉnh: “The way some companies treat their employees can degrade their self-esteem and morale.”"},{"number":17,"answer":"teenager","context":"As a ______, she often felt confused about many things in her life.","explanation":"Sau mạo từ a cần một danh từ đếm được số ít chỉ người; teenager nghĩa là thanh thiếu niên. Cụm mở đầu “As a teenager” đặt thời điểm câu chuyện vào tuổi thiếu niên. Câu hoàn chỉnh: “As a teenager, she often felt confused about many things in her life.”"},{"number":18,"answer":"impulse","context":"Buying a new car on ______ often leads to regret when the excitement fades away.","explanation":"Impulse là danh từ và tạo thành cụm cố định on impulse = do bốc đồng, không suy nghĩ trước. Việc mua xe vì hứng nhất thời hợp với kết quả “often leads to regret”. Câu hoàn chỉnh: “Buying a new car on impulse often leads to regret when the excitement fades away.”"},{"number":19,"answer":"extreme","context":"Completing the marathon was an ______ experience for Anna, both physically and mentally.","explanation":"Ô trống đứng trước danh từ experience nên cần tính từ extreme, nghĩa là cực độ/khắc nghiệt. Hai phương diện “physically and mentally” cho thấy trải nghiệm marathon đòi hỏi ở mức rất cao. Câu hoàn chỉnh: “Completing the marathon was an extreme experience for Anna, both physically and mentally.”"},{"number":20,"answer":"adopt","context":"He decided to ______ a dog from the animal shelter.","explanation":"Sau decided to cần động từ nguyên mẫu adopt. Adopt a dog nghĩa là nhận nuôi chó, phù hợp với nguồn “from the animal shelter”; không phải buy vì con vật đến từ trại cứu hộ. Câu hoàn chỉnh: “He decided to adopt a dog from the animal shelter.”"},{"number":21,"answer":"cope","context":"It can be difficult to ______ with the pressures of work and family life at the same time.","explanation":"Cấu trúc đúng là cope with + noun = đối phó/xoay xở với điều gì. Sau “It can be difficult to” cần động từ nguyên mẫu, và pressures là đối tượng của with. Câu hoàn chỉnh: “It can be difficult to cope with the pressures of work and family life at the same time.”"},{"number":22,"answer":"rewarding","context":"Running a marathon was a ________ experience for him because it was difficult but satisfying.","explanation":"Ô trống bổ nghĩa cho danh từ experience nên cần tính từ rewarding = đáng công, đem lại sự thỏa mãn. Vế “because it was difficult but satisfying” giải thích trực tiếp vì sao trải nghiệm ấy rewarding. Câu hoàn chỉnh: “Running a marathon was a rewarding experience for him because it was difficult but satisfying.”"},{"number":23,"answer":"inspiration","context":"His success in the project was a great ______ for everyone in the team.","explanation":"Sau a great cần danh từ số ít; inspiration là “nguồn cảm hứng”. Thành công của anh ấy tạo động lực cho cả đội, nên nghĩa phù hợp. Câu hoàn chỉnh: “His success in the project was a great inspiration for everyone in the team.”"},{"number":24,"answer":"coworker","context":"A good ______ can often provide valuable support and insight in a challenging situation at work.","explanation":"Sau a good cần danh từ đếm được số ít chỉ người; coworker là đồng nghiệp. Người làm cùng có thể đem lại “support and insight” trong tình huống công việc khó khăn. Câu hoàn chỉnh: “A good coworker can often provide valuable support and insight in a challenging situation at work.”"},{"number":25,"answer":"separate","context":"Taking time to ______ yourself from the pressures of daily life is essential for maintaining a good mental health.","explanation":"Cấu trúc separate yourself from something nghĩa là tách mình ra khỏi điều gì. Sau to dùng động từ nguyên mẫu separate, còn “from the pressures of daily life” hoàn chỉnh bổ ngữ. Câu hoàn chỉnh theo đề: “Taking time to separate yourself from the pressures of daily life is essential for maintaining a good mental health.”"}]},{"exercise":3,"count":10,"inputKind":"mcq","choices":["A","B","C","D"],"instruction":"Ex 3: Read the passage below and choose the correct word from the options to fill in the blanks.","questions":[{"number":26,"answer":"C","context":"Teenagers’ brains are still developing, (26) ______ is why their behavior can sometimes seem erratic or extreme.","explanation":"Sau dấu phẩy là mệnh đề “___ is why ...” cần một đại từ quan hệ làm chủ ngữ và quy chiếu toàn bộ ý “Teenagers’ brains are still developing”. Which dùng được trong mệnh đề quan hệ không xác định: “..., which is why ...”. This không được nối trực tiếp theo kiểu này; what không có tiền ngữ; that thường không đứng sau dấu phẩy."},{"number":27,"answer":"C","context":"While adults often (27) ______ adolescent behavior with recklessness, recent brain research has revealed new insights (28) ______ why teens act the way they do.","explanation":"Cụm cố định associate A with B = liên hệ/đánh đồng A với B. Chủ ngữ adults, tân ngữ adolescent behavior và bổ ngữ with recklessness tạo đúng khung “adults often associate adolescent behavior with recklessness”. Relate thường cần relate A to B; combine/provide không hợp nghĩa."},{"number":28,"answer":"B","context":"While adults often (27) ______ adolescent behavior with recklessness, recent brain research has revealed new insights (28) ______ why teens act the way they do.","explanation":"Danh từ insight kết hợp tự nhiên với giới từ into: insight into why teens act ... = hiểu biết sâu về lý do thanh thiếu niên hành động như vậy. Towards, through và upon không tạo collocation này."},{"number":29,"answer":"D","context":"Scientists have found that (29) ______ the brain is almost fully developed by age six, it continues to change throughout adolescence, with crucial developments (30) ______ until around age 25.","explanation":"Hai mệnh đề tạo quan hệ nhượng bộ: dù bộ não gần như phát triển đầy đủ lúc sáu tuổi, nó vẫn tiếp tục thay đổi trong tuổi vị thành niên. Although nối đúng hai ý tương phản. Since sẽ chỉ nguyên nhân, given không phù hợp cấu trúc, còn but không thể đứng sau that theo mẫu “found that but ...”."},{"number":30,"answer":"C","context":"Scientists have found that (29) ______ the brain is almost fully developed by age six, it continues to change throughout adolescence, with crucial developments (30) ______ until around age 25.","explanation":"Sau with là cấu trúc tuyệt đối “with + noun + V-ing”: with crucial developments occurring until around age 25. Occurring mô tả các phát triển đang tiếp diễn; occur là động từ chia thiếu cấu trúc, occurred sai thời/quan hệ, còn being occurred sai vì occur là nội động từ."},{"number":31,"answer":"A","context":"When teenagers consider engaging in risky behavior, their brains release (31) ______ chemicals associated with pleasure than adults' brains do.","explanation":"Câu có dấu hiệu so sánh than: “___ chemicals ... than adults’ brains do”. Chemicals là danh từ đếm được số nhiều, nhưng ở đây more trực tiếp tạo so sánh hơn về lượng: release more chemicals than. Many/much không đứng một mình trước than trong cấu trúc này; far chỉ bổ nghĩa cho more chứ không thay thế nó."},{"number":32,"answer":"D","context":"Teens are also more (32) ______ to seek out social rewards and form connections with others, which further drives their behavior.","explanation":"Cấu trúc be likely to + verb nghĩa là có khả năng/dễ làm gì: “Teens are also more likely to seek out social rewards”. Like là giới từ/động từ, unlike mang nghĩa trái ngược, còn alike thường đứng sau động từ nối và không đi với to-infinitive."},{"number":33,"answer":"C","context":"However, the (33) ______ of pleasure and social connection can sometimes lead teens to make poor decisions.","explanation":"Sau mạo từ the và trước giới từ of cần danh từ; pursuit of pleasure = sự theo đuổi niềm vui/khoái cảm. Chase có thể là danh từ nhưng “the chase of” không tự nhiên ở đây; following không đúng nghĩa; tendency thường đi với to, không phải of pleasure."},{"number":34,"answer":"B","context":"The intense desire for rewards can result (34) ______ dangerous choices, as teens are less afraid to try new things or act independently.","explanation":"Cụm động từ cố định result in + noun nghĩa là dẫn đến một kết quả. Vì vậy “can result in dangerous choices” là đúng. Result from chỉ nguyên nhân xuất phát từ đâu; result to/with không dùng theo nghĩa này."},{"number":35,"answer":"C","context":"The brain's impulsive tendencies may be essential for preparing teens to leave their parents and live successfully on their (35) ______ as adults.","explanation":"Thành ngữ on one’s own = tự lập, một mình, không phụ thuộc người khác. Đại từ sở hữu their đã có trước ô trống nên phải dùng own: “live successfully on their own as adults”. Person, self và ego không tạo cụm này."}]},{"exercise":4,"count":8,"inputKind":"text","choices":[],"instruction":"Ex 4: Fill in the blanks with ONE suitable word.","questions":[{"number":36,"answer":"plays/has","context":"Adolescence is a crucial stage in a teenager's development, and parental support (36) __________ a significant role in shaping their future.","explanation":"Cách kết hợp chuẩn nhất là play a significant role in + V-ing = đóng vai trò quan trọng trong việc gì, nên “parental support plays a significant role in shaping their future”. Has a significant role cũng truyền đạt ý “có vai trò quan trọng”, vì thế nguồn chấp nhận cả plays/has; chủ ngữ support số ít nên động từ đều thêm -s."},{"number":37,"answer":"with","context":"Parents can assist their teenagers effectively by providing them (37) __________ emotional support, fostering open communication, and offering guidance in decision-making.","explanation":"Cấu trúc provide somebody with something = cung cấp cho ai điều gì. “Providing them with emotional support” có them là người nhận và emotional support là thứ được cung cấp; vì vậy giới từ phải là with."},{"number":38,"answer":"Firstly / First /","context":"(38) __________ , parents should create an environment of trust and emotional safety.","explanation":"Giải thích của cô: Initially\n\nÔ trống mở đầu luận điểm thứ nhất và sau đó đoạn văn có “Secondly”, nên cần từ nối chỉ trình tự. Firstly hoặc First đều nghĩa là “trước hết”; Initially cũng có thể mở ý ban đầu. Dấu phẩy sau ô trống tách trạng từ liên kết khỏi mệnh đề chính."},{"number":39,"answer":"share","context":"By being approachable and non-judgmental, parents allow their teenagers to (39) __________ their thoughts and concerns without fear of punishment or ridicule.","explanation":"Sau allow + object + to cần động từ nguyên mẫu. Share one’s thoughts and concerns nghĩa là chia sẻ suy nghĩ và mối lo; ngữ cảnh “open communication” và “without fear” làm rõ lựa chọn share."},{"number":40,"answer":"makes/helps","context":"This open communication strengthens the parent-child relationship and (40) __________ the teenager feel understood and valued.","explanation":"Chủ ngữ This open communication số ít nên dùng makes hoặc helps. Make + object + bare infinitive cho “makes the teenager feel understood”; help + object + bare infinitive cũng cho “helps the teenager feel understood”. Cả hai đều diễn tả giao tiếp khiến/giúp trẻ cảm thấy được thấu hiểu."},{"number":41,"answer":"while / but","context":"Secondly, parents can assist by setting clear boundaries and expectations, (41) __________ also allowing their teenagers some independence.","explanation":"Câu đặt hai yêu cầu cần cân bằng: cha mẹ đặt ranh giới rõ ràng nhưng đồng thời cho con một mức độc lập. While nhấn mạnh sự tương phản đồng thời; but nối hai ý đối lập trực tiếp. Cả hai đều phù hợp với ý “This balance” ở câu sau."},{"number":42,"answer":"decisions /","context":"This balance encourages responsibility and helps teenagers to learn to make (42) __________ within a framework of guidance.","explanation":"Giải thích của cô: choices\n\nSau make cần một danh từ số nhiều làm tân ngữ. Make decisions và make choices đều là collocation mang nghĩa đưa ra quyết định/lựa chọn; cụm “within a framework of guidance” cho thấy trẻ được tập tự quyết trong giới hạn định hướng."},{"number":43,"answer":"to","context":"Ultimately, a strong, supportive, and understanding relationship is key (43) __________ helping teenagers navigate their adolescent years successfully.","explanation":"Cấu trúc be key to + noun/V-ing nghĩa là yếu tố then chốt đối với việc gì. To ở đây là giới từ nên sau nó dùng helping: “is key to helping teenagers navigate ...”, không phải dấu hiệu của động từ nguyên mẫu."}]},{"exercise":5,"count":19,"inputKind":"mcq","choices":["A","B","C","D"],"instruction":"Ex 5: Read the following passages and answer the questions.","questions":[{"number":44,"answer":"B","context":"Đoạn 1 thảo luận về việc xây dựng đường sá thời kỳ đầu ở Hoa Kỳ chủ yếu dưới góc độ nào?","explanation":"Giải thích của cô: Đoạn 1 thảo luận về việc xây dựng đường sá thời kỳ đầu ở Hoa Kỳ chủ yếu dưới góc độ nào?\n\nĐoạn 1 tập trung vào câu hỏi ai trả tiền và tổ chức xây đường: các bang “Unable to finance road construction” nên nhờ công ty tư nhân, Pennsylvania cấp đặc quyền và cho thu phí. Vì vậy ý chính là financing of new roads (B). A chỉ là một loại đường, C là bối cảnh giao thông với nội địa, còn D chỉ là chi tiết về quyền điều tiết mức phí."},{"number":45,"answer":"D","context":"Từ \"primitive\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"primitive\" gần nghĩa nhất với từ nào?\n\nCâu mở đầu nói vận tải đường bộ năm 1790 còn “extremely primitive”, rồi giải thích đường “few and short”; do đó primitive mang nghĩa chưa phát triển, tương ứng undeveloped (D). Unsafe, unknown và inexpensive không được ngữ cảnh chứng minh."},{"number":46,"answer":"C","context":"Vào năm 1790, hầu hết các con đường nối các thị trấn ở vùng nội địa với?","explanation":"Giải thích của cô: Vào năm 1790, hầu hết các con đường nối các thị trấn ở vùng nội địa với?\n\nBằng chứng trực tiếp ở đoạn 1: “Roads were ... usually extending from inland communities to the nearest river town or seaport.” Vì vậy đáp án là river towns or seaports (C). Các phương án A, B và D đều không xuất hiện như đầu mối của phần lớn con đường."},{"number":47,"answer":"C","context":"Cụm từ \"on the threshold of\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Cụm từ \"on the threshold of\" gần nghĩa nhất với từ nào?\n\n“On the threshold of a new era” là thành ngữ nghĩa là đang ở ngưỡng/bắt đầu một thời kỳ mới, nên gần nhất với at the start of (C). In need of nói nhu cầu, in place of nói sự thay thế, còn with the purpose of nói mục đích."},{"number":48,"answer":"A","context":"Theo đoạn văn, tại sao các bang lại muốn các công ty tư nhân giúp đỡ xây dựng đường sá?","explanation":"Giải thích của cô: Theo đoạn văn, tại sao các bang lại muốn các công ty tư nhân giúp đỡ xây dựng đường sá?\n\nĐoạn văn nêu nguyên nhân rõ ràng: “Unable to finance road construction, states turned for help to private companies.” Tức các bang không đủ khả năng tự chi trả, đúng với A. B, C và D suy đoán về thiết bị, tốc độ hoặc kiến thức nhưng văn bản không nói."},{"number":49,"answer":"A","context":"Từ \"it\" trong câu 4 của đoạn 1 ám chỉ cái gì?","explanation":"Giải thích của cô: Từ \"it\" trong câu 4 của đoạn 1 ám chỉ cái gì?\n\nTrong câu “The legislature gave the company the authority ... though it carefully regulated the rates”, đại từ it là chủ ngữ thực hiện hành động regulated. Danh từ số ít có thẩm quyền điều tiết mức phí là the legislature (A), không phải company, authority hay payment."},{"number":50,"answer":"D","context":"Từ \"imitation\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"imitation\" gần nghĩa nhất với từ nào?\n\nThành công của Lancaster Pike “encouraged imitation”, nghĩa là khiến nơi khác làm theo mô hình ấy. Imitation vì vậy gần với copying (D). Investment có thể là phương tiện tài chính nhưng không đồng nghĩa; suggestion và increasing cũng không diễn tả việc bắt chước."},{"number":51,"answer":"B","context":"Bang Virginia được nhắc đến như một ví dụ về một bang mà?","explanation":"Giải thích của cô: Bang Virginia được nhắc đến như một ví dụ về một bang mà?\n\nĐoạn 2 đối chiếu: các bang miền Bắc dựa vào công ty tư nhân, “but Virginia constructed a network at public expense”. At public expense nghĩa là bằng ngân sách nhà nước, nên B đúng. Đoạn không nói Virginia bỏ trạm thu phí, xây 1.500 dặm trong một năm hay ban luật hạn chế đường."},{"number":52,"answer":"C","context":"\"Bánh xe lớn, rộng\" của xe ngựa Conestoga được nhắc đến ở đoạn 3 như một đặc điểm để chứng minh xe này?","explanation":"Giải thích của cô: \"Bánh xe lớn, rộng\" của xe ngựa Conestoga được nhắc đến ở đoạn 3 như một đặc điểm để chứng minh xe này?\n\nNgay sau đặc điểm ấy, tác giả nói bánh xe “able to negotiate all but the deepest ruts and holes”: có thể đi qua gần như mọi vệt lún và ổ gà. Đây là bằng chứng chúng hiệu quả trên mặt đường gồ ghề (C). Không có thông tin chúng xuất phát đầu tiên ở Đức, hiếm lạ hay gây hỏng hàng."},{"number":53,"answer":"C","context":"Đoạn văn chủ yếu thảo luận về điều gì?","explanation":"Giải thích của cô: Đoạn văn chủ yếu thảo luận về điều gì?\n\nBài đọc theo dõi hai nền văn hóa bản địa sớm Adena–Hopewell và Mississippian: nơi hình thành, nông nghiệp, thương mại, tôn giáo, làng thị và các gò đất. Vì vậy chủ đề bao quát nhất là “The early people and cultures of the United States” (C). A và D chỉ là hai khía cạnh; B quá hẹp."},{"number":54,"answer":"B","context":"Điều nào sau đây là kết quả từ sự trỗi dậy của nông nghiệp ở Đông Nam Hoa Kỳ?","explanation":"Giải thích của cô: Điều nào sau đây là kết quả từ sự trỗi dậy của nông nghiệp ở Đông Nam Hoa Kỳ?\n\nTrình tự đoạn 1 là: họ bắt đầu trồng ngô, ngày càng giỏi canh tác, rồi “settled into permanent villages”. Do đó việc hình thành các khu định cư lâu dài (B) là hệ quả trực tiếp. Thương mại được kể sau nhưng không được quy trực tiếp là kết quả của nông nghiệp; C và D không có trong bài."},{"number":55,"answer":"A","context":"Thuật ngữ \"Adena-Hopewell\" dùng để chỉ định điều gì?","explanation":"Giải thích của cô: Thuật ngữ \"Adena-Hopewell\" dùng để chỉ định điều gì?\n\nBài nói nền văn hóa này “takes its name from sites in Ohio”, tức tên Adena–Hopewell bắt nguồn từ các địa điểm khảo cổ ở Ohio. Trong các lựa chọn, A là phương án gần nhất vì nói tới các địa điểm ban đầu của nền văn hóa. B và C biến hai tên thành dân tộc/lãnh đạo, D biến chúng thành tuyến thương mại, đều trái văn bản."},{"number":56,"answer":"B","context":"Từ \"bartering\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"bartering\" gần nghĩa nhất với từ nào?\n\nTrong cụm “great traders, bartering jewellery, pottery, animal pelts, tools...”, bartering chỉ việc trao đổi hàng hóa trực tiếp. Vì vậy exchanging (B) là đồng nghĩa. Producing là sản xuất, transporting là vận chuyển, loading là chất hàng—đều có thể liên quan thương mại nhưng không phải nghĩa của barter."},{"number":57,"answer":"C","context":"Từ \"supplanted\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"supplanted\" gần nghĩa nhất với từ nào?\n\nSau khi Hopewell suy tàn, “it was supplanted by another culture, the Mississippian”: nền văn hóa mới thay thế nền văn hóa cũ. Do đó supplanted = replaced (C). Conquered hàm ý chinh phục không được nêu; preceded là có trước, ngược trình tự; imitated là bắt chước."},{"number":58,"answer":"C","context":"Theo đoạn văn, nền văn hóa Mississippian đạt đỉnh cao phát triển khi nào?","explanation":"Giải thích của cô: Theo đoạn văn, nền văn hóa Mississippian đạt đỉnh cao phát triển khi nào?\n\nBằng chứng nguyên văn: “At the peak of its strength, about the year 1200, it was the most advanced culture in North America.” Vì vậy C, khoảng năm 1200. Các mốc 400, 400–700 và thế kỷ XVI lần lượt liên quan sự suy tàn Hopewell, giai đoạn chuyển tiếp và thời người châu Âu đến."},{"number":59,"answer":"A","context":"Nền nông nghiệp của người Mississippian khác với những người đi trước (Hopewell) như thế nào?","explanation":"Giải thích của cô: Nền nông nghiệp của người Mississippian khác với những người đi trước (Hopewell) như thế nào?\n\nBài cho biết người Mississippian trồng trọt “on a grander scale” và phát triển giống ngô cải tiến sống được trong đất ướt, khí hậu khá mát; vì vậy A là phương án gần nhất: sản xuất quy mô lớn hơn và cây trồng bền sức hơn. B, C và D không được nêu, trong đó C còn trái với khả năng chịu khí hậu mát và đất ướt."},{"number":60,"answer":"C","context":"Tại sao tác giả lại đề cập đến việc nhiều bộ tộc Mississippian tự gọi mình là \"con của Mặt Trời\"?","explanation":"Giải thích của cô: Tại sao tác giả lại đề cập đến việc nhiều bộ tộc Mississippian tự gọi mình là \"con của Mặt Trời\"?\n\nTác giả vừa nói nông nghiệp quan trọng đến mức gắn chặt với Mặt Trời—“the guarantor of good crops”—rồi đưa tên gọi “children of the Sun” làm minh họa. Vì vậy chi tiết này cho thấy tầm quan trọng rất lớn họ đặt vào nông nghiệp (C), không nhằm mô tả nghi lễ, sự phục tùng hay tranh luận chung về tôn giáo."},{"number":61,"answer":"D","context":"Cụm từ \"charged with\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Cụm từ \"charged with\" gần nghĩa nhất với từ nào?\n\nTrong “priests and those charged with guarding the flame”, charged with + V-ing nghĩa là được giao trách nhiệm làm việc gì. Vì vậy assigned to (D) tương đương. Passed on, experienced at và interested in không thể hiện nghĩa được giao nhiệm vụ."},{"number":62,"answer":"B","context":"Các gò đất bằng phẳng ở thị trấn Mississippian được dùng cho tất cả mục đích sau, NGOẠI TRỪ?","explanation":"Giải thích của cô: Các gò đất bằng phẳng ở thị trấn Mississippian được dùng cho tất cả mục đích sau, NGOẠI TRỪ?\n\nBài nêu gò là nơi có đền và ngọn lửa thiêng (A), “ceremonial and trading sites” (A, C), và đôi khi là “burial grounds” (D). Không có chi tiết chúng là nơi họp của toàn cộng đồng, nên B là mục đích KHÔNG được đề cập."}]}]}</script>

    thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17,

  const TENS = Object.freeze({ twenty: 20, thirty: 30, forty: 40, fifty: 50,
    sixty: 60, seventy: 70, eighty: 80, ninety: 90 });
  const SCALES = Object.freeze({ thousand: 1000, million: 1000000, billion: 1000000000 });
  const ORDINALS = Object.freeze({ zeroth: "zero", first: "one", second: "two", third: "three",
    fourth: "four", fifth: "five", sixth: "six", seventh: "seven", eighth: "eight",
    ninth: "nine", tenth: "ten", eleventh: "eleven", twelfth: "twelve", thirteenth: "thirteen",
    fourteenth: "fourteen", fifteenth: "fifteen", sixteenth: "sixteen", seventeenth: "seventeen",
    eighteenth: "eighteen", nineteenth: "nineteen", twentieth: "twenty", thirtieth: "thirty",
    fortieth: "forty", fiftieth: "fifty", sixtieth: "sixty", seventieth: "seventy",
    eightieth: "eighty", ninetieth: "ninety", hundredth: "hundred", thousandth: "thousand",
    millionth: "million", billionth: "billion" });
  const own = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
  const cardinalWord = word => own(SMALL, word) || own(TENS, word) || own(SCALES, word) || word === "hundred";
  const numericWord = word => cardinalWord(word) || own(ORDINALS, word);

  function inputText(value) {
    if (typeof value === "string") return value;
    if (typeof value === "number" && Number.isFinite(value)) return String(value);
    return "";
  }

  function basicText(value) {
    return inputText(value).normalize("NFKC").toLowerCase()
      .replace(/[\u200B-\u200D\uFEFF\u00AD]/g, "")
      .replace(/[‘’‛ʼ′]/g, "'")
      .replace(/[‐‑‒–—―−]/g, "-")
      .replace(/\s+/g, " ").trim();
  }

  function unwrap(value) {
    const pairs = { '"': '"', "'": "'", "“": "”", "‘": "’", "(": ")", "[": "]", "{": "}" };
    let result = value.trim();
    // Only a balanced wrapper is presentation punctuation, not a missing bracket.
    for (let depth = 0; depth < 4 && result.length > 1; depth += 1) {
      if (pairs[result[0]] !== result[result.length - 1]) break;

    const label = node("label", "question-number", "Câu " + number.padStart(2, "0"));
    label.htmlFor = "answer-" + number;
    top.appendChild(label);
    if (result) top.appendChild(node("span", "question-state", result.correct ? "✓ Đúng" : "✕ Sai"));
    card.appendChild(top);
    const value = plainText(attempt.answers[number]);
    const choices = Array.isArray(section.choices) ? section.choices.filter((choice) => typeof choice === "string" && choice.trim()).map((choice) => choice.trim()) : [];
    if (section.inputKind === "mcq" && choices.length) {
      const grid = node("div", "choice-grid");
      grid.setAttribute("role", "radiogroup");
      grid.setAttribute("aria-label", "Đáp án câu " + number);
      choices.forEach((choice, index) => {
        const choiceLabel = node("label", "choice");
        const input = node("input");
        input.type = "radio";
        input.name = "answer-" + number;
        input.id = index === 0 ? "answer-" + number : "answer-" + number + "-" + index;
        input.value = choice;
        input.checked = value === choice;
        input.disabled = !!attempt.submittedAt || submitting;
        input.addEventListener("change", () => recordAnswer(number, choice));
        choiceLabel.append(input, node("span", "", choice));
        grid.appendChild(choiceLabel);
      });
      card.appendChild(grid);
    } else if (section.inputKind === "matching" && choices.length) {
      const input = node("select");
      input.id = "answer-" + number;
      input.name = "answer-" + number;
      input.setAttribute("aria-label", "Đáp án câu " + number);
      const empty = node("option", "", "— Chọn đáp án —");
      empty.value = "";
      input.appendChild(empty);
      choices.forEach((choice) => { const option = node("option", "", choice); option.value = choice; input.appendChild(option); });
      input.value = value;
      input.disabled = !!attempt.submittedAt || submitting;
      input.addEventListener("change", () => recordAnswer(number, input.value));
      card.appendChild(input);
    } else {
      const input = node("input");
      input.type = "text";
      input.id = "answer-" + number;
      input.name = "answer-" + number;
      input.value = value;
      input.maxLength = 600;
      input.placeholder = "Nhập câu trả lời của bạn";
      input.autocomplete = "off";
      input.setAttribute("autocapitalize", "off");
      input.setAttribute("autocorrect", "off");
      input.spellcheck = false;
      input.disabled = !!attempt.submittedAt || submitting;
      input.addEventListener("input", () => recordAnswer(number, input.value));
      card.appendChild(input);
    }
    if (result) {
      const review = node("div", "answer-review");
      const key = node("p", "answer-key");
      const mine = node("span", "answer-key-row", "Bạn trả lời: ");
      mine.appendChild(node("b", result.correct ? "" : "submitted-answer", plainText(result.actual)));
      const correct = node("span", "answer-key-row", "Đáp án đúng: ");
      correct.appendChild(node("b", "", plainText(result.answer)));
      key.append(mine, correct);
      const alternatives = Array.isArray(result.acceptedAnswers) ? result.acceptedAnswers.map(plainText).filter((answer) => answer && answer !== plainText(result.answer)) : [];
      if (alternatives.length) key.appendChild(node("small", "", "Cũng chấp nhận: " + alternatives.join(" · ")));
      review.appendChild(key);
      if (plainText(question.context)) {
        review.appendChild(node("p", "review-label", "Ngữ cảnh câu hỏi"));
        review.appendChild(node("p", "question-context", plainText(question.context)));
      }
      review.appendChild(node("p", "review-label", "Giải thích"));
      review.appendChild(node("p", "explanation", cleanExplanation(result.explanation) || "Chưa có giải thích cho câu này."));
      card.appendChild(review);
    }
    return card;
  }

  function cleanExplanation(value) {
    return plainText(value).replace(/^Giải thích của cô\s*:\s*/i, "");
  }

  function setReviewMode(mode, questionNumber) {
    reviewMode = mode === "all" ? "all" : "wrong";
    renderAnswers();
    $("answer-scroll").scrollTop = 0;
    if (questionNumber !== undefined) {
      const card = [...document.querySelectorAll("[data-question]")].find((item) => item.dataset.question === String(questionNumber));
      if (card) {
        card.scrollIntoView({ block: "start" });
        card.focus({ preventScroll: true });
      }
    }
  }

  function renderResultSummary() {
    const target = $("result-summary");
    target.replaceChildren();
    target.hidden = !attempt.submittedAt || !attempt.grade || !attempt.grade.complete;
    if (target.hidden) return;
    const grade = attempt.grade;
    const box = node("section", "result-summary");
    box.setAttribute("aria-labelledby", "result-heading");
    box.appendChild(node("p", "result-kicker", "KẾT QUẢ"));
    const numbers = node("div", "result-numbers");
    const score = node("div", "result-score", String(grade.score));
    score.appendChild(node("small", "", " / " + grade.total));
    numbers.append(score, node("div", "result-percent", String(grade.percent) + "%"));
    box.appendChild(numbers);
    const title = node("h3", "", grade.score === grade.total ? "Hoàn thành tất cả các câu" : grade.wrong.length + " câu cần sửa");
    title.id = "result-heading";
    box.appendChild(title);
    if (grade.wrong.length) {
      const wrongLabel = node("p", "result-wrong-label", "CÂU SAI");
      const jumps = node("div", "wrong-jumps");
      grade.wrong.forEach((result) => {
        const button = node("button", "", String(result.number));
        button.type = "button";
        button.setAttribute("aria-label", "Xem câu sai " + result.number);
        button.addEventListener("click", () => setReviewMode("wrong", result.number));
        jumps.appendChild(button);
      });
      box.append(wrongLabel, jumps);
    }
    const toggles = node("div", "review-toggle");
    const wrongButton = node("button", reviewMode === "wrong" ? "active" : "", "CÂU SAI (" + grade.wrong.length + ")");
    wrongButton.type = "button";
    wrongButton.hidden = grade.wrong.length === 0;
    wrongButton.setAttribute("aria-pressed", String(reviewMode === "wrong"));
    wrongButton.addEventListener("click", () => setReviewMode("wrong"));
    const allButton = node("button", reviewMode === "all" ? "active" : "", "TẤT CẢ (" + grade.total + ")");
    allButton.type = "button";
    allButton.setAttribute("aria-pressed", String(reviewMode === "all"));
    allButton.addEventListener("click", () => setReviewMode("all"));
    toggles.append(wrongButton, allButton);
    box.appendChild(toggles);
    target.appendChild(box);
  }

  function renderDelivery() {
    const target = $("delivery-status");
    target.replaceChildren();
    const pending = !!attempt && ["sending", "pending"].includes(attempt.delivery && attempt.delivery.state);
    $("new-attempt").disabled = pending;
    $("new-attempt").textContent = pending ? "ĐANG LƯU ĐIỂM…" : "LÀM MỘT LƯỢT MỚI ↻";
    const state = attempt.delivery && attempt.delivery.state;
    target.hidden = !attempt || !attempt.submittedAt || !["unconfirmed", "not-configured", "test-mode"].includes(state);
    if (target.hidden) return;
    const messages = {
      unconfirmed: ["Chưa lưu được điểm", "Vui lòng kiểm tra mạng hoặc báo giáo viên."],
      "not-configured": ["Chưa lưu được điểm", "Vui lòng báo giáo viên."],
      "test-mode": ["CHẾ ĐỘ KIỂM THỬ — không ghi điểm", ""]
    };
    const message = messages[state] || messages.unconfirmed;
    target.className = "delivery" + (["unconfirmed", "not-configured"].includes(state) ? " is-warning" : "");
    target.appendChild(node("strong", "", message[0]));
    if (message[1]) target.appendChild(node("span", "", message[1]));
  }

  async function withSubmissionLock(action) {
    if (navigator.locks && typeof navigator.locks.request === "function") {
      let actionStarted = false;
      try {
        return await navigator.locks.request(storageBase + ":submit:" + attempt.id, { mode: "exclusive" }, () => {
          actionStarted = true;
          return action();
        });
      } catch (error) {
        if (actionStarted) throw error;
        // Some embedded/partitioned contexts expose Web Locks but reject access.
        return action();
      }
    }
    return action();
  }

  async function submitAttempt(event) {
    event.preventDefault();
    if (!attempt || attempt.submittedAt || submitting) return;
    $("form-error").hidden = true;
    if (answeredCount() !== questions.length) {
      $("form-error").textContent = "Bạn cần trả lời đủ toàn bộ câu trước khi chấm bài.";
      $("form-error").hidden = false;
      const missing = questions.find((question) => !plainText(attempt.answers[String(question.number)]));
      const input = missing && $("answer-" + missing.number);
      if (input) input.focus();
      return;
    }
    submitting = true;
    renderAnswers();
    let shouldSend = false;
    try {
      shouldSend = await withSubmissionLock(() => {
        const saved = readStorage(attemptKey(attempt.id));
        if (validStoredAttempt(saved) && saved.submittedAt) {
          attempt = saved;
          if (["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) attempt.delivery = { state: "unconfirmed", reason: "already-submitted" };
          return false;
        }
        const grade = globalThis.RI2Grading.gradeAttempt(unit, attempt.answers);
        if (!grade.complete) throw new Error("incomplete");
        attempt.grade = grade;
        attempt.submittedAt = new Date().toISOString();
        attempt.delivery = { state: "sending", attemptedAt: attempt.submittedAt };
        persist();
        return true;
      });
    } catch (_) {
      $("form-error").textContent = "Chưa thể chấm bài. Các câu trả lời vẫn được giữ; vui lòng kiểm tra lại hoặc báo giáo viên.";
      $("form-error").hidden = false;
    } finally {
      submitting = false;
      renderAnswers();
      if (attempt.submittedAt) {
        $("answer-scroll").scrollTop = 0;
        $("answer-scroll").focus({ preventScroll: true });
      }
    }
    if (shouldSend) await sendScore(attempt.id);
  }

  function configuredFormSink() {
    if (course.testing === true) return null;
    const sink = course.scoreSink;
    if (!sink || sink.kind !== "google-form" || !sink.entries || typeof sink.formResponseUrl !== "string") return null;
    try {
      const url = new URL(sink.formResponseUrl);
      if (url.protocol !== "https:" || url.hostname !== "docs.google.com" || !/^\/forms\/d\/(?:e\/)?[^/]+\/formResponse\/?$/.test(url.pathname)) return null;
      const required = ["name", "total", "assignmentCode", "lesson", "activity", "className", "percent", "score", "wrong"];
      if (required.some((field) => !/^entry\.\d+$/.test(sink.entries[field] || ""))) return null;
      return sink;
    } catch (_) { return null; }
  }

  function scoreBody(sink, snapshot) {
    const grade = snapshot.grade;
    const values = {
      name: snapshot.identity.name,
      className: snapshot.identity.className,
      total: String(grade.total),
      assignmentCode: plainText(unit.testCode),
      lesson: unitLabel(),
      activity: "Làm lại đề · Lượt " + snapshot.number + " · Mã lượt " + snapshot.id + " · " + snapshot.submittedAt,
      percent: String(grade.percent),
      score: String(grade.score),
      wrong: grade.wrong.length ? grade.wrong.map((result) => "Câu " + result.number + ": " + plainText(result.actual) + " → " + plainText(result.answer)).join("\n") : "Không có câu sai"
    };
    const body = new URLSearchParams();
    Object.keys(values).forEach((field) => body.set(sink.entries[field], values[field]));
    // Only use additional form mappings when explicitly supplied by the course configuration.
    const optional = { attemptId: snapshot.id, attemptNumber: String(snapshot.number), submittedAt: snapshot.submittedAt, startedAt: snapshot.startedAt };
    Object.keys(optional).forEach((field) => { if (/^entry\.\d+$/.test(sink.entries[field] || "")) body.set(sink.entries[field], optional[field]); });
    return body;
  }

  async function sendScore(id) {
    if (!attempt || attempt.id !== id || !attempt.submittedAt) return;
    if (course.testing === true) {
      attempt.delivery = { state: "test-mode" };
      persist();
      renderDelivery();
      return;
    }
    const sink = configuredFormSink();
    if (!sink) {
      attempt.delivery = { state: "not-configured" };
      persist();
      renderDelivery();
      return;
    }
    const snapshot = JSON.parse(JSON.stringify(attempt));
    const controller = typeof AbortController === "function" ? new AbortController() : null;
    const timeout = controller ? setTimeout(() => controller.abort(), 25000) : null;
    try {
      // Google Forms is intentionally no-cors: an opaque response is NOT a storage confirmation.
      await fetch(sink.formResponseUrl, { method: "POST", mode: "no-cors", credentials: "omit", body: scoreBody(sink, snapshot), ...(controller ? { signal: controller.signal } : {}) });
      snapshot.delivery = { state: "sent-unverified", attemptedAt: snapshot.delivery.attemptedAt, requestFinishedAt: new Date().toISOString() };
    } catch (_) {
      snapshot.delivery = { state: "unconfirmed", attemptedAt: snapshot.delivery.attemptedAt, reason: "network" };
    } finally {
      if (timeout !== null) clearTimeout(timeout);
    }
    try { localStorage.setItem(attemptKey(id), JSON.stringify(snapshot)); } catch (_) { storageAvailable = false; }
    if (attempt && attempt.id === id) {
      attempt.delivery = snapshot.delivery;
      persist();
      renderDelivery();
    }
  }

  function startNewAttempt() {
    if (!attempt || !attempt.submittedAt || submitting || ["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) return;
    attempt = createAttempt(Number(attempt.number || 1) + 1);
    reviewMode = "wrong";
    persist({ makeCurrent: true });
    $("form-error").hidden = true;
    renderAnswers();
    $("answer-scroll").scrollTop = 0;
    const first = questions[0] && $("answer-" + questions[0].number);
    if (first) first.focus({ preventScroll: true });
  }

  function receiveStorageUpdate(event) {
    if (!attempt || !storageBase || event.key !== attemptKey(attempt.id) || !event.newValue) return;
    try {
      const saved = JSON.parse(event.newValue);
      if (!validStoredAttempt(saved) || !saved.submittedAt) return;
      attempt = saved;
      if (["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) attempt.delivery = { state: "unconfirmed", reason: "another-tab" };
      renderAnswers();
    } catch (_) { /* Ignore unrelated or incomplete browser-storage events. */ }
  }

  initialize();
}());
</script></body>
</html>
