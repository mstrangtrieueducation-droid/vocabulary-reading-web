  <script id="ri2-unit-data" type="application/json">{"unit":3,"title":"READING INTENSIVE 2 · UNIT 3","testCode":"RI2-U03","total":60,"studentPreviewUrl":"https://docs.google.com/document/d/1DKQmia2_Dh_0ZBFcgGwsjWlQ5OuNqUHOpHw0sDf_46g/preview","sections":[{"exercise":1,"count":15,"inputKind":"matching","choices":["A","B","C","D","E","F","G","H","I","K","L","M","O","P","Q"],"instruction":"Ex 1: Match the words in Column A with their correct definitions in Column B. Write the letter of the definition next to the corresponding word.","questions":[{"number":1,"answer":"M","context":"archeology (n)","explanation":"Archeology (thường viết archaeology) là danh từ chỉ ngành nghiên cứu con người và văn hóa quá khứ qua công trình, mộ, công cụ cùng các di vật. Định nghĩa M nêu đúng đối tượng và mục đích nghiên cứu này, nên là cặp tương ứng."},{"number":2,"answer":"I","context":"evidence (n)","explanation":"Evidence là danh từ không đếm được, nghĩa là bằng chứng—các sự kiện hoặc dấu hiệu giúp chứng minh điều gì đó. I diễn đạt chính xác chức năng ‘help to prove something’; cần phân biệt với clue, một manh mối giúp lần ra lời giải."},{"number":3,"answer":"E","context":"clue (n)","explanation":"Clue là danh từ đếm được chỉ một dữ kiện/manh mối giúp giải quyết vấn đề hoặc tìm ra câu trả lời. Định nghĩa E tập trung đúng chức năng hỗ trợ khám phá lời giải, nên ghép với clue thay vì nghĩa rộng hơn của evidence."},{"number":4,"answer":"H","context":"conduct (v)","explanation":"Conduct ở vai trò động từ nghĩa là tổ chức và thực hiện một hoạt động có hệ thống, như cuộc điều tra hoặc thí nghiệm. H nêu đúng cả cấu trúc conduct an investigation/experiment, nên là định nghĩa phù hợp."},{"number":5,"answer":"P","context":"analysis (n)","explanation":"Analysis là danh từ chỉ quá trình xem xét chi tiết để hiểu một vấn đề hoặc nhận ra các thành phần quan trọng. P diễn đạt đầy đủ quá trình ấy; A lại là động từ investigate, không phải danh từ chỉ sự phân tích."},{"number":6,"answer":"O","context":"fracture (n)","explanation":"Fracture là danh từ chỉ vết nứt/gãy, đặc biệt ở xương hoặc cấu trúc như đá. Định nghĩa O lặp đúng cả nghĩa chính lẫn các ví dụ điển hình, nên khớp trực tiếp."},{"number":7,"answer":"L","context":"burial (n)","explanation":"Burial là danh từ chỉ hành động/chính lễ chôn cất thi thể trong đất hoặc trong mộ. L mô tả đúng hành động đặt người chết vào ground/tomb; C lại định nghĩa chính nơi chôn là tomb."},{"number":8,"answer":"Q","context":"beyond (pre)","explanation":"Beyond là giới từ chỉ ở phía xa hơn hoặc vượt quá một ranh giới/mốc. Q (‘on or to the farther side of; farther than’) diễn giải chính xác quan hệ không gian hoặc mức độ này."},{"number":9,"answer":"B","context":"flee (v)","explanation":"Flee là động từ nghĩa là chạy trốn khỏi nơi hoặc tình huống nguy hiểm. B nêu đúng hành động ‘run away ... from danger’; từ thường dùng nội động từ (flee) hoặc ngoại động từ trực tiếp (flee a place)."},{"number":10,"answer":"F","context":"speculation (n)","explanation":"Speculation là danh từ chỉ sự phỏng đoán khi chưa có đủ thông tin để chắc chắn. Định nghĩa F nhấn đúng cả hành động đoán và mức độ thiếu bằng chứng, nên phân biệt được với analysis dựa trên xem xét chi tiết."},{"number":11,"answer":"A","context":"investigate (v)","explanation":"Investigate là động từ nghĩa là điều tra/xem xét cẩn thận một tình huống, vấn đề hoặc tội phạm để tìm sự thật. A nêu đúng hành động, đối tượng và mục đích đó."},{"number":12,"answer":"D","context":"distinguish (v)","explanation":"Distinguish là động từ chỉ việc nhận ra hoặc chỉ ra sự khác biệt giữa hai hay nhiều người/vật. D diễn đạt trực tiếp cấu trúc distinguish between A and B; không phải hành động tách vật lý như isolate."},{"number":13,"answer":"K","context":"religious (a)","explanation":"Religious là tính từ nghĩa là thuộc tôn giáo hoặc có niềm tin tôn giáo mạnh. K bao quát cả hai cách dùng này, nên đúng về nghĩa và từ loại."},{"number":14,"answer":"G","context":"attach (v)","explanation":"Attach là động từ nghĩa là gắn, buộc hoặc nối một vật với vật khác. G liệt kê đúng ba động tác ‘fasten, join, or connect’, nên là định nghĩa tương ứng."},{"number":15,"answer":"C","context":"tomb (n)","explanation":"Tomb là danh từ chỉ ngôi mộ lớn hoặc buồng/công trình nơi người chết được chôn. C định nghĩa chính xác vật/nơi chôn cất này; cần phân biệt với burial, hành động chôn cất."}]},{"exercise":2,"count":10,"inputKind":"text","choices":[],"instruction":"Ex 2: Fill in the blanks with the following words: archaeologist, attempt, deal, carry, analyze, vulnerable, rule, indicate, exposure, likelihood","questions":[{"number":16,"answer":"indicate","context":"The preliminary results __________ that the experiment was successful, but further testing is required.","explanation":"Indicate là động từ, nghĩa là cho thấy hoặc chỉ ra. Chủ ngữ số nhiều The preliminary results đi với nguyên mẫu hiện tại indicate: “The preliminary results indicate that the experiment was successful”; vế sau về kiểm tra thêm cho thấy đây mới là dấu hiệu ban đầu."},{"number":17,"answer":"vulnerable","context":"Some species are __________ to diseases due to their weakened immune systems.","explanation":"Vulnerable là tính từ, nghĩa là dễ bị tổn thương hoặc mắc bệnh. Sau are cần bổ ngữ tính từ: “Some species are vulnerable to diseases...”; cụm cố định vulnerable to và nguyên nhân hệ miễn dịch yếu xác nhận lựa chọn."},{"number":18,"answer":"archaeologists","context":"The __________ was able to uncover new artifacts at the ancient site after months of excavation.","explanation":"Archaeologist là danh từ chỉ nhà khảo cổ; ngữ cảnh khai quật di vật tại một địa điểm cổ đại đòi hỏi nghề này. Tuy nhiên câu có The ... was able, nên về hòa hợp số phải là số ít archaeologist; khóa nguồn lại giữ dạng số nhiều archaeologists."},{"number":19,"answer":"analyze","context":"Experts must __________ the data before making any conclusions about the patterns.","explanation":"Analyze là động từ nghĩa là phân tích. Sau động từ khuyết thiếu must dùng nguyên mẫu: “Experts must analyze the data before making any conclusions”; thứ tự phân tích dữ liệu trước khi kết luận đúng với quy trình nghiên cứu."},{"number":20,"answer":"attempt","context":"The company made an __________ to improve customer service by launching a new training program.","explanation":"Attempt là danh từ đếm được, nghĩa là một nỗ lực/lần cố gắng. Cấu trúc “made an attempt to improve customer service” dùng make an attempt to + verb; chương trình đào tạo mới là biện pháp của nỗ lực ấy."},{"number":21,"answer":"rule","context":"We can __________ out the possibility of foul play in this case after reviewing the evidence.","explanation":"Cụm động từ rule out nghĩa là loại trừ một khả năng sau khi xem xét bằng chứng. Sau can dùng nguyên mẫu: “We can rule out the possibility of foul play...”; out có sẵn sau chỗ trống là dấu hiệu collocation quyết định."},{"number":22,"answer":"likelihood","context":"There is a high __________ of success if the new treatment is administered at the early stages of the disease.","explanation":"Likelihood là danh từ nghĩa là khả năng/xác suất một việc xảy ra. Cụm “a high likelihood of success” hoàn chỉnh theo mẫu likelihood of + noun; điều kiện điều trị ở giai đoạn sớm làm xác suất thành công cao."},{"number":23,"answer":"deal","context":"The scientist has done a great __________ of research on climate change over the past decade.","explanation":"Cụm định lượng a great deal of + uncountable noun nghĩa là rất nhiều. “The scientist has done a great deal of research...” đúng vì research không đếm được; deal là danh từ nhưng cả cụm mới mang nghĩa số lượng."},{"number":24,"answer":"carry","context":"To determine the cause of the issue, the team will __________ out an in-depth study of the materials.","explanation":"Cụm động từ carry out nghĩa là tiến hành/thực hiện. Sau will dùng nguyên mẫu: “the team will carry out an in-depth study”; danh từ study là đối tượng thường đi với conduct/carry out."},{"number":25,"answer":"exposure","context":"The __________ to toxic chemicals in the workplace poses a serious health risk to employees.","explanation":"Exposure là danh từ chỉ sự tiếp xúc/phơi nhiễm. Chủ ngữ đầy đủ “The exposure to toxic chemicals in the workplace” đi với poses; cụm exposure to + harmful substance giải thích nguy cơ sức khỏe nghiêm trọng."}]},{"exercise":3,"count":10,"inputKind":"mcq","choices":["A","B","C","D"],"instruction":"Ex 3: Read the passage below and choose the correct word from the options to fill in the blanks.","questions":[{"number":26,"answer":"D","context":"The (26) ______ of pyramids around the world is a testament to humanity’s ability to construct monumental structures that endure through time.","explanation":"The discovery of pyramids nghĩa là việc phát hiện các kim tự tháp, và được xem là bằng chứng cho năng lực xây dựng của con người. Invention là phát minh, exploration là thám hiểm, còn foundation là nền móng/sự thành lập, đều không phù hợp với các công trình đã tồn tại và được tìm thấy."},{"number":27,"answer":"B","context":"The most famous pyramids are (27) ______ of ancient Egypt, which have long captured the imagination of historians and archaeologists.","explanation":"Cấu trúc thay thế danh từ số nhiều là The most famous pyramids are those of ancient Egypt: those thay cho pyramids để tránh lặp. One sai số, còn that là số ít/đại từ quan hệ và không thể thay danh từ số nhiều ở đây."},{"number":28,"answer":"C","context":"The Great Pyramid of Giza, (28) ______ around 2580–2560 BCE during the reign of Pharaoh Khufu, stands as one of the Seven Wonders of the Ancient World.","explanation":"Cụm built around 2580–2560 BCE... là mệnh đề phân từ quá khứ rút gọn, bổ nghĩa bị động cho The Great Pyramid of Giza. A to be built chỉ mục đích/kỳ vọng, B chủ động sai nghĩa, còn D was built sẽ tạo hai động từ hữu hạn nối bằng dấu phẩy trước stands."},{"number":29,"answer":"A","context":"Its precision and scale continue to intrigue researchers, (29) ______ questions about the technology and manpower used to build it.","explanation":"Raising questions nghĩa là làm nảy sinh/đặt ra các câu hỏi; cụm V-ing sau dấu phẩy chỉ kết quả của việc độ chính xác và quy mô vẫn gây tò mò. Rising là tự tăng lên, arising thường mô tả câu hỏi tự xuất hiện, còn arousing cần tân ngữ như interest/curiosity, không đi tự nhiên với questions ở đây."},{"number":30,"answer":"D","context":"(30) ______ , pyramids are not unique to Egypt.","explanation":"Đoạn trước tập trung kim tự tháp Ai Cập; câu mới chuyển ý rằng kim tự tháp không chỉ có ở Ai Cập rồi đưa ví dụ Mesoamerica. However diễn tả tương phản phù hợp; Then chỉ trình tự, Therefore chỉ kết quả và Moreover chỉ bổ sung cùng hướng."},{"number":31,"answer":"C","context":"Built around 200 CE, (31) ______ is one of the largest pyramids in the world.","explanation":"Sau cụm phân từ “Built around 200 CE,” cần đại từ It làm chủ ngữ cho is one of the largest pyramids, quy chiếu Pyramid of the Sun. They sai số; What và Which sẽ mở mệnh đề phụ nhưng câu không có mệnh đề chính tương ứng."},{"number":32,"answer":"A","context":"In Sudan, the Kingdom of Kush built pyramids at sites like Meroë, (32) ______ over 200 pyramids have been uncovered, many smaller than those in Egypt but still monumental in their own right.","explanation":"Tiền ngữ sites like Meroë chỉ nơi chốn và mệnh đề sau đã đủ chủ-vị over 200 pyramids have been uncovered; vì vậy dùng trạng từ quan hệ where. Which/that phải giữ một chức năng danh từ trong mệnh đề, còn when chỉ thời gian."},{"number":33,"answer":"D","context":"These pyramids served as tombs for the royal family, showcasing the influence of Egyptian architecture (33) ______ Nubian culture.","explanation":"Cụm danh từ chuẩn là the influence of A on B: ảnh hưởng của kiến trúc Ai Cập đối với văn hóa Nubia. Vì of Egyptian architecture đã nêu nguồn ảnh hưởng, chỗ trống phải là on trước đối tượng chịu ảnh hưởng; to/with/in không đúng collocation này."},{"number":34,"answer":"C","context":"These structures have provided (34) ______ insights into ancient societies and continue to inspire curiosity and research into the (35) ______ in which ancient cultures approached engineering, astronomy, and ritual.","explanation":"Invaluable insights nghĩa là những hiểu biết cực kỳ quý giá, phù hợp với đóng góp của kim tự tháp cho việc nghiên cứu xã hội cổ đại. Valueless trái nghĩa; value là danh từ, còn overvalued hàm ý bị đánh giá cao quá mức mà đoạn không nói tới."},{"number":35,"answer":"C","context":"These structures have provided (34) ______ insights into ancient societies and continue to inspire curiosity and research into the (35) ______ in which ancient cultures approached engineering, astronomy, and ritual.","explanation":"Cấu trúc cố định the ways in which + clause nghĩa là những cách mà các nền văn hóa cổ tiếp cận kỹ thuật, thiên văn và nghi lễ. Means thường đi với by which, methods cần by/through which, còn processes in which đổi sang nghĩa quá trình tham gia."}]},{"exercise":4,"count":10,"inputKind":"text","choices":[],"instruction":"Ex 4: Fill in the blanks with ONE suitable word.","questions":[{"number":36,"answer":"has","context":"The discovery of Ötzi, the Iceman, in 1991 in the Alps (36) __________ significantly advanced our understanding of life in ancient Europe.","explanation":"Chủ ngữ trung tâm The discovery là số ít, và in 1991 nêu thời điểm phát hiện nhưng ảnh hưởng hiểu biết kéo đến hiện tại. Do đó hiện tại hoàn thành has significantly advanced phù hợp cả hòa hợp chủ-vị và ý nghĩa kéo dài."},{"number":37,"answer":"that","context":"Carbon dating revealed (37) __________ he lived over 5,300 years ago, making him the oldest preserved complete human body ever found.","explanation":"Sau revealed cần một mệnh đề danh từ làm tân ngữ: revealed that he lived over 5,300 years ago. That chỉ nối nội dung được phép định tuổi carbon cho thấy; nó không giữ vai trò chủ ngữ/tân ngữ bên trong mệnh đề."},{"number":38,"answer":"provided","context":"His body, perfectly preserved in ice, (38) __________ scientists with remarkable insights into his life.","explanation":"Giải thích của cô: insight (n) into st hiểu biết sâu về st\n\nCụm provide someone with something cho ta “His body ... provided scientists with remarkable insights into his life”. Sự bảo quản hoàn hảo đã cung cấp dữ liệu cho các nhà khoa học, và thì quá khứ provided thống nhất với câu chuyện phát hiện."},{"number":39,"answer":"showed / indicated","context":"Analysis of his tools, including a knife made of stone and an axe, (39) __________ he was likely a local leader, as well as a skilled hunter.","explanation":"Chủ ngữ Analysis of his tools là số ít và sự phân tích đã xảy ra trong quá khứ, nên showed hoặc indicated đều đúng. Mệnh đề theo sau “he was likely a local leader...” là kết luận mà các công cụ—đặc biệt chiếc rìu—cho thấy."},{"number":40,"answer":"which","context":"His diet, (40) __________ included bread and goat meat, further indicated that he resided in a village, offering a glimpse into his daily life.","explanation":"Sau dấu phẩy cần đại từ quan hệ which để thay His diet và làm chủ ngữ của included bread and goat meat. Đây là mệnh đề quan hệ không xác định bổ sung chi tiết; that thường không dùng sau dấu phẩy trong cấu trúc này."},{"number":41,"answer":"of / for","context":"In addition to his personal belongings, scientific research also uncovered evidence (41) __________ his violent death.","explanation":"Evidence of his violent death nghĩa là bằng chứng cho thấy cái chết bạo lực đã xảy ra; evidence for nhấn mạnh bằng chứng ủng hộ giả thuyết về cái chết ấy. Cả hai giới từ có thể nối evidence với cụm danh từ, dù of tự nhiên và trực tiếp hơn trong câu này."},{"number":42,"answer":"by","context":"An X-ray examination conducted in 2001 revealed that Ötzi was fatally injured (42) __________ an arrow wound beneath his left shoulder, inflicted from behind.","explanation":"Câu bị động was fatally injured by an arrow wound dùng by để nêu nguyên nhân/tác nhân gây thương tích. Chi tiết vết thương nằm dưới vai và bị bắn từ phía sau củng cố quan hệ này; with có thể nói công cụ trong cách viết khác nhưng không phải khóa ở đây."},{"number":43,"answer":"might / may","context":"Further analysis of his clothing in 2003 revealed traces of blood from other individuals, indicating he (43) __________ have been involved in a fight shortly before his demise.","explanation":"Trước have been involved cần động từ khuyết thiếu để tạo modal perfect. May/might have been involved diễn tả suy đoán về một việc trong quá khứ dựa trên vết máu của người khác; might thường cho mức chắc chắn thấp hơn một chút."},{"number":44,"answer":"while","context":"Some researchers initially speculated that he was fleeing from danger, but his stomach contents suggested he had just eaten, implying that he was attacked (44) __________ resting.","explanation":"While resting là mệnh đề trạng ngữ thời gian rút gọn từ while he was resting. Dạ dày cho thấy Ötzi vừa ăn nên các nhà nghiên cứu suy ra ông bị tấn công trong lúc nghỉ, thay vì đang bỏ chạy."},{"number":45,"answer":"on","context":"Today, Ötzi’s mysterious death continues to fascinate researchers, shedding light (45) __________ the struggles and challenges of life in the ancient world.","explanation":"Giải thích của cô: shed / throw / cast light on st\n\nCụm cố định shed light on something nghĩa là làm sáng tỏ/cung cấp hiểu biết về điều gì. “Shedding light on the struggles and challenges...” nói bí ẩn Ötzi giúp ta hiểu đời sống cổ đại; giới từ bắt buộc của cụm là on."}]},{"exercise":5,"count":15,"inputKind":"mcq","choices":["A","B","C","D"],"instruction":"Ex 5: Read the following passages and answer the questions.","questions":[{"number":46,"answer":"A","context":"Khía cạnh nào của nông nghiệp Hoa Kỳ thế kỷ 19 được thảo luận chính?","explanation":"Giải thích của cô: Khía cạnh nào của nông nghiệp Hoa Kỳ thế kỷ 19 được thảo luận chính?\n\nBài liên tục nối việc áp dụng máy tiết kiệm lao động với sản lượng tăng: máy gặt/đập trước và trong Nội chiến, cải tiến sau chiến tranh, rồi diện tích canh tác tăng cuối thế kỷ. A bao quát mạch này; B–D chỉ nói nội dung không có hoặc quá hẹp."},{"number":47,"answer":"C","context":"Từ \"crucial\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"crucial\" gần nghĩa nhất với từ nào?\n\nTrong “The most crucial factor behind this phenomenal upsurge”, crucial nghĩa là quan trọng nhất/then chốt. Important (C) gần nghĩa trực tiếp; obvious, unbelievable và desirable lần lượt chỉ sự rõ ràng, khó tin và đáng mong muốn."},{"number":48,"answer":"B","context":"Cụm \"avail themselves\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Cụm \"avail themselves\" gần nghĩa nhất với từ nào?\n\nCụm đầy đủ avail themselves of the new equipment nghĩa là tận dụng/sử dụng thiết bị mới. Make use (B), hiểu đầy đủ là make use of, giữ đúng nghĩa; take care, get rid và do more không tương đương."},{"number":49,"answer":"D","context":"Tại sao Nội chiến (Civil War) là động lực cho cơ giới hóa?","explanation":"Giải thích của cô: Tại sao Nội chiến (Civil War) là động lực cho cơ giới hóa?\n\nBài nêu phần lớn lực lượng lao động bị gọi nhập ngũ, nên nông dân miền Bắc vội dùng thiết bị tiết kiệm lao động. Máy móc cần để thay thế lực lượng lao động đang biến mất (D); các phương án về nhu cầu ngũ cốc của quân đội, công nghệ chiến tranh hay giảm giá không phải lý do tác giả đưa ra."},{"number":50,"answer":"C","context":"Phát biểu nào đúng về máy móc sau Nội chiến?","explanation":"Giải thích của cô: Phát biểu nào đúng về máy móc sau Nội chiến?\n\nĐầu đoạn 2 nói sau năm 1865, máy móc “became ever more important” và thiết bị cải tiến “was continually introduced”. Vì vậy việc dùng máy nông nghiệp tiếp tục tăng (C); bài không nói nông dân quay lại lao động thủ công hay máy kém chất lượng làm chậm sản xuất."},{"number":51,"answer":"A","context":"Máy gặt đập (combines) và máy gặt tự buộc giống nhau vì đều?","explanation":"Giải thích của cô: Máy gặt đập (combines) và máy gặt tự buộc giống nhau vì đều?\n\nMáy gặt tự buộc vừa cắt, gom và buộc thân lúa; combine vừa gặt, đập và đóng bao trong một hoạt động. Cả hai thực hiện nhiều hơn một chức năng (A); bài không cho thấy chúng cần ít năng lượng, chỉ dùng ở California hay cần đúng hai người."},{"number":52,"answer":"D","context":"Từ \"they\" ám chỉ cái gì?","explanation":"Giải thích của cô: Từ \"they\" ám chỉ cái gì?\n\nTrong “Threshing machines were also being improved ... and after 1870 they were increasingly powered by steam engines”, they quay lại chủ ngữ Threshing machines. Vì vậy D đúng; steam engines là nguồn cung năng lượng nằm sau by, còn grain stalks và horses không phải tiền ngữ."},{"number":53,"answer":"D","context":"Có thể suy ra hầu hết nông dân không sở hữu máy đập vì?","explanation":"Giải thích của cô: Có thể suy ra hầu hết nông dân không sở hữu máy đập vì?\n\nBài cho giá máy đập hơi nước từ 1.000 đến 4.000 đô la và ngay sau đó nói chúng thường thuộc chủ máy chuyên đi làm thuê. Quan hệ nhân quả cho phép suy ra máy quá đắt để mỗi nông dân đều sở hữu (D); các lý do về kỹ năng, chỗ chứa hay cơ hội mua trước không có bằng chứng."},{"number":54,"answer":"B","context":"Từ \"ponderous\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"ponderous\" gần nghĩa nhất với từ nào?\n\nCác combine được mô tả đôi khi phải dùng tới 40 con ngựa kéo, cho thấy chúng rất nặng và cồng kềnh. Heavy (B) sát nghĩa ponderous; advanced, complex và rapid không nhấn trọng lượng/kích thước khó di chuyển."},{"number":55,"answer":"B","context":"Chủ đề chính của bài đọc là gì?","explanation":"Giải thích của cô: Chủ đề chính của bài đọc là gì?\n\nBài kể nhu cầu tìm chất diệt nấm an toàn, cách Hazen và Brown chia việc xử lý mẫu đất, rồi phát hiện và phát triển chất thành nystatin. Do đó B bao quát quá trình phát triển một fungicide an toàn; tiểu sử hai người và các tổ chức/penicillin chỉ tạo bối cảnh."},{"number":56,"answer":"B","context":"Có thể suy ra điều gì về penicillin?","explanation":"Giải thích của cô: Có thể suy ra điều gì về penicillin?\n\nPenicillin được gọi là một trong các “new wonder drugs” đã tồn tại khi Hazen và Brown bắt đầu tìm thuốc chống nấm; nystatin chỉ xuất hiện sau mẫu đất năm 1948 và nghiên cứu tiếp theo. Vì vậy có thể suy ra penicillin được phát triển trước nystatin (B); bài còn nói nó giết vi khuẩn kiểm soát nấm, nên A sai."},{"number":57,"answer":"C","context":"Tại sao tác giả nhắc đến Đại học Columbia?","explanation":"Giải thích của cô: Tại sao tác giả nhắc đến Đại học Columbia?\n\nCâu “Based upon Hazen's previous research at Columbia University, where she had built...” cho biết Hazen từng nghiên cứu và xây dựng bộ sưu tập nuôi cấy nấm ở đó. Vì thế C đúng; nystatin không được phát triển tại Columbia và bài không nói Brown học hay trường trao giải."},{"number":58,"answer":"A","context":"Từ \"both\" ám chỉ ai?","explanation":"Giải thích của cô: Từ \"both\" ám chỉ ai?\n\nCâu vừa nêu Brown và Hazen, rồi nói “both were convinced that an antifungal organism...”. Both chỉ đúng hai nhà khoa học Hazen và Brown (A); các cặp thuốc, phòng thí nghiệm hay double effect không thể là chủ thể mang niềm tin."},{"number":59,"answer":"A","context":"Brown và Hazen đã phân tích chất gì?","explanation":"Giải thích của cô: Brown và Hazen đã phân tích chất gì?\n\nHazen sàng lọc và nuôi cấy nhiều soil samples, gửi chúng cho Brown để chiết xuất, cô lập và tinh chế hoạt chất. Soil tương ứng với dirt (A); streptomycin, bacteria và penicillin không phải vật liệu mẫu hai người phân tích trong quy trình được mô tả."},{"number":60,"answer":"D","context":"W. B. Nourse là ai?","explanation":"Giải thích của cô: W. B. Nourse là ai?\n\nHazen lấy cục đất ở mép “W.B. Nourse's cow pasture” và sau đó văn bản gọi ông là “farm owner Nourse”. Hai chi tiết xác định ông là một nông dân/chủ trang trại (D), không phải nhà vi sinh, thầy giáo hay người sưu tầm nấm."}]}]}</script>

  <script>/* RI2 grading is deliberately deterministic: only approved keys and explicit

(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else if (typeof define === "function" && define.amd) define([], factory);
  else root.RI2Grading = factory();
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  const SMALL = Object.freeze({ zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5,
    six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12,
    thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17,
    eighteen: 18, nineteen: 19 });
  const TENS = Object.freeze({ twenty: 20, thirty: 30, forty: 40, fifty: 50,
    sixty: 60, seventy: 70, eighty: 80, ninety: 90 });
  const SCALES = Object.freeze({ thousand: 1000, million: 1000000, billion: 1000000000 });
  const ORDINALS = Object.freeze({ zeroth: "zero", first: "one", second: "two", third: "three",
    fourth: "four", fifth: "five", sixth: "six", seventh: "seven", eighth: "eight",
    ninth: "nine", tenth: "ten", eleventh: "eleven", twelfth: "twelve", thirteenth: "thirteen",
    fourteenth: "fourteen", fifteenth: "fifteen", sixteenth: "sixteen", seventeenth: "seventeen",
    eighteenth: "eighteen", nineteenth: "nineteen", twentieth: "twenty", thirtieth: "thirty",
    fortieth: "forty", fiftieth: "fifty", sixtieth: "sixty", seventieth: "seventy",
    eightieth: "eighty", ninetieth: "ninety", hundredth: "hundred", thousandth: "thousand",
    millionth: "million", billionth: "billion" });
  const own = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
  const cardinalWord = word => own(SMALL, word) || own(TENS, word) || own(SCALES, word) || word === "hundred";
  const numericWord = word => cardinalWord(word) || own(ORDINALS, word);

  function inputText(value) {
    if (typeof value === "string") return value;
    if (typeof value === "number" && Number.isFinite(value)) return String(value);
    return "";
  }

  function basicText(value) {
    return inputText(value).normalize("NFKC").toLowerCase()
      .replace(/[\u200B-\u200D\uFEFF\u00AD]/g, "")
      .replace(/[‘’‛ʼ′]/g, "'")
      .replace(/[‐‑‒–—―−]/g, "-")
      .replace(/\s+/g, " ").trim();
  }

  function unwrap(value) {
    const pairs = { '"': '"', "'": "'", "“": "”", "‘": "’", "(": ")", "[": "]", "{": "}" };
    let result = value.trim();
    // Only a balanced wrapper is presentation punctuation, not a missing bracket.
    for (let depth = 0; depth < 4 && result.length > 1; depth += 1) {
      if (pairs[result[0]] !== result[result.length - 1]) break;
      result = result.slice(1, -1).trim();
    }
    return result;
  }

  function meridiem(value) {
    return value.replace(/(?<![a-z])([ap])\s*\.?\s*m\s*\.?(?![a-z])/g, "$1m");
  }

  function policyFor(expected, question) {
    const text = basicText(expected);
    const timeText = meridiem(text);
    const time = /\bo\s*'?\s*clock\b/.test(timeText) ? "oclock"
      : /(?<![a-z])[ap]m(?![a-z])/.test(timeText) ? "meridiem"
      : /\b\d{1,2}\s*:\s*\d{2}\b/.test(timeText) ? "clock" : "none";
    let numbers = /\d/.test(text);
    // Standalone One/First and anaphoric "the one" are grammatical keys in RI2.
    // A caller may explicitly opt in for a numeric-only word answer.
    const quantity = text.replace(/^(?:at least|more than|less than|nearly|about|approximately|over|under|up to|around)\s+/, "");
    const words = quantity.replace(/-/g, " ").split(/\s+/);
    let length = 0;
    while (length < words.length && (numericWord(words[length]) || words[length] === "and")) length += 1;
    const qualifier = quantity !== text;
    const grammaticalTail = /^(?:of|that|which|who|whom|to|by|with|for|as|than)$/;
    if (length > 0 && (qualifier || (length < words.length && !grammaticalTail.test(words[length])) || length > 1)) numbers = true;
    if (question && typeof question.numberFormatting === "boolean") numbers = question.numberFormatting;
    return { numbers, time, degrees: /°|º|˚|\bdegrees\b/.test(inputText(expected).toLowerCase()) };
  }

  function surface(value, policy) {
    let text = inputText(value);
    if (policy.degrees) text = text.replace(/[º˚]/g, "°");
    text = meridiem(basicText(unwrap(text)));
    // A single final sentence mark is harmless; internal numeric punctuation stays.
    text = text.replace(/[.!?,;:]$/, "").trim();
    text = unwrap(text)
      .replace(/(?<=[a-z])\s*-\s*(?=[a-z0-9])|(?<=[0-9])\s*-\s*(?=[a-z])/g, " ")
      .replace(/%/g, " percent ")
      .replace(/\bper\s+cent\b/g, "percent")
      .replace(/\s*\/\s*/g, "/")
      .replace(/\s*,\s*/g, ", ");
    if (policy.time === "oclock") text = text.replace(/\bo\s*'?\s*clock\b/g, "oclock");
    return text.replace(/\s+/g, " ").trim();
  }

  function parseCardinal(words) {
    let total = 0, group = 0, previous = "start", previousSmall = -1, lastScale = Infinity;
    for (const word of words) {
      if (word === "and") {
        if (previous !== "hundred" && previous !== "scale") return null;
        previous = "and";
      } else if (own(SMALL, word)) {
        const number = SMALL[word];
        if (number === 0 ? words.length !== 1 : number < 10
          ? !["start", "tens", "hundred", "scale", "and"].includes(previous)
          : !["start", "hundred", "scale", "and"].includes(previous)) return null;
        group += number;
        previous = number < 10 ? "small" : "teen";
        previousSmall = number;
      } else if (own(TENS, word)) {
        if (!["start", "hundred", "scale", "and"].includes(previous)) return null;
        group += TENS[word]; previous = "tens"; previousSmall = -1;
      } else if (word === "hundred") {
        if (previous !== "small" || previousSmall < 1 || previousSmall > 9 || group > 9) return null;
        group *= 100; previous = "hundred"; previousSmall = -1;
      } else {
        const scale = SCALES[word];
        if (!scale || !group || previous === "and" || scale >= lastScale) return null;
        total += group * scale; group = 0; previous = "scale"; previousSmall = -1; lastScale = scale;
      }
    }
    const number = total + group;
    return previous !== "start" && previous !== "and" && Number.isSafeInteger(number) ? number : null;
  }

  function suffix(number) {
    const tail = number % 100;
    return tail >= 11 && tail <= 13 ? "th" : number % 10 === 1 ? "st" : number % 10 === 2 ? "nd" : number % 10 === 3 ? "rd" : "th";
  }

  function parseWords(words) {
    const final = words[words.length - 1];
    if (!own(ORDINALS, final)) {
      const number = parseCardinal(words);
      return number === null ? null : String(number);
    }
    if (words.slice(0, -1).some(word => own(ORDINALS, word))) return null;
    const cardinal = ORDINALS[final];
    const number = words.length === 1 && (cardinal === "hundred" || own(SCALES, cardinal))
      ? (cardinal === "hundred" ? 100 : SCALES[cardinal])
      : parseCardinal(words.slice(0, -1).concat(cardinal));
    return number === null ? null : String(number) + suffix(number);
  }

  function numberWords(value) {
    const tokens = value.match(/[a-z]+|\d+|[^a-z\d]+/g) || [];
    const output = [];
    for (let index = 0; index < tokens.length; index += 1) {
      if (!numericWord(tokens[index])) { output.push(tokens[index]); continue; }
      const candidates = [{ word: tokens[index], end: index }];
      let cursor = index + 1;
      while (candidates.length < 64 && cursor + 1 < tokens.length && /^\s+$/.test(tokens[cursor]) && (numericWord(tokens[cursor + 1]) || tokens[cursor + 1] === "and")) {
        candidates.push({ word: tokens[cursor + 1], end: cursor + 1 }); cursor += 2;
      }
      let matched = false;
      for (let length = candidates.length; length > 0; length -= 1) {
        const parsed = parseWords(candidates.slice(0, length).map(candidate => candidate.word));
        if (parsed !== null) { output.push(parsed); index = candidates[length - 1].end; matched = true; break; }
      }
      if (!matched) output.push(tokens[index]);
    }
    return output.join("");
  }

  function clock(value, mode) {
    const format = (whole, hourText, minuteText, period) => {
      const hour = Number(hourText), minute = Number(minuteText);
      if (hour < (period ? 1 : 0) || hour > (period ? 12 : 23) || minute > 59) return whole;
      return hour + ":" + String(minute).padStart(2, "0") + (period ? " " + period : "");
    };
    if (mode === "oclock") return value.replace(/\b(0?\d|1[0-2])\s+oclock\b/g, (whole, hour) => Number(hour) >= 1 ? Number(hour) + " oclock" : whole);
    if (mode === "meridiem") return value
      .replace(/\b(\d{1,2})\s*[:.]\s*(\d{2})\s*(am|pm)\b/g, format)
      .replace(/\b(\d{1,2})\s+(\d{1,2})\s*(am|pm)\b/g, format)
      .replace(/(?<![\d:.])\b(0?\d|1[0-2])\s*(am|pm)\b/g, (whole, hour, period) => Number(hour) >= 1 ? Number(hour) + " " + period : whole);
    if (mode === "clock") return value.replace(/\b(\d{1,2})\s*[:.]\s*(\d{2})\b/g, (whole, hour, minute) => format(whole, hour, minute));
    return value;

    $("new-attempt").textContent = pending ? "ĐANG LƯU ĐIỂM…" : "LÀM MỘT LƯỢT MỚI ↻";
    const state = attempt.delivery && attempt.delivery.state;
    target.hidden = !attempt || !attempt.submittedAt || !["unconfirmed", "not-configured", "test-mode"].includes(state);
    if (target.hidden) return;
    const messages = {
      unconfirmed: ["Chưa lưu được điểm", "Vui lòng kiểm tra mạng hoặc báo giáo viên."],
      "not-configured": ["Chưa lưu được điểm", "Vui lòng báo giáo viên."],
      "test-mode": ["CHẾ ĐỘ KIỂM THỬ — không ghi điểm", ""]
    };
    const message = messages[state] || messages.unconfirmed;
    target.className = "delivery" + (["unconfirmed", "not-configured"].includes(state) ? " is-warning" : "");
    target.appendChild(node("strong", "", message[0]));
    if (message[1]) target.appendChild(node("span", "", message[1]));
  }

  async function withSubmissionLock(action) {
    if (navigator.locks && typeof navigator.locks.request === "function") {
      let actionStarted = false;
      try {
        return await navigator.locks.request(storageBase + ":submit:" + attempt.id, { mode: "exclusive" }, () => {
          actionStarted = true;
          return action();
        });
      } catch (error) {
        if (actionStarted) throw error;
        // Some embedded/partitioned contexts expose Web Locks but reject access.
        return action();
      }
    }
    return action();
  }

  async function submitAttempt(event) {
    event.preventDefault();
    if (!attempt || attempt.submittedAt || submitting) return;
    $("form-error").hidden = true;
    if (answeredCount() !== questions.length) {
      $("form-error").textContent = "Bạn cần trả lời đủ toàn bộ câu trước khi chấm bài.";
      $("form-error").hidden = false;
      const missing = questions.find((question) => !plainText(attempt.answers[String(question.number)]));
      const input = missing && $("answer-" + missing.number);
      if (input) input.focus();
      return;
    }
    submitting = true;
    renderAnswers();
    let shouldSend = false;
    try {
      shouldSend = await withSubmissionLock(() => {
        const saved = readStorage(attemptKey(attempt.id));
        if (validStoredAttempt(saved) && saved.submittedAt) {
          attempt = saved;
          if (["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) attempt.delivery = { state: "unconfirmed", reason: "already-submitted" };
          return false;
        }
        const grade = globalThis.RI2Grading.gradeAttempt(unit, attempt.answers);
        if (!grade.complete) throw new Error("incomplete");
        attempt.grade = grade;
        attempt.submittedAt = new Date().toISOString();
        attempt.delivery = { state: "sending", attemptedAt: attempt.submittedAt };
        persist();
        return true;
      });
    } catch (_) {
      $("form-error").textContent = "Chưa thể chấm bài. Các câu trả lời vẫn được giữ; vui lòng kiểm tra lại hoặc báo giáo viên.";
      $("form-error").hidden = false;
    } finally {
      submitting = false;
      renderAnswers();
      if (attempt.submittedAt) {
        $("answer-scroll").scrollTop = 0;
        $("answer-scroll").focus({ preventScroll: true });
      }
    }
    if (shouldSend) await sendScore(attempt.id);
  }

  function configuredFormSink() {
    if (course.testing === true) return null;
    const sink = course.scoreSink;
    if (!sink || sink.kind !== "google-form" || !sink.entries || typeof sink.formResponseUrl !== "string") return null;
    try {
      const url = new URL(sink.formResponseUrl);
      if (url.protocol !== "https:" || url.hostname !== "docs.google.com" || !/^\/forms\/d\/(?:e\/)?[^/]+\/formResponse\/?$/.test(url.pathname)) return null;
      const required = ["name", "total", "assignmentCode", "lesson", "activity", "className", "percent", "score", "wrong"];
      if (required.some((field) => !/^entry\.\d+$/.test(sink.entries[field] || ""))) return null;
      return sink;
    } catch (_) { return null; }
  }

  function scoreBody(sink, snapshot) {
    const grade = snapshot.grade;
    const values = {
      name: snapshot.identity.name,
      className: snapshot.identity.className,
      total: String(grade.total),
      assignmentCode: plainText(unit.testCode),
      lesson: unitLabel(),
      activity: "Làm lại đề · Lượt " + snapshot.number + " · Mã lượt " + snapshot.id + " · " + snapshot.submittedAt,
      percent: String(grade.percent),
      score: String(grade.score),
      wrong: grade.wrong.length ? grade.wrong.map((result) => "Câu " + result.number + ": " + plainText(result.actual) + " → " + plainText(result.answer)).join("\n") : "Không có câu sai"
    };
    const body = new URLSearchParams();
    Object.keys(values).forEach((field) => body.set(sink.entries[field], values[field]));
    // Only use additional form mappings when explicitly supplied by the course configuration.
    const optional = { attemptId: snapshot.id, attemptNumber: String(snapshot.number), submittedAt: snapshot.submittedAt, startedAt: snapshot.startedAt };
    Object.keys(optional).forEach((field) => { if (/^entry\.\d+$/.test(sink.entries[field] || "")) body.set(sink.entries[field], optional[field]); });
    return body;
  }

  async function sendScore(id) {
    if (!attempt || attempt.id !== id || !attempt.submittedAt) return;
    if (course.testing === true) {
      attempt.delivery = { state: "test-mode" };
      persist();
      renderDelivery();
      return;
    }
    const sink = configuredFormSink();
    if (!sink) {
      attempt.delivery = { state: "not-configured" };
      persist();
      renderDelivery();
      return;
    }
    const snapshot = JSON.parse(JSON.stringify(attempt));
    const controller = typeof AbortController === "function" ? new AbortController() : null;
    const timeout = controller ? setTimeout(() => controller.abort(), 25000) : null;
    try {
      // Google Forms is intentionally no-cors: an opaque response is NOT a storage confirmation.
      await fetch(sink.formResponseUrl, { method: "POST", mode: "no-cors", credentials: "omit", body: scoreBody(sink, snapshot), ...(controller ? { signal: controller.signal } : {}) });
      snapshot.delivery = { state: "sent-unverified", attemptedAt: snapshot.delivery.attemptedAt, requestFinishedAt: new Date().toISOString() };
    } catch (_) {
      snapshot.delivery = { state: "unconfirmed", attemptedAt: snapshot.delivery.attemptedAt, reason: "network" };
    } finally {
      if (timeout !== null) clearTimeout(timeout);
    }
    try { localStorage.setItem(attemptKey(id), JSON.stringify(snapshot)); } catch (_) { storageAvailable = false; }
    if (attempt && attempt.id === id) {
      attempt.delivery = snapshot.delivery;
      persist();
      renderDelivery();
    }
  }

  function startNewAttempt() {
    if (!attempt || !attempt.submittedAt || submitting || ["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) return;
    attempt = createAttempt(Number(attempt.number || 1) + 1);
    reviewMode = "wrong";
    persist({ makeCurrent: true });
    $("form-error").hidden = true;
    renderAnswers();
    $("answer-scroll").scrollTop = 0;
    const first = questions[0] && $("answer-" + questions[0].number);
    if (first) first.focus({ preventScroll: true });
  }

  function receiveStorageUpdate(event) {
    if (!attempt || !storageBase || event.key !== attemptKey(attempt.id) || !event.newValue) return;
    try {
      const saved = JSON.parse(event.newValue);
      if (!validStoredAttempt(saved) || !saved.submittedAt) return;
      attempt = saved;
      if (["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) attempt.delivery = { state: "unconfirmed", reason: "another-tab" };
      renderAnswers();
    } catch (_) { /* Ignore unrelated or incomplete browser-storage events. */ }
  }

  initialize();
}());
</script>
