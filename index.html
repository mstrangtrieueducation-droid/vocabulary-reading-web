<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c173f" />
    <title>Ms. Trang Trieu Education · Vocabulary & Reading</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", Arial, sans-serif; color: #0c173f; background: #f4f6f3; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; }
      main { width: min(920px, 100%); background: #fff; border: 1px solid #d9dfdc; border-radius: 28px; padding: clamp(28px, 6vw, 64px); box-shadow: 0 24px 70px rgba(12, 23, 63, .12); }
      img { width: 76px; height: 76px; object-fit: contain; }
      p { color: #50605e; line-height: 1.7; }
      h1 { margin: 22px 0 8px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(40px, 7vw, 72px); line-height: .98; }
      .courses { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 34px; }
      a { display: block; padding: 20px; border: 1px solid #d9dfdc; border-radius: 16px; color: #0c173f; text-decoration: none; font-weight: 750; background: #fbfcfa; }
      a:hover, a:focus-visible { border-color: #2f706c; background: #eef5f2; outline: none; }
      @media (max-width: 620px) { .courses { grid-template-columns: 1fr; } body { padding: 14px; } }
    </style>
  </head>
  <body>
    <main>
      <img src="./ms-trang-trieu-education-logo.png" alt="Ms. Trang Trieu Education" />
      <h1>Vocabulary &amp; Reading</h1>
      <p>Chọn chương trình để mở bài học đầu tiên.</p>
      <div class="courses">
        <a href="./vf1-u01-live/">Vocabulary Foundation 1</a>
        <a href="./vf2-u01-live/">Vocabulary Foundation 2</a>
        <a href="./ri1-u01-live/">Reading Intensive 1</a>
        <a href="./ri2-u01-live/">Reading Intensive 2</a>
      </div>
    </main>
  </body>
</html>
