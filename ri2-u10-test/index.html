<body>
  <aside class="test-mode-banner" id="test-mode-banner" role="status" hidden>CHẾ ĐỘ KIỂM THỬ — không ghi điểm</aside>
  <section class="gate" id="identity-gate" aria-labelledby="gate-title">
    <div class="gate-card">
      <div class="brand-line"><span class="brand-mark" aria-hidden="true">RI2</span><span id="gate-course">READING INTENSIVE</span></div>
      <h1 id="gate-title" style="margin:26px 0 18px">Sẵn sàng bắt đầu?</h1>
      <div class="gate-facts"><span id="gate-question-count">Phiếu trả lời</span></div>
      <form class="identity-form" id="identity-form" novalidate>
        <div class="field"><label for="student-name">Họ và tên</label><input id="student-name" name="student-name" type="text" maxlength="120" autocomplete="name" placeholder="Nhập đầy đủ họ và tên" required></div>
        <div class="field"><label for="student-class">Lớp</label><select id="student-class" name="student-class" required><option value="">— Chọn lớp FIGHTER —</option></select></div>
        <button class="primary" id="open-quiz" type="submit">MỞ ĐỀ & PHIẾU TRẢ LỜI →</button>
      </form>
      <p class="gate-error" id="gate-error" role="alert" hidden></p>
    </div>
  </section>

  <main class="app" id="quiz-app" hidden>
    <header class="app-header">
      <div class="app-title"><span class="brand-mark" aria-hidden="true">RI2</span><div><p class="app-kicker" id="app-course">READING INTENSIVE</p><h1 id="app-title">Làm lại đề</h1></div></div>
      <div class="identity-badge"><strong id="identity-name"></strong><span id="identity-class"></span></div>
    </header>
    <div class="quiz-layout">
      <section class="panel document-panel" aria-labelledby="document-heading">
        <div class="panel-header"><h2 id="document-heading">Đề bài</h2></div>
        <div class="document-body" id="document-body"><div class="document-loading" id="document-loading" role="status">Đang tải đề bài…</div></div>
      </section>
      <form class="panel answers-panel" id="answer-form" novalidate aria-labelledby="answers-heading">
        <div class="panel-header"><div><h2 id="answers-heading">Phiếu trả lời</h2><p id="attempt-label">Lượt 1</p></div><div class="answer-progress"><strong id="answered-count">0</strong><span id="total-count"></span></div></div>
        <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="answer-scroll" id="answer-scroll" tabindex="-1">
          <p class="storage-warning" id="storage-warning" role="status" hidden></p>
          <div id="result-summary" hidden></div>
          <div id="answer-sections"></div>
        </div>
        <footer class="answer-footer">
          <p class="form-error" id="form-error" role="alert" hidden></p>
          <div class="delivery" id="delivery-status" role="status" aria-live="polite" hidden></div>
          <button class="primary" id="submit-answers" type="submit" disabled>ĐIỀN ĐỦ CÁC CÂU ĐỂ NỘP</button>
          <button class="primary" id="new-attempt" type="button" hidden>LÀM MỘT LƯỢT MỚI ↻</button>
        </footer>
      </form>
    </div>
  </main>

  <script id="ri2-unit-data" type="application/json">{"unit":10,"title":"READING INTENSIVE 2 · UNIT 10","testCode":"RI2-U10","total":65,"studentPreviewUrl":"https://docs.google.com/document/d/1BCcnsngQoWspRWD1Yg-_4t2hYecjtZPRdQ89oVYnTV0/preview","sections":[{"exercise":1,"count":15,"inputKind":"matching","choices":["A","B","C","D","E","F","G","H","I","J","K","L","M","N","O"],"instruction":"Ex 1: Match the words in Column A with their correct definitions in Column B. Write the letter of the definition next to the corresponding word.","questions":[{"number":1,"answer":"H","context":"excessive (a)","explanation":"Giải thích của cô: Excessive: Quá mức, nhiều hơn mức cần thiết hoặc mức bình thường.\n\nExcessive là tính từ chỉ số lượng/mức độ vượt quá giới hạn hợp lý. Vì vậy từ khớp H: “More than what is necessary or normal.”; necessary or normal chính là chuẩn bị vượt quá."},{"number":2,"answer":"J","context":"debate (n)","explanation":"Giải thích của cô: Debate: Cuộc tranh luận, một cuộc thảo luận hoặc tranh cãi về một chủ đề mà ở đó mọi người bày tỏ các ý kiến khác nhau.\n\nDebate ở đây là danh từ chỉ cuộc thảo luận có nhiều quan điểm đối lập. Định nghĩa J—“A discussion or argument about a topic where people express different opinions.”—diễn đạt đúng cả hình thức thảo luận và sự khác biệt ý kiến."},{"number":3,"answer":"L","context":"sustainable (a)","explanation":"Giải thích của cô: Sustainable: Bền vững, có thể tiếp tục trong một thời gian dài mà không gây hại cho môi trường hoặc sử dụng quá nhiều tài nguyên.\n\nSustainable là tính từ chỉ khả năng duy trì lâu dài mà không làm cạn kiệt tài nguyên hay gây hại môi trường. Nó khớp chính xác L, nơi có đủ ba ý continue for a long time, without harm và without using too many resources."},{"number":4,"answer":"N","context":"shift (n)","explanation":"Giải thích của cô: Shift: Sự chuyển dịch, một sự thay đổi hoặc di chuyển từ vị trí, trạng thái hoặc hướng này sang hướng khác.\n\nShift là danh từ chỉ một sự thay đổi/chuyển hướng. Định nghĩa N: “A change or movement from one position, state, or direction to another.” lặp lại đúng các nét nghĩa vị trí, trạng thái và phương hướng."},{"number":5,"answer":"A","context":"economical (a)","explanation":"Giải thích của cô: Economical: Tiết kiệm, kinh tế, biết tiết kiệm tiền bạc hoặc tài nguyên; không lãng phí.\n\nEconomical là tính từ mô tả thứ/người sử dụng tiền hoặc tài nguyên hiệu quả. Vì vậy đáp án A: “Saving money or resources; not wasteful.”; cần phân biệt economic = thuộc kinh tế, không nhất thiết mang nghĩa tiết kiệm."},{"number":6,"answer":"C","context":"instability (n)","explanation":"Giải thích của cô: Instability: Sự bất ổn, trạng thái không chắc chắn, không thể dự đoán trước, hoặc thay đổi theo cách không ổn định.\n\nInstability là danh từ phủ định của stability, chỉ trạng thái thiếu ổn định. Định nghĩa C nêu “uncertain, unpredictable” và “not stable”, nên khớp trực tiếp."},{"number":7,"answer":"E","context":"crack (v)","explanation":"Giải thích của cô: Crack: Làm nứt, vỡ một thứ gì đó thành các mảnh, thường đi kèm một âm thanh sắc nhọn.\n\nCrack ở đây là động từ chỉ làm nứt/vỡ, thường tạo tiếng rắc. Nó tương ứng với E: “To break something into pieces, usually with a sharp sound.”; break và sharp sound là hai tín hiệu nhận diện."},{"number":8,"answer":"G","context":"appeal (v)","explanation":"Giải thích của cô: Appeal: Sức hút, hoặc hành động đưa ra một yêu cầu nghiêm túc hoặc chính thức cho điều gì đó, hoặc cố gắng thu hút sự chú ý/quan tâm.\n\nAppeal có thể là động từ kêu gọi/kháng nghị hoặc thu hút. Định nghĩa G nhắc “make a serious or formal request” và “attract attention or interest”, nên bao quát đúng hai cách dùng được nêu."},{"number":9,"answer":"O","context":"critical (a)","explanation":"Giải thích của cô: Critical: Nguy cấp, cực kỳ quan trọng hoặc thiết yếu; ngoài ra còn có nghĩa là mang tính chỉ trích, đánh giá cẩn thận và tìm ra lỗi sai.\n\nCritical là tính từ đa nghĩa: cực kỳ quan trọng/nguy cấp hoặc có tính đánh giá, phê bình. Định nghĩa O nêu cả “extremely important or essential” lẫn “judging ... and finding mistakes”, nên khớp đầy đủ."},{"number":10,"answer":"M","context":"melt (v)","explanation":"Giải thích của cô: Melt: Tan chảy, chuyển từ thể rắn sang thể lỏng do tác động của nhiệt độ.\n\nMelt là động từ mô tả sự chuyển pha từ rắn sang lỏng vì nhiệt. Định nghĩa M nói đúng “To change from a solid to a liquid because of heat.”, nên là cặp tương ứng trực tiếp."},{"number":11,"answer":"I","context":"slide (v)","explanation":"Giải thích của cô: Slide: Trượt, di chuyển mượt mà trên một bề mặt, thường là do tình cờ hoặc với rất ít sự kiểm soát.\n\nSlide là động từ chỉ chuyển động trượt trên bề mặt. Nó khớp I: “To move smoothly over a surface, often by accident or with little control.”; smoothly over a surface phân biệt slide với shift chung chung."},{"number":12,"answer":"K","context":"amenity (n)","explanation":"Giải thích của cô: Amenity: Tiện nghi, một tính năng hoặc dịch vụ làm cho một nơi nào đó trở nên thoải mái hoặc dễ chịu hơn.\n\nAmenity là danh từ chỉ tiện ích/dịch vụ giúp nơi ở hoặc địa điểm dễ chịu hơn. Vì vậy K—“A feature or service that makes a place comfortable or enjoyable.”—là định nghĩa chính xác."},{"number":13,"answer":"B","context":"subsidy (n)","explanation":"Giải thích của cô: Subsidy: Tiền trợ cấp, khoản tiền do chính phủ hoặc một tổ chức khác cấp để giúp giảm chi phí của một cái gì đó.\n\nSubsidy là danh từ chỉ khoản trợ cấp tài chính nhằm hỗ trợ/giảm chi phí. Định nghĩa B nêu rõ nguồn tiền là government or another organization và mục đích reduce the cost, nên khớp hoàn toàn."},{"number":14,"answer":"F","context":"host (v)","explanation":"Giải thích của cô: Host: Làm chủ nhà, cung cấp một địa điểm cho một sự kiện hoặc cho mọi người ở lại.\n\nHost ở đây là động từ, nghĩa là tổ chức/đón tiếp bằng cách cung cấp địa điểm. Nó nối với F: “To provide a place for an event or for people to stay.”; không phải danh từ host chỉ người chủ trì."},{"number":15,"answer":"D","context":"anthropology (n)","explanation":"Giải thích của cô: Anthropology: Nhân chủng học, ngành nghiên cứu về con người, văn hóa, xã hội và sự phát triển của họ theo thời gian.\n\nAnthropology là danh từ tên ngành nhân học. Định nghĩa D liệt kê đúng đối tượng nghiên cứu: humans, cultures, societies và development over time, nên là đáp án duy nhất."}]},{"exercise":2,"count":10,"inputKind":"text","choices":[],"instruction":"Ex 2: Fill in the blanks with the following words: exceeds, stake, appeal, stable, economic, anthropologist, host, abandon, priority, conservationists.","questions":[{"number":16,"answer":"anthropologist","context":"As a _______ studying different cultures, she traveled to remote villages to understand their customs and traditions.","explanation":"Sau mạo từ a cần danh từ đếm được chỉ người; anthropologist là nhà nhân chủng học. Việc nghiên cứu văn hóa, đến các làng xa xôi và tìm hiểu phong tục là công việc đặc trưng của người này. Câu hoàn chỉnh: “As an anthropologist studying different cultures, she traveled to remote villages to understand their customs and traditions.”"},{"number":17,"answer":"economic","context":"With the recent rise in prices, the government is facing serious _______ challenges.","explanation":"Ô trống đứng trước challenges nên cần tính từ economic = thuộc kinh tế. “Rise in prices” và áp lực lên chính phủ tạo ngữ cảnh vấn đề kinh tế. Câu hoàn chỉnh: “With the recent rise in prices, the government is facing serious economic challenges.”; economical sẽ mang nghĩa tiết kiệm, không phù hợp."},{"number":18,"answer":"host","context":"It's important for a _______ to make their guests feel welcomed and comfortable at the party.","explanation":"Sau a cần danh từ đếm được số ít; host ở đây là chủ nhà/người tổ chức. Nhiệm vụ làm khách cảm thấy được chào đón và thoải mái khớp trực tiếp với vai trò ấy. Câu hoàn chỉnh: “It’s important for a host to make their guests feel welcomed and comfortable at the party.”"},{"number":19,"answer":"abandon","context":"They had to _______ their old home because of the financial crisis, leaving behind a place full of memories.","explanation":"Sau had to cần động từ nguyên mẫu abandon = rời bỏ, từ bỏ. Khủng hoảng tài chính buộc họ rời căn nhà cũ và để lại ký ức, nên nghĩa hoàn toàn phù hợp. Câu hoàn chỉnh: “They had to abandon their old home because of the financial crisis, leaving behind a place full of memories.”"},{"number":20,"answer":"priority","context":"The health of the child is the _______ of the parents, and they always try to make sure she receives the best care.","explanation":"Sau the cần danh từ; priority nghĩa là điều được ưu tiên hàng đầu. Nội dung sau nói cha mẹ luôn bảo đảm con nhận chăm sóc tốt nhất, chứng minh sức khỏe của con là ưu tiên. Câu theo đề: “The health of the child is the priority of the parents ...”."},{"number":21,"answer":"exceeds","context":"The amount of dust in the air in Hanoi today ________ the safe level that is acknowledged by WHO.","explanation":"Chủ ngữ The amount số ít và câu nêu sự thật hiện tại, nên động từ exceed phải chia exceeds. Exceed the safe level nghĩa là vượt quá mức an toàn. Câu hoàn chỉnh: “The amount of dust in the air in Hanoi today exceeds the safe level that is acknowledged by WHO.”"},{"number":22,"answer":"stable","context":"If the foundations of the house aren't ________ , collapse is possible.","explanation":"Sau động từ be aren’t cần tính từ stable = vững chắc/ổn định để mô tả foundations. Mệnh đề “collapse is possible” nêu hậu quả nếu nền móng không vững. Câu hoàn chỉnh: “If the foundations of the house aren’t stable, collapse is possible.”"},{"number":23,"answer":"stake","context":"Thousands of lives will be at ________ if emergency aid does not arrive in the city soon.","explanation":"Cụm cố định be at stake nghĩa là bị đe dọa, đang lâm nguy. “Thousands of lives” và điều kiện viện trợ khẩn cấp không đến tạo đúng ngữ cảnh nguy hiểm. Câu hoàn chỉnh: “Thousands of lives will be at stake if emergency aid does not arrive in the city soon.”"},{"number":24,"answer":"appeal","context":"This used to be a marvellous hotel, but it has lost its ________ in recent years.","explanation":"Sau tính từ sở hữu its cần danh từ; appeal ở đây là sức hấp dẫn. Khách sạn từng tuyệt vời nhưng nay không còn hấp dẫn như trước. Câu hoàn chỉnh: “This used to be a marvellous hotel, but it has lost its appeal in recent years.”"},{"number":25,"answer":"conservationists","context":"__________ are fighting to save that kind of tiger from extinction.","explanation":"Chủ ngữ đứng trước are fighting phải là danh từ số nhiều chỉ người; conservationists là các nhà bảo tồn. Hoạt động cứu loài hổ khỏi tuyệt chủng đúng với vai trò của họ. Câu hoàn chỉnh: “Conservationists are fighting to save that kind of tiger from extinction.”"}]},{"exercise":3,"count":8,"inputKind":"mcq","choices":["A","B","C","D"],"instruction":"Ex 3: Read the passage below and choose the correct word from the options to fill in the blanks.","questions":[{"number":26,"answer":"D","context":"As the glacier melts, the rocks underneath (26) ______ more heat, causing even faster snowmelt.","explanation":"Đá lộ ra dưới băng hấp thụ nhiệt, làm tuyết tan nhanh hơn; collocation là absorb heat. Distribute là phân phối, provide là cung cấp, maintain là duy trì, đều không diễn tả cơ chế bề mặt tối giữ nhiệt."},{"number":27,"answer":"C","context":"This process illustrates the alarming impact of global warming, a (27) ______ linked to human activity.","explanation":"Sau mạo từ a cần danh từ số ít; phenomenon nghĩa là hiện tượng và phù hợp để gọi global warming. Case là trường hợp, factor là yếu tố, scene là cảnh—không bao quát hiện tượng khí hậu đang được mô tả."},{"number":28,"answer":"D","context":"Scientists worldwide, (28) ______ about the accelerated melting of glaciers, warn that this trend could have dire consequences.","explanation":"Cụm chen giữa hai dấu phẩy rút gọn từ “who are concerned about ...”, nên dùng quá khứ phân từ concerned. Concerned about = lo ngại về. Concerning sẽ khiến scientists là bên “gây lo ngại”, concern là sai loại từ, to concern sai cấu trúc."},{"number":29,"answer":"B","context":"The ice sheets of Greenland and Antarctica, for example, are melting faster than anticipated, (29) ______ could cause sea levels to rise significantly by the end of the century.","explanation":"Sau dấu phẩy cần đại từ quan hệ which để thay cho toàn bộ sự việc các dải băng tan nhanh và làm chủ ngữ của could cause. That thường không mở mệnh đề quan hệ không xác định sau dấu phẩy; this sẽ tạo comma splice; what không có tiền ngữ."},{"number":30,"answer":"D","context":"Melting water can seep into cracks on the surface of glaciers, allowing them to slide into warmer ocean waters, (30) ______ the melting process.","explanation":"Nước tan giúp sông băng trượt vào vùng biển ấm hơn, qua đó đẩy nhanh quá trình tan; speeding up the melting process là cụm V-ing chỉ kết quả. Opening up, switching on và calming down không hợp nghĩa cơ chế tăng tốc."},{"number":31,"answer":"D","context":"(31) ______ this issue affects some regions by causing floods, other areas, particularly those relying on glacial meltwater, are facing severe water shortages.","explanation":"While mở mệnh đề tương phản: một số vùng bị lũ, trong khi các vùng phụ thuộc nước băng tan lại thiếu nước nghiêm trọng. And và Since không thể hiện tương phản. Though cũng có thể tạo nghĩa nhượng bộ gần tương đương, nhưng đáp án nguồn chọn While để đặt hai tình huống song song đối lập."},{"number":32,"answer":"B","context":"To combat these effects, public (32) ______ like Leonardo DiCaprio emphasize the need for an urgent shift in attitudes toward climate change.","explanation":"Leonardo DiCaprio là người nổi tiếng có ảnh hưởng công chúng, nên public figures = các nhân vật công chúng. People/humans quá chung, còn patterns là mô hình, không thể chỉ người đứng ra kêu gọi."},{"number":33,"answer":"A","context":"He advocates for voting for leaders who understand the gravity of these environmental issues, stating that the future of the planet is (33) ______ stake.","explanation":"Thành ngữ be at stake nghĩa là đang bị đe dọa/đặt trong tình thế nguy hiểm. “The future of the planet is at stake” nhấn mạnh hậu quả cấp bách; in, on và under không đi trong cụm này."}]},{"exercise":4,"count":10,"inputKind":"text","choices":[],"instruction":"Ex 4: Fill in the blanks with ONE suitable word.","questions":[{"number":34,"answer":"effect / impact","context":"Climate change has a profound (34) __________ on all forms of life on Earth, affecting ecosystems, biodiversity, and the stability of natural processes.","explanation":"Sau a profound cần danh từ số ít và giới từ on. Cả have an effect on và have an impact on đều là collocation nghĩa là có tác động đến: “Climate change has a profound effect/impact on all forms of life on Earth.”"},{"number":35,"answer":"such","context":"Rising global temperatures, caused primarily by human activities (35) __________ as deforestation and the burning of fossil fuels, lead to extreme weather events, including (36) __________ frequent storms, droughts, and floods.","explanation":"Cụm such as dùng để giới thiệu ví dụ. Deforestation và the burning of fossil fuels là hai ví dụ cụ thể của human activities, nên “activities such as ...” hoàn chỉnh quan hệ khái quát–ví dụ."},{"number":36,"answer":"more","context":"Rising global temperatures, caused primarily by human activities (35) __________ as deforestation and the burning of fossil fuels, lead to extreme weather events, including (36) __________ frequent storms, droughts, and floods.","explanation":"Ô trống bổ nghĩa frequent để tạo so sánh hơn: more frequent storms = các cơn bão xảy ra thường xuyên hơn. Rising temperatures khiến tần suất tăng, và frequent là tính từ nhiều âm tiết nên dùng more."},{"number":37,"answer":"making","context":"These disturbances disrupt habitats, (37) __________ survival more difficult for many species.","explanation":"Sau dấu phẩy dùng V-ing making để nêu kết quả của mệnh đề trước: các xáo trộn phá hủy sinh cảnh, khiến sự sinh tồn khó hơn. Cấu trúc make + object + adjective là “making survival more difficult”."},{"number":38,"answer":"marine / sea / ocean","context":"For instance, polar bears face shrinking ice caps, while coral reefs, which are vital to (38) __________ life, suffer from bleaching due to higher ocean temperatures.","explanation":"Ô trống đứng trước life nên cần từ bổ nghĩa chỉ sự sống ở biển. Marine life là collocation chuẩn; sea life và ocean life cũng cùng nghĩa và đúng ngữ cảnh rạn san hô. “Vital to ... life” nói vai trò thiết yếu của san hô với sinh vật biển."},{"number":39,"answer":"on","context":"Altered weather patterns also affect food and water availability, putting stress (39) __________ plants and animals alike.","explanation":"Cụm put stress on somebody/something nghĩa là gây áp lực lên. Vì vậy “putting stress on plants and animals alike” diễn tả thực vật và động vật đều chịu sức ép do nguồn thức ăn, nước thay đổi."},{"number":40,"answer":"search","context":"Migratory patterns are changing as species are forced to move to new areas in (40) __________ of more favorable conditions.","explanation":"Cụm in search of = để tìm kiếm. Các loài buộc di chuyển tới khu vực mới “in search of more favorable conditions”, tức tìm điều kiện thuận lợi hơn; sau in và trước of cần danh từ search."},{"number":41,"answer":"who / that","context":"Additionally, altered temperature and rainfall can influence the growth cycles of plants, impacting herbivores (41) __________ depend on them, and in turn, affecting the entire food chain.","explanation":"Tiền ngữ herbivores chỉ sinh vật và mệnh đề sau thiếu chủ ngữ cho depend. Who hoặc that đều làm đại từ quan hệ chủ ngữ: “herbivores who/that depend on them”; them quy chiếu plants."},{"number":42,"answer":"extinction / disappearance","context":"As ecosystems become less stable, the biodiversity that has evolved over millions of years is threatened, leading to the (42) __________ of vulnerable species.","explanation":"Sau the và trước of vulnerable species cần danh từ chỉ kết quả bị đe dọa. Extinction là sự tuyệt chủng, còn disappearance là sự biến mất; cả hai phù hợp với chuỗi ý biodiversity is threatened → species vanish."},{"number":43,"answer":"how","context":"Ultimately, climate change presents a serious challenge to all living things, forcing us to reconsider (43) __________ we interact with the planet and its resources.","explanation":"Sau reconsider là mệnh đề gián tiếp “how we interact with ...”: xem xét lại cách chúng ta tương tác với hành tinh và tài nguyên. How đóng vai trò trạng từ chỉ cách thức; mệnh đề phía sau đã có đủ chủ ngữ we và động từ interact."}]},{"exercise":5,"count":22,"inputKind":"mcq","choices":["A","B","C","D"],"instruction":"Ex 5: Read the following passages and answer the questions.","questions":[{"number":44,"answer":"C","context":"Chủ đề chính của đoạn văn là gì?","explanation":"Giải thích của cô: Chủ đề chính của đoạn văn là gì?\n\nBài không chỉ mô tả vật liệu hay cách làm hạt chuỗi mà giải thích vì sao chúng đáng nghiên cứu: quan hệ với chủ nhân, đặc tính sưu tầm, các “secrets” về lịch sử/văn hóa và giá trị khảo cổ. Do đó C, the reasons for studying beads, bao quát nhất; A, B, D đều quá hẹp."},{"number":45,"answer":"B","context":"Từ \"adorned\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"adorned\" gần nghĩa nhất với từ nào?\n\nTrong “men, women, and children adorned themselves with beads”, họ dùng hạt chuỗi để trang sức cho mình. Adorned vì vậy gần nhất với decorated (B). Protected, purchased và enjoyed không diễn tả hành động đeo đồ trang trí."},{"number":46,"answer":"C","context":"Từ \"attire\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"attire\" gần nghĩa nhất với từ nào?\n\nCụm “incorporated into articles of attire” nói hạt chuỗi được gắn vào các món trang phục. Attire = clothing (C). Ritual, importance và history không phải vật có thể gắn hạt chuỗi vào."},{"number":47,"answer":"D","context":"Tất cả các đặc điểm sau đều được nêu là đặc tính của đồ sưu tầm, NGOẠI TRỪ?","explanation":"Giải thích của cô: Tất cả các đặc điểm sau đều được nêu là đặc tính của đồ sưu tầm, NGOẠI TRỪ?\n\nĐoạn 2 liệt kê “durable, portable, available in infinite variety, and often valuable”, tương ứng A, B và C. Scarcity (sự khan hiếm) không được nêu; thậm chí “infinite variety” không đồng nghĩa khan hiếm. Vì câu hỏi EXCEPT, chọn D."},{"number":48,"answer":"D","context":"Theo đoạn văn, tất cả các yếu tố sau khiến người ta muốn chạm vào hạt chuỗi, NGOẠI TRỪ?","explanation":"Giải thích của cô: Theo đoạn văn, tất cả các yếu tố sau khiến người ta muốn chạm vào hạt chuỗi, NGOẠI TRỪ?\n\nBài nói “beads come in shapes, colors, and materials that almost compel one to handle them”, nên A, B, C đều được nêu. Odor (mùi) không xuất hiện, vì vậy D là yếu tố ngoại lệ."},{"number":49,"answer":"D","context":"Từ \"unravel\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"unravel\" gần nghĩa nhất với từ nào?\n\n“Secrets waiting to be revealed” ngay trước đó giải nghĩa cho “points of information one hopes to unravel”: khám phá/làm sáng tỏ thông tin. Vì vậy discover (D) đúng. Communicate, transport và improve không hợp với secrets/history cần được hé lộ."},{"number":50,"answer":"C","context":"Từ \"mundane\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"mundane\" gần nghĩa nhất với từ nào?\n\nCâu nhấn mạnh “Even the most mundane beads” vẫn có thể đi rất xa, tạo tương phản giữa vẻ bình thường và lịch sử đặc biệt. Mundane vì thế = ordinary (C). Carved, beautiful và heavy mô tả đặc điểm khác không được ngữ cảnh gợi ra."},{"number":51,"answer":"C","context":"Rất khó để lần theo lịch sử của một số hạt chuỗi cổ là vì chúng?","explanation":"Giải thích của cô: Rất khó để lần theo lịch sử của một số hạt chuỗi cổ là vì chúng?\n\nĐoạn 3 nói tài liệu gốc ít hoặc không có và nhiều hạt cổ “have often been separated from their original cultural context”. Trong các đáp án, điều này tương ứng việc bị chuyển khỏi vị trí/bối cảnh ban đầu (C). Kích thước, chôn dưới đất hay thường bị mất không phải lý do bài nêu."},{"number":52,"answer":"A","context":"Kiến thức về lịch sử của hạt chuỗi có thể hữu ích cho nghiên cứu của ai?","explanation":"Giải thích của cô: Kiến thức về lịch sử của hạt chuỗi có thể hữu ích cho nghiên cứu của ai?\n\nHạt chuỗi cho biết “cultural context”, trình độ thương mại, công nghệ, văn hóa và giúp định niên đại di chỉ—đều thuộc phạm vi nghiên cứu con người và văn hóa của anthropologists. Vì vậy A đúng; chuyên gia nông nghiệp, y khoa và kinh tế chỉ chạm một phần hoặc không phù hợp."},{"number":53,"answer":"B","context":"Đoạn văn chủ yếu thảo luận về điều gì?","explanation":"Giải thích của cô: Đoạn văn chủ yếu thảo luận về điều gì?\n\nSau phần mở về sự thích nghi của mỏ chim với nguồn thức ăn, bài tập trung vào crossbill: cấu tạo mỏ chéo, cách tách vảy quả thông, sự khác nhau giữa mỏ lớn/nhỏ và một trường hợp ngoại lệ. Vì vậy B, the efficiency of the bill of the crossbill, sát nhất. A và C lệch trọng tâm; D quá rộng cho nhiều loài chim."},{"number":54,"answer":"A","context":"Phát biểu nào phản ánh tốt nhất kiểu \"tinh chỉnh tiến hóa\" được nhắc đến ở đoạn 1?","explanation":"Giải thích của cô: Phát biểu nào phản ánh tốt nhất kiểu \"tinh chỉnh tiến hóa\" được nhắc đến ở đoạn 1?\n\nCác ví dụ cho thấy hình dạng mỏ chuyên hóa theo cách kiếm thức ăn: oystercatcher cạy vỏ, hummingbird hút mật sâu, kiwi ngửi giun; crossbill cũng thích nghi với quả thông. Do đó A nói các hình dạng mỏ tiến hóa tùy nguồn thức ăn. B–D đưa ra quan hệ tiến hóa cụ thể mà bài không khẳng định."},{"number":55,"answer":"C","context":"Tại sao tác giả lại nhắc đến chim oystercatchers, chim hút mật và chim kiwi?","explanation":"Giải thích của cô: Tại sao tác giả lại nhắc đến chim oystercatchers, chim hút mật và chim kiwi?\n\nBa loài được dùng làm ví dụ về mối quan hệ chức năng giữa thiết kế mỏ và thức ăn: cạy vỏ, thăm hoa có mật, tìm giun. Vì vậy C đúng. Bài không nói chúng đều sống trong rừng, có mỏ giống crossbill hay có họ hàng gần với crossbill."},{"number":56,"answer":"D","context":"Crossbills là một loại?","explanation":"Giải thích của cô: Crossbills là một loại?\n\nĐoạn 1 gọi rõ “Two species of these finches” rồi mô tả crossbills. Vì thế crossbills là một loại finch (D). Shorebird, hummingbird và kiwi chỉ là các ví dụ đứng trước, không phải phân loại của crossbill."},{"number":57,"answer":"C","context":"Từ \"which\" ở đoạn 2 ám chỉ cái gì?","explanation":"Giải thích của cô: Từ \"which\" ở đoạn 2 ám chỉ cái gì?\n\nTrong “a powerful biting force at the bill tips, which is critical...”, which đứng ngay sau và bổ nghĩa cho cụm danh từ “a powerful biting force”. Vì vậy nó quy chiếu force (C); seed, bird và bill không khớp cấu trúc gần nhất của mệnh đề quan hệ."},{"number":58,"answer":"A","context":"Từ \"gap\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"gap\" gần nghĩa nhất với từ nào?\n\nCrossbill tách hai vảy chồng nhau của quả thông rồi luồn lưỡi “into the gap”. Gap ở đây là khe hở vừa được tạo, tương ứng opening (A). Flower, mouth và tree không mô tả khoảng trống giữa các vảy."},{"number":59,"answer":"D","context":"Từ \"discards\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"discards\" gần nghĩa nhất với từ nào?\n\nSau khi làm nứt lớp vỏ gỗ của hạt, chim “discards the woody seed covering” rồi nuốt nhân: nó vứt/bỏ phần vỏ đi. Vì vậy gets rid of (D) đúng. Eats trái với việc chỉ nuốt inner kernel; breaks và finds out không diễn tả loại bỏ."},{"number":60,"answer":"A","context":"Từ \"others\" ở đoạn 3 ám chỉ cái gì?","explanation":"Giải thích của cô: Từ \"others\" ở đoạn 3 ám chỉ cái gì?\n\nCấu trúc “The bills ... vary—some are stout and deep, others more slender and shallow” lược bỏ danh từ sau some/others. Cả hai đều chỉ các bills, nên A đúng; không phải species, seeds hay cones."},{"number":61,"answer":"B","context":"Từ \"deft\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"deft\" gần nghĩa nhất với từ nào?\n\n“Small-billed crossbills are more deft at removing the seeds” nghĩa là chúng khéo léo/thành thạo hơn khi lấy hạt nhỏ. Deft gần nhất với skilled (B). Hungry, tired và pleasant không nói năng lực thao tác."},{"number":62,"answer":"A","context":"Từ \"robust\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"robust\" gần nghĩa nhất với từ nào?\n\n“A large, robust bill” đối lập với loại mỏ slender và dùng cho lực cắn; robust ở đây nghĩa là chắc khỏe, tương ứng strong (A). Colorful, unusual và sharp không phải nghĩa từ vựng này."},{"number":63,"answer":"C","context":"Nội dung bài viết chỉ ra chim mỏ chéo Newfoundland là một điểm dị biệt (anomaly) ở chỗ nào?","explanation":"Giải thích của cô: Nội dung bài viết chỉ ra chim mỏ chéo Newfoundland là một điểm dị biệt (anomaly) ở chỗ nào?\n\nQuy luật trước đó là mỏ lớn hợp quả lớn, mỏ nhỏ hợp quả nhỏ. Newfoundland crossbill lại có “large, robust bill” trong khi phần lớn cây lá kim ở đó có “small cones”, nên kích thước mỏ không khớp nguồn thức ăn (C). Bài không nói nó lớn hơn toàn thân, đổi kỹ thuật hay rời rừng thường xanh."},{"number":64,"answer":"D","context":"Đoạn cuối cùng của bài đọc có khả năng cao sẽ tiếp tục thảo luận về điều gì?","explanation":"Giải thích của cô: Đoạn cuối cùng của bài đọc có khả năng cao sẽ tiếp tục thảo luận về điều gì?\n\nĐoạn cuối vừa nêu nghịch lý mỏ lớn–quả nhỏ nhưng chưa giải thích. Mạch triển khai hợp lý tiếp theo là cách loài này vẫn sinh tồn/kiếm ăn bằng chiếc mỏ lớn, tức D. A–C chuyển chủ đề sang chim khác, hệ sinh thái hoặc thú mà không giải quyết anomaly vừa đặt ra."},{"number":65,"answer":"B","context":"Tác giả mô tả cách chim mỏ chéo lấy hạt ra khỏi quả thông ở đoạn nào trong bài?","explanation":"Giải thích của cô: Tác giả mô tả cách chim mỏ chéo lấy hạt ra khỏi quả thông ở đoạn nào trong bài?\n\nĐoạn 2 trình bày toàn bộ chuỗi thao tác: dùng hàm dưới tách hai vảy, luồn lưỡi vào khe, kéo hạt ra, bỏ vỏ và nuốt nhân. Vì vậy đáp án là the second paragraph (B); các đoạn khác nói bối cảnh, biến thể mỏ và trường hợp Newfoundland."}]}]}</script>

  const own = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
  const cardinalWord = word => own(SMALL, word) || own(TENS, word) || own(SCALES, word) || word === "hundred";
  const numericWord = word => cardinalWord(word) || own(ORDINALS, word);

  function inputText(value) {
    if (typeof value === "string") return value;
    if (typeof value === "number" && Number.isFinite(value)) return String(value);
    return "";
  }

  function basicText(value) {
    return inputText(value).normalize("NFKC").toLowerCase()
      .replace(/[\u200B-\u200D\uFEFF\u00AD]/g, "")
      .replace(/[‘’‛ʼ′]/g, "'")
      .replace(/[‐‑‒–—―−]/g, "-")
      .replace(/\s+/g, " ").trim();
  }

  function unwrap(value) {
    const pairs = { '"': '"', "'": "'", "“": "”", "‘": "’", "(": ")", "[": "]", "{": "}" };
    let result = value.trim();
    // Only a balanced wrapper is presentation punctuation, not a missing bracket.
    for (let depth = 0; depth < 4 && result.length > 1; depth += 1) {
      if (pairs[result[0]] !== result[result.length - 1]) break;
      result = result.slice(1, -1).trim();
    }
    return result;
  }

  function meridiem(value) {
    return value.replace(/(?<![a-z])([ap])\s*\.?\s*m\s*\.?(?![a-z])/g, "$1m");

  function policyFor(expected, question) {

    card.appendChild(top);
    const value = plainText(attempt.answers[number]);
    const choices = Array.isArray(section.choices) ? section.choices.filter((choice) => typeof choice === "string" && choice.trim()).map((choice) => choice.trim()) : [];
    if (section.inputKind === "mcq" && choices.length) {
      const grid = node("div", "choice-grid");
      grid.setAttribute("role", "radiogroup");
      grid.setAttribute("aria-label", "Đáp án câu " + number);
      choices.forEach((choice, index) => {
        const choiceLabel = node("label", "choice");
        const input = node("input");
        input.type = "radio";
        input.name = "answer-" + number;
        input.id = index === 0 ? "answer-" + number : "answer-" + number + "-" + index;
        input.value = choice;
        input.checked = value === choice;
        input.disabled = !!attempt.submittedAt || submitting;
        input.addEventListener("change", () => recordAnswer(number, choice));
        choiceLabel.append(input, node("span", "", choice));
        grid.appendChild(choiceLabel);
      });
      card.appendChild(grid);
    } else if (section.inputKind === "matching" && choices.length) {
      const input = node("select");
      input.id = "answer-" + number;
      input.name = "answer-" + number;
      input.setAttribute("aria-label", "Đáp án câu " + number);
      const empty = node("option", "", "— Chọn đáp án —");
      empty.value = "";
      input.appendChild(empty);
      choices.forEach((choice) => { const option = node("option", "", choice); option.value = choice; input.appendChild(option); });
      input.value = value;
      input.disabled = !!attempt.submittedAt || submitting;
      input.addEventListener("change", () => recordAnswer(number, input.value));
      card.appendChild(input);
    } else {
      const input = node("input");
      input.type = "text";
      input.id = "answer-" + number;
      input.name = "answer-" + number;
      input.value = value;
      input.maxLength = 600;
      input.placeholder = "Nhập câu trả lời của bạn";
      input.autocomplete = "off";
      input.setAttribute("autocapitalize", "off");
      input.setAttribute("autocorrect", "off");
      input.spellcheck = false;
      input.disabled = !!attempt.submittedAt || submitting;
      input.addEventListener("input", () => recordAnswer(number, input.value));
      card.appendChild(input);
    }
    if (result) {
      const review = node("div", "answer-review");
      const key = node("p", "answer-key");
      const mine = node("span", "answer-key-row", "Bạn trả lời: ");
      mine.appendChild(node("b", result.correct ? "" : "submitted-answer", plainText(result.actual)));
      const correct = node("span", "answer-key-row", "Đáp án đúng: ");
      correct.appendChild(node("b", "", plainText(result.answer)));
      key.append(mine, correct);
      const alternatives = Array.isArray(result.acceptedAnswers) ? result.acceptedAnswers.map(plainText).filter((answer) => answer && answer !== plainText(result.answer)) : [];
      if (alternatives.length) key.appendChild(node("small", "", "Cũng chấp nhận: " + alternatives.join(" · ")));
      review.appendChild(key);
      if (plainText(question.context)) {
        review.appendChild(node("p", "review-label", "Ngữ cảnh câu hỏi"));
        review.appendChild(node("p", "question-context", plainText(question.context)));
      }
      review.appendChild(node("p", "review-label", "Giải thích"));
      review.appendChild(node("p", "explanation", cleanExplanation(result.explanation) || "Chưa có giải thích cho câu này."));
      card.appendChild(review);
    }
    return card;
  }

  function cleanExplanation(value) {
    return plainText(value).replace(/^Giải thích của cô\s*:\s*/i, "");
  }

  function setReviewMode(mode, questionNumber) {
    reviewMode = mode === "all" ? "all" : "wrong";
    renderAnswers();
    $("answer-scroll").scrollTop = 0;
    if (questionNumber !== undefined) {
      const card = [...document.querySelectorAll("[data-question]")].find((item) => item.dataset.question === String(questionNumber));
      if (card) {
        card.scrollIntoView({ block: "start" });
        card.focus({ preventScroll: true });
      }
    }
  }

  function renderResultSummary() {
    const target = $("result-summary");
    target.replaceChildren();
    target.hidden = !attempt.submittedAt || !attempt.grade || !attempt.grade.complete;
    if (target.hidden) return;
    const grade = attempt.grade;
    const box = node("section", "result-summary");
    box.setAttribute("aria-labelledby", "result-heading");
    box.appendChild(node("p", "result-kicker", "KẾT QUẢ"));
    const numbers = node("div", "result-numbers");
    const score = node("div", "result-score", String(grade.score));
    score.appendChild(node("small", "", " / " + grade.total));
    numbers.append(score, node("div", "result-percent", String(grade.percent) + "%"));
    box.appendChild(numbers);
    const title = node("h3", "", grade.score === grade.total ? "Hoàn thành tất cả các câu" : grade.wrong.length + " câu cần sửa");
    title.id = "result-heading";
    box.appendChild(title);
    if (grade.wrong.length) {
      const wrongLabel = node("p", "result-wrong-label", "CÂU SAI");
      const jumps = node("div", "wrong-jumps");
      grade.wrong.forEach((result) => {
        const button = node("button", "", String(result.number));
        button.type = "button";
        button.setAttribute("aria-label", "Xem câu sai " + result.number);
        button.addEventListener("click", () => setReviewMode("wrong", result.number));
        jumps.appendChild(button);
      });
      box.append(wrongLabel, jumps);
    }
    const toggles = node("div", "review-toggle");
    const wrongButton = node("button", reviewMode === "wrong" ? "active" : "", "CÂU SAI (" + grade.wrong.length + ")");
    wrongButton.type = "button";
    wrongButton.hidden = grade.wrong.length === 0;
    wrongButton.setAttribute("aria-pressed", String(reviewMode === "wrong"));
    wrongButton.addEventListener("click", () => setReviewMode("wrong"));
    const allButton = node("button", reviewMode === "all" ? "active" : "", "TẤT CẢ (" + grade.total + ")");
    allButton.type = "button";
    allButton.setAttribute("aria-pressed", String(reviewMode === "all"));
    allButton.addEventListener("click", () => setReviewMode("all"));
    toggles.append(wrongButton, allButton);
    box.appendChild(toggles);
    target.appendChild(box);
  }

  function renderDelivery() {
    const target = $("delivery-status");
    target.replaceChildren();
    const pending = !!attempt && ["sending", "pending"].includes(attempt.delivery && attempt.delivery.state);
    $("new-attempt").disabled = pending;
    $("new-attempt").textContent = pending ? "ĐANG LƯU ĐIỂM…" : "LÀM MỘT LƯỢT MỚI ↻";
    const state = attempt.delivery && attempt.delivery.state;
    target.hidden = !attempt || !attempt.submittedAt || !["unconfirmed", "not-configured", "test-mode"].includes(state);
    if (target.hidden) return;
    const messages = {
      unconfirmed: ["Chưa lưu được điểm", "Vui lòng kiểm tra mạng hoặc báo giáo viên."],
      "not-configured": ["Chưa lưu được điểm", "Vui lòng báo giáo viên."],
      "test-mode": ["CHẾ ĐỘ KIỂM THỬ — không ghi điểm", ""]
    };
    const message = messages[state] || messages.unconfirmed;
    target.className = "delivery" + (["unconfirmed", "not-configured"].includes(state) ? " is-warning" : "");
    target.appendChild(node("strong", "", message[0]));
    if (message[1]) target.appendChild(node("span", "", message[1]));
  }

  async function withSubmissionLock(action) {
    if (navigator.locks && typeof navigator.locks.request === "function") {
      let actionStarted = false;
      try {
        return await navigator.locks.request(storageBase + ":submit:" + attempt.id, { mode: "exclusive" }, () => {
          actionStarted = true;
          return action();
        });
      } catch (error) {
        if (actionStarted) throw error;
        // Some embedded/partitioned contexts expose Web Locks but reject access.
        return action();
      }
    }
    return action();
  }

  async function submitAttempt(event) {
    event.preventDefault();
    if (!attempt || attempt.submittedAt || submitting) return;
    $("form-error").hidden = true;
    if (answeredCount() !== questions.length) {
      $("form-error").textContent = "Bạn cần trả lời đủ toàn bộ câu trước khi chấm bài.";
      $("form-error").hidden = false;
      const missing = questions.find((question) => !plainText(attempt.answers[String(question.number)]));
      const input = missing && $("answer-" + missing.number);
      if (input) input.focus();
      return;
    }
    submitting = true;
    renderAnswers();
    let shouldSend = false;
    try {
      shouldSend = await withSubmissionLock(() => {
        const saved = readStorage(attemptKey(attempt.id));
        if (validStoredAttempt(saved) && saved.submittedAt) {
          attempt = saved;
          if (["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) attempt.delivery = { state: "unconfirmed", reason: "already-submitted" };
          return false;
        }
        const grade = globalThis.RI2Grading.gradeAttempt(unit, attempt.answers);
        if (!grade.complete) throw new Error("incomplete");
        attempt.grade = grade;
        attempt.submittedAt = new Date().toISOString();
        attempt.delivery = { state: "sending", attemptedAt: attempt.submittedAt };
        persist();
        return true;
      });
    } catch (_) {
      $("form-error").textContent = "Chưa thể chấm bài. Các câu trả lời vẫn được giữ; vui lòng kiểm tra lại hoặc báo giáo viên.";
      $("form-error").hidden = false;
    } finally {
      submitting = false;
      renderAnswers();
      if (attempt.submittedAt) {
        $("answer-scroll").scrollTop = 0;
        $("answer-scroll").focus({ preventScroll: true });
      }
    }
    if (shouldSend) await sendScore(attempt.id);
  }

  function configuredFormSink() {
    if (course.testing === true) return null;
    const sink = course.scoreSink;
    if (!sink || sink.kind !== "google-form" || !sink.entries || typeof sink.formResponseUrl !== "string") return null;
    try {
      const url = new URL(sink.formResponseUrl);
      if (url.protocol !== "https:" || url.hostname !== "docs.google.com" || !/^\/forms\/d\/(?:e\/)?[^/]+\/formResponse\/?$/.test(url.pathname)) return null;
      const required = ["name", "total", "assignmentCode", "lesson", "activity", "className", "percent", "score", "wrong"];
      if (required.some((field) => !/^entry\.\d+$/.test(sink.entries[field] || ""))) return null;
      return sink;
    } catch (_) { return null; }
  }

  function scoreBody(sink, snapshot) {
    const grade = snapshot.grade;
    const values = {
      name: snapshot.identity.name,
      className: snapshot.identity.className,
      total: String(grade.total),
      assignmentCode: plainText(unit.testCode),
      lesson: unitLabel(),
      activity: "Làm lại đề · Lượt " + snapshot.number + " · Mã lượt " + snapshot.id + " · " + snapshot.submittedAt,
      percent: String(grade.percent),
      score: String(grade.score),
      wrong: grade.wrong.length ? grade.wrong.map((result) => "Câu " + result.number + ": " + plainText(result.actual) + " → " + plainText(result.answer)).join("\n") : "Không có câu sai"
    };
    const body = new URLSearchParams();
    Object.keys(values).forEach((field) => body.set(sink.entries[field], values[field]));
    // Only use additional form mappings when explicitly supplied by the course configuration.
    const optional = { attemptId: snapshot.id, attemptNumber: String(snapshot.number), submittedAt: snapshot.submittedAt, startedAt: snapshot.startedAt };
    Object.keys(optional).forEach((field) => { if (/^entry\.\d+$/.test(sink.entries[field] || "")) body.set(sink.entries[field], optional[field]); });
    return body;
  }

  async function sendScore(id) {
    if (!attempt || attempt.id !== id || !attempt.submittedAt) return;
    if (course.testing === true) {
      attempt.delivery = { state: "test-mode" };
      persist();
      renderDelivery();
      return;
    }
    const sink = configuredFormSink();
    if (!sink) {
      attempt.delivery = { state: "not-configured" };
      persist();
      renderDelivery();
      return;
    }
    const snapshot = JSON.parse(JSON.stringify(attempt));
    const controller = typeof AbortController === "function" ? new AbortController() : null;
    const timeout = controller ? setTimeout(() => controller.abort(), 25000) : null;
    try {
      // Google Forms is intentionally no-cors: an opaque response is NOT a storage confirmation.
      await fetch(sink.formResponseUrl, { method: "POST", mode: "no-cors", credentials: "omit", body: scoreBody(sink, snapshot), ...(controller ? { signal: controller.signal } : {}) });
      snapshot.delivery = { state: "sent-unverified", attemptedAt: snapshot.delivery.attemptedAt, requestFinishedAt: new Date().toISOString() };
    } catch (_) {
      snapshot.delivery = { state: "unconfirmed", attemptedAt: snapshot.delivery.attemptedAt, reason: "network" };
    } finally {
      if (timeout !== null) clearTimeout(timeout);
    }
    try { localStorage.setItem(attemptKey(id), JSON.stringify(snapshot)); } catch (_) { storageAvailable = false; }
    if (attempt && attempt.id === id) {
      attempt.delivery = snapshot.delivery;
      persist();
      renderDelivery();
    }
  }

  function startNewAttempt() {
    if (!attempt || !attempt.submittedAt || submitting || ["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) return;
    attempt = createAttempt(Number(attempt.number || 1) + 1);
    reviewMode = "wrong";
    persist({ makeCurrent: true });
    $("form-error").hidden = true;
    renderAnswers();
    $("answer-scroll").scrollTop = 0;
    const first = questions[0] && $("answer-" + questions[0].number);
    if (first) first.focus({ preventScroll: true });
  }

  function receiveStorageUpdate(event) {
    if (!attempt || !storageBase || event.key !== attemptKey(attempt.id) || !event.newValue) return;
    try {
      const saved = JSON.parse(event.newValue);
      if (!validStoredAttempt(saved) || !saved.submittedAt) return;
      attempt = saved;
      if (["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) attempt.delivery = { state: "unconfirmed", reason: "another-tab" };
      renderAnswers();
    } catch (_) { /* Ignore unrelated or incomplete browser-storage events. */ }
  }

  initialize();
}());
</script></body>
</html>
