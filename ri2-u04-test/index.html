  <main class="app" id="quiz-app" hidden>
    <header class="app-header">
      <div class="app-title"><span class="brand-mark" aria-hidden="true">RI2</span><div><p class="app-kicker" id="app-course">READING INTENSIVE</p><h1 id="app-title">Làm lại đề</h1></div></div>

      </section>

  <script id="ri2-unit-data" type="application/json">{"unit":4,"title":"READING INTENSIVE 2 · UNIT 4","testCode":"RI2-U04","total":66,"studentPreviewUrl":"https://docs.google.com/document/d/1e4pM2Ov5eSi5ApHX2Q7jh-dfpk53OP7QNVjFBvIRzcw/preview","sections":[{"exercise":1,"count":15,"inputKind":"matching","choices":["A","B","C","D","E","F","G","H","I","J","K","L","M","N","O"],"instruction":"Ex 1: Match the words in Column A with their correct definitions in Column B. Write the letter of the definition next to the corresponding word.","questions":[{"number":1,"answer":"N","context":"intangible (a)","explanation":"Giải thích của cô: Intangible (a): Vô hình, không thể chạm tới.\n\nIntangible là tính từ chỉ điều không có hình thể vật chất, không thể chạm hoặc đo trực tiếp, như truyền thống hay bản sắc. N diễn đạt đúng nghĩa ‘cannot be touched or physically measured; not having a physical presence’."},{"number":2,"answer":"F","context":"decline (v)","explanation":"Giải thích của cô: Decline (v): Suy giảm, trở nên ít hơn/yếu hơn.\n\nDecline là động từ nghĩa là giảm về lượng, tầm quan trọng, chất lượng hoặc sức mạnh. F liệt kê chính xác các phương diện có thể suy giảm, nên là định nghĩa đầy đủ của từ ở đây."},{"number":3,"answer":"H","context":"craft (n)","explanation":"Giải thích của cô: Craft (n): Nghề thủ công, kỹ năng làm đồ bằng tay.\n\nCraft là danh từ chỉ nghề/hoạt động đòi hỏi kỹ năng đặc biệt, nhất là làm vật bằng tay. H nêu đúng cả yếu tố kỹ năng và lao động thủ công; không nên nhầm với động từ craft là chế tác."},{"number":4,"answer":"K","context":"cuisine (n)","explanation":"Giải thích của cô: Cuisine (n): Ẩm thực, phong cách nấu ăn đặc trưng.\n\nCuisine là danh từ chỉ phong cách nấu nướng/ẩm thực đặc trưng của quốc gia, vùng miền hoặc cơ sở. Định nghĩa K dùng đúng nét nghĩa này và nêu đúng các phạm vi văn hóa thường đi với từ."},{"number":5,"answer":"M","context":"hospitable (a)","explanation":"Giải thích của cô: Hospitable (a): Hiếu khách, chào đón khách.\n\nHospitable là tính từ mô tả người/nơi thân thiện và nhiệt tình đón khách hoặc người lạ. M là diễn giải đồng nghĩa trực tiếp, khác với friendly nói chung vì từ này nhấn cách tiếp đãi khách."},{"number":6,"answer":"A","context":"endure (v)","explanation":"Giải thích của cô: Endure (v): Chịu đựng, cam chịu điều khó khăn.\n\nEndure là động từ nghĩa là chịu đựng một điều khó chịu, đau đớn hoặc gian khổ trong thời gian dài. A mô tả chính xác cả đối tượng chịu đựng và độ kéo dài của hành động."},{"number":7,"answer":"C","context":"ritual (n)","explanation":"Giải thích của cô: Ritual (n): Nghi lễ, các hành động cố định theo nghi thức.\n\nRitual là danh từ chỉ chuỗi hành động, đôi khi kèm lời nói, được thực hiện theo một khuôn cố định, thường trong nghi lễ. C nêu đúng đặc điểm lặp lại và tính nghi thức ấy."},{"number":8,"answer":"E","context":"promote (v)","explanation":"Giải thích của cô: Promote (v): Thúc đẩy, khuyến khích.\n\nPromote là động từ nghĩa là khuyến khích người khác ủng hộ, sử dụng, mua hoặc thực hiện điều gì. E bao quát đúng các tân ngữ và mục đích thường gặp của từ; trong ngữ cảnh khác nó còn có nghĩa thăng chức."},{"number":9,"answer":"O","context":"convince (v)","explanation":"Giải thích của cô: Convince (v): Thuyết phục ai đó tin điều gì.\n\nConvince là động từ nghĩa là khiến ai tin chắc hoặc bị thuyết phục về một điều. O diễn đạt đúng hai cấu trúc ý nghĩa convince someone và make them certain, nên là cặp tương ứng."},{"number":10,"answer":"I","context":"define (v)","explanation":"Giải thích của cô: Define (v): Định nghĩa, giải thích giới hạn.\n\nDefine là động từ chỉ việc giải thích ý nghĩa và ranh giới chính xác của một khái niệm. I nêu đúng hai phần ‘meaning’ và ‘exact limits’, phân biệt với việc chỉ mô tả chung."},{"number":11,"answer":"D","context":"monument (n)","explanation":"Giải thích của cô: Monument (n): Đài kỷ niệm, công trình vinh danh.\n\nMonument là danh từ chỉ công trình được xây để tưởng niệm hoặc tôn vinh một người/sự kiện nổi tiếng. Định nghĩa D nêu đúng mục đích và hình thức công trình này."},{"number":12,"answer":"B","context":"military (a)","explanation":"Giải thích của cô: Military (a): Thuộc về quân đội.\n\nMilitary ở đây là tính từ nghĩa là liên quan binh sĩ hoặc lực lượng vũ trang. B diễn đạt đúng phạm vi ấy; từ cũng có thể là danh từ tập hợp trong ngữ cảnh khác nhưng không phải cách dùng được hỏi."},{"number":13,"answer":"G","context":"gradual (a)","explanation":"Giải thích của cô: Gradual (a): Dần dần, thay đổi chậm theo thời gian.\n\nGradual là tính từ chỉ quá trình xảy ra hoặc thay đổi từ từ trong một khoảng thời gian dài. G lặp đúng hai dấu hiệu ‘slowly’ và ‘over a long period of time’."},{"number":14,"answer":"L","context":"weave (v)","explanation":"Giải thích của cô: Weave (v): Dệt vải.\n\nWeave là động từ nghĩa là dệt bằng cách đan chéo sợi lên và xuống qua các sợi khác. L mô tả đúng thao tác kỹ thuật tạo vải, nên là định nghĩa cụ thể chứ không chỉ nói chung về nghề thủ công."},{"number":15,"answer":"J","context":"basis (n)","explanation":"Giải thích của cô: Basis (n): Nền tảng, cơ sở của một vấn đề.\n\nBasis là danh từ chỉ nền tảng, lý do hoặc các dữ kiện/ý tưởng cốt lõi để một điều được phát triển. J diễn đạt đúng chức năng làm điểm xuất phát của lập luận hoặc hệ thống."}]},{"exercise":2,"count":10,"inputKind":"text","choices":[],"instruction":"Ex 2: Fill in the blanks with the following words: violence, identity, contrast, tangible, heritage, basic, hardship, practice, inspiration, military.","questions":[{"number":16,"answer":"violence","context":"The rise of ________ in the region has raised concerns about the safety and security of the local population.","explanation":"Violence là danh từ không đếm được, nghĩa là bạo lực. “The rise of violence in the region...” dùng cấu trúc the rise of + noun; mối lo về an toàn và an ninh của dân địa phương là hệ quả trực tiếp của bạo lực gia tăng."},{"number":17,"answer":"basic","context":"Clean drinking water is a ________ need for every individual, regardless of their location or situation.","explanation":"Basic là tính từ, nghĩa là cơ bản/thiết yếu. Câu “Clean drinking water is a basic need...” cần tính từ bổ nghĩa cho need, và nước sạch là nhu cầu nền tảng của mọi người bất kể hoàn cảnh."},{"number":18,"answer":"inspiration","context":"The story of the young inventor served as ________ for many aspiring engineers to create innovative solutions.","explanation":"Inspiration là danh từ, nghĩa là nguồn cảm hứng. Cấu trúc “served as inspiration for many aspiring engineers” cho biết câu chuyện truyền động lực để họ sáng tạo; serve as + noun và inspiration for + person đều là collocation chuẩn."},{"number":19,"answer":"identity","context":"Cultural ________ is an essential part of any nation, as it shapes its traditions, customs, and way of life.","explanation":"Identity là danh từ chỉ bản sắc. “Cultural identity is an essential part of any nation” hoàn chỉnh chủ ngữ, và việc nó định hình truyền thống, phong tục, lối sống giải thích chính xác khái niệm bản sắc văn hóa."},{"number":20,"answer":"tangible","context":"The museum displayed several ________ artifacts, each telling a story of the region’s past.","explanation":"Tangible là tính từ nghĩa là hữu hình, có thể chạm thấy. “The museum displayed several tangible artifacts” nói các hiện vật vật chất được trưng bày; từ này đối lập với intangible dùng cho truyền thống hoặc giá trị phi vật thể."},{"number":21,"answer":"practice","context":"Daily ________ in the military includes strict training and discipline that prepare soldiers for any challenge.","explanation":"Practice là danh từ, ở đây chỉ hoạt động/thông lệ được thực hiện hằng ngày. “Daily practice in the military includes strict training and discipline...” nói nếp thực hành thường nhật chuẩn bị cho binh sĩ; daily cần một danh từ theo sau."},{"number":22,"answer":"military","context":"The army used ________ force to suppress the rebellion, causing widespread fear and suffering in the region.","explanation":"Military là tính từ bổ nghĩa cho force, tạo cụm military force—vũ lực/lực lượng quân sự. Chủ ngữ The army và hành động đàn áp nổi loạn là các dấu hiệu ngữ cảnh trực tiếp; violence force không phải cụm đúng."},{"number":23,"answer":"hardship","context":"After years of ________, the community finally found a way to thrive in the harsh desert environment.","explanation":"Hardship là danh từ chỉ gian khổ/hoàn cảnh khó khăn. Sau years of cần danh từ: “After years of hardship, the community finally found a way to thrive...”; sự đối lập giữa nhiều năm khó khăn và cuối cùng phát triển xác nhận nghĩa."},{"number":24,"answer":"heritage","context":"The ancient ________ of the country is reflected in its architecture, language, and festivals.","explanation":"Heritage là danh từ chỉ di sản được truyền lại từ quá khứ. “The ancient heritage of the country is reflected in its architecture, language, and festivals” liệt kê những biểu hiện cụ thể của di sản văn hóa quốc gia."},{"number":25,"answer":"contrast","context":"The artist’s work often includes a ________ between light and dark, making the pieces visually striking.","explanation":"Contrast là danh từ chỉ sự tương phản. Cụm “a contrast between light and dark” dùng mẫu contrast between A and B; chính đối lập sáng–tối làm tác phẩm nổi bật về thị giác."}]},{"exercise":3,"count":10,"inputKind":"mcq","choices":["A","B","C","D"],"instruction":"Ex 3: Read the passage below and choose the correct word from the options to fill in the blanks.","questions":[{"number":26,"answer":"D","context":"” These (26) ______ refer to cultural practices, traditions, and expressions that are integral to the identity of communities worldwide.","explanation":"These terms quy chiếu hai tên gọi vừa nêu: “Living Treasures” và “Intangible Cultural Heritage”. Terms là các thuật ngữ/tên gọi dùng để chỉ thực hành và biểu đạt văn hóa; structures, headings và phrases không đúng chức năng trong câu."},{"number":27,"answer":"C","context":"(27) ______ physical monuments or sites, intangible heritage includes elements such as music, dance, and crafts, (28) ______ reflect the values and way of life of a community.","explanation":"Tác giả đối lập di sản phi vật thể với physical monuments or sites, nên dùng Unlike + cụm danh từ: “Unlike physical monuments..., intangible heritage includes...”. Like/Alike cho nghĩa giống nhau, còn Likely là trạng từ/tính từ chỉ xác suất."},{"number":28,"answer":"C","context":"(27) ______ physical monuments or sites, intangible heritage includes elements such as music, dance, and crafts, (28) ______ reflect the values and way of life of a community.","explanation":"Sau dấu phẩy cần đại từ quan hệ which thay cho toàn bộ danh sách music, dance, and crafts và làm chủ ngữ của reflect. Đây là mệnh đề không xác định; that không dùng tự nhiên sau dấu phẩy, who chỉ người và what không có tiền ngữ."},{"number":29,"answer":"D","context":"While UNESCO has long protected landmarks like the Tower of Pisa and Machu Picchu, it also began (29) ______ on preserving cultural traditions in 2008.","explanation":"Cụm động từ focus on + V-ing nghĩa là tập trung vào một hoạt động. Sau began có thể dùng V-ing, tạo “began focusing on preserving cultural traditions”; rely/depend on đổi nghĩa, còn lean on không phù hợp chính sách UNESCO."},{"number":30,"answer":"D","context":"This shift aimed to recognize and safeguard practices such as the Chinese Dragon Boat Festival, Spanish flamenco, and Brazilian capoeira, which (30) ______ to the rich cultural diversity of the world.","explanation":"Cấu trúc contribute to + noun nghĩa là đóng góp vào. Các lễ hội và nghệ thuật được công nhận “contribute to the rich cultural diversity of the world”; turn to, aim to và lead to không diễn tả vai trò đóng góp tích cực này."},{"number":31,"answer":"B","context":"UNESCO’s efforts extend (31) ______ performing arts to regional cuisines, beverages, and various local practices.","explanation":"Extend beyond A to B nghĩa là mở rộng vượt ra ngoài A tới B. Nỗ lực của UNESCO vượt khỏi nghệ thuật biểu diễn để bao gồm ẩm thực, đồ uống và thực hành địa phương; behind, over và beside không tạo cấu trúc phạm vi này."},{"number":32,"answer":"B","context":"These additions reflect the growing understanding that food is (32) ______ tied to culture and plays a role in preserving cultural identities.","explanation":"Cụm be deeply tied to nghĩa là gắn bó sâu sắc với. Deeply bổ nghĩa mức độ liên kết giữa đồ ăn và văn hóa; strictly thu hẹp nghĩa, nearly là gần như, còn highly tied không phải kết hợp tự nhiên."},{"number":33,"answer":"B","context":"(33) ______ , many of these traditions are under threat.","explanation":"Hai đoạn đầu mô tả nỗ lực và phạm vi bảo tồn; câu mới chuyển sang vấn đề trái chiều rằng nhiều truyền thống đang bị đe dọa. However là trạng từ tương phản đúng; Moreover/Likewise bổ sung cùng hướng và Therefore chỉ kết quả."},{"number":34,"answer":"A","context":"For example, in Algeria, the traditional wedding ritual, where the bride’s hands are painted with henna, is facing decline as modern practices (34) ______ popularity.","explanation":"Cụm gain popularity nghĩa là trở nên phổ biến hơn. Khi các tập quán hiện đại ngày càng được ưa chuộng, nghi lễ cưới truyền thống suy giảm; maintain/remain/retain popularity đều nói tiếp tục giữ độ phổ biến, không tạo sự thay thế tăng dần."},{"number":35,"answer":"D","context":"By safeguarding these traditions, UNESCO promotes cultural diversity and ensures that unique cultural expressions are not lost in an (35) ______ globalized world.","explanation":"Trước tính từ/phân từ globalized cần trạng từ, và increasingly globalized world nghĩa là thế giới ngày càng toàn cầu hóa. Increase là động từ/danh từ, increasing là tính từ/V-ing, increased nói mức đã tăng chứ không bổ nghĩa theo cách cần thiết."}]},{"exercise":4,"count":10,"inputKind":"text","choices":[],"instruction":"Ex 4: Fill in the blanks with ONE suitable word.","questions":[{"number":36,"answer":"in","context":"Vietnam is a unique and diverse country, rich (36) __________ traditions and cultures that have evolved over thousands of years.","explanation":"Cụm cố định be rich in + noun nghĩa là phong phú về/có nhiều. “Vietnam is ... rich in traditions and cultures” dùng in để nối tính từ rich với những phương diện văn hóa dồi dào."},{"number":37,"answer":"The","context":"(37) __________ geographical diversity, spanning from the mountainous regions in the north to the Mekong Delta in the south, has contributed significantly to the variety of cultural practices and traditions found across the country.","explanation":"Cụm danh từ xác định geographical diversity nói sự đa dạng địa lý của chính Việt Nam vừa được giới thiệu, nên cần mạo từ The. Viết hoa The vì đứng đầu câu; phần phân từ spanning... bổ nghĩa cho toàn cụm chủ ngữ."},{"number":38,"answer":"home","context":"The northern region, influenced by Chinese culture, is (38) __________ to the elegant and refined traditions of Hanoi, while the central region, with its distinct historical heritage, reflects a blend of indigenous and Cham influences.","explanation":"Cấu trúc be home to + noun nghĩa là là nơi có/nuôi dưỡng. “The northern region ... is home to the elegant and refined traditions of Hanoi” nói miền Bắc là cái nôi/nơi tồn tại của các truyền thống ấy; to đã có sẵn sau ô trống."},{"number":39,"answer":"particularly/","context":"The southern region, shaped by both indigenous cultures and centuries of French colonialism, displays a more vibrant and cosmopolitan atmosphere, (39) __________ in Ho Chi Minh City.","explanation":"Giải thích của cô: especially\n\nParticularly hoặc especially là trạng từ nhấn mạnh Ho Chi Minh City như ví dụ nổi bật nhất cho bầu không khí sôi động, quốc tế của miền Nam. Trạng từ đứng trước cụm giới từ in Ho Chi Minh City và không thay đổi cấu trúc câu."},{"number":40,"answer":"With","context":"(40) __________ over 50 different ethnic groups, each with its own distinct language, customs, clothing, and religious practices, the tapestry of Vietnamese culture is (41) __________ varied as it is complex.","explanation":"With + noun phrase mở cụm trạng ngữ nêu đặc điểm nền: “With over 50 different ethnic groups...”. Cụm này cung cấp hoàn cảnh để mệnh đề chính kết luận bức tranh văn hóa đa dạng; With viết hoa vì đầu câu."},{"number":41,"answer":"as","context":"(40) __________ over 50 different ethnic groups, each with its own distinct language, customs, clothing, and religious practices, the tapestry of Vietnamese culture is (41) __________ varied as it is complex.","explanation":"Cấu trúc so sánh tương quan as + adjective + as cho câu “the tapestry ... is as varied as it is complex”: đa dạng cũng ngang mức phức tạp. Từ as thứ hai đã có trước it, nên ô trống cần as thứ nhất."},{"number":42,"answer":"played","context":"The majority Kinh group (Vietnamese) has (42) __________ a dominant role in shaping the country’s culture, (43) __________ the contributions of minority groups such as the Tay, H'mong, and Khmer are equally significant.","explanation":"Cụm cố định play a role in + V-ing nghĩa là đóng vai trò trong. Sau has cần quá khứ phân từ played, tạo hiện tại hoàn thành “has played a dominant role” để nói ảnh hưởng của người Kinh kéo dài đến hiện tại."},{"number":43,"answer":"yet/but","context":"The majority Kinh group (Vietnamese) has (42) __________ a dominant role in shaping the country’s culture, (43) __________ the contributions of minority groups such as the Tay, H'mong, and Khmer are equally significant.","explanation":"Yet hoặc but nối hai mệnh đề tương phản: người Kinh đóng vai trò chủ đạo, nhưng đóng góp của các dân tộc thiểu số cũng quan trọng không kém. Hai liên từ đẳng lập đều đứng sau dấu phẩy và trước chủ ngữ the contributions."},{"number":44,"answer":"celebrated","context":"The nation’s festivals, such as Tết (Lunar New Year), are (44) __________ with great enthusiasm across different regions, embodying the harmonious blend of ancient customs and contemporary practices.","explanation":"Câu cần bị động vì các lễ hội là đối tượng được tổ chức/kỷ niệm: are celebrated with great enthusiasm. Sau are dùng quá khứ phân từ celebrated; cụm with great enthusiasm mô tả cách người dân đón lễ."},{"number":45,"answer":"as","context":"These traditions, alongside the nation’s culinary richness, reinforce Vietnam (45) __________ a truly diverse and culturally vibrant homeland.","explanation":"Khóa dùng as để tạo ý “reinforce Vietnam as a truly diverse and culturally vibrant homeland”—củng cố hình ảnh/vị thế Việt Nam như một quê hương đa dạng. As giới thiệu vai trò/tư cách được khẳng định, nhưng câu tự nhiên hơn nếu có danh từ như Vietnam's identity/image trước nó."}]},{"exercise":5,"count":21,"inputKind":"mcq","choices":["A","B","C","D"],"instruction":"Ex 5: Read the following passages and answer the questions.","questions":[{"number":46,"answer":"A","context":"Người Mandans xây nhà sát nhau để làm gì?","explanation":"Giải thích của cô: Người Mandans xây nhà sát nhau để làm gì?\n\nĐoạn 1 nói bố trí nhà dày giúp họ tự bảo vệ trước người khác muốn lấy thực phẩm đã dự trữ. Vì vậy mục đích là canh giữ nguồn lương thực (A); thời tiết, diện tích trồng ngô và dùng chung dụng cụ không được nêu làm lý do."},{"number":47,"answer":"C","context":"Từ \"enabled\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"enabled\" gần nghĩa nhất với từ nào?\n\n“The tight arrangement enabled the Mandans to protect themselves” nghĩa là cách bố trí ấy giúp/cho phép họ tự bảo vệ. Helped (C) gần nghĩa trong ngữ cảnh; covered, reminded và isolated không diễn tả việc tạo khả năng."},{"number":48,"answer":"B","context":"Từ \"considerable\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"considerable\" gần nghĩa nhất với từ nào?\n\nConsiderable skill nghĩa là rất nhiều/một mức kỹ năng đáng kể. Much (B) chuyển đúng lượng lớn; planning và physical đổi loại ý, còn D flew là động từ quá khứ không liên quan."},{"number":49,"answer":"D","context":"Tại sao tác giả tin người Mandans là những nông dân lành nghề?","explanation":"Giải thích của cô: Tại sao tác giả tin người Mandans là những nông dân lành nghề?\n\nĐoạn 2 liệt kê mùa sinh trưởng ngắn, sương giá, hạn, nóng, mưa đá và châu chấu; đoạn 3 nói phụ nữ Mandan vẫn trồng được ngô chịu nghịch cảnh. Bằng chứng cho thấy họ canh tác thành công bất chấp thời tiết bất lợi (D), không phải nhờ phân bón, đất đa dạng hay giống ngô mới được nêu rõ."},{"number":50,"answer":"C","context":"Từ \"consumption\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"consumption\" gần nghĩa nhất với từ nào?\n\nTrong “slated for immediate consumption”, phần ngô được định để dùng ngay, đối lập với phần đem lưu trữ. Eating (C) là nghĩa chính xác của sự tiêu thụ thực phẩm; decay, planting và conversion không phù hợp."},{"number":51,"answer":"C","context":"Quy trình nào tác giả ngụ ý được thực hiện bởi cả nam và nữ?","explanation":"Giải thích của cô: Quy trình nào tác giả ngụ ý được thực hiện bởi cả nam và nữ?\n\nPhụ nữ được nói có trách nhiệm chính với ruộng và bắt đầu trồng ngô; đến vụ sau, văn bản chuyển sang chủ ngữ chung “the people picked the rest of the corn”. Cách đổi chủ ngữ ngụ ý cả nam và nữ tham gia thu hoạch ngô (C); không có bằng chứng tương tự cho dọn ruộng, trồng ngô hoặc thu hoạch bí."},{"number":52,"answer":"B","context":"Từ \"catastrophe\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"catastrophe\" gần nghĩa nhất với từ nào?\n\nThe catastrophe of crop failure and accompanying hunger là thảm họa mất mùa kèm đói. Disaster (B) đồng nghĩa trực tiếp; control, avoidance và history không thể hiện hậu quả nghiêm trọng."},{"number":53,"answer":"B","context":"Người Mandans bảo quản thức ăn bằng cách nào?","explanation":"Giải thích của cô: Người Mandans bảo quản thức ăn bằng cách nào?\n\nBài nhắc ngô xanh được “boiled, dried, and shelled”, còn bí được thái lát, phơi khô rồi xâu lại trước khi cất. Phương pháp chung cho cả hai là drying (B); smoking, freezing và salting không xuất hiện."},{"number":54,"answer":"D","context":"Từ \"it\" ám chỉ điều gì?","explanation":"Giải thích của cô: Từ \"it\" ám chỉ điều gì?\n\nCâu trước có “another staple, squash”; câu sau viết “After they picked it, they sliced it, dried it...”. Đại từ số ít it lặp lại squash (D), không thể là June, corn hay time trong chuỗi thao tác thu hoạch."},{"number":55,"answer":"D","context":"Loại cây nào được trồng chủ yếu bởi đàn ông?","explanation":"Giải thích của cô: Loại cây nào được trồng chủ yếu bởi đàn ông?\n\nCâu cuối nói người Mandan trồng hướng dương và thuốc lá, rồi “the latter was the particular task of the old men”. The latter chỉ mục thứ hai là tobacco, nên D đúng; ngô và bí chủ yếu do phụ nữ đảm trách, còn hướng dương là mục thứ nhất."},{"number":56,"answer":"A","context":"Tác giả ngụ ý điều gì xuyên suốt bài văn?","explanation":"Giải thích của cô: Tác giả ngụ ý điều gì xuyên suốt bài văn?\n\nNgười Mandan dự trữ thức ăn từ năm này sang năm khác, giữ phần thu hoạch tốt nhất làm hạt giống/thương mại và lập kho ngầm chống mất mùa. Chuỗi hành động nhất quán cho thấy họ lập kế hoạch cho tương lai (A); bài không nhấn cá nhân, cởi mở với người lạ hay ưa phiêu lưu."},{"number":57,"answer":"C","context":"Đoạn văn chủ yếu thảo luận về điều gì?","explanation":"Giải thích của cô: Đoạn văn chủ yếu thảo luận về điều gì?\n\nBài mô tả cách lãnh đạo được công nhận, bác bỏ ý có phẩm chất lãnh đạo bẩm sinh, rồi phân tích hai vai trò instrumental và expressive trong nhóm. Trong các lựa chọn, C bao quát quá trình nhóm xã hội xác định ai lãnh đạo; D quá rộng và không nhấn việc người lãnh đạo được chọn/nhận diện như câu mở bài."},{"number":58,"answer":"C","context":"Đoạn văn đề cập đến tất cả các cách sau để trở thành lãnh đạo, NGOẠI TRỪ?","explanation":"Giải thích của cô: Đoạn văn đề cập đến tất cả các cách sau để trở thành lãnh đạo, NGOẠI TRỪ?\n\nĐoạn 1 nêu lãnh đạo có thể đến từ khuôn mẫu văn hóa truyền thống, bầu cử chính thức hoặc tuyển chọn. Specific leadership training không được nhắc đến, nên C là phương án EXCEPT; A, B và D đều xuất hiện gần như nguyên văn."},{"number":59,"answer":"B","context":"Khi đề cập đến \"natural leaders\" (lãnh đạo bẩm sinh), tác giả muốn nêu quan điểm là?","explanation":"Giải thích của cô: Khi đề cập đến \"natural leaders\" (lãnh đạo bẩm sinh), tác giả muốn nêu quan điểm là?\n\nĐoạn 2 nói nhiều thập kỷ nghiên cứu “failed to produce consistent evidence” về bất kỳ nhóm natural leaders nào và không có bộ phẩm chất chung. Vì vậy không có bằng chứng họ tồn tại (B); A, C, D hoặc thiếu căn cứ hoặc trái trực tiếp đoạn văn."},{"number":60,"answer":"A","context":"Có thể rút ra kết luận gì về lãnh đạo từ đoạn 2?","explanation":"Giải thích của cô: Có thể rút ra kết luận gì về lãnh đạo từ đoạn 2?\n\nTác giả kết luận gần như bất kỳ ai cũng có thể được công nhận là lãnh đạo nếu phẩm chất người đó đáp ứng nhu cầu của that particular group. Vì nhu cầu thay đổi theo nhóm, người hiệu quả ở nhóm này có thể không hiệu quả ở nhóm khác (A); các lựa chọn còn lại không được suy ra."},{"number":61,"answer":"D","context":"Lãnh đạo mang tính công cụ (instrumental leaders) thường tập trung vào?","explanation":"Giải thích của cô: Lãnh đạo mang tính công cụ (instrumental leaders) thường tập trung vào?\n\nĐoạn 3 định nghĩa instrumental leadership là kiểu “emphasizes the completion of tasks”; thành viên trông cậy họ để hoàn thành công việc. Vì vậy họ tập trung đạt mục tiêu (D), trong khi quan hệ hài hòa và hỗ trợ cảm xúc thuộc expressive leadership."},{"number":62,"answer":"C","context":"Từ \"collective\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"collective\" gần nghĩa nhất với từ nào?\n\nThe collective well-being of a social group's members là phúc lợi chung của cả nhóm. Group (C) giữ đúng nghĩa thuộc tập thể; necessary, typical và particular không diễn tả sự cùng chung của nhiều thành viên."},{"number":63,"answer":"C","context":"Từ \"them\" ám chỉ ai?","explanation":"Giải thích của cô: Từ \"them\" ám chỉ ai?\n\nTrong cụm “minimize tension and conflict among them”, among đòi hỏi một nhóm người và tiền ngữ phù hợp là group members vừa được nhắc. Vì vậy C đúng; goals, tension/conflict không phải người và expressive leaders không phải nhóm đang được hỗ trợ trong câu."},{"number":64,"answer":"A","context":"\"Mối quan hệ thứ cấp\" (secondary relationship) được mô tả là?","explanation":"Giải thích của cô: \"Mối quan hệ thứ cấp\" (secondary relationship) được mô tả là?\n\nĐoạn 4 đối lập instrumental leaders có secondary relationship với expressive leaders có quan hệ more personal or primary; cuối đoạn còn gọi sự tôn trọng dành cho nhóm đầu là more distant. Vì vậy A distant đúng, còn personal là phía đối lập."},{"number":65,"answer":"D","context":"Từ \"resolve\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"resolve\" gần nghĩa nhất với từ nào?\n\nResolve issues that threaten to divide the group nghĩa là giải quyết các vấn đề có nguy cơ chia rẽ nhóm. Find a solution for (D) là diễn giải chính xác; ba lựa chọn còn lại chỉ né tránh hoặc nói về vấn đề, không xử lý nó."},{"number":66,"answer":"D","context":"Đoạn 3 và 4 tổ chức cuộc thảo luận về lãnh đạo chủ yếu theo phương pháp nào?","explanation":"Giải thích của cô: Đoạn 3 và 4 tổ chức cuộc thảo luận về lãnh đạo chủ yếu theo phương pháp nào?\n\nHai đoạn liên tục đặt instrumental leadership cạnh expressive leadership: mục tiêu đối lập phúc lợi, quan hệ xa đối lập quan hệ cá nhân, kỷ luật đối lập hỗ trợ. Cấu trúc tổ chức là comparison and contrast (D), không phải kể sự kiện, phân tích nguyên nhân-kết quả hay chỉ đưa ví dụ cho một vấn đề."}]}]}</script>

    eightieth: "eighty", ninetieth: "ninety", hundredth: "hundred", thousandth: "thousand",
    millionth: "million", billionth: "billion" });
  const own = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
  const cardinalWord = word => own(SMALL, word) || own(TENS, word) || own(SCALES, word) || word === "hundred";
  const numericWord = word => cardinalWord(word) || own(ORDINALS, word);

  function inputText(value) {
    if (typeof value === "string") return value;
    if (typeof value === "number" && Number.isFinite(value)) return String(value);
    return "";
  }

  function basicText(value) {

      .replace(/[‘’‛ʼ′]/g, "'")
      .replace(/[‐‑‒–—―−]/g, "-")
      .replace(/\s+/g, " ").trim();

  function unwrap(value) {
    const pairs = { '"': '"', "'": "'", "“": "”", "‘": "’", "(": ")", "[": "]", "{": "}" };
    let result = value.trim();
    // Only a balanced wrapper is presentation punctuation, not a missing bracket.
    for (let depth = 0; depth < 4 && result.length > 1; depth += 1) {
      if (pairs[result[0]] !== result[result.length - 1]) break;
      result = result.slice(1, -1).trim();
    }
    return result;

  function meridiem(value) {
    return value.replace(/(?<![a-z])([ap])\s*\.?\s*m\s*\.?(?![a-z])/g, "$1m");
  }

  function policyFor(expected, question) {
    const text = basicText(expected);
    const timeText = meridiem(text);
    const time = /\bo\s*'?\s*clock\b/.test(timeText) ? "oclock"
      : /(?<![a-z])[ap]m(?![a-z])/.test(timeText) ? "meridiem"
      : /\b\d{1,2}\s*:\s*\d{2}\b/.test(timeText) ? "clock" : "none";
    let numbers = /\d/.test(text);
    // Standalone One/First and anaphoric "the one" are grammatical keys in RI2.
    // A caller may explicitly opt in for a numeric-only word answer.
    const quantity = text.replace(/^(?:at least|more than|less than|nearly|about|approximately|over|under|up to|around)\s+/, "");
    const words = quantity.replace(/-/g, " ").split(/\s+/);
    let length = 0;
    while (length < words.length && (numericWord(words[length]) || words[length] === "and")) length += 1;
    const qualifier = quantity !== text;
    const grammaticalTail = /^(?:of|that|which|who|whom|to|by|with|for|as|than)$/;

      input.id = "answer-" + number;
      input.name = "answer-" + number;
      input.setAttribute("aria-label", "Đáp án câu " + number);
      const empty = node("option", "", "— Chọn đáp án —");
      empty.value = "";
      input.appendChild(empty);
      choices.forEach((choice) => { const option = node("option", "", choice); option.value = choice; input.appendChild(option); });
      input.value = value;
      input.disabled = !!attempt.submittedAt || submitting;
      input.addEventListener("change", () => recordAnswer(number, input.value));
      card.appendChild(input);
    } else {
      const input = node("input");
      input.type = "text";
      input.id = "answer-" + number;
      input.name = "answer-" + number;
      input.value = value;
      input.maxLength = 600;
      input.placeholder = "Nhập câu trả lời của bạn";
      input.autocomplete = "off";
      input.setAttribute("autocapitalize", "off");
      input.setAttribute("autocorrect", "off");
      input.spellcheck = false;
      input.disabled = !!attempt.submittedAt || submitting;
      input.addEventListener("input", () => recordAnswer(number, input.value));
      card.appendChild(input);
    }
    if (result) {
      const review = node("div", "answer-review");
      const key = node("p", "answer-key");
      const mine = node("span", "answer-key-row", "Bạn trả lời: ");
      mine.appendChild(node("b", result.correct ? "" : "submitted-answer", plainText(result.actual)));
      const correct = node("span", "answer-key-row", "Đáp án đúng: ");
      correct.appendChild(node("b", "", plainText(result.answer)));
      key.append(mine, correct);
      const alternatives = Array.isArray(result.acceptedAnswers) ? result.acceptedAnswers.map(plainText).filter((answer) => answer && answer !== plainText(result.answer)) : [];
      if (alternatives.length) key.appendChild(node("small", "", "Cũng chấp nhận: " + alternatives.join(" · ")));
      review.appendChild(key);
      if (plainText(question.context)) {
        review.appendChild(node("p", "review-label", "Ngữ cảnh câu hỏi"));
        review.appendChild(node("p", "question-context", plainText(question.context)));
      }
      review.appendChild(node("p", "review-label", "Giải thích"));
      review.appendChild(node("p", "explanation", cleanExplanation(result.explanation) || "Chưa có giải thích cho câu này."));
      card.appendChild(review);
    }
    return card;
  }

  function cleanExplanation(value) {
    return plainText(value).replace(/^Giải thích của cô\s*:\s*/i, "");
  }

  function setReviewMode(mode, questionNumber) {
    reviewMode = mode === "all" ? "all" : "wrong";
    renderAnswers();
    $("answer-scroll").scrollTop = 0;
    if (questionNumber !== undefined) {
      const card = [...document.querySelectorAll("[data-question]")].find((item) => item.dataset.question === String(questionNumber));
      if (card) {
        card.scrollIntoView({ block: "start" });
        card.focus({ preventScroll: true });
      }
    }
  }

  function renderResultSummary() {
    const target = $("result-summary");
    target.replaceChildren();
    target.hidden = !attempt.submittedAt || !attempt.grade || !attempt.grade.complete;
    if (target.hidden) return;
    const grade = attempt.grade;
    const box = node("section", "result-summary");
    box.setAttribute("aria-labelledby", "result-heading");
    box.appendChild(node("p", "result-kicker", "KẾT QUẢ"));
    const numbers = node("div", "result-numbers");
    const score = node("div", "result-score", String(grade.score));
    score.appendChild(node("small", "", " / " + grade.total));
    numbers.append(score, node("div", "result-percent", String(grade.percent) + "%"));
    box.appendChild(numbers);
    const title = node("h3", "", grade.score === grade.total ? "Hoàn thành tất cả các câu" : grade.wrong.length + " câu cần sửa");
    title.id = "result-heading";
    box.appendChild(title);
    if (grade.wrong.length) {
      const wrongLabel = node("p", "result-wrong-label", "CÂU SAI");
      const jumps = node("div", "wrong-jumps");
      grade.wrong.forEach((result) => {
        const button = node("button", "", String(result.number));
        button.type = "button";
        button.setAttribute("aria-label", "Xem câu sai " + result.number);
        button.addEventListener("click", () => setReviewMode("wrong", result.number));
        jumps.appendChild(button);
      });
      box.append(wrongLabel, jumps);
    }
    const toggles = node("div", "review-toggle");
    const wrongButton = node("button", reviewMode === "wrong" ? "active" : "", "CÂU SAI (" + grade.wrong.length + ")");
    wrongButton.type = "button";
    wrongButton.hidden = grade.wrong.length === 0;
    wrongButton.setAttribute("aria-pressed", String(reviewMode === "wrong"));
    wrongButton.addEventListener("click", () => setReviewMode("wrong"));
    const allButton = node("button", reviewMode === "all" ? "active" : "", "TẤT CẢ (" + grade.total + ")");
    allButton.type = "button";
    allButton.setAttribute("aria-pressed", String(reviewMode === "all"));
    allButton.addEventListener("click", () => setReviewMode("all"));
    toggles.append(wrongButton, allButton);
    box.appendChild(toggles);
    target.appendChild(box);
  }

  function renderDelivery() {
    const target = $("delivery-status");
    target.replaceChildren();
    const pending = !!attempt && ["sending", "pending"].includes(attempt.delivery && attempt.delivery.state);
    $("new-attempt").disabled = pending;
    $("new-attempt").textContent = pending ? "ĐANG LƯU ĐIỂM…" : "LÀM MỘT LƯỢT MỚI ↻";
    const state = attempt.delivery && attempt.delivery.state;
    target.hidden = !attempt || !attempt.submittedAt || !["unconfirmed", "not-configured", "test-mode"].includes(state);
    if (target.hidden) return;
    const messages = {
      unconfirmed: ["Chưa lưu được điểm", "Vui lòng kiểm tra mạng hoặc báo giáo viên."],
      "not-configured": ["Chưa lưu được điểm", "Vui lòng báo giáo viên."],
      "test-mode": ["CHẾ ĐỘ KIỂM THỬ — không ghi điểm", ""]
    };
    const message = messages[state] || messages.unconfirmed;
    target.className = "delivery" + (["unconfirmed", "not-configured"].includes(state) ? " is-warning" : "");
    target.appendChild(node("strong", "", message[0]));
    if (message[1]) target.appendChild(node("span", "", message[1]));
  }

  async function withSubmissionLock(action) {
    if (navigator.locks && typeof navigator.locks.request === "function") {
      let actionStarted = false;
      try {
        return await navigator.locks.request(storageBase + ":submit:" + attempt.id, { mode: "exclusive" }, () => {
          actionStarted = true;
          return action();
        });
      } catch (error) {
        if (actionStarted) throw error;
        // Some embedded/partitioned contexts expose Web Locks but reject access.
        return action();
      }
    }
    return action();
  }

  async function submitAttempt(event) {
    event.preventDefault();
    if (!attempt || attempt.submittedAt || submitting) return;
    $("form-error").hidden = true;
    if (answeredCount() !== questions.length) {
      $("form-error").textContent = "Bạn cần trả lời đủ toàn bộ câu trước khi chấm bài.";
      $("form-error").hidden = false;
      const missing = questions.find((question) => !plainText(attempt.answers[String(question.number)]));
      const input = missing && $("answer-" + missing.number);
      if (input) input.focus();
      return;
    }
    submitting = true;
    renderAnswers();
    let shouldSend = false;
    try {
      shouldSend = await withSubmissionLock(() => {
        const saved = readStorage(attemptKey(attempt.id));
        if (validStoredAttempt(saved) && saved.submittedAt) {
          attempt = saved;
          if (["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) attempt.delivery = { state: "unconfirmed", reason: "already-submitted" };
          return false;
        }
        const grade = globalThis.RI2Grading.gradeAttempt(unit, attempt.answers);
        if (!grade.complete) throw new Error("incomplete");
        attempt.grade = grade;
        attempt.submittedAt = new Date().toISOString();
        attempt.delivery = { state: "sending", attemptedAt: attempt.submittedAt };
        persist();
        return true;
      });
    } catch (_) {
      $("form-error").textContent = "Chưa thể chấm bài. Các câu trả lời vẫn được giữ; vui lòng kiểm tra lại hoặc báo giáo viên.";
      $("form-error").hidden = false;
    } finally {
      submitting = false;
      renderAnswers();
      if (attempt.submittedAt) {
        $("answer-scroll").scrollTop = 0;
        $("answer-scroll").focus({ preventScroll: true });
      }
    }
    if (shouldSend) await sendScore(attempt.id);
  }

  function configuredFormSink() {
    if (course.testing === true) return null;
    const sink = course.scoreSink;
    if (!sink || sink.kind !== "google-form" || !sink.entries || typeof sink.formResponseUrl !== "string") return null;
    try {
      const url = new URL(sink.formResponseUrl);
      if (url.protocol !== "https:" || url.hostname !== "docs.google.com" || !/^\/forms\/d\/(?:e\/)?[^/]+\/formResponse\/?$/.test(url.pathname)) return null;
      const required = ["name", "total", "assignmentCode", "lesson", "activity", "className", "percent", "score", "wrong"];
      if (required.some((field) => !/^entry\.\d+$/.test(sink.entries[field] || ""))) return null;
      return sink;
    } catch (_) { return null; }
  }

  function scoreBody(sink, snapshot) {
    const grade = snapshot.grade;
    const values = {
      name: snapshot.identity.name,
      className: snapshot.identity.className,
      total: String(grade.total),
      assignmentCode: plainText(unit.testCode),
      lesson: unitLabel(),
      activity: "Làm lại đề · Lượt " + snapshot.number + " · Mã lượt " + snapshot.id + " · " + snapshot.submittedAt,
      percent: String(grade.percent),
      score: String(grade.score),
      wrong: grade.wrong.length ? grade.wrong.map((result) => "Câu " + result.number + ": " + plainText(result.actual) + " → " + plainText(result.answer)).join("\n") : "Không có câu sai"
    };
    const body = new URLSearchParams();
    Object.keys(values).forEach((field) => body.set(sink.entries[field], values[field]));
    // Only use additional form mappings when explicitly supplied by the course configuration.
    const optional = { attemptId: snapshot.id, attemptNumber: String(snapshot.number), submittedAt: snapshot.submittedAt, startedAt: snapshot.startedAt };
    Object.keys(optional).forEach((field) => { if (/^entry\.\d+$/.test(sink.entries[field] || "")) body.set(sink.entries[field], optional[field]); });
    return body;
  }

  async function sendScore(id) {
    if (!attempt || attempt.id !== id || !attempt.submittedAt) return;
    if (course.testing === true) {
      attempt.delivery = { state: "test-mode" };
      persist();
      renderDelivery();
      return;
    }
    const sink = configuredFormSink();
    if (!sink) {
      attempt.delivery = { state: "not-configured" };
      persist();
      renderDelivery();
      return;
    }
    const snapshot = JSON.parse(JSON.stringify(attempt));
    const controller = typeof AbortController === "function" ? new AbortController() : null;
    const timeout = controller ? setTimeout(() => controller.abort(), 25000) : null;
    try {
      // Google Forms is intentionally no-cors: an opaque response is NOT a storage confirmation.
      await fetch(sink.formResponseUrl, { method: "POST", mode: "no-cors", credentials: "omit", body: scoreBody(sink, snapshot), ...(controller ? { signal: controller.signal } : {}) });
      snapshot.delivery = { state: "sent-unverified", attemptedAt: snapshot.delivery.attemptedAt, requestFinishedAt: new Date().toISOString() };
    } catch (_) {
      snapshot.delivery = { state: "unconfirmed", attemptedAt: snapshot.delivery.attemptedAt, reason: "network" };
    } finally {
      if (timeout !== null) clearTimeout(timeout);
    }
    try { localStorage.setItem(attemptKey(id), JSON.stringify(snapshot)); } catch (_) { storageAvailable = false; }
    if (attempt && attempt.id === id) {
      attempt.delivery = snapshot.delivery;
      persist();
      renderDelivery();
    }
  }

  function startNewAttempt() {
    if (!attempt || !attempt.submittedAt || submitting || ["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) return;
    attempt = createAttempt(Number(attempt.number || 1) + 1);
    reviewMode = "wrong";
    persist({ makeCurrent: true });
    $("form-error").hidden = true;
    renderAnswers();
    $("answer-scroll").scrollTop = 0;
    const first = questions[0] && $("answer-" + questions[0].number);
    if (first) first.focus({ preventScroll: true });
  }

  function receiveStorageUpdate(event) {
    if (!attempt || !storageBase || event.key !== attemptKey(attempt.id) || !event.newValue) return;
    try {
      const saved = JSON.parse(event.newValue);
      if (!validStoredAttempt(saved) || !saved.submittedAt) return;
      attempt = saved;
      if (["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) attempt.delivery = { state: "unconfirmed", reason: "another-tab" };
      renderAnswers();
    } catch (_) { /* Ignore unrelated or incomplete browser-storage events. */ }
  }

  initialize();
}());
</script></body>
</html>
