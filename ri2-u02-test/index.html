  <script id="ri2-unit-data" type="application/json">{"unit":2,"title":"READING INTENSIVE 2 · UNIT 2","testCode":"RI2-U02","total":64,"studentPreviewUrl":"https://docs.google.com/document/d/1sHdLgprNWe5Lshhgrv-b9PZ5M8LGdNMVFBQEjBF7aZA/preview","sections":[{"exercise":1,"count":15,"inputKind":"matching","choices":["A","B","C","D","E","F","G","H","I","K","L","M","O","P","Q"],"instruction":"Ex 1: Match the words in Column A with their correct definitions in Column B. Write the letter of the definition next to the corresponding word.","questions":[{"number":1,"answer":"O","context":"Anthem (n)","explanation":"Giải thích của cô: Anthem (n): bài hát đặc trưng/quốc ca\n\nAnthem là danh từ chỉ bài hát có ý nghĩa đặc biệt đối với một quốc gia, tổ chức hoặc cộng đồng và thường được hát vào dịp trang trọng. Định nghĩa O nêu đầy đủ cả đối tượng lẫn cách sử dụng ấy, nên là cặp tương ứng."},{"number":2,"answer":"G","context":"Immigrant (n)","explanation":"Giải thích của cô: Immigrant (n): người nhập cư\n\nImmigrant là danh từ chỉ người đến một quốc gia khác để sinh sống lâu dài. G diễn đạt đúng hướng di chuyển ‘come to a different country’ và mục đích định cư; cần phân biệt với emigrant, người rời quê hương đi nơi khác."},{"number":3,"answer":"K","context":"Revelation (n)","explanation":"Giải thích của cô: Revelation (n): sự tiết lộ/phát hiện\n\nRevelation là danh từ chỉ hành động làm lộ điều từng bí mật hoặc một sự thật mới được tiết lộ. K nêu chính xác hai nét nghĩa này, khác với evidence là dữ kiện dùng để chứng minh."},{"number":4,"answer":"I","context":"Mimic (v)","explanation":"Giải thích của cô: Mimic (v): bắt chước\n\nMimic là động từ nghĩa là bắt chước giọng nói, cử chỉ hoặc cách di chuyển của người khác, đôi khi để gây cười/chế giễu. Định nghĩa I mô tả đúng hành động này, nên không thể ghép với các định nghĩa về tiếp cận hay phát triển."},{"number":5,"answer":"F","context":"Approach (v)","explanation":"Giải thích của cô: Approach (v): tiếp cận\n\nỞ vai trò động từ, approach nghĩa là tiến lại gần một người/vật hoặc gần tới một mốc về thời gian, chất lượng hay số lượng. F bao quát đúng các cách dùng ‘come near or nearer’, nên là định nghĩa phù hợp."},{"number":6,"answer":"P","context":"Organism (n)","explanation":"Giải thích của cô: Organism (n): sinh vật/cơ thể sống\n\nOrganism là danh từ chỉ một cá thể sống, chẳng hạn thực vật, động vật hoặc vi sinh vật. P định nghĩa đúng ‘a single living plant, animal, virus, etc.’, trong khi các lựa chọn khác là hành động hoặc tính chất."},{"number":7,"answer":"L","context":"Light-hearted (a)","explanation":"Giải thích của cô: Light-hearted (a): vui vẻ, vô tư\n\nLight-hearted là tính từ mô tả tâm trạng/nội dung vui vẻ, thoải mái và không quá nghiêm trọng. L dùng đúng hai nét nghĩa ‘happy and not serious’, nên là cặp tương ứng trực tiếp."},{"number":8,"answer":"Q","context":"Evolve (v)","explanation":"Giải thích của cô: Evolve (v): tiến hóa/phát triển dần dần\n\nEvolve là động từ chỉ quá trình tự phát triển hoặc làm cho một điều phát triển dần theo thời gian. Q diễn đạt đúng ý ‘develop gradually’ ở cả nội động từ và ngoại động từ."},{"number":9,"answer":"E","context":"Apparent (a)","explanation":"Giải thích của cô: Apparent (a): rõ ràng, hiển nhiên\n\nApparent là tính từ chỉ điều có thể nhận thấy hoặc hiểu được; tùy ngữ cảnh còn có thể mang nghĩa ‘có vẻ’. E (‘able to be seen or understood’) khớp đúng nghĩa được kiểm tra ở đây."},{"number":10,"answer":"C","context":"Potential (a)","explanation":"Giải thích của cô: Potential (a): tiềm năng\n\nPotential là tính từ chỉ khả năng có thể phát triển hoặc xảy ra khi có điều kiện cần thiết. C truyền đạt ý một điều trở nên khả thi khi các điều kiện tồn tại, nên được dùng để ghép với từ này."},{"number":11,"answer":"A","context":"Isolate (v)","explanation":"Giải thích của cô: Isolate (v): cô lập/tách biệt\n\nIsolate là động từ nghĩa là tách một người/vật ra khỏi những thứ đang nối hoặc trộn cùng nó. A mô tả chính xác hành động ‘separate ... from other things’, nên là định nghĩa đúng."},{"number":12,"answer":"M","context":"Longevity (n)","explanation":"Giải thích của cô: Longevity (n): sự trường thọ\n\nLongevity là danh từ chỉ tuổi thọ dài hoặc thời gian tồn tại lâu. M nêu ý cốt lõi ‘living for a long time’, do đó tương ứng về nghĩa, dù cần hiểu đây là ‘the state/duration of living long’ chứ không phải một tính từ."},{"number":13,"answer":"D","context":"Extensive (a)","explanation":"Giải thích của cô: Extensive (a): rộng lớn/bao quát\n\nExtensive là tính từ nghĩa là trải rộng trên một khu vực lớn hoặc bao quát phạm vi rộng. D nêu đúng cả ‘covering a large area’ và ‘having a great range’, nên khớp đầy đủ."},{"number":14,"answer":"H","context":"Standard (a)","explanation":"Giải thích của cô: Standard (a): tiêu chuẩn/thông thường\n\nỞ đây standard là tính từ chỉ điều thông thường, được xem là chuẩn mực hoặc được chấp nhận. H diễn đạt đúng nét nghĩa ‘usual rather than special ... correct or acceptable’."},{"number":15,"answer":"B","context":"Dialect (n)","explanation":"Giải thích của cô: Dialect (n): tiếng địa phương\n\nDialect là danh từ chỉ biến thể ngôn ngữ của một vùng/nhóm, có thể khác về từ vựng, ngữ pháp và phát âm. Định nghĩa B mô tả đúng biến thể được nói ở một khu vực cụ thể của đất nước."}]},{"exercise":2,"count":10,"inputKind":"text","choices":[],"instruction":"Ex 2: Fill in the blanks with the following words: complex, giant, strategy, stability, conceal, breed, extension, marine, aspect, culprit","questions":[{"number":16,"answer":"culprit","context":"The police identified the main ________ behind the robbery after reviewing the security footage.","explanation":"Culprit là danh từ đếm được, nghĩa là thủ phạm hoặc tác nhân chính gây ra vấn đề. Câu hoàn chỉnh “The police identified the main culprit behind the robbery...” dùng cụm culprit behind + event; việc xem camera để xác định người chịu trách nhiệm xác nhận nghĩa này."},{"number":17,"answer":"marine","context":"Many ________ species are at risk due to pollution in the oceans.","explanation":"Marine là tính từ, nghĩa là thuộc biển/đại dương. “Many marine species are at risk due to pollution in the oceans” nói các loài sinh vật biển bị đe dọa bởi ô nhiễm đại dương; vị trí trước species cũng yêu cầu từ bổ nghĩa dạng tính từ."},{"number":18,"answer":"stability","context":"Economic ________ is crucial for the growth and development of any country.","explanation":"Stability là danh từ, nghĩa là sự ổn định. Câu “Economic stability is crucial for the growth...” cần một danh từ làm trung tâm chủ ngữ, và một nền kinh tế ổn định là điều kiện hợp logic cho tăng trưởng/phát triển."},{"number":19,"answer":"breed","context":"Scientists are working to ________ endangered animals in captivity to save them from extinction.","explanation":"Breed là động từ, nghĩa là cho động vật sinh sản/nhân giống. Sau to cần nguyên mẫu: “Scientists are working to breed endangered animals in captivity...”; nuôi sinh sản trong điều kiện nuôi nhốt là biện pháp trực tiếp để ngăn tuyệt chủng."},{"number":20,"answer":"aspect","context":"One important ________ of the problem is the lack of proper communication between departments.","explanation":"Aspect là danh từ chỉ một khía cạnh của vấn đề. Câu hoàn chỉnh “One important aspect of the problem is...” dùng cấu trúc an aspect of; sự thiếu giao tiếp là một phương diện cụ thể trong vấn đề rộng hơn."},{"number":21,"answer":"giant","context":"A ________ wave crashed against the shore, causing damage to the harbor.","explanation":"Giant ở đây là tính từ, nghĩa là khổng lồ. “A giant wave crashed against the shore...” mô tả con sóng lớn đến mức làm hư hại cảng; vị trí giữa mạo từ a và danh từ wave cần một từ bổ nghĩa kích thước."},{"number":22,"answer":"complex","context":"The issue is quite ________ and requires careful analysis before making a decision.","explanation":"Complex là tính từ, nghĩa là phức tạp, gồm nhiều yếu tố khó xử lý. Sau is quite cần tính từ: “The issue is quite complex and requires careful analysis”; nhu cầu phân tích cẩn thận là dấu hiệu nghĩa quyết định."},{"number":23,"answer":"extension","context":"The new ________ of the building will include additional office spaces and a conference hall.","explanation":"Extension là danh từ chỉ phần mở rộng/cơi nới. “The new extension of the building will include additional office spaces...” nói phần xây thêm của tòa nhà; new và of the building cùng xác định đây là một danh từ công trình."},{"number":24,"answer":"strategy","context":"The company developed a new ________ to increase its market share and attract more customers.","explanation":"Strategy là danh từ chỉ kế hoạch có chủ đích để đạt mục tiêu. Câu “The company developed a new strategy to increase its market share...” dùng develop a strategy to + verb; hai mục tiêu tăng thị phần và thu hút khách hàng cho thấy đây là kế hoạch kinh doanh."},{"number":25,"answer":"conceal","context":"The criminal tried to ________ the evidence, but the police discovered it.","explanation":"Conceal là động từ nghĩa là che giấu. Sau tried to cần nguyên mẫu: “The criminal tried to conceal the evidence, but the police discovered it”; vế but ... discovered it tạo đối lập trực tiếp giữa giấu và bị phát hiện."}]},{"exercise":3,"count":10,"inputKind":"mcq","choices":["A","B","C","D"],"instruction":"Ex 3: Read the passage below and choose the correct word from the options to fill in the blanks.","questions":[{"number":26,"answer":"D","context":"Despite centuries of study, the ocean (26) ______ largely unexplored, with an estimated 80% of it still hidden beneath the surface.","explanation":"Cụm remains largely unexplored nghĩa là đại dương vẫn phần lớn chưa được khám phá; remain + adjective diễn tả trạng thái tiếp tục tồn tại. Maintains, obtains và retains thường cần tân ngữ, không đứng nối trực tiếp với tính từ unexplored theo cấu trúc này."},{"number":27,"answer":"C","context":"This lack of exploration (27) ______ countless mysteries waiting to be uncovered, and within these depths, there are probably many incredible creatures and ecosystems yet to be discovered.","explanation":"Leaves countless mysteries waiting to be uncovered nghĩa là tình trạng thiếu khám phá để lại vô số bí ẩn đang chờ được tìm ra. Leave + object + V-ing là cấu trúc đúng; get, make và keep không tạo được cách diễn đạt tự nhiên với toàn cụm này."},{"number":28,"answer":"B","context":"The ocean is home (28) ______ millions of species, many of (29) ______ are so unique that they seem almost otherworldly.","explanation":"Kết hợp từ cố định là be home to + noun, nghĩa là là nơi sinh sống của. “The ocean is home to millions of species” vì thế cần to; of, for, with không đi trong cấu trúc này."},{"number":29,"answer":"C","context":"The ocean is home (28) ______ millions of species, many of (29) ______ are so unique that they seem almost otherworldly.","explanation":"Cấu trúc many of which mở mệnh đề quan hệ không xác định và thay cho millions of species. Which theo sau giới từ of và chỉ vật/loài; them sẽ cần liên từ, that không dùng sau giới từ ở dạng này, còn it sai số."},{"number":30,"answer":"A","context":"For example, bioluminescent creatures, such as certain species of jellyfish, fish, and plankton, produce their own light, (30) ______ stunning displays in the deep, dark waters.","explanation":"Khóa nguồn chọn A create, mang nghĩa tạo ra các màn trình diễn ánh sáng đẹp mắt. Tuy nhiên câu đã có động từ hữu hạn produce và dấu phẩy trước chỗ trống; để biểu thị kết quả đúng ngữ pháp phải dùng creating stunning displays (B), không thể đặt thêm create mà thiếu liên từ/chủ ngữ mới."},{"number":31,"answer":"D","context":"Scientists are continually discovering new species that have adapted in (31) ______ unimaginable to survive in the ocean's harshest environments.","explanation":"Khóa nguồn chọn D means, với ý các loài thích nghi bằng những cách không thể tưởng tượng. Tuy nhiên kết hợp chuẩn là adapt in ways unimaginable (A); in means unimaginable không tự nhiên và means thường dùng trong by means of hoặc a means of doing something."},{"number":32,"answer":"B","context":"In addition to (32) ______ new species, the ocean holds secrets to various natural processes that humans have yet to fully understand.","explanation":"Sau giới từ in addition to phải dùng danh từ hoặc V-ing, nên discovering là dạng đúng: “In addition to discovering new species...”. Discover nguyên mẫu và to discover không theo giới từ to ở đây; to be discovered vừa sai cấu trúc vừa đổi nghĩa chủ động."},{"number":33,"answer":"D","context":"Marine ecosystems, such as coral reefs, (33) ______ vital roles in maintaining the balance of the global environment, yet their true importance is still not (34) ______ understood.","explanation":"Cụm cố định play a vital role in nghĩa là đóng vai trò thiết yếu trong. Chủ ngữ số nhiều Marine ecosystems đi với play; take, keep và make không kết hợp với roles theo nghĩa này."},{"number":34,"answer":"D","context":"Marine ecosystems, such as coral reefs, (33) ______ vital roles in maintaining the balance of the global environment, yet their true importance is still not (34) ______ understood.","explanation":"Completely understood nghĩa là được hiểu đầy đủ/hoàn toàn, hợp với still not và ý con người chưa biết hết tầm quan trọng thật sự của hệ sinh thái biển. Deeply thường đi với cảm xúc, intensely chỉ cường độ và extremely understood không phải kết hợp tự nhiên."},{"number":35,"answer":"A","context":"The ocean, full of life and mystery, is an endless (35) ______ of awe and wonder, with much left to be explored.","explanation":"Cụm an endless source of awe and wonder nghĩa là nguồn cảm hứng kinh ngạc và kỳ thú bất tận. Source of là kết hợp từ đúng; power, root và resource không diễn tả tự nhiên đại dương liên tục tạo nên cảm giác kinh ngạc."}]},{"exercise":4,"count":10,"inputKind":"text","choices":[],"instruction":"Ex 4: Fill in the blanks with ONE suitable word.","questions":[{"number":36,"answer":"are","context":"Humpback whales (36) __________ fascinating creatures, known for their long songs and their ability to interact with humans in the ocean.","explanation":"Chủ ngữ Humpback whales là số nhiều và câu nêu một đặc điểm chung ở hiện tại, nên dùng are. Câu hoàn chỉnh “Humpback whales are fascinating creatures” là cấu trúc subject + be + noun phrase."},{"number":37,"answer":"made","context":"Jim Darling, a marine biologist who has studied humpback whales for over 25 years, has (37) __________ significant discoveries about their songs.","explanation":"Sau trợ động từ has cần quá khứ phân từ, và kết hợp từ là make discoveries. “Has made significant discoveries” dùng hiện tại hoàn thành để tổng kết những phát hiện Darling đạt được trong hơn 25 năm nghiên cứu."},{"number":38,"answer":"from/while","context":"He recorded these songs (38) __________ on a boat near Hawaii, and during one memorable experience, author Douglas Chadwick joined him in the water.","explanation":"From tạo “recorded these songs from on a boat” nếu giữ nguyên cả từ on thì không chuẩn; cách hiểu hợp lệ là while on a boat, nghĩa là ghi âm trong lúc ở trên thuyền. Nếu nguồn dự định chấp nhận from, câu phải là from a boat và bỏ on."},{"number":39,"answer":"at/by","context":"While swimming alongside a whale, Chadwick was amazed (39) __________ the whale's curiosity but also its peaceful behavior, even as it swam under the boat and began to sing.","explanation":"Cả amazed at và amazed by đều có thể giới thiệu nguyên nhân gây kinh ngạc. “Chadwick was amazed at/by the whale's curiosity...” nghĩa là ông kinh ngạc trước tính tò mò nhưng hiền hòa của cá voi; sau was amazed cần một giới từ nối với cụm danh từ."},{"number":40,"answer":"last","context":"Humpback songs are incredibly complex and can (40) __________ for up to 30 minutes, (41) __________ them among the longest songs sung by any animal.","explanation":"Sau động từ khuyết thiếu can dùng nguyên mẫu last, nghĩa là kéo dài. “Humpback songs ... can last for up to 30 minutes” đi với cụm thời lượng for up to 30 minutes, là dấu hiệu kết hợp từ rõ ràng."},{"number":41,"answer":"making","context":"Humpback songs are incredibly complex and can (40) __________ for up to 30 minutes, (41) __________ them among the longest songs sung by any animal.","explanation":"Sau dấu phẩy, making them among the longest songs... là cụm phân từ chỉ kết quả: việc kéo dài đến 30 phút khiến chúng thuộc nhóm bài hát động vật dài nhất. Dùng động từ hữu hạn sẽ cần một liên từ và chủ ngữ riêng."},{"number":42,"answer":"although","context":"Scientists are still unsure why whales sing, (42) __________ it is believed that male whales may use their songs to attract females or to communicate with other males.","explanation":"Although nối hai ý nhượng bộ: các nhà khoa học vẫn chưa chắc vì sao cá voi hát, mặc dù người ta tin con đực có thể dùng bài hát để thu hút con cái hoặc giao tiếp. Dấu phẩy ngăn hai mệnh đề và quan hệ ‘chưa chắc—nhưng có giả thuyết’ quyết định liên từ này."},{"number":43,"answer":"can/may","context":"Some researchers suggest that the songs (43) __________ even evolve, changing year after year, much like national anthems.","explanation":"Trước động từ nguyên mẫu evolve cần động từ khuyết thiếu. Can nói khả năng đặc trưng rằng bài hát có thể biến đổi; may diễn tả giả thuyết chưa chắc chắn, phù hợp với Some researchers suggest và chi tiết chúng thay đổi qua từng năm."},{"number":44,"answer":"led","context":"The study of humpback whales continues, and scientists (44) __________ Darling and his team are dedicated to unraveling the mystery behind these majestic creatures' behavior and songs.","explanation":"Khóa nguồn giữ led, có thể đoán ý định là ‘các nhà khoa học do Darling và đội của ông dẫn dắt’. Tuy nhiên câu cần đầy đủ scientists led by Darling and his team are dedicated...; với nguyên văn chỉ có một ô trống trước Darling, điền riêng led tạo “scientists led Darling and his team are”, sai cấu trúc."},{"number":45,"answer":"behind","context":"Their curiosity about human understanding of the species is a driving force (45) __________ their ongoing research.","explanation":"Cụm cố định a driving force behind + noun chỉ động lực đứng sau một hoạt động. “Their curiosity ... is a driving force behind their ongoing research” nghĩa là sự tò mò thúc đẩy nghiên cứu đang tiếp diễn."}]},{"exercise":5,"count":19,"inputKind":"mcq","choices":["A","B","C","D"],"instruction":"Ex 5: Read the following passages and answer the questions.","questions":[{"number":46,"answer":"B","context":"principal (a) = main = major # principle","explanation":"Giải thích của cô: principal (a) = main = major # principle\n\nTrong câu “Galaxies are the major building blocks”, major mang nghĩa chính/yếu nhất, tương đương principal (B). Intense chỉ cường độ, huge chỉ kích thước và unique là độc nhất; đồng thời cần phân biệt principal với danh từ principle."},{"number":47,"answer":"B","context":"Đoạn 2 thảo luận về điều gì?","explanation":"Giải thích của cô: Đoạn 2 thảo luận về điều gì?\n\nĐoạn 2 mở bằng “There are three main types of galaxies” rồi lần lượt mô tả spiral, elliptical và irregular. Vì vậy B bao quát cả đoạn; A và C chỉ là một tiểu mục, còn D chỉ so sánh hai loại và bỏ elliptical."},{"number":48,"answer":"B","context":"Từ \"which\" thay thế cho từ nào?","explanation":"Giải thích của cô: Từ \"which\" thay thế cho từ nào?\n\nTrong cụm “the interstellar gas in which new stars form”, đại từ quan hệ which đứng sau in và thay cho gas: các sao mới hình thành trong khí liên sao. Dust, pattern và galaxy không phải tiền ngữ trực tiếp của mệnh đề này."},{"number":49,"answer":"B","context":"Sao mới hình thành trong thiên hà xoắn ốc do đâu?","explanation":"Giải thích của cô: Sao mới hình thành trong thiên hà xoắn ốc do đâu?\n\nBài viết nói mô hình xoắn quay “compresses gas and dust, triggering the formation of bright young stars”. Đây là bằng chứng trực tiếp cho B; không có vụ nổ khí, sự kết hợp sao cũ hay phát xạ vô tuyến làm nguyên nhân trong đoạn."},{"number":50,"answer":"B","context":"\"obvious\" gần nghĩa với từ nào?","explanation":"Giải thích của cô: \"obvious\" gần nghĩa với từ nào?\n\nTrong “no obvious structure”, obvious nghĩa là rõ ràng, dễ nhận thấy. Apparent (B) là từ đồng nghĩa sát nhất; discovered là được khám phá, understood là được hiểu và simplistic là đơn giản hóa quá mức."},{"number":51,"answer":"C","context":"devoid of = lacking in (adj)","explanation":"Giải thích của cô: devoid of = lacking in (adj)\n\nBài nói thiên hà elliptical “are devoid of interstellar gas”, tức không có/thiếu khí liên sao. Vì vậy phát biểu chúng chứa lượng khí liên sao cao (C) là điều KHÔNG đúng; các ý kích thước lớn, phần lớn sao già và hình cầu/ellipsoid đều được đoạn văn hỗ trợ."},{"number":52,"answer":"A","context":"Đặc điểm của thiên hà vô tuyến?","explanation":"Giải thích của cô: Đặc điểm của thiên hà vô tuyến?\n\nĐoạn 2 giải thích các thiên hà elliptical khổng lồ đôi khi là nguồn phát xạ vô tuyến mạnh, “in which case they are called radio galaxies”. Vì vậy radio galaxies là một trường hợp thuộc loại elliptical (A); các lựa chọn về kích thước nhỏ, quan hệ với irregular hay độ sáng thấp trái hoặc không có trong bài."},{"number":53,"answer":"A","context":"Tỷ lệ thiên hà không định hình (irregular)?","explanation":"Giải thích của cô: Tỷ lệ thiên hà không định hình (irregular)?\n\nBài nêu “Irregular galaxies comprise about one-tenth of all galaxies”. Một phần mười tương đương 10%, nên A đúng; 25% là tỷ lệ gần đúng của spiral, còn 50% và 75% không được nêu."},{"number":54,"answer":"C","context":"Từ \"they\" thay thế cho từ nào?","explanation":"Giải thích của cô: Từ \"they\" thay thế cho từ nào?\n\nTrong câu “the distances to the galaxies are incomprehensibly large, but they too are made more manageable...”, they quay lại cụm chủ ngữ the distances to the galaxies. Do đó C đúng; intervals, yardsticks và bản thân galaxies không phải thứ được đo theo light-year ở cấu trúc này."},{"number":55,"answer":"C","context":"Tại sao tác giả nhắc đến thiên hà Virgo và Andromeda?","explanation":"Giải thích của cô: Tại sao tác giả nhắc đến thiên hà Virgo và Andromeda?\n\nAndromeda được nói cách hai triệu năm ánh sáng, còn ánh sáng từ Virgo khởi hành khi bò sát vẫn thống trị. Hai ví dụ biến khoảng cách trừu tượng thành thời gian truyền ánh sáng cực dài, nhấn mạnh các thiên hà cách Trái Đất vô cùng xa (C). Các phương án về khả năng nhìn thấy, tuổi thiên hà hay giới hạn kính thiên văn không phải mục đích của ví dụ."},{"number":56,"answer":"D","context":"prevalent (a) = very common","explanation":"Giải thích của cô: prevalent (a) = very common\n\n“Reptiles still dominated the animal world” nghĩa là bò sát thịnh hành/chiếm ưu thế trong thế giới động vật thời đó. Were prevalent in (D) giữ đúng ý phổ biến và thống trị; threatened, replaced và were developing in không tương đương."},{"number":57,"answer":"B","context":"Tại sao tác động của đường sắt trước 1860 bị coi là \"hạn chế\"?","explanation":"Giải thích của cô: Tại sao tác động của đường sắt trước 1860 bị coi là \"hạn chế\"?\n\nĐường ray dừng ở sông Missouri, nên tàu phải chuyển hàng, thư và hành khách sang tàu hơi nước, xe ngựa hoặc xe khách để đi tiếp về phía tây. Điều này khớp trực tiếp B; bài không quy nguyên nhân cho tuyến đường vòng, sở thích hành khách hay giá vé."},{"number":58,"answer":"B","context":"Từ \"they\" thay thế cho từ nào?","explanation":"Giải thích của cô: Từ \"they\" thay thế cho từ nào?\n\nKhóa nguồn chọn B trains. Tuy nhiên đại từ they trong câu “wagon freighting, stagecoaching and steamboating did not come to an end ...; rather they became supplements or feeders” quy chiếu ba phương thức vận tải cũ, tương ứng gần nhất với D, không phải tàu hỏa."},{"number":59,"answer":"D","context":"freight (n) hàng hoá vận chuyển","explanation":"Giải thích của cô: freight (n) hàng hoá vận chuyển\n\nBài cho biết các tuyến xe hàng tiếp tục hoạt động nhưng “constantly shrinking routes”, còn xe ngựa chỉ đi nơi đường ray chưa được đặt. Có thể suy ra khi đường sắt mở rộng, chúng được sử dụng ít hơn trước (D); bài không nói tài xế từ chối làm việc, chuyên môn hóa hay lập tuyến cạnh tranh."},{"number":60,"answer":"C","context":"\"crisscross\" gần nghĩa với từ nào?","explanation":"Giải thích của cô: \"crisscross\" gần nghĩa với từ nào?\n\nTrong ngữ cảnh các xe ngựa tiếp tục đi khắp miền Tây nơi chưa có đường ray, crisscross nghĩa là di chuyển qua lại theo nhiều hướng. C diễn đạt sát nhất; lead the way, separate và uncover không nói sự di chuyển đan chéo."},{"number":61,"answer":"D","context":"Tại sao nhắc đến dãy Sierra Nevada?","explanation":"Giải thích của cô: Tại sao nhắc đến dãy Sierra Nevada?\n\nĐường sắt Central Pacific phải tiến về phía đông từ California “through the formidable barriers of the Sierra Nevada”. Dãy núi được dùng làm ví dụ cụ thể về chướng ngại xây dựng (D), không nhằm đề xuất tuyến khác, kể tai nạn hay chỉ nhận diện một địa danh lịch sử."},{"number":62,"answer":"A","context":"skepticism = doubt","explanation":"Giải thích của cô: skepticism = doubt\n\nSkepticism trong câu chỉ sự nghi ngờ rằng tuyến đường sắt qua vùng khó khăn, thưa dân có thể sinh lời. Doubt (A) là từ đồng nghĩa trực tiếp; amazement, urgency và determination là các thái độ khác."},{"number":63,"answer":"C","context":"mature (a) trưởng thành","explanation":"Giải thích của cô: mature (a) trưởng thành\n\nNgay sau cụm “premature enterprise”, bài giải thích “not only the cost of construction but also the very high risk deterred private investment”. Vì chi phí và rủi ro làm nhà đầu tư tư nhân chùn bước, C là diễn giải trực tiếp; các vấn đề công nghệ, vật liệu và nhân lực không được nêu."},{"number":64,"answer":"B","context":"subsidy (n) tài trợ tiền","explanation":"Giải thích của cô: subsidy (n) tài trợ tiền\n\nGovernment subsidy là khoản hỗ trợ tài chính của chính phủ để một dự án có thể thực hiện. Financing (B) gần nghĩa nhất; persuasion là thuyết phục, explanation là giải thích và penalty là hình phạt, trái với vai trò hỗ trợ."}]}]}</script>

  function inputText(value) {

      .replace(/[\u200B-\u200D\uFEFF\u00AD]/g, "")

  function unwrap(value) {

  function meridiem(value) {

  }

  function policyFor(expected, question) {
    const text = basicText(expected);
    const timeText = meridiem(text);
    const time = /\bo\s*'?\s*clock\b/.test(timeText) ? "oclock"

      : /\b\d{1,2}\s*:\s*\d{2}\b/.test(timeText) ? "clock" : "none";

    // Standalone One/First and anaphoric "the one" are grammatical keys in RI2.
    // A caller may explicitly opt in for a numeric-only word answer.
    const quantity = text.replace(/^(?:at least|more than|less than|nearly|about|approximately|over|under|up to|around)\s+/, "");
    const words = quantity.replace(/-/g, " ").split(/\s+/);
    let length = 0;

    const qualifier = quantity !== text;
    const grammaticalTail = /^(?:of|that|which|who|whom|to|by|with|for|as|than)$/;
    if (length > 0 && (qualifier || (length < words.length && !grammaticalTail.test(words[length])) || length > 1)) numbers = true;
    if (question && typeof question.numberFormatting === "boolean") numbers = question.numberFormatting;
    return { numbers, time, degrees: /°|º|˚|\bdegrees\b/.test(inputText(expected).toLowerCase()) };

  function surface(value, policy) {

    if (policy.degrees) text = text.replace(/[º˚]/g, "°");
    text = meridiem(basicText(unwrap(text)));
    // A single final sentence mark is harmless; internal numeric punctuation stays.
    text = text.replace(/[.!?,;:]$/, "").trim();

      .replace(/(?<=[a-z])\s*-\s*(?=[a-z0-9])|(?<=[0-9])\s*-\s*(?=[a-z])/g, " ")
      .replace(/%/g, " percent ")
      .replace(/\bper\s+cent\b/g, "percent")
      .replace(/\s*\/\s*/g, "/")
      .replace(/\s*,\s*/g, ", ");
    if (policy.time === "oclock") text = text.replace(/\bo\s*'?\s*clock\b/g, "oclock");
    return text.replace(/\s+/g, " ").trim();
  }

  function parseCardinal(words) {
    let total = 0, group = 0, previous = "start", previousSmall = -1, lastScale = Infinity;
    for (const word of words) {

        if (number === 0 ? words.length !== 1 : number < 10
          ? !["start", "tens", "hundred", "scale", "and"].includes(previous)
          : !["start", "hundred", "scale", "and"].includes(previous)) return null;
        group += number;
        previous = number < 10 ? "small" : "teen";
        previousSmall = number;
      } else if (own(TENS, word)) {
        if (!["start", "hundred", "scale", "and"].includes(previous)) return null;
        group += TENS[word]; previous = "tens"; previousSmall = -1;
      } else if (word === "hundred") {
        if (previous !== "small" || previousSmall < 1 || previousSmall > 9 || group > 9) return null;
        group *= 100; previous = "hundred"; previousSmall = -1;
      } else {
        const scale = SCALES[word];
        if (!scale || !group || previous === "and" || scale >= lastScale) return null;
        total += group * scale; group = 0; previous = "scale"; previousSmall = -1; lastScale = scale;
      }
    }
    const number = total + group;
    return previous !== "start" && previous !== "and" && Number.isSafeInteger(number) ? number : null;

  function suffix(number) {
    const tail = number % 100;

  function parseWords(words) {

    const box = node("section", "result-summary");
    box.setAttribute("aria-labelledby", "result-heading");
    box.appendChild(node("p", "result-kicker", "KẾT QUẢ"));
    const numbers = node("div", "result-numbers");
    const score = node("div", "result-score", String(grade.score));
    score.appendChild(node("small", "", " / " + grade.total));
    numbers.append(score, node("div", "result-percent", String(grade.percent) + "%"));
    box.appendChild(numbers);
    const title = node("h3", "", grade.score === grade.total ? "Hoàn thành tất cả các câu" : grade.wrong.length + " câu cần sửa");
    title.id = "result-heading";
    box.appendChild(title);
    if (grade.wrong.length) {
      const wrongLabel = node("p", "result-wrong-label", "CÂU SAI");
      const jumps = node("div", "wrong-jumps");
      grade.wrong.forEach((result) => {
        const button = node("button", "", String(result.number));
        button.type = "button";
        button.setAttribute("aria-label", "Xem câu sai " + result.number);
        button.addEventListener("click", () => setReviewMode("wrong", result.number));
        jumps.appendChild(button);
      });
      box.append(wrongLabel, jumps);
    }
    const toggles = node("div", "review-toggle");
    const wrongButton = node("button", reviewMode === "wrong" ? "active" : "", "CÂU SAI (" + grade.wrong.length + ")");
    wrongButton.type = "button";
    wrongButton.hidden = grade.wrong.length === 0;
    wrongButton.setAttribute("aria-pressed", String(reviewMode === "wrong"));
    wrongButton.addEventListener("click", () => setReviewMode("wrong"));
    const allButton = node("button", reviewMode === "all" ? "active" : "", "TẤT CẢ (" + grade.total + ")");
    allButton.type = "button";
    allButton.setAttribute("aria-pressed", String(reviewMode === "all"));
    allButton.addEventListener("click", () => setReviewMode("all"));
    toggles.append(wrongButton, allButton);
    box.appendChild(toggles);
    target.appendChild(box);
  }

  function renderDelivery() {
    const target = $("delivery-status");
    target.replaceChildren();
    const pending = !!attempt && ["sending", "pending"].includes(attempt.delivery && attempt.delivery.state);
    $("new-attempt").disabled = pending;
    $("new-attempt").textContent = pending ? "ĐANG LƯU ĐIỂM…" : "LÀM MỘT LƯỢT MỚI ↻";
    const state = attempt.delivery && attempt.delivery.state;
    target.hidden = !attempt || !attempt.submittedAt || !["unconfirmed", "not-configured", "test-mode"].includes(state);
    if (target.hidden) return;
    const messages = {
      unconfirmed: ["Chưa lưu được điểm", "Vui lòng kiểm tra mạng hoặc báo giáo viên."],
      "not-configured": ["Chưa lưu được điểm", "Vui lòng báo giáo viên."],
      "test-mode": ["CHẾ ĐỘ KIỂM THỬ — không ghi điểm", ""]
    };
    const message = messages[state] || messages.unconfirmed;
    target.className = "delivery" + (["unconfirmed", "not-configured"].includes(state) ? " is-warning" : "");
    target.appendChild(node("strong", "", message[0]));
    if (message[1]) target.appendChild(node("span", "", message[1]));
  }

  async function withSubmissionLock(action) {
    if (navigator.locks && typeof navigator.locks.request === "function") {
      let actionStarted = false;
      try {
        return await navigator.locks.request(storageBase + ":submit:" + attempt.id, { mode: "exclusive" }, () => {
          actionStarted = true;
          return action();
        });
      } catch (error) {
        if (actionStarted) throw error;
        // Some embedded/partitioned contexts expose Web Locks but reject access.
        return action();
      }
    }
    return action();
  }

  async function submitAttempt(event) {
    event.preventDefault();
    if (!attempt || attempt.submittedAt || submitting) return;
    $("form-error").hidden = true;
    if (answeredCount() !== questions.length) {
      $("form-error").textContent = "Bạn cần trả lời đủ toàn bộ câu trước khi chấm bài.";
      $("form-error").hidden = false;
      const missing = questions.find((question) => !plainText(attempt.answers[String(question.number)]));
      const input = missing && $("answer-" + missing.number);
      if (input) input.focus();
      return;
    }
    submitting = true;
    renderAnswers();
    let shouldSend = false;
    try {
      shouldSend = await withSubmissionLock(() => {
        const saved = readStorage(attemptKey(attempt.id));
        if (validStoredAttempt(saved) && saved.submittedAt) {
          attempt = saved;
          if (["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) attempt.delivery = { state: "unconfirmed", reason: "already-submitted" };
          return false;
        }
        const grade = globalThis.RI2Grading.gradeAttempt(unit, attempt.answers);
        if (!grade.complete) throw new Error("incomplete");
        attempt.grade = grade;
        attempt.submittedAt = new Date().toISOString();
        attempt.delivery = { state: "sending", attemptedAt: attempt.submittedAt };
        persist();
        return true;
      });
    } catch (_) {
      $("form-error").textContent = "Chưa thể chấm bài. Các câu trả lời vẫn được giữ; vui lòng kiểm tra lại hoặc báo giáo viên.";
      $("form-error").hidden = false;
    } finally {
      submitting = false;
      renderAnswers();
      if (attempt.submittedAt) {
        $("answer-scroll").scrollTop = 0;
        $("answer-scroll").focus({ preventScroll: true });
      }
    }
    if (shouldSend) await sendScore(attempt.id);
  }

  function configuredFormSink() {
    if (course.testing === true) return null;
    const sink = course.scoreSink;
    if (!sink || sink.kind !== "google-form" || !sink.entries || typeof sink.formResponseUrl !== "string") return null;
    try {
      const url = new URL(sink.formResponseUrl);
      if (url.protocol !== "https:" || url.hostname !== "docs.google.com" || !/^\/forms\/d\/(?:e\/)?[^/]+\/formResponse\/?$/.test(url.pathname)) return null;
      const required = ["name", "total", "assignmentCode", "lesson", "activity", "className", "percent", "score", "wrong"];
      if (required.some((field) => !/^entry\.\d+$/.test(sink.entries[field] || ""))) return null;
      return sink;
    } catch (_) { return null; }
  }

  function scoreBody(sink, snapshot) {
    const grade = snapshot.grade;
    const values = {
      name: snapshot.identity.name,
      className: snapshot.identity.className,
      total: String(grade.total),
      assignmentCode: plainText(unit.testCode),
      lesson: unitLabel(),
      activity: "Làm lại đề · Lượt " + snapshot.number + " · Mã lượt " + snapshot.id + " · " + snapshot.submittedAt,
      percent: String(grade.percent),
      score: String(grade.score),
      wrong: grade.wrong.length ? grade.wrong.map((result) => "Câu " + result.number + ": " + plainText(result.actual) + " → " + plainText(result.answer)).join("\n") : "Không có câu sai"
    };
    const body = new URLSearchParams();
    Object.keys(values).forEach((field) => body.set(sink.entries[field], values[field]));
    // Only use additional form mappings when explicitly supplied by the course configuration.
    const optional = { attemptId: snapshot.id, attemptNumber: String(snapshot.number), submittedAt: snapshot.submittedAt, startedAt: snapshot.startedAt };
    Object.keys(optional).forEach((field) => { if (/^entry\.\d+$/.test(sink.entries[field] || "")) body.set(sink.entries[field], optional[field]); });
    return body;
  }

  async function sendScore(id) {
    if (!attempt || attempt.id !== id || !attempt.submittedAt) return;
    if (course.testing === true) {
      attempt.delivery = { state: "test-mode" };
      persist();
      renderDelivery();
      return;
    }
    const sink = configuredFormSink();
    if (!sink) {
      attempt.delivery = { state: "not-configured" };
      persist();
      renderDelivery();
      return;
    }
    const snapshot = JSON.parse(JSON.stringify(attempt));
    const controller = typeof AbortController === "function" ? new AbortController() : null;
    const timeout = controller ? setTimeout(() => controller.abort(), 25000) : null;
    try {
      // Google Forms is intentionally no-cors: an opaque response is NOT a storage confirmation.
      await fetch(sink.formResponseUrl, { method: "POST", mode: "no-cors", credentials: "omit", body: scoreBody(sink, snapshot), ...(controller ? { signal: controller.signal } : {}) });
      snapshot.delivery = { state: "sent-unverified", attemptedAt: snapshot.delivery.attemptedAt, requestFinishedAt: new Date().toISOString() };
    } catch (_) {
      snapshot.delivery = { state: "unconfirmed", attemptedAt: snapshot.delivery.attemptedAt, reason: "network" };
    } finally {
      if (timeout !== null) clearTimeout(timeout);
    }
    try { localStorage.setItem(attemptKey(id), JSON.stringify(snapshot)); } catch (_) { storageAvailable = false; }
    if (attempt && attempt.id === id) {
      attempt.delivery = snapshot.delivery;
      persist();
      renderDelivery();
    }
  }

  function startNewAttempt() {
    if (!attempt || !attempt.submittedAt || submitting || ["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) return;
    attempt = createAttempt(Number(attempt.number || 1) + 1);
    reviewMode = "wrong";
    persist({ makeCurrent: true });
    $("form-error").hidden = true;
    renderAnswers();
    $("answer-scroll").scrollTop = 0;
    const first = questions[0] && $("answer-" + questions[0].number);
    if (first) first.focus({ preventScroll: true });
  }

  function receiveStorageUpdate(event) {
    if (!attempt || !storageBase || event.key !== attemptKey(attempt.id) || !event.newValue) return;
    try {
      const saved = JSON.parse(event.newValue);
      if (!validStoredAttempt(saved) || !saved.submittedAt) return;
      attempt = saved;
      if (["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) attempt.delivery = { state: "unconfirmed", reason: "another-tab" };
      renderAnswers();
    } catch (_) { /* Ignore unrelated or incomplete browser-storage events. */ }
  }

  initialize();
}());
</script></body>
</html>
