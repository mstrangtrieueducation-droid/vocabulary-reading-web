  <script id="ri2-unit-data" type="application/json">{"unit":12,"title":"READING INTENSIVE 2 · UNIT 12","testCode":"RI2-U12","total":66,"studentPreviewUrl":"https://docs.google.com/document/d/1JzaxdVTIKdRSabUuHqj06HLyVsOhIT2_IHzx6mJ8y_U/preview","sections":[{"exercise":1,"count":15,"inputKind":"matching","choices":["A","B","C","D","E","F","G","H","I","J","K","L","M","N","O"],"instruction":"Ex 1: Match the words in Column A with their correct definitions in Column B. Write the letter of the definition next to the corresponding word.","questions":[{"number":1,"answer":"I","context":"ascend (v)","explanation":"Giải thích của cô: Ascend: Đi lên, đi tới một vị trí cao hơn.\n\nAscend là động từ chỉ chuyển động đi lên. Nó khớp chính xác với I: “To go up or move higher.”; cả go up và move higher đều là cách diễn đạt trực tiếp nghĩa từ."},{"number":2,"answer":"L","context":"geological (a)","explanation":"Giải thích của cô: Geological: Thuộc về địa chất, liên quan đến việc nghiên cứu Trái Đất, các loại đá và cách đất đai được hình thành.\n\nGeological là tính từ thuộc geology (địa chất học). Định nghĩa L nêu đúng ba đối tượng: Earth, rocks và cách land is formed, nên là cặp tương ứng."},{"number":3,"answer":"N","context":"ease (n)","explanation":"Giải thích của cô: Ease: Sự dễ dàng, trạng thái thoải mái, thư giãn hoặc không có khó khăn.\n\nEase ở đây là danh từ chỉ trạng thái dễ dàng/thoải mái, không căng thẳng hay trở ngại. Nó khớp N: “The state of being comfortable, relaxed, or not having difficulties.”"},{"number":4,"answer":"A","context":"conquer (v)","explanation":"Giải thích của cô: Conquer: Chinh phục, kiểm soát một thứ gì đó (đặc biệt bằng vũ lực) hoặc vượt qua một điều gì đó khó khăn.\n\nConquer là động từ có thể chỉ chiếm quyền kiểm soát hoặc chiến thắng một khó khăn. Định nghĩa A—“To take control of something, especially by force, or to overcome something difficult.”—bao quát đúng cả hai cách dùng."},{"number":5,"answer":"C","context":"better (v)","explanation":"Giải thích của cô: Better: Cải thiện, làm cho cái gì đó trở nên tốt hơn hoặc thành công hơn.\n\nBetter ở đây là động từ, không phải dạng so sánh của good; nó nghĩa là cải thiện. Vì vậy C: “To improve or make something become good or more successful.” là định nghĩa chính xác."},{"number":6,"answer":"E","context":"emergence (n)","explanation":"Giải thích của cô: Emergence: Sự nổi lên, sự xuất hiện hoặc quá trình một thứ gì đó lộ diện ra ngoài.\n\nEmergence là danh từ của emerge, chỉ quá trình xuất hiện/lộ ra. Nó nối với E: “The process of something appearing or coming out.”; process và appearing thể hiện đúng loại từ và nghĩa."},{"number":7,"answer":"G","context":"relatively (adv)","explanation":"Giải thích của cô: Relatively: Tương đối, khi so sánh với một thứ khác (thường mang nghĩa \"khá là\").\n\nRelatively là trạng từ đặt một đặc điểm trong tương quan với chuẩn khác, thường giảm mức tuyệt đối thành “khá/tương đối”. Định nghĩa G “In comparison to something else, often meaning ‘somewhat’ or ‘fairly.’” khớp trực tiếp."},{"number":8,"answer":"J","context":"aisle (n)","explanation":"Giải thích của cô: Aisle: Lối đi giữa các lối ghế ngồi (ví dụ ở rạp hát hoặc trên máy bay).\n\nAisle là danh từ chỉ lối đi giữa các hàng ghế/kệ. Định nghĩa J nêu “A passage between rows of seats” và đúng các ví dụ theater/plane, nên tương ứng hoàn toàn."},{"number":9,"answer":"O","context":"steer (v)","explanation":"Giải thích của cô: Steer: Lái, hướng dẫn hoặc kiểm soát hướng đi của một vật (như phương tiện hoặc tàu thuyền).\n\nSteer là động từ chỉ điều khiển hướng chuyển động. Nó khớp O: “To guide or control the direction of something, like a vehicle or a ship.”; guide/control the direction là nét nghĩa quyết định."},{"number":10,"answer":"B","context":"parachute (n)","explanation":"Giải thích của cô: Parachute: Chiếc dù bay, một thiết bị đặc biệt giúp làm giảm tốc độ rơi của bạn từ trên bầu trời.\n\nParachute là danh từ chỉ thiết bị tạo lực cản để làm chậm cú rơi. Vì vậy B—“A special piece of equipment that slows your fall from the sky.”—là định nghĩa chính xác."},{"number":11,"answer":"D","context":"thrilling (a)","explanation":"Giải thích của cô: Thrilling: Kỳ ảo, ly kỳ, rất hào hứng và tràn đầy cảm xúc mạnh mẽ.\n\nThrilling là tính từ mô tả trải nghiệm cực kỳ hào hứng, gây cảm giác mạnh. Nó nối với D: “Very exciting and full of strong emotions.”; exciting là từ đồng nghĩa trực tiếp trong định nghĩa."},{"number":12,"answer":"F","context":"cliff (n)","explanation":"Giải thích của cô: Cliff: Vách đá, một bề mặt hoặc rìa đá rất dốc và cao.\n\nCliff là danh từ chỉ vách đá cao, dựng đứng hoặc rất dốc. Định nghĩa F “A very steep, high rock face or edge.” khớp chính xác với các đặc điểm steep, high và rock."},{"number":13,"answer":"H","context":"emergency (n)","explanation":"Giải thích của cô: Emergency: Tình huống khẩn cấp, một tình huống nghiêm trọng, bất ngờ đòi hỏi phải hành động hoặc giúp đỡ ngay lập tức.\n\nEmergency là danh từ chỉ tình huống nguy cấp cần phản ứng ngay. Vì thế H—“A serious, unexpected situation that requires immediate action or help.”—nêu đủ tính nghiêm trọng, bất ngờ và cấp bách."},{"number":14,"answer":"M","context":"descend (v)","explanation":"Giải thích của cô: Descend: Đi xuống, di chuyển xuống một vị trí thấp hơn.\n\nDescend là động từ trái nghĩa với ascend, chỉ chuyển động xuống thấp. Nó khớp M: “To go down or move to a lower place.”"},{"number":15,"answer":"K","context":"thriller (n)","explanation":"Giải thích của cô: Thriller: Phim/Truyện giật gân, một loại câu chuyện, phim hoặc sách ly kỳ và đầy sự hồi hộp, thường liên quan đến nguy hiểm hoặc bí ẩn.\n\nThriller là danh từ chỉ thể loại truyện/phim gây hồi hộp. Định nghĩa K nêu đúng “story, movie, or book”, tính exciting/suspense và mô-típ danger or mystery, nên hoàn toàn tương ứng."}]},{"exercise":2,"count":10,"inputKind":"text","choices":[],"instruction":"Ex 2: Fill in the blanks with the following words: emerge, intuition, extremes, thrilled, ease, better, geology, trade, extension, solely.","questions":[{"number":16,"answer":"thrilled","context":"She was so _______ to receive the award for her hard work and dedication.","explanation":"Sau was so cần tính từ chỉ cảm xúc của chủ ngữ she; thrilled nghĩa là vô cùng vui mừng/hào hứng. To receive the award là nguyên nhân cảm xúc. Câu hoàn chỉnh: “She was so thrilled to receive the award for her hard work and dedication.”; thrilling sẽ mô tả vật/sự việc gây cảm xúc."},{"number":17,"answer":"emerge","context":"After hours of discussion, a solution began to _______ that everyone agreed on.","explanation":"Sau began to cần động từ nguyên mẫu emerge = xuất hiện/dần hình thành. Một giải pháp bắt đầu hiện ra sau nhiều giờ thảo luận phù hợp nghĩa này. Câu hoàn chỉnh: “After hours of discussion, a solution began to emerge that everyone agreed on.”"},{"number":18,"answer":"extremes","context":"He decided to go to any _______ in order to ensure the success of his new business idea.","explanation":"Extremes là danh từ số nhiều, chỉ những biện pháp/mức độ cực đoan. Câu muốn nói anh ấy sẵn sàng đi đến mọi mức cực đoan để bảo đảm thành công: “He decided to go to any extremes in order to ensure the success of his new business idea.”"},{"number":19,"answer":"intuition","context":"The scientist’s _______ told him that something was not right with the experiment.","explanation":"Sau sở hữu cách scientist’s cần danh từ intuition = trực giác. Mệnh đề “told him that something was not right” mô tả một linh cảm chưa dựa trên chứng cứ rõ ràng. Câu hoàn chỉnh: “The scientist’s intuition told him that something was not right with the experiment.”"},{"number":20,"answer":"ease","context":"They were able to complete the task with _______ because they had practiced beforehand.","explanation":"Cụm with ease nghĩa là một cách dễ dàng, không gặp khó khăn. Việc đã luyện tập trước giải thích tại sao họ hoàn thành nhiệm vụ dễ dàng. Câu hoàn chỉnh: “They were able to complete the task with ease because they had practiced beforehand.”"},{"number":21,"answer":"geology","context":"In his field of study, he was the leading expert in _______.","explanation":"Sau giới từ in cần danh từ chỉ lĩnh vực; geology là địa chất học. Cụm “leading expert in geology” nghĩa là chuyên gia hàng đầu trong ngành địa chất. Câu hoàn chỉnh: “In his field of study, he was the leading expert in geology.”"},{"number":22,"answer":"better","context":"It’s important to _______ your skills if you want to succeed in the competitive job market.","explanation":"Sau to cần động từ nguyên mẫu better, nghĩa là cải thiện/nâng cao. Tân ngữ your skills và mục tiêu thành công trong thị trường cạnh tranh xác nhận nghĩa này. Câu hoàn chỉnh: “It’s important to better your skills if you want to succeed in the competitive job market.”"},{"number":23,"answer":"solely","context":"The company decided to focus _______ on developing new software products.","explanation":"Ô trống bổ nghĩa cho động từ focus nên cần trạng từ solely = chỉ, duy nhất. Cấu trúc focus solely on diễn tả công ty chỉ tập trung vào phần mềm mới. Câu hoàn chỉnh: “The company decided to focus solely on developing new software products.”"},{"number":24,"answer":"trade","context":"The government has signed a new agreement to improve the _______ between the two countries.","explanation":"Sau the cần danh từ; trade là hoạt động thương mại/giao thương giữa hai nước. Hiệp định mới nhằm cải thiện trao đổi thương mại. Câu theo đề: “The government has signed a new agreement to improve the trade between the two countries.”"},{"number":25,"answer":"extension","context":"The school is planning to build an _______ to accommodate more students in the coming years.","explanation":"Sau an cần danh từ đếm được số ít; extension là phần xây nối thêm vào một tòa nhà. Mục đích có thêm chỗ cho học sinh xác nhận nghĩa này. Câu hoàn chỉnh: “The school is planning to build an extension to accommodate more students in the coming years.”"}]},{"exercise":3,"count":10,"inputKind":"mcq","choices":["A","B","C","D"],"instruction":"Ex 3: Read the passage below and choose the correct word from the options to fill in the blanks.","questions":[{"number":26,"answer":"B","context":"In August 2004, Sergio García-Dils de la Vega prepared (26) ________ a monumental undertaking as he bid farewell to his girlfriend.","explanation":"Cụm cố định prepare for something = chuẩn bị cho việc gì. “A monumental undertaking” là danh từ chỉ nhiệm vụ lớn nên cần for. Prepare to thường đi với động từ nguyên mẫu, không phải danh từ như ở đây."},{"number":27,"answer":"D","context":"Their objective was formidable: to explore its depths and potentially achieve a descent of 2,000 meters, an underground challenge (27) ________ to scaling the highest mountains.","explanation":"Sau danh từ challenge cần tính từ comparable và cụm comparable to = có thể so sánh với/tương đương. “An underground challenge comparable to scaling the highest mountains” so độ khó thám hiểm hang với leo núi. Comparing là V-ing, compared cần cấu trúc khác, comparison là danh từ."},{"number":28,"answer":"D","context":"They strategically established a series of underground camps, (28) ________ behind essential ropes and communication lines to secure their return route.","explanation":"Cụm leave behind nghĩa là để lại phía sau. Đội thiết lập trại và để dây thừng, đường liên lạc dọc tuyến nhằm bảo đảm đường về: “leaving behind essential ropes and communication lines”. Dropping hàm ý đánh rơi, bringing/taking trái ý để lại."},{"number":29,"answer":"B","context":"(29) ________ their limits, they often worked grueling 20-hour days, advancing methodically deeper into the earth.","explanation":"Collocation push one’s limits = vượt/đẩy giới hạn chịu đựng của bản thân. Làm việc 20 giờ mỗi ngày là bằng chứng họ đang “pushing their limits”. Straining thường cần object khác hoặc strain oneself; pulling và exceeding không tự nhiên với their limits trong cấu trúc này."},{"number":30,"answer":"C","context":"After three intense weeks, the explorers reached 1,775 meters, (30) ________ the deepest point attained at that time.","explanation":"Sau dấu phẩy dùng V-ing marking để nêu kết quả/ý nghĩa của việc đạt 1.775 mét: cột mốc ấy đánh dấu điểm sâu nhất lúc bấy giờ. Marked sẽ tạo hai động từ chia nối chỉ bằng dấu phẩy; mark và to mark không đúng quan hệ diễn ngôn."},{"number":31,"answer":"D","context":"(31) ________ , their path was blocked by a sump – a water-filled passage.","explanation":"Câu trước nêu thành tích đạt độ sâu kỷ lục; câu sau chuyển ý bất lợi “their path was blocked by a sump”. However thể hiện tương phản. Alternatively là phương án thay thế, Additionally là bổ sung cùng chiều, As a consequence là hệ quả nhưng việc bị chặn không phải hệ quả logic của kỷ lục."},{"number":32,"answer":"A","context":"Samokhin dove once more, surfacing with promising signs, but (32) ________ supplies and overwhelming fatigue necessitated a retreat for the expedition.","explanation":"Ô trống đứng trước supplies nên cần tính từ/phân từ depleted = đã cạn kiệt. Cùng với overwhelming fatigue, nguồn tiếp tế cạn buộc đoàn rút lui. Run-out không dùng như tính từ theo dạng này; extracted/utilized không diễn tả thiếu nguồn lực."},{"number":33,"answer":"D","context":"They pushed the known depth (33) ________ 2,080 meters.","explanation":"Cấu trúc push something to + mức/giới hạn = đẩy cái gì lên tới mức nào. “They pushed the known depth to 2,080 meters” nói họ nâng độ sâu đã biết lên 2.080 m. With, at và by không hoàn chỉnh quan hệ đích đến này."},{"number":34,"answer":"D","context":"In 2012, he (34) ________ his own record, diving to an astonishing 2,197 meters.","explanation":"Samokhin trước đó giữ kỷ lục 2.191 m, rồi đạt 2.197 m, nên anh vượt kỷ lục của chính mình: surpassed his own record. Overcame thường dùng cho khó khăn, achieved/reached a record có thể đạt kỷ lục nhưng không thể hiện vượt mức cũ như số liệu."},{"number":35,"answer":"C","context":"Krubera Cave (35) ________ an ultimate test for explorers, its hidden depths continually beckoning new efforts to chart the vast unknown beneath the surface.","explanation":"Cấu trúc remain + noun phrase nghĩa là vẫn là. “Krubera Cave remains an ultimate test for explorers” cho thấy qua thời gian hang vẫn giữ vai trò thử thách tối thượng. Obtains, retains và maintains đều cần tân ngữ/cấu trúc khác; không nối trực tiếp với an ultimate test theo nghĩa này."}]},{"exercise":4,"count":8,"inputKind":"text","choices":[],"instruction":"Ex 4: Fill in the blanks with ONE suitable word.","questions":[{"number":36,"answer":"have","context":"For thousands of years, humans (36) __________ dreamed of flying.","explanation":"Cụm thời gian For thousands of years yêu cầu hiện tại hoàn thành để nối quá khứ với hiện tại. Chủ ngữ humans số nhiều nên dùng have dreamed: “For thousands of years, humans have dreamed of flying.”"},{"number":37,"answer":"that / which","context":"Leonardo da Vinci, a 15th-century artist and inventor, studied birds and designed flying machines (37) __________ never left the ground.","explanation":"Tiền ngữ flying machines chỉ vật và mệnh đề sau thiếu chủ ngữ của never left. That hoặc which đều làm đại từ quan hệ chủ ngữ trong mệnh đề xác định: “flying machines that/which never left the ground.”"},{"number":38,"answer":"made","context":"Centuries later, in North Carolina, I (38) __________ that dream real—with a hang glider.","explanation":"Cấu trúc make a dream real = biến giấc mơ thành hiện thực. Mốc kể chuyện “Centuries later, in North Carolina” và các động từ quá khứ sau đó yêu cầu made: “I made that dream real—with a hang glider.”"},{"number":39,"answer":"Unlike","context":"(39) __________ Leonardo, I had modern help: a lightweight glider that made flying safe and simple.","explanation":"Người kể đối chiếu Leonardo, người không có công nghệ hiện đại, với bản thân có tàu lượn nhẹ. Unlike + noun nghĩa là không giống/khác với: “Unlike Leonardo, I had modern help.”"},{"number":40,"answer":"by","context":"Lifted into the air (40) __________ a small plane, it felt like falling headfirst from a building when the glider released.","explanation":"Cụm phân từ bị động “Lifted into the air” cần by để giới thiệu tác nhân/phương tiện thực hiện hành động: được một máy bay nhỏ kéo/nâng lên. Vì vậy “Lifted into the air by a small plane” là đúng."},{"number":41,"answer":"Others","context":"(41) __________ , like Swiss inventor Yves Rossy, use jet-powered wings.","explanation":"Câu trước nêu Skydivers and BASE jumpers; câu sau chuyển sang những người khác như Yves Rossy. Others là đại từ số nhiều tự đứng làm chủ ngữ, nghĩa là những người khác: “Others, like Swiss inventor Yves Rossy, use jet-powered wings.”"},{"number":42,"answer":"at","context":"Rossy steers with his body and can soar for 10 minutes (42) __________ a time, even crossing from France to England.","explanation":"Cụm cố định at a time = mỗi lần/liên tục trong một khoảng. “Can soar for 10 minutes at a time” nghĩa là có thể bay mỗi lượt mười phút."},{"number":43,"answer":"matter","context":"He hopes his inventions will motivate others to chase dreams, no (43) __________ how impossible they seem.","explanation":"Cấu trúc no matter how + adjective + clause nghĩa là bất kể ... đến đâu. “No matter how impossible they seem” diễn tả vẫn theo đuổi giấc mơ dù có vẻ bất khả thi đến mức nào."}]},{"exercise":5,"count":23,"inputKind":"mcq","choices":["A","B","C","D"],"instruction":"Ex 5: Read the following passages and answer the questions.","questions":[{"number":44,"answer":"C","context":"Đoạn văn chủ yếu thảo luận về điều gì?","explanation":"Giải thích của cô: Đoạn văn chủ yếu thảo luận về điều gì?\n\nĐoạn 1 nêu hạn chế của dự báo truyền thống với bão cục bộ; đoạn 2 giải thích các tiến bộ radar, thiết bị tự động, vệ tinh và máy tính làm Nowcasting khả thi. Vì vậy chủ đề bao quát là weather forecasting (C), đặc biệt dự báo rất ngắn hạn. Computers và satellites chỉ là công cụ; dangerous storms là đối tượng dự báo."},{"number":45,"answer":"B","context":"Tại sao tác giả nhắc đến trận lốc xoáy ở Edmonton, Canada?","explanation":"Giải thích của cô: Tại sao tác giả nhắc đến trận lốc xoáy ở Edmonton, Canada?\n\nTác giả vừa nói thời tiết cục bộ có thể tàn phá rồi đưa lốc Edmonton với thiệt hại hơn 250 triệu đô làm minh chứng cụ thể. Vì vậy B: an example of a damaging storm. Bài không dùng nó để chứng minh lốc thường xảy ra vào hè/ở Canada hay để phân loại thời tiết."},{"number":46,"answer":"D","context":"Từ \"subtle\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"subtle\" gần nghĩa nhất với từ nào?\n\nCác mô hình khó nhận ra “subtle atmospheric changes” trước bão vì dữ liệu không đủ chi tiết. Subtle ở đây là nhỏ, tinh vi, khó nhận thấy, gần nhất với slight (D). Complex, regular và imagined không diễn tả mức thay đổi nhỏ khó phát hiện."},{"number":47,"answer":"B","context":"Tại sao tác giả lại nêu việc quan sát khí tượng được thực hiện \"chỉ 12 giờ một lần\"?","explanation":"Giải thích của cô: Tại sao tác giả lại nêu việc quan sát khí tượng được thực hiện \"chỉ 12 giờ một lần\"?\n\nTần suất thưa và các điểm đo cách nhau hàng trăm dặm minh họa dữ liệu quá hạn chế để bắt những biến đổi nhanh, cục bộ. Do đó chi tiết cho thấy vì sao quan sát có giá trị hạn chế (B). Nó không chứng minh tính kịp thời, so sánh thiết bị hay hợp tác quốc tế."},{"number":48,"answer":"A","context":"Từ \"they\" ở đoạn văn số 1 ám chỉ cái gì?","explanation":"Giải thích của cô: Từ \"they\" ở đoạn văn số 1 ám chỉ cái gì?\n\nTrong “conventional forecasting models do a much better job ... than they do forecasting specific local events”, they thay cho chủ ngữ số nhiều conventional forecasting models. Vì vậy A đúng; conditions, regions và events là đối tượng được dự báo, không phải chủ thể “do a better job”."},{"number":49,"answer":"A","context":"Cái nào sau đây KHÔNG được nhắc đến như một bước tiến trong việc dự báo thời tiết ngắn hạn?","explanation":"Giải thích của cô: Cái nào sau đây KHÔNG được nhắc đến như một bước tiến trong việc dự báo thời tiết ngắn hạn?\n\nĐoạn 2 liệt kê tiến bộ mới gồm radar systems, automated weather instruments và satellites, tương ứng B–D. Weather balloons được nhắc ở đoạn 1 như nguồn quan sát truyền thống thưa thớt, không phải bước tiến mới, nên A là đáp án EXCEPT."},{"number":50,"answer":"A","context":"Từ \"compile\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"compile\" gần nghĩa nhất với từ nào?\n\nMáy tính “compile and analyze this large volume of weather information”, tức tập hợp nhiều dữ liệu lại rồi phân tích. Compile gần nhất với put together (A). Look up là tra cứu, pile high là chất cao theo nghĩa vật lý, work over không mang nghĩa tập hợp dữ liệu."},{"number":51,"answer":"A","context":"Với phương pháp Nowcasting, lần đầu tiên người ta có thể cung cấp thông tin về?","explanation":"Giải thích của cô: Với phương pháp Nowcasting, lần đầu tiên người ta có thể cung cấp thông tin về?\n\nNowcasts được định nghĩa là “accurate, very short range forecasts”, nhằm khắc phục việc mô hình cũ dự báo kém “short-lived local storms”. Vì vậy A đúng. Dữ liệu radar là đầu vào, còn dự báo dài hạn và điều kiện chung đã làm được trước đó."},{"number":52,"answer":"D","context":"Từ \"raw\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"raw\" gần nghĩa nhất với từ nào?\n\n“Raw weather data” là dữ liệu thời tiết ở dạng ban đầu, chưa được máy tính xử lý thành từ, biểu tượng và đồ họa. Vì vậy raw = unprocessed (D). Stormy mô tả thời tiết, inaccurate nói độ chính xác, uncooked chỉ là nghĩa đen dùng cho thức ăn."},{"number":53,"answer":"D","context":"Tác giả có khả năng cao nhất sẽ đồng ý với phát biểu nào sau đây?","explanation":"Giải thích của cô: Tác giả có khả năng cao nhất sẽ đồng ý với phát biểu nào sau đây?\n\nGiọng bài tích cực: tiến bộ khoa học–công nghệ đã vượt hầu hết trở ngại và Nowcasting “is becoming a reality”, nên dự báo thời tiết đang chính xác hơn (D). Vệ tinh truyền dữ liệu chứ không tự dự báo; bài không yêu cầu chuẩn hóa chương trình và cũng khẳng định cách tiếp cận giàu quan sát nay khả thi, trái C."},{"number":54,"answer":"B","context":"Cái nào sau đây phản ánh chính xác nhất ứng dụng thực tế của Nowcasting?","explanation":"Giải thích của cô: Cái nào sau đây phản ánh chính xác nhất ứng dụng thực tế của Nowcasting?\n\nNowcasting cung cấp dự báo rất ngắn hạn cho hiện tượng cục bộ nguy hiểm; một cảnh báo phát thanh về cơn dông nghiêm trọng sắp xảy ra là ứng dụng điển hình (B). Dự báo năm ngày là dài hơn, lượng mưa trung bình là khí hậu quá khứ, danh sách nhiệt độ thành phố chỉ là quan sát."},{"number":55,"answer":"C","context":"Đoạn văn chủ yếu thảo luận về chủ đề gì?","explanation":"Giải thích của cô: Đoạn văn chủ yếu thảo luận về chủ đề gì?\n\nBài mô tả cấu tạo hoa lan, cơ quan sinh sản, cánh môi và các cách hoa thu hút/thao túng loài thụ phấn. Chủ đề bao quát là flowers (C), cụ thể hoa lan. Birds và insects chỉ là tác nhân thụ phấn; perfume chỉ là một phương tiện thu hút."},{"number":56,"answer":"B","context":"Hoa lan trở nên độc nhất vô nhị (unique) là nhờ vào?","explanation":"Giải thích của cô: Hoa lan trở nên độc nhất vô nhị (unique) là nhờ vào?\n\nCâu đầu nêu hoa lan độc đáo vì có “the most highly developed of all blossoms”, trong đó cơ quan sinh sản đực và cái hợp nhất thành column. Vì vậy uniqueness nằm ở structure of its blossom (B). Habitat, sản phẩm và tuổi thọ không được dùng để giải thích."},{"number":57,"answer":"A","context":"Từ \"fused\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"fused\" gần nghĩa nhất với từ nào?\n\nCác cơ quan sinh sản đực và cái “are fused in a single structure called the column”, tức được kết hợp/hợp nhất trong một cấu trúc. Vì vậy combined (A) đúng. Hidden, fertilized và produced là các quá trình khác."},{"number":58,"answer":"D","context":"Thông thường có bao nhiêu hạt lan được thụ phấn trong cùng một lần?","explanation":"Giải thích của cô: Thông thường có bao nhiêu hạt lan được thụ phấn trong cùng một lần?\n\nBài nói một lần thụ phấn sẽ thụ tinh “hundreds of thousands, and in some cases millions, of seeds”. Trong bốn số, 200,000 (D) là lựa chọn duy nhất thuộc mức hàng trăm nghìn; 200, 2.000 và 20.000 đều thấp hơn rõ rệt."},{"number":59,"answer":"D","context":"Cái nào sau đây là một dạng cấu tạo cánh hoa của hoa lan?","explanation":"Giải thích của cô: Cái nào sau đây là một dạng cấu tạo cánh hoa của hoa lan?\n\nBài nói quanh column có ba sepal và ba petal, rồi xác định “The most noticeable of the petals is called the labellum”. Vì vậy labellum (D) là một cánh hoa. Column là cơ quan hợp nhất, sepal là lá đài, stem là thân."},{"number":60,"answer":"C","context":"Cánh môi (labellum) có thể được so sánh tốt nhất với vật nào?","explanation":"Giải thích của cô: Cánh môi (labellum) có thể được so sánh tốt nhất với vật nào?\n\nLabellum được đánh dấu như “an unmistakable landing strip” để côn trùng đáp xuống. Landing strip tương ứng đường băng sân bay, nên C đúng. Obstacle course xuất hiện sau nhưng là cơ chế khác, không phải phép so sánh trực tiếp cho labellum."},{"number":61,"answer":"A","context":"Từ \"lure\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"lure\" gần nghĩa nhất với từ nào?\n\n“To lure their pollinators from afar”, hoa lan dùng hình dạng, màu và mùi để khiến loài thụ phấn tìm đến. Lure vì vậy = attract (A). Recognize, follow và help không diễn tả hành động thu hút từ xa."},{"number":62,"answer":"A","context":"Cái nào KHÔNG được nhắc đến như một phương thức để hoa lan thu hút côn trùng?","explanation":"Giải thích của cô: Cái nào KHÔNG được nhắc đến như một phương thức để hoa lan thu hút côn trùng?\n\nĐoạn 2 liệt kê “intriguing shapes, colors, and scents”, tương ứng shape (B), color (C) và perfume (D). Size không được nêu như phương thức thu hút, nên A là đáp án EXCEPT."},{"number":63,"answer":"A","context":"Từ \"their\" ở đoạn văn số 2 ám chỉ cái gì?","explanation":"Giải thích của cô: Từ \"their\" ở đoạn văn số 2 ám chỉ cái gì?\n\nTrong câu “To lure their pollinators from afar, orchids use ...”, chủ ngữ orchids xuất hiện ngay sau cụm mở đầu, và pollinators là các loài thụ phấn của hoa lan. Vì vậy their quy chiếu orchids (A), không phải birds, insects hay species."},{"number":64,"answer":"D","context":"Bài viết ủng hộ phát biểu nào sau đây về mùi hương của hoa lan?","explanation":"Giải thích của cô: Bài viết ủng hộ phát biểu nào sau đây về mùi hương của hoa lan?\n\nBằng chứng trực tiếp: “Some orchids even change their scents to interest different insects at different times.” Do đó mùi hương có thể thay đổi vào những thời điểm khác nhau (D). Bài không nói chỉ hiệu quả khi côn trùng ở gần, xua côn trùng hại hay khó phân biệt."},{"number":65,"answer":"C","context":"Từ \"placed\" ở đoạn 2 gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"placed\" ở đoạn 2 gần nghĩa nhất với từ nào?\n\nTrong obstacle course, côn trùng không được rời đi cho đến khi pollen “has been accurately placed or removed”, tức phấn được đặt/gửi đúng vị trí hoặc lấy đi. Deposited (C) gần nghĩa nhất. Estimated, measured và identified không nói việc đưa phấn tới vị trí."},{"number":66,"answer":"B","context":"Từ \"discrete\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"discrete\" gần nghĩa nhất với từ nào?\n\nHoa lan tránh lai chéo tràn lan, bảo đảm các loài tồn tại “as discrete identities”: như những bản sắc/đơn vị tách biệt nhau. Vì vậy discrete = separate (B). Complicated, inoffensive và functional không diễn tả sự phân biệt giữa các loài."}]}]}</script>

    millionth: "million", billionth: "billion" });
  const own = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
  const cardinalWord = word => own(SMALL, word) || own(TENS, word) || own(SCALES, word) || word === "hundred";
  const numericWord = word => cardinalWord(word) || own(ORDINALS, word);

  function inputText(value) {
    if (typeof value === "string") return value;
    if (typeof value === "number" && Number.isFinite(value)) return String(value);
    return "";
  }

  function basicText(value) {
    return inputText(value).normalize("NFKC").toLowerCase()
      .replace(/[\u200B-\u200D\uFEFF\u00AD]/g, "")
      .replace(/[‘’‛ʼ′]/g, "'")
      .replace(/[‐‑‒–—―−]/g, "-")
      .replace(/\s+/g, " ").trim();
  }

  function unwrap(value) {
    const pairs = { '"': '"', "'": "'", "“": "”", "‘": "’", "(": ")", "[": "]", "{": "}" };
    let result = value.trim();
    // Only a balanced wrapper is presentation punctuation, not a missing bracket.
    for (let depth = 0; depth < 4 && result.length > 1; depth += 1) {
      if (pairs[result[0]] !== result[result.length - 1]) break;
      result = result.slice(1, -1).trim();
    }
    return result;
  }

  function meridiem(value) {
    return value.replace(/(?<![a-z])([ap])\s*\.?\s*m\s*\.?(?![a-z])/g, "$1m");

  function policyFor(expected, question) {

    const timeText = meridiem(text);
    const time = /\bo\s*'?\s*clock\b/.test(timeText) ? "oclock"
      : /(?<![a-z])[ap]m(?![a-z])/.test(timeText) ? "meridiem"
      : /\b\d{1,2}\s*:\s*\d{2}\b/.test(timeText) ? "clock" : "none";
    let numbers = /\d/.test(text);
    // Standalone One/First and anaphoric "the one" are grammatical keys in RI2.

        input.type = "radio";
        input.name = "answer-" + number;
        input.id = index === 0 ? "answer-" + number : "answer-" + number + "-" + index;
        input.value = choice;
        input.checked = value === choice;
        input.disabled = !!attempt.submittedAt || submitting;
        input.addEventListener("change", () => recordAnswer(number, choice));
        choiceLabel.append(input, node("span", "", choice));
        grid.appendChild(choiceLabel);
      });
      card.appendChild(grid);
    } else if (section.inputKind === "matching" && choices.length) {
      const input = node("select");
      input.id = "answer-" + number;
      input.name = "answer-" + number;
      input.setAttribute("aria-label", "Đáp án câu " + number);
      const empty = node("option", "", "— Chọn đáp án —");
      empty.value = "";
      input.appendChild(empty);
      choices.forEach((choice) => { const option = node("option", "", choice); option.value = choice; input.appendChild(option); });
      input.value = value;
      input.disabled = !!attempt.submittedAt || submitting;
      input.addEventListener("change", () => recordAnswer(number, input.value));
      card.appendChild(input);
    } else {
      const input = node("input");
      input.type = "text";
      input.id = "answer-" + number;
      input.name = "answer-" + number;
      input.value = value;
      input.maxLength = 600;
      input.placeholder = "Nhập câu trả lời của bạn";
      input.autocomplete = "off";
      input.setAttribute("autocapitalize", "off");
      input.setAttribute("autocorrect", "off");
      input.spellcheck = false;
      input.disabled = !!attempt.submittedAt || submitting;
      input.addEventListener("input", () => recordAnswer(number, input.value));
      card.appendChild(input);
    }
    if (result) {
      const review = node("div", "answer-review");
      const key = node("p", "answer-key");
      const mine = node("span", "answer-key-row", "Bạn trả lời: ");
      mine.appendChild(node("b", result.correct ? "" : "submitted-answer", plainText(result.actual)));
      const correct = node("span", "answer-key-row", "Đáp án đúng: ");
      correct.appendChild(node("b", "", plainText(result.answer)));
      key.append(mine, correct);
      const alternatives = Array.isArray(result.acceptedAnswers) ? result.acceptedAnswers.map(plainText).filter((answer) => answer && answer !== plainText(result.answer)) : [];
      if (alternatives.length) key.appendChild(node("small", "", "Cũng chấp nhận: " + alternatives.join(" · ")));
      review.appendChild(key);
      if (plainText(question.context)) {
        review.appendChild(node("p", "review-label", "Ngữ cảnh câu hỏi"));
        review.appendChild(node("p", "question-context", plainText(question.context)));
      }
      review.appendChild(node("p", "review-label", "Giải thích"));
      review.appendChild(node("p", "explanation", cleanExplanation(result.explanation) || "Chưa có giải thích cho câu này."));
      card.appendChild(review);
    }
    return card;
  }

  function cleanExplanation(value) {
    return plainText(value).replace(/^Giải thích của cô\s*:\s*/i, "");
  }

  function setReviewMode(mode, questionNumber) {
    reviewMode = mode === "all" ? "all" : "wrong";
    renderAnswers();
    $("answer-scroll").scrollTop = 0;
    if (questionNumber !== undefined) {
      const card = [...document.querySelectorAll("[data-question]")].find((item) => item.dataset.question === String(questionNumber));
      if (card) {
        card.scrollIntoView({ block: "start" });
        card.focus({ preventScroll: true });
      }
    }
  }

  function renderResultSummary() {
    const target = $("result-summary");
    target.replaceChildren();
    target.hidden = !attempt.submittedAt || !attempt.grade || !attempt.grade.complete;
    if (target.hidden) return;
    const grade = attempt.grade;
    const box = node("section", "result-summary");
    box.setAttribute("aria-labelledby", "result-heading");
    box.appendChild(node("p", "result-kicker", "KẾT QUẢ"));
    const numbers = node("div", "result-numbers");
    const score = node("div", "result-score", String(grade.score));
    score.appendChild(node("small", "", " / " + grade.total));
    numbers.append(score, node("div", "result-percent", String(grade.percent) + "%"));
    box.appendChild(numbers);
    const title = node("h3", "", grade.score === grade.total ? "Hoàn thành tất cả các câu" : grade.wrong.length + " câu cần sửa");
    title.id = "result-heading";
    box.appendChild(title);
    if (grade.wrong.length) {
      const wrongLabel = node("p", "result-wrong-label", "CÂU SAI");
      const jumps = node("div", "wrong-jumps");
      grade.wrong.forEach((result) => {
        const button = node("button", "", String(result.number));
        button.type = "button";
        button.setAttribute("aria-label", "Xem câu sai " + result.number);
        button.addEventListener("click", () => setReviewMode("wrong", result.number));
        jumps.appendChild(button);
      });
      box.append(wrongLabel, jumps);
    }
    const toggles = node("div", "review-toggle");
    const wrongButton = node("button", reviewMode === "wrong" ? "active" : "", "CÂU SAI (" + grade.wrong.length + ")");
    wrongButton.type = "button";
    wrongButton.hidden = grade.wrong.length === 0;
    wrongButton.setAttribute("aria-pressed", String(reviewMode === "wrong"));
    wrongButton.addEventListener("click", () => setReviewMode("wrong"));
    const allButton = node("button", reviewMode === "all" ? "active" : "", "TẤT CẢ (" + grade.total + ")");
    allButton.type = "button";
    allButton.setAttribute("aria-pressed", String(reviewMode === "all"));
    allButton.addEventListener("click", () => setReviewMode("all"));
    toggles.append(wrongButton, allButton);
    box.appendChild(toggles);
    target.appendChild(box);
  }

  function renderDelivery() {
    const target = $("delivery-status");
    target.replaceChildren();
    const pending = !!attempt && ["sending", "pending"].includes(attempt.delivery && attempt.delivery.state);
    $("new-attempt").disabled = pending;
    $("new-attempt").textContent = pending ? "ĐANG LƯU ĐIỂM…" : "LÀM MỘT LƯỢT MỚI ↻";
    const state = attempt.delivery && attempt.delivery.state;
    target.hidden = !attempt || !attempt.submittedAt || !["unconfirmed", "not-configured", "test-mode"].includes(state);
    if (target.hidden) return;
    const messages = {
      unconfirmed: ["Chưa lưu được điểm", "Vui lòng kiểm tra mạng hoặc báo giáo viên."],
      "not-configured": ["Chưa lưu được điểm", "Vui lòng báo giáo viên."],
      "test-mode": ["CHẾ ĐỘ KIỂM THỬ — không ghi điểm", ""]
    };
    const message = messages[state] || messages.unconfirmed;
    target.className = "delivery" + (["unconfirmed", "not-configured"].includes(state) ? " is-warning" : "");
    target.appendChild(node("strong", "", message[0]));
    if (message[1]) target.appendChild(node("span", "", message[1]));
  }

  async function withSubmissionLock(action) {
    if (navigator.locks && typeof navigator.locks.request === "function") {
      let actionStarted = false;
      try {
        return await navigator.locks.request(storageBase + ":submit:" + attempt.id, { mode: "exclusive" }, () => {
          actionStarted = true;
          return action();
        });
      } catch (error) {
        if (actionStarted) throw error;
        // Some embedded/partitioned contexts expose Web Locks but reject access.
        return action();
      }
    }
    return action();
  }

  async function submitAttempt(event) {
    event.preventDefault();
    if (!attempt || attempt.submittedAt || submitting) return;
    $("form-error").hidden = true;
    if (answeredCount() !== questions.length) {
      $("form-error").textContent = "Bạn cần trả lời đủ toàn bộ câu trước khi chấm bài.";
      $("form-error").hidden = false;
      const missing = questions.find((question) => !plainText(attempt.answers[String(question.number)]));
      const input = missing && $("answer-" + missing.number);
      if (input) input.focus();
      return;
    }
    submitting = true;
    renderAnswers();
    let shouldSend = false;
    try {
      shouldSend = await withSubmissionLock(() => {
        const saved = readStorage(attemptKey(attempt.id));
        if (validStoredAttempt(saved) && saved.submittedAt) {
          attempt = saved;
          if (["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) attempt.delivery = { state: "unconfirmed", reason: "already-submitted" };
          return false;
        }
        const grade = globalThis.RI2Grading.gradeAttempt(unit, attempt.answers);
        if (!grade.complete) throw new Error("incomplete");
        attempt.grade = grade;
        attempt.submittedAt = new Date().toISOString();
        attempt.delivery = { state: "sending", attemptedAt: attempt.submittedAt };
        persist();
        return true;
      });
    } catch (_) {
      $("form-error").textContent = "Chưa thể chấm bài. Các câu trả lời vẫn được giữ; vui lòng kiểm tra lại hoặc báo giáo viên.";
      $("form-error").hidden = false;
    } finally {
      submitting = false;
      renderAnswers();
      if (attempt.submittedAt) {
        $("answer-scroll").scrollTop = 0;
        $("answer-scroll").focus({ preventScroll: true });
      }
    }
    if (shouldSend) await sendScore(attempt.id);
  }

  function configuredFormSink() {
    if (course.testing === true) return null;
    const sink = course.scoreSink;
    if (!sink || sink.kind !== "google-form" || !sink.entries || typeof sink.formResponseUrl !== "string") return null;
    try {
      const url = new URL(sink.formResponseUrl);
      if (url.protocol !== "https:" || url.hostname !== "docs.google.com" || !/^\/forms\/d\/(?:e\/)?[^/]+\/formResponse\/?$/.test(url.pathname)) return null;
      const required = ["name", "total", "assignmentCode", "lesson", "activity", "className", "percent", "score", "wrong"];
      if (required.some((field) => !/^entry\.\d+$/.test(sink.entries[field] || ""))) return null;
      return sink;
    } catch (_) { return null; }
  }

  function scoreBody(sink, snapshot) {
    const grade = snapshot.grade;
    const values = {
      name: snapshot.identity.name,
      className: snapshot.identity.className,
      total: String(grade.total),
      assignmentCode: plainText(unit.testCode),
      lesson: unitLabel(),
      activity: "Làm lại đề · Lượt " + snapshot.number + " · Mã lượt " + snapshot.id + " · " + snapshot.submittedAt,
      percent: String(grade.percent),
      score: String(grade.score),
      wrong: grade.wrong.length ? grade.wrong.map((result) => "Câu " + result.number + ": " + plainText(result.actual) + " → " + plainText(result.answer)).join("\n") : "Không có câu sai"
    };
    const body = new URLSearchParams();
    Object.keys(values).forEach((field) => body.set(sink.entries[field], values[field]));
    // Only use additional form mappings when explicitly supplied by the course configuration.
    const optional = { attemptId: snapshot.id, attemptNumber: String(snapshot.number), submittedAt: snapshot.submittedAt, startedAt: snapshot.startedAt };
    Object.keys(optional).forEach((field) => { if (/^entry\.\d+$/.test(sink.entries[field] || "")) body.set(sink.entries[field], optional[field]); });
    return body;
  }

  async function sendScore(id) {
    if (!attempt || attempt.id !== id || !attempt.submittedAt) return;
    if (course.testing === true) {
      attempt.delivery = { state: "test-mode" };
      persist();
      renderDelivery();
      return;
    }
    const sink = configuredFormSink();
    if (!sink) {
      attempt.delivery = { state: "not-configured" };
      persist();
      renderDelivery();
      return;
    }
    const snapshot = JSON.parse(JSON.stringify(attempt));
    const controller = typeof AbortController === "function" ? new AbortController() : null;
    const timeout = controller ? setTimeout(() => controller.abort(), 25000) : null;
    try {
      // Google Forms is intentionally no-cors: an opaque response is NOT a storage confirmation.
      await fetch(sink.formResponseUrl, { method: "POST", mode: "no-cors", credentials: "omit", body: scoreBody(sink, snapshot), ...(controller ? { signal: controller.signal } : {}) });
      snapshot.delivery = { state: "sent-unverified", attemptedAt: snapshot.delivery.attemptedAt, requestFinishedAt: new Date().toISOString() };
    } catch (_) {
      snapshot.delivery = { state: "unconfirmed", attemptedAt: snapshot.delivery.attemptedAt, reason: "network" };
    } finally {
      if (timeout !== null) clearTimeout(timeout);
    }
    try { localStorage.setItem(attemptKey(id), JSON.stringify(snapshot)); } catch (_) { storageAvailable = false; }
    if (attempt && attempt.id === id) {
      attempt.delivery = snapshot.delivery;
      persist();
      renderDelivery();
    }
  }

  function startNewAttempt() {
    if (!attempt || !attempt.submittedAt || submitting || ["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) return;
    attempt = createAttempt(Number(attempt.number || 1) + 1);
    reviewMode = "wrong";
    persist({ makeCurrent: true });
    $("form-error").hidden = true;
    renderAnswers();
    $("answer-scroll").scrollTop = 0;
    const first = questions[0] && $("answer-" + questions[0].number);
    if (first) first.focus({ preventScroll: true });
  }

  function receiveStorageUpdate(event) {
    if (!attempt || !storageBase || event.key !== attemptKey(attempt.id) || !event.newValue) return;
    try {
      const saved = JSON.parse(event.newValue);
      if (!validStoredAttempt(saved) || !saved.submittedAt) return;
      attempt = saved;
      if (["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) attempt.delivery = { state: "unconfirmed", reason: "another-tab" };
      renderAnswers();
    } catch (_) { /* Ignore unrelated or incomplete browser-storage events. */ }
  }

  initialize();
}());
</script>
