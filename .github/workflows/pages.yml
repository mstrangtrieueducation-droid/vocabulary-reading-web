name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage lesson website without development catalogs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, re
          root = Path('.')
          destination = root / '.pages-output'
          excluded = {'.git', '.github', '.pages-output', 'tests', 'scripts', 'node_modules'}
          allowed = {'.html', '.js', '.mjs', '.css', '.json', '.png', '.jpg', '.jpeg', '.webp', '.svg', '.ico', '.mp3', '.mp4', '.wav', '.ogg', '.woff', '.woff2', '.ttf', '.otf', '.pdf'}
          for source in root.rglob('*'):
              if not source.is_file() or any(part in excluded for part in source.parts):
                  continue
              if source.suffix.lower() not in allowed and source.name not in {'.nojekyll', 'CNAME', 'robots.txt'}:
                  continue
              if source.name == 'index.html' and len(source.parts) > 1:
                  utilities = {'bridge-return', 'notebook-submit', 'vf2-submit', 'vocab-submit'}
                  if source.parent.name not in utilities and not re.fullmatch(r'[a-f0-9]{32}', source.parent.name):
                      html = source.read_text(encoding='utf-8')
                      neutral = 'lesson-link-retired' in html or 'Vui lòng mở đường link bài học được giáo viên gửi.' in html
                      assert neutral, f'Lesson URLs must use an independent random token: {source}'
              target = destination / source
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          assert (destination / 'index.html').is_file()
          assert not (destination / 'tests').exists()
          assert not (destination / 'scripts').exists()
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-output
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
