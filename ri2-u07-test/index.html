  <script id="ri2-unit-data" type="application/json">{"unit":7,"title":"READING INTENSIVE 2 · UNIT 7","testCode":"RI2-U07","total":61,"studentPreviewUrl":"https://docs.google.com/document/d/106fEVlzgLIFZ_puQJwKAagjKbGRk_NonFKB-chUqw00/preview","sections":[{"exercise":1,"count":15,"inputKind":"matching","choices":["A","B","C","D","E","F","G","H","I","K","L","M","O","P","Q"],"instruction":"Ex 1: Match the words in Column A with their correct definitions in Column B. Write the letter of the definition next to the corresponding word.","questions":[{"number":1,"answer":"E","context":"authority (n)","explanation":"Giải thích của cô: Authority: Chuyên gia, hoặc một người có kiến thức chuyên sâu trong một lĩnh vực cụ thể.\nAuthority ở nghĩa danh từ chỉ một chuyên gia có kiến thức đáng tin cậy về lĩnh vực nào đó. Định nghĩa E nêu đúng ‘an expert’ và ‘special knowledge’, nên ghép với E."},{"number":2,"answer":"K","context":"considerate (a)","explanation":"Giải thích của cô: Considerate: Chu đáo, tốt bụng và biết nghĩ cho cảm xúc của người khác.\nConsiderate là tính từ mô tả người tử tế và lưu tâm đến cảm xúc, nhu cầu của người khác. Nội dung ấy trùng trực tiếp với định nghĩa K."},{"number":3,"answer":"O","context":"ideal (a)","explanation":"Giải thích của cô: Ideal: Lý tưởng, hoàn hảo hoặc chính xác theo đúng cách bạn mong muốn.\nIdeal là tính từ nói một điều hoàn hảo hoặc đúng như mong muốn. Định nghĩa O ‘perfect or exactly how you want it to be’ là cách diễn đạt tương đương."},{"number":4,"answer":"Q","context":"distinctive (a)","explanation":"Giải thích của cô: Distinctive: Đặc trưng, dễ dàng nhận biết vì nó khác biệt so với những thứ khác.\nDistinctive là tính từ chỉ đặc điểm nổi bật khiến một vật dễ được nhận ra giữa các vật khác. Đó chính là định nghĩa Q."},{"number":5,"answer":"A","context":"assume (v)","explanation":"Giải thích của cô: Assume: Giả định, nghĩ rằng điều gì đó là đúng mà không có bằng chứng hay thông tin xác thực.\nAssume là động từ chỉ coi một điều là đúng dù chưa có bằng chứng. Định nghĩa A lặp đúng quan hệ ‘think ... true without having proof or information’."},{"number":6,"answer":"C","context":"essence (n)","explanation":"Giải thích của cô: Essence: Bản chất, cốt lõi hoặc phẩm chất quan trọng nhất của một cái gì đó.\nEssence là danh từ chỉ phần cốt lõi hoặc phẩm chất quan trọng nhất làm nên bản chất của sự vật. Vì vậy ghép với C."},{"number":7,"answer":"G","context":"edge (n)","explanation":"Giải thích của cô: Edge: Lợi thế, một phẩm chất đặc biệt giúp một thứ gì đó trở nên nổi bật.\nEdge ở nghĩa bóng là lợi thế cạnh tranh hoặc đặc điểm giúp ai/cái gì vượt trội. Định nghĩa G ‘a special quality that makes something stand out’ khớp với nghĩa này, không phải nghĩa ‘mép/cạnh’."},{"number":8,"answer":"I","context":"delicate (a)","explanation":"Giải thích của cô: Delicate: Mỏng manh, dễ vỡ hoặc dễ bị hư hỏng.\nDelicate là tính từ mô tả vật mỏng manh, cần xử lý cẩn thận vì dễ hỏng. Định nghĩa I diễn đạt trực tiếp nét nghĩa fragile or easily damaged."},{"number":9,"answer":"M","context":"odor (n)","explanation":"Giải thích của cô: Odor: Mùi hương, đặc biệt là một mùi mạnh hoặc gây khó chịu.\nOdor là danh từ chỉ mùi, thường là mùi mạnh hoặc khó chịu. Hai dấu hiệu ấy xuất hiện nguyên vẹn trong định nghĩa M."},{"number":10,"answer":"P","context":"dominate (v)","explanation":"Giải thích của cô: Dominate: Thống trị, có quyền kiểm soát ai đó/cái gì đó, hoặc là phần quan trọng nhất, dễ nhận thấy nhất.\nDominate là động từ chỉ kiểm soát hoặc chiếm vị trí nổi bật nhất. Định nghĩa P bao quát cả hai nghĩa ‘have control’ và ‘most important or noticeable’."},{"number":11,"answer":"B","context":"budget (n)","explanation":"Giải thích của cô: Budget: Ngân sách, một kế hoạch về lượng tiền bạn có để tiêu và cách bạn sẽ tiêu số tiền đó.\nBudget là danh từ chỉ kế hoạch thu xếp số tiền có thể chi và cách chi. Định nghĩa B mô tả chính xác chức năng đó."},{"number":12,"answer":"D","context":"emphasis (n)","explanation":"Giải thích của cô: Emphasis: Sự nhấn mạnh, sự chú ý đặc biệt hoặc tầm quan trọng được dành cho cái gì.\nEmphasis là danh từ chỉ sự chú ý hoặc tầm quan trọng đặc biệt đặt lên một điều. Vì vậy D là định nghĩa tương ứng."},{"number":13,"answer":"F","context":"freight (n)","explanation":"Giải thích của cô: Freight: Hàng hóa vận chuyển, các sản phẩm được vận chuyển thường với số lượng lớn.\nFreight là danh từ tập hợp chỉ hàng hóa được vận chuyển, nhất là số lượng lớn bằng tàu, xe hoặc máy bay. Định nghĩa F nêu đúng nội dung này."},{"number":14,"answer":"H","context":"synthetic (a)","explanation":"Giải thích của cô: Synthetic: Tổng hợp, nhân tạo (do con người làm ra bằng cách kết hợp các vật liệu khác nhau, thay vì có nguồn gốc từ tự nhiên).\nSynthetic là tính từ mô tả vật do con người tạo ra, thường bằng cách kết hợp chất liệu, đối lập với natural. Định nghĩa H chứa đúng phép đối lập này."},{"number":15,"answer":"L","context":"auction (n)","explanation":"Giải thích của cô: Auction: Cuộc đấu giá công khai, nơi các món đồ được bán cho người trả mức tiền cao nhất.\nAuction là danh từ chỉ cuộc bán công khai cho người ra giá cao nhất. Vì định nghĩa L nêu cả cách bán và người mua thắng giá, L là cặp chính xác."}]},{"exercise":2,"count":10,"inputKind":"text","choices":[],"instruction":"Ex 2: Fill in the blanks with the following words: fragrance, tackle, considerable, far-reaching, process, essential, distinct, nature, certain, residents","questions":[{"number":16,"answer":"fragrance","context":"The ________ of the flowers in the garden filled the air with a pleasant smell.","explanation":"Sau The cần một danh từ làm chủ ngữ; fragrance là hương thơm. Câu hoàn chỉnh: ‘The fragrance of the flowers in the garden filled the air with a pleasant smell.’ Cụm pleasant smell xác nhận sắc thái thơm dễ chịu, khác odor thường trung tính hoặc khó chịu."},{"number":17,"answer":"nature","context":"The ________ of the project is still unclear, and the team is working on the details.","explanation":"Cấu trúc the nature of something chỉ bản chất/đặc điểm cơ bản của một việc. Câu hoàn chỉnh: ‘The nature of the project is still unclear, and the team is working on the details.’ Việc bản chất dự án chưa rõ giải thích vì nhóm còn hoàn thiện chi tiết."},{"number":18,"answer":"certain","context":"Some people are born with a ________ ability to understand complex mathematical concepts.","explanation":"Khoảng trống đứng trước danh từ ability và sau a nên cần tính từ; a certain ability nghĩa là một khả năng nhất định. Câu hoàn chỉnh: ‘Some people are born with a certain ability to understand complex mathematical concepts.’"},{"number":19,"answer":"tackle","context":"The company is planning to ________ the issue of climate change by investing in renewable energy sources.","explanation":"Sau is planning to cần động từ nguyên mẫu; tackle an issue nghĩa là giải quyết/đối phó một vấn đề khó. Câu hoàn chỉnh: ‘The company is planning to tackle the issue of climate change by investing in renewable energy sources.’"},{"number":20,"answer":"distinct","context":"The forest has a ________ environment that attracts wildlife from all over the region.","explanation":"Distinct là tính từ bổ nghĩa cho environment, nghĩa là riêng biệt/rõ ràng khác với môi trường khác. Câu hoàn chỉnh: ‘The forest has a distinct environment that attracts wildlife from all over the region.’ Mệnh đề sau cho thấy môi trường ấy có đặc điểm riêng hấp dẫn động vật."},{"number":21,"answer":"essential","context":"Good communication is ________ for the success of any team.","explanation":"Sau is cần tính từ; cấu trúc essential for something nghĩa là thiết yếu đối với điều gì. Câu hoàn chỉnh: ‘Good communication is essential for the success of any team.’"},{"number":22,"answer":"considerable","context":"The team has made a ________ amount of progress in their research on renewable energy technologies.","explanation":"Considerable là tính từ nghĩa là đáng kể, đi tự nhiên trong cụm a considerable amount of progress. Câu hoàn chỉnh: ‘The team has made a considerable amount of progress in their research on renewable energy technologies.’"},{"number":23,"answer":"residents","context":"The ________ of the town are working together to make it a better place for everyone.","explanation":"Sau The và trước are cần danh từ số nhiều làm chủ ngữ. Residents là những người cư trú: ‘The residents of the town are working together to make it a better place for everyone.’ Động từ are xác nhận dạng số nhiều."},{"number":24,"answer":"far-reaching","context":"The manager explained that the project would have ________ effects on the entire community.","explanation":"Far-reaching là tính từ ghép nghĩa là có ảnh hưởng rộng và lâu dài, bổ nghĩa cho effects. Câu hoàn chỉnh: ‘The manager explained that the project would have far-reaching effects on the entire community.’ Phạm vi entire community làm rõ tính rộng khắp."},{"number":25,"answer":"process","context":"The new software development is a ________ that requires several steps to complete.","explanation":"Sau a cần danh từ số ít; process là một quy trình gồm nhiều bước. Câu hoàn chỉnh: ‘The new software development is a process that requires several steps to complete.’ Mệnh đề ‘requires several steps’ chính là định nghĩa theo ngữ cảnh."}]},{"exercise":3,"count":8,"inputKind":"mcq","choices":["A","B","C","D"],"instruction":"Ex 3: Read the passage below and choose the correct word from the options to fill in the blanks.","questions":[{"number":26,"answer":"D","context":"Some flowers have gained fame for their unique beauty and rarity, making them highly (26) ______ after and expensive.","explanation":"Giải thích của cô: seek (v) - sought - sought\nCollocation be highly sought after nghĩa là được săn tìm/ưa chuộng rất nhiều. Câu đang ở bị động với have gained fame và nói hoa hiếm, đắt; found, explored và asked không kết hợp với after theo nghĩa này."},{"number":27,"answer":"D","context":"(27) ______ for its romantic symbolism, roses come in a variety of colors, each carrying a different meaning.","explanation":"Known for là cụm phân từ rút gọn từ ‘The Rose is known for its romantic symbolism’, bổ sung lý do hoa hồng nổi tiếng. To be known không tự nhiên ở đầu câu này; Was known tạo câu độc lập sai dấu; Knowing làm hoa hồng thành chủ thể biết điều gì."},{"number":28,"answer":"A","context":"The price of a rose depends on its type, but rare varieties like the Blue Rose can (28) ______ up to $15 per stem.","explanation":"Giải thích của cô: priceless: vô giá (nghĩa tốt)\nSau modal can dùng động từ nguyên mẫu cost; cấu trúc cost up to $15 per stem nói giá tối đa. Worth là tính từ và cần be worth; price/expense là danh từ nên không thể đứng trực tiếp sau can."},{"number":29,"answer":"D","context":"The Orchid is another beloved flower, (29) ______ over 25,000 species worldwide.","explanation":"With + cụm danh từ được dùng để bổ sung đặc điểm: ‘The Orchid ..., with over 25,000 species worldwide.’ For, to và about không thể giới thiệu số lượng loài theo cấu trúc này."},{"number":30,"answer":"A","context":"While you can't buy cherry blossoms directly, the experience of seeing the blooms during their short season is considered (30) ______ and often involves pricey travel and tour packages.","explanation":"Giải thích của cô: priceless: vô giá (nghĩa tốt)\nPriceless nghĩa là vô giá, quý đến mức không thể định giá; phù hợp với ‘the experience of seeing the blooms’ dù chuyến đi có thể đắt. Worthless và valueless mang nghĩa không có giá trị; costly chỉ đắt tiền, không diễn tả giá trị tinh thần của trải nghiệm."},{"number":31,"answer":"B","context":"Today, tulips are (31) ______ more affordable, but rare varieties can still be expensive, ranging from $10 to $20 per stem.","explanation":"Cấu trúc far + comparative dùng để nhấn mạnh mức độ: ‘tulips are far more affordable’ = hoa tulip rẻ hơn rất nhiều so với thời Tulip Mania. Lot cần ‘a lot’, too tạo nghĩa quá mức, most tạo so sánh nhất chứ không đi với more."},{"number":32,"answer":"A","context":"Native to the Philippines, its price can reach $200 per flower (32) ______ its scarcity and difficulty to cultivate.","explanation":"Giải thích của cô: cultivate (v) trồng trọt, canh tác\nDue to + cụm danh từ chỉ nguyên nhân: giá cao vì sự khan hiếm và khó canh tác. Despite tạo nhượng bộ trái nghĩa; according to là theo nguồn; resulting from đặt ở đây sẽ gắn lỏng lẻo và kém tự nhiên với mệnh đề giá."},{"number":33,"answer":"B","context":"These flowers not only captivate with their beauty but also come with a price, (33) ______ their rarity and cultural significance.","explanation":"Giải thích của cô: reflect (v) phản ánh\nSau dấu phẩy cần V-ing tạo mệnh đề phân từ chỉ điều mức giá thể hiện. ‘come with a price, reflecting their rarity and cultural significance’ nghĩa là giá phản ánh độ hiếm và ý nghĩa văn hóa. Presenting/providing không hợp quan hệ; increasing làm sai nghĩa."}]},{"exercise":4,"count":12,"inputKind":"text","choices":[],"instruction":"Ex 4: Fill in the blanks with ONE suitable word.","questions":[{"number":34,"answer":"being","context":"The global flower trade has become increasingly international, with flowers (34) __________ transported across great distances thanks to modern technology.","explanation":"Cấu trúc with + danh từ + being + past participle mô tả hành động bị động đang diễn ra: ‘with flowers being transported across great distances’. Flowers là đối tượng được vận chuyển, nên không thể dùng dạng chủ động."},{"number":35,"answer":"One","context":"(35) __________ of the leading countries in this industry is the Netherlands, which has dominated the market (36) __________ the 1970s, handling about 50% of the world's flower trade.","explanation":"Cấu trúc one of + danh từ số nhiều nghĩa là một trong số: ‘One of the leading countries in this industry is the Netherlands.’ Động từ is cũng phù hợp vì chủ ngữ trung tâm là One."},{"number":36,"answer":"since","context":"(35) __________ of the leading countries in this industry is the Netherlands, which has dominated the market (36) __________ the 1970s, handling about 50% of the world's flower trade.","explanation":"Thì hiện tại hoàn thành has dominated kết hợp với since + mốc bắt đầu ‘the 1970s’. Câu cho biết Hà Lan thống trị thị trường từ thập niên 1970 đến nay."},{"number":37,"answer":"the one / those","context":"The country’s auction houses, such as (37) __________ in Aalsmeer, are crucial hubs for flower sales, with thousands of flowers sold daily.","explanation":"Sau such as cần một đại từ thay cho auction house(s). The one chỉ nhà đấu giá cụ thể ở Aalsmeer; those có thể thay cho số nhiều auction houses nếu hiểu Aalsmeer có nhiều cơ sở. Cả hai cách điền nguồn chấp nhận đều tránh lặp danh từ."},{"number":38,"answer":"from","context":"The climate plays an essential role in flower cultivation, with countries like Ecuador benefiting (38) __________ favorable growing conditions, including predictable rainfall and long sunny days.","explanation":"Collocation benefit from something nghĩa là hưởng lợi từ điều gì. Ecuador hưởng lợi từ điều kiện canh tác thuận lợi, gồm lượng mưa dự đoán được và nhiều ngày nắng."},{"number":39,"answer":"making","context":"Ecuador’s flower industry, led by Mauricio Dávalos, has flourished in recent years, (39) __________ it a major exporter of roses to the United States.","explanation":"V-ing sau dấu phẩy diễn tả kết quả của mệnh đề trước: ngành hoa phát triển, qua đó biến Ecuador thành nước xuất khẩu hoa hồng lớn. Cấu trúc make + it + noun phrase tạo ‘making it a major exporter’."},{"number":40,"answer":"to","context":"The flower trade has also brought economic benefits and job opportunities (40) __________ the country.","explanation":"Bring something to a place/person là mang điều gì đến cho nơi/người đó. ‘brought economic benefits and job opportunities to the country’ nghĩa là đem lợi ích và việc làm đến cho đất nước."},{"number":41,"answer":"However","context":"(41) __________ , the global nature of the flower industry presents challenges.","explanation":"Đoạn trước nêu lợi ích kinh tế, còn đoạn này chuyển sang challenges, nên cần trạng từ tương phản However ở đầu câu. Dấu phẩy sau chỗ trống cũng đúng với cách dùng trạng từ nối này."},{"number":42,"answer":"like / in","context":"Local flower businesses in places (42) __________ the United States face stiff competition from international companies, (43) __________ has led to the closure of some local shops.","explanation":"Places like the United States hiểu là những thị trường/quốc gia như Hoa Kỳ; places in the United States hiểu là các địa phương nằm trong Hoa Kỳ. Cả like và in đều tạo câu đúng ngữ pháp, nhưng thay đổi phạm vi quy chiếu."},{"number":43,"answer":"which","context":"Local flower businesses in places (42) __________ the United States face stiff competition from international companies, (43) __________ has led to the closure of some local shops.","explanation":"Sau dấu phẩy cần đại từ quan hệ không xác định which, quy chiếu tới tình trạng cạnh tranh quốc tế ở mệnh đề trước: tình trạng ấy đã làm một số cửa hàng địa phương đóng cửa. That không dùng trong mệnh đề không xác định sau dấu phẩy."},{"number":44,"answer":"As / When","context":"(44) __________ the industry becomes more interconnected, small businesses must adapt or risk being overtaken by larger players, illustrating the far-reaching impact of global trade (45) __________ local economies.","explanation":"As hoặc When đều có thể mở mệnh đề thời gian: khi/trong lúc ngành ngày càng liên kết, doanh nghiệp nhỏ phải thích nghi. As nhấn mạnh hai quá trình diễn ra song song; When chỉ thời điểm/điều kiện xảy ra."},{"number":45,"answer":"on","context":"(44) __________ the industry becomes more interconnected, small businesses must adapt or risk being overtaken by larger players, illustrating the far-reaching impact of global trade (45) __________ local economies.","explanation":"Collocation impact on something nghĩa là tác động lên/đối với điều gì. Cụm hoàn chỉnh ‘the far-reaching impact of global trade on local economies’ nói ảnh hưởng rộng của thương mại toàn cầu tới kinh tế địa phương."}]},{"exercise":5,"count":16,"inputKind":"mcq","choices":["A","B","C","D"],"instruction":"Ex 5: Read the following passages and answer the questions.","questions":[{"number":46,"answer":"C","context":"merchant (n) thương buôn, thương lái","explanation":"Giải thích của cô: merchant (n) thương buôn, thương lái\nCâu đầu cho biết merchant class mở rộng thì nghề kim hoàn bạc và đồng phát triển để phục vụ họ; bài còn nói silversmith có liên hệ trực tiếp với các thương nhân thịnh vượng. Vì vậy C đúng. Chi phí bạc, lò nung mới và công cụ mới không được nêu là nguyên nhân."},{"number":47,"answer":"A","context":"artisan (n) nghệ nhân","explanation":"Giải thích của cô: artisan (n) nghệ nhân\nTrong ‘in the eighteenth century they could be found in all major colonial cities’, tiền ngữ hợp nghĩa là silversmiths ở câu trước. Major colonial cities là nơi họ được tìm thấy, còn artisans và materials không phải chủ thể đang được theo dõi."},{"number":48,"answer":"D","context":"Từ \"exalted\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"exalted\" gần nghĩa nhất với từ nào?\nExalted status là địa vị cao quý/cao hơn người khác, gần nhất với superior (D). Unusual là khác thường, uncertain là không chắc, surprising là gây ngạc nhiên; chúng không thể hiện uy thế xã hội của thợ bạc."},{"number":49,"answer":"D","context":"Ở thời thuộc địa Mỹ, thợ bạc thường lấy nguyên liệu làm đồ bạc từ đâu?","explanation":"Giải thích của cô: Ở thời thuộc địa Mỹ, thợ bạc thường lấy nguyên liệu làm đồ bạc từ đâu?\nBài nói rõ ‘Customers generally secured the silver for the silver objects they ordered’ rồi mang tiền xu tới thợ. Vì vậy vật liệu thường đến từ customers (D), không phải mỏ, nhà nhập khẩu hay thợ bạc khác."},{"number":50,"answer":"B","context":"Từ \"ingots\" ám chỉ cái gì?","explanation":"Giải thích của cô: Từ \"ingots\" ám chỉ cái gì?\nThợ nung chảy tiền, thêm đồng tạo hợp kim và đúc thành ‘rectangular blocks’; câu sau gọi chính các khối này là ingots. Vì vậy B đúng. Chúng không phải tiền xu ban đầu, công cụ hay khuôn đúc."},{"number":51,"answer":"A","context":"Cụm từ \"came of age\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Cụm từ \"came of age\" gần nghĩa nhất với từ nào?\nTrong ngữ cảnh nghề coppersmithing đầu thế kỷ XVIII, came of age nghĩa là trưởng thành và tự xác lập như một ngành nghề, gần nhất với established itself (A). Đoạn còn nói nó prospered, nên declined trái nghĩa; hai lựa chọn còn lại không phù hợp."},{"number":52,"answer":"C","context":"Bài viết nhắc đến tất cả các công dụng của đồng NGOẠI TRỪ làm?","explanation":"Giải thích của cô: Bài viết nhắc đến tất cả các công dụng của đồng NGOẠI TRỪ làm?\nBài nêu đồng dùng làm pots and kettles, brass cho maritime instruments và scientific instruments. Không có musical instruments, nên C là đáp án EXCEPT; A, B và D đều là công dụng được nêu trực tiếp."},{"number":53,"answer":"B","context":"prestige (n) uy tín","explanation":"Giải thích của cô: prestige (n) uy tín\nBài nói thợ đồng ‘shaped it in much the same manner as silver’, nên hai nghề giống nhau ở cách tạo hình kim loại (B). Uy tín, giá thành và tính thực dụng không được mô tả là tương đương; thợ bạc có prestige đặc biệt còn đồng chủ yếu làm vật dụng thực tế."},{"number":54,"answer":"C","context":"Điều nào sau đây có khả năng đúng về đồng ở các thuộc địa?","explanation":"Giải thích của cô: Điều nào sau đây có khả năng đúng về đồng ở các thuộc địa?\n‘Virtually all copper’ được nhập dưới dạng tấm hoặc lấy từ đồ đồng cũ tái chế. Từ đó có thể suy ra không có nguồn mỏ đồng địa phương đáng kể để khai thác, nên C hợp lý. A trái với khả năng dẫn nhiệt tốt; B và D không có bằng chứng."},{"number":55,"answer":"C","context":"Đoạn văn chủ yếu thảo luận về điều gì?","explanation":"Giải thích của cô: Đoạn văn chủ yếu thảo luận về điều gì?\nBài phân loại cơ chế phòng vệ thực vật thành thụ động/chủ động rồi giải thích hàng rào vật lý, hóa chất và phản ứng quá mẫn hoạt động ra sao. Vì vậy C bao quát nhất; A đảo trọng tâm sang ký sinh trùng, B chỉ câu cuối, D chỉ một phép so sánh ngắn."},{"number":56,"answer":"A","context":"Cụm từ \"subject to\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Cụm từ \"subject to\" gần nghĩa nhất với từ nào?\n‘Plants are subject to attack and infection’ nghĩa là thực vật dễ/có nguy cơ bị tấn công và nhiễm bệnh, tương đương susceptible to (A). Classified by, attractive to và strengthened by không phù hợp với mối đe dọa được mô tả."},{"number":57,"answer":"B","context":"Từ \"which\" ám chỉ cái gì?","explanation":"Giải thích của cô: Từ \"which\" ám chỉ cái gì?\nTrong danh sách ‘toxic or potentially toxic substances, such as resins, tannins, glycosides, and alkaloids, many of which ...’, which thay cho substances vừa được liệt kê. Tissues, barriers và insects không phải tiền ngữ của cấu trúc many of."},{"number":58,"answer":"D","context":"Chất nào được tác giả đề cập là không nhất thiết gây độc cho bọ cánh cứng khoai tây Colorado?","explanation":"Giải thích của cô: Chất nào được tác giả đề cập là không nhất thiết gây độc cho bọ cánh cứng khoai tây Colorado?\nBài nói loài bọ này thành công khi phá khoai tây vì có ‘high tolerance to alkaloids’ vốn thường xua sâu hại. Do đó alkaloids (D) không nhất thiết độc/hiệu quả với Colorado beetle; ba chất còn lại không được gắn cụ thể với khả năng chịu đựng của nó."},{"number":59,"answer":"C","context":"Tại sao tác giả lại nhắc đến \"glycoproteins\"?","explanation":"Giải thích của cô: Tại sao tác giả lại nhắc đến \"glycoproteins\"?\nGlycoproteins trong thành tế bào có thể vô hiệu hóa enzyme phá thành tế bào; đây là ví dụ cụ thể về hóa chất phòng vệ ức chế một bước thiết yếu của ký sinh. Vì vậy C đúng, không phải phép so với miễn dịch động vật hay ví dụ về hàng rào vật lý."},{"number":60,"answer":"A","context":"Từ \"dramatic\" có thể được thay thế tốt nhất bởi từ nào?","explanation":"Giải thích của cô: Từ \"dramatic\" có thể được thay thế tốt nhất bởi từ nào?\nTrong ‘the most dramatic example’, dramatic nghĩa là nổi bật, gây ấn tượng mạnh, gần nhất với striking (A). Accurate và consistent nói độ chính xác/nhất quán; appealing là hấp dẫn, không đúng sắc thái phản ứng quá mẫn dữ dội."},{"number":61,"answer":"D","context":"Đoạn văn có khả năng cao sẽ tiếp tục thảo luận về các lý thuyết của?","explanation":"Giải thích của cô: Đoạn văn có khả năng cao sẽ tiếp tục thảo luận về các lý thuyết của?\nCâu cuối nêu ‘Several theories have been put forward to explain the basis of hypersensitive resistance.’ Theo mạch văn, phần sau sẽ trình bày các nguyên lý/cơ sở của phản ứng quá mẫn (D), không quay lại phòng vệ thụ động hay hóa chất đã nói ở trước."}]}]}</script>

  <script>/* RI2 grading is deliberately deterministic: only approved keys and explicit

  const own = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
  const cardinalWord = word => own(SMALL, word) || own(TENS, word) || own(SCALES, word) || word === "hundred";
  const numericWord = word => cardinalWord(word) || own(ORDINALS, word);

    if (typeof value === "string") return value;
    if (typeof value === "number" && Number.isFinite(value)) return String(value);

    return inputText(value).normalize("NFKC").toLowerCase()
      .replace(/[\u200B-\u200D\uFEFF\u00AD]/g, "")
      .replace(/[‘’‛ʼ′]/g, "'")
      .replace(/[‐‑‒–—―−]/g, "-")
      .replace(/\s+/g, " ").trim();

  }

  function policyFor(expected, question) {
    const text = basicText(expected);
    const timeText = meridiem(text);
    const time = /\bo\s*'?\s*clock\b/.test(timeText) ? "oclock"
      : /(?<![a-z])[ap]m(?![a-z])/.test(timeText) ? "meridiem"

    const quantity = text.replace(/^(?:at least|more than|less than|nearly|about|approximately|over|under|up to|around)\s+/, "");
    const words = quantity.replace(/-/g, " ").split(/\s+/);
    let length = 0;
    while (length < words.length && (numericWord(words[length]) || words[length] === "and")) length += 1;
    const qualifier = quantity !== text;
    const grammaticalTail = /^(?:of|that|which|who|whom|to|by|with|for|as|than)$/;

    return { numbers, time, degrees: /°|º|˚|\bdegrees\b/.test(inputText(expected).toLowerCase()) };

  function surface(value, policy) {

      .replace(/%/g, " percent ")
      .replace(/\bper\s+cent\b/g, "percent")
      .replace(/\s*\/\s*/g, "/")
      .replace(/\s*,\s*/g, ", ");
    if (policy.time === "oclock") text = text.replace(/\bo\s*'?\s*clock\b/g, "oclock");
    return text.replace(/\s+/g, " ").trim();
  }

  function parseCardinal(words) {
    let total = 0, group = 0, previous = "start", previousSmall = -1, lastScale = Infinity;
    for (const word of words) {

          : !["start", "hundred", "scale", "and"].includes(previous)) return null;

      } else if (own(TENS, word)) {
        if (!["start", "hundred", "scale", "and"].includes(previous)) return null;

      } else if (word === "hundred") {
        if (previous !== "small" || previousSmall < 1 || previousSmall > 9 || group > 9) return null;

  function parseWords(words) {

      : parseCardinal(words.slice(0, -1).concat(cardinal));

  function numberWords(value) {
    const tokens = value.match(/[a-z]+|\d+|[^a-z\d]+/g) || [];

      while (candidates.length < 64 && cursor + 1 < tokens.length && /^\s+$/.test(tokens[cursor]) && (numericWord(tokens[cursor + 1]) || tokens[cursor + 1] === "and")) {

      }

  function clock(value, mode) {

    }
    const toggles = node("div", "review-toggle");
    const wrongButton = node("button", reviewMode === "wrong" ? "active" : "", "CÂU SAI (" + grade.wrong.length + ")");
    wrongButton.type = "button";
    wrongButton.hidden = grade.wrong.length === 0;
    wrongButton.setAttribute("aria-pressed", String(reviewMode === "wrong"));
    wrongButton.addEventListener("click", () => setReviewMode("wrong"));
    const allButton = node("button", reviewMode === "all" ? "active" : "", "TẤT CẢ (" + grade.total + ")");
    allButton.type = "button";
    allButton.setAttribute("aria-pressed", String(reviewMode === "all"));
    allButton.addEventListener("click", () => setReviewMode("all"));
    toggles.append(wrongButton, allButton);
    box.appendChild(toggles);
    target.appendChild(box);
  }

  function renderDelivery() {
    const target = $("delivery-status");
    target.replaceChildren();
    const pending = !!attempt && ["sending", "pending"].includes(attempt.delivery && attempt.delivery.state);
    $("new-attempt").disabled = pending;
    $("new-attempt").textContent = pending ? "ĐANG LƯU ĐIỂM…" : "LÀM MỘT LƯỢT MỚI ↻";
    const state = attempt.delivery && attempt.delivery.state;
    target.hidden = !attempt || !attempt.submittedAt || !["unconfirmed", "not-configured", "test-mode"].includes(state);
    if (target.hidden) return;
    const messages = {
      unconfirmed: ["Chưa lưu được điểm", "Vui lòng kiểm tra mạng hoặc báo giáo viên."],
      "not-configured": ["Chưa lưu được điểm", "Vui lòng báo giáo viên."],
      "test-mode": ["CHẾ ĐỘ KIỂM THỬ — không ghi điểm", ""]
    };
    const message = messages[state] || messages.unconfirmed;
    target.className = "delivery" + (["unconfirmed", "not-configured"].includes(state) ? " is-warning" : "");
    target.appendChild(node("strong", "", message[0]));
    if (message[1]) target.appendChild(node("span", "", message[1]));
  }

  async function withSubmissionLock(action) {
    if (navigator.locks && typeof navigator.locks.request === "function") {
      let actionStarted = false;
      try {
        return await navigator.locks.request(storageBase + ":submit:" + attempt.id, { mode: "exclusive" }, () => {
          actionStarted = true;
          return action();
        });
      } catch (error) {
        if (actionStarted) throw error;
        // Some embedded/partitioned contexts expose Web Locks but reject access.
        return action();
      }
    }
    return action();
  }

  async function submitAttempt(event) {
    event.preventDefault();
    if (!attempt || attempt.submittedAt || submitting) return;
    $("form-error").hidden = true;
    if (answeredCount() !== questions.length) {
      $("form-error").textContent = "Bạn cần trả lời đủ toàn bộ câu trước khi chấm bài.";
      $("form-error").hidden = false;
      const missing = questions.find((question) => !plainText(attempt.answers[String(question.number)]));
      const input = missing && $("answer-" + missing.number);
      if (input) input.focus();
      return;
    }
    submitting = true;
    renderAnswers();
    let shouldSend = false;
    try {
      shouldSend = await withSubmissionLock(() => {
        const saved = readStorage(attemptKey(attempt.id));
        if (validStoredAttempt(saved) && saved.submittedAt) {
          attempt = saved;
          if (["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) attempt.delivery = { state: "unconfirmed", reason: "already-submitted" };
          return false;
        }
        const grade = globalThis.RI2Grading.gradeAttempt(unit, attempt.answers);
        if (!grade.complete) throw new Error("incomplete");
        attempt.grade = grade;
        attempt.submittedAt = new Date().toISOString();
        attempt.delivery = { state: "sending", attemptedAt: attempt.submittedAt };
        persist();
        return true;
      });
    } catch (_) {
      $("form-error").textContent = "Chưa thể chấm bài. Các câu trả lời vẫn được giữ; vui lòng kiểm tra lại hoặc báo giáo viên.";
      $("form-error").hidden = false;
    } finally {
      submitting = false;
      renderAnswers();
      if (attempt.submittedAt) {
        $("answer-scroll").scrollTop = 0;
        $("answer-scroll").focus({ preventScroll: true });
      }
    }
    if (shouldSend) await sendScore(attempt.id);
  }

  function configuredFormSink() {
    if (course.testing === true) return null;
    const sink = course.scoreSink;
    if (!sink || sink.kind !== "google-form" || !sink.entries || typeof sink.formResponseUrl !== "string") return null;
    try {
      const url = new URL(sink.formResponseUrl);
      if (url.protocol !== "https:" || url.hostname !== "docs.google.com" || !/^\/forms\/d\/(?:e\/)?[^/]+\/formResponse\/?$/.test(url.pathname)) return null;
      const required = ["name", "total", "assignmentCode", "lesson", "activity", "className", "percent", "score", "wrong"];
      if (required.some((field) => !/^entry\.\d+$/.test(sink.entries[field] || ""))) return null;
      return sink;
    } catch (_) { return null; }
  }

  function scoreBody(sink, snapshot) {
    const grade = snapshot.grade;
    const values = {
      name: snapshot.identity.name,
      className: snapshot.identity.className,
      total: String(grade.total),
      assignmentCode: plainText(unit.testCode),
      lesson: unitLabel(),
      activity: "Làm lại đề · Lượt " + snapshot.number + " · Mã lượt " + snapshot.id + " · " + snapshot.submittedAt,
      percent: String(grade.percent),
      score: String(grade.score),
      wrong: grade.wrong.length ? grade.wrong.map((result) => "Câu " + result.number + ": " + plainText(result.actual) + " → " + plainText(result.answer)).join("\n") : "Không có câu sai"
    };
    const body = new URLSearchParams();
    Object.keys(values).forEach((field) => body.set(sink.entries[field], values[field]));
    // Only use additional form mappings when explicitly supplied by the course configuration.
    const optional = { attemptId: snapshot.id, attemptNumber: String(snapshot.number), submittedAt: snapshot.submittedAt, startedAt: snapshot.startedAt };
    Object.keys(optional).forEach((field) => { if (/^entry\.\d+$/.test(sink.entries[field] || "")) body.set(sink.entries[field], optional[field]); });
    return body;
  }

  async function sendScore(id) {
    if (!attempt || attempt.id !== id || !attempt.submittedAt) return;
    if (course.testing === true) {
      attempt.delivery = { state: "test-mode" };
      persist();
      renderDelivery();
      return;
    }
    const sink = configuredFormSink();
    if (!sink) {
      attempt.delivery = { state: "not-configured" };
      persist();
      renderDelivery();
      return;
    }
    const snapshot = JSON.parse(JSON.stringify(attempt));
    const controller = typeof AbortController === "function" ? new AbortController() : null;
    const timeout = controller ? setTimeout(() => controller.abort(), 25000) : null;
    try {
      // Google Forms is intentionally no-cors: an opaque response is NOT a storage confirmation.
      await fetch(sink.formResponseUrl, { method: "POST", mode: "no-cors", credentials: "omit", body: scoreBody(sink, snapshot), ...(controller ? { signal: controller.signal } : {}) });
      snapshot.delivery = { state: "sent-unverified", attemptedAt: snapshot.delivery.attemptedAt, requestFinishedAt: new Date().toISOString() };
    } catch (_) {
      snapshot.delivery = { state: "unconfirmed", attemptedAt: snapshot.delivery.attemptedAt, reason: "network" };
    } finally {
      if (timeout !== null) clearTimeout(timeout);
    }
    try { localStorage.setItem(attemptKey(id), JSON.stringify(snapshot)); } catch (_) { storageAvailable = false; }
    if (attempt && attempt.id === id) {
      attempt.delivery = snapshot.delivery;
      persist();
      renderDelivery();
    }
  }

  function startNewAttempt() {
    if (!attempt || !attempt.submittedAt || submitting || ["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) return;
    attempt = createAttempt(Number(attempt.number || 1) + 1);
    reviewMode = "wrong";
    persist({ makeCurrent: true });
    $("form-error").hidden = true;
    renderAnswers();
    $("answer-scroll").scrollTop = 0;
    const first = questions[0] && $("answer-" + questions[0].number);
    if (first) first.focus({ preventScroll: true });
  }

  function receiveStorageUpdate(event) {
    if (!attempt || !storageBase || event.key !== attemptKey(attempt.id) || !event.newValue) return;
    try {
      const saved = JSON.parse(event.newValue);
      if (!validStoredAttempt(saved) || !saved.submittedAt) return;
      attempt = saved;
      if (["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) attempt.delivery = { state: "unconfirmed", reason: "another-tab" };
      renderAnswers();
    } catch (_) { /* Ignore unrelated or incomplete browser-storage events. */ }
  }

  initialize();
}());
</script>
