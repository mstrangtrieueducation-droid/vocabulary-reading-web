<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vocabulary Foundation 1</title>
  <style>
    :root{--ink:#17302f;--muted:#64726f;--teal:#1f675f;--teal2:#174d48;--soft:#e8f2ee;--ivory:#f4f2ec;--line:#d5dfdb;--white:#fff;--red:#a64035;--redbg:#fff0ed;--green:#277154;--greenbg:#eaf6ef;--font:Arial,"Segoe UI",Roboto,"Noto Sans",sans-serif}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:hidden;background:var(--ivory);color:var(--ink);font-family:var(--font)}
    button,input,select{font-family:var(--font);font-size:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(31,103,95,.22);outline-offset:2px}
    [hidden]{display:none!important}
    .frame{height:100%;padding:10px;display:grid;grid-template-rows:64px minmax(0,1fr);gap:10px}
    .topbar{min-width:0;padding:8px 14px;display:flex;align-items:center;gap:18px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.96);box-shadow:0 7px 22px rgba(20,55,51,.06)}
    .brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
    .brand-badge{display:grid;width:40px;height:40px;place-items:center;border-radius:50%;background:var(--teal);color:#fff;font-size:14px;font-weight:800}
    .brand-copy{display:grid;gap:2px}
    .brand-copy strong{font-size:17px;line-height:1.05}
    .eyebrow,.student span,.progress span,.gate label>span,.sheet-title,.saved{color:var(--teal);font-size:10px;font-weight:800;line-height:1.2;letter-spacing:.04em}
    .student{min-width:0;margin-left:auto;display:grid;text-align:right}
    .student strong{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
    .student small{color:var(--muted);font-size:11px}
    .progress{width:min(320px,28vw);display:grid;gap:6px}
    .progress>div{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
    .progress strong{color:var(--teal);font-size:20px}
    .track{height:8px;overflow:hidden;border-radius:99px;background:#dde7e3}
    .track i{display:block;width:0;height:100%;border-radius:inherit;background:var(--teal);transition:width .2s ease}
    .workspace{min-width:0;min-height:0;display:grid;grid-template-columns:minmax(0,1.42fr) minmax(440px,.9fr);gap:10px}
    .workspace.is-gated{grid-template-columns:minmax(0,1fr)}
    .workspace.is-gated .right-pane{width:100%}
    .doc-pane,.right-pane{min-width:0;min-height:0;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 12px 32px rgba(20,55,51,.08);overflow:hidden}
    .doc-pane{display:grid;grid-template-rows:42px minmax(0,1fr)}
    .doc-head{padding:0 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#f7faf8;color:var(--teal);font-size:10px;font-weight:800;letter-spacing:.04em}
    .doc-head a{color:var(--teal);text-decoration:none}
    .doc-pane iframe{width:100%;height:100%;border:0;background:#fff}
    .right-pane{position:relative}
    .gate{height:100%;padding:clamp(22px,4vw,50px);display:flex;flex-direction:column;justify-content:center}
    .gate .kicker{margin:0 0 9px;color:var(--teal);font-size:11px;font-weight:800;letter-spacing:.04em}
    .gate h1{margin:0 0 10px;font-size:clamp(28px,2.4vw,38px);font-weight:800;line-height:1.08;letter-spacing:-.02em}
    .gate>p{margin:0 0 24px;color:var(--muted);font-size:14px;line-height:1.55}
    .gate label{display:grid;gap:8px;margin-bottom:14px}
    .gate input,.gate select{width:100%;height:56px;padding:0 15px;border:1px solid #c7d4cf;border-radius:10px;background:#fff;color:var(--ink);font-size:17px}
    .primary{min-height:52px;padding:0 18px;border:0;border-radius:10px;background:var(--teal);color:#fff;font-size:11px;font-weight:800;letter-spacing:.03em}
    .primary:hover{background:var(--teal2)}
    .primary:disabled{cursor:not-allowed;opacity:.55}
    .gate .primary{width:100%;margin-top:4px}
    .notice{margin:0 0 13px;padding:10px 12px;border:1px solid #efc4bc;border-radius:9px;background:var(--redbg);color:var(--red);font-size:12px;font-weight:700;line-height:1.4}
    .sheet{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
    .tabs{padding:9px;display:flex;gap:5px;overflow-x:auto;border-bottom:1px solid var(--line);background:#f7faf8;scrollbar-width:thin}
    .tabs button{flex:1 0 58px;height:42px;border:1px solid #cedad5;border-radius:9px;background:#fff;color:var(--muted);font-size:10px;font-weight:800}
    .tabs button.active{border-color:var(--teal);background:var(--teal);color:#fff}
    .tabs button.done:after{margin-left:4px;content:"✓";color:var(--green)}
    .tabs button.active.done:after{color:#fff}
    .sheet-head{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .sheet-head h2{margin:4px 0 0;font-size:25px;line-height:1;font-weight:800}
    .sheet-head>b{padding:6px 9px;border-radius:99px;background:var(--soft);color:var(--teal);font-size:11px}
    .rows{min-height:0;padding:11px 12px 18px;display:grid;align-content:start;gap:9px;overflow-y:auto;overscroll-behavior:contain;scrollbar-color:#aac1b8 transparent;scrollbar-width:thin}
    .answer-row{min-height:64px;display:grid;grid-template-columns:56px minmax(0,1fr);align-items:stretch;border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden}
    .answer-row.answered{border-color:#9fc6b7;box-shadow:0 0 0 2px rgba(31,103,95,.05)}
    .qnum{display:grid;place-items:center;border-right:1px solid var(--line);background:var(--soft);color:var(--teal);font-size:21px;font-weight:800}
    .answer-row input,.answer-row select{width:calc(100% - 20px);height:48px;margin:8px 10px;padding:0 14px;border:1px solid #c7d4cf;border-radius:8px;background:#fbfdfc;color:var(--ink);font-size:18px}
    .answer-row input:focus,.answer-row select:focus{border-color:var(--teal);background:#fff;outline:0;box-shadow:0 0 0 3px rgba(31,103,95,.1)}
    .letters{padding:8px 10px;display:grid;grid-template-columns:repeat(var(--choice-count,4),minmax(38px,1fr));gap:6px}
    .letters button{height:48px;border:1px solid #cbd8d3;border-radius:8px;background:#fbfdfc;color:var(--teal);font-weight:800}
    .letters button.selected{border-color:var(--teal);background:var(--teal);color:#fff}
    .sheet-foot{padding:9px 11px;display:flex;align-items:center;gap:7px;border-top:1px solid var(--line);background:#fff;box-shadow:0 -6px 18px rgba(20,55,51,.04)}
    .saved{margin-right:auto}
    .sheet-foot button{min-height:44px;padding:0 13px;border:1px solid #c8d5d0;border-radius:8px;background:#fff;color:var(--teal);font-size:10px;font-weight:800}
    .sheet-foot button:disabled{cursor:not-allowed;opacity:.35}
    .sheet-foot .grade{border-color:var(--teal);background:var(--teal);color:#fff}
    .result{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
    .result-head{padding:18px;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:15px;border-bottom:1px solid var(--line)}
    .score{display:flex;align-items:baseline;color:var(--teal)}
    .score strong{font-size:48px;line-height:1;font-weight:800}
    .score span{color:var(--muted);font-size:19px;font-weight:700}
    .result-head h2{margin:2px 0 5px;font-size:22px;font-weight:800}
    .result-head p{margin:0;color:var(--muted);font-size:12px}
    .sync{margin-top:5px;color:var(--green);font-size:11px;font-weight:700}
    .sync.error{color:var(--red)}
    .review-tools{padding:11px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);background:#f7faf8}
    .wrong-list{margin:0;color:var(--red);font-size:12px;line-height:1.5}
    .wrong-list strong{display:block;margin-bottom:2px;font-size:10px;letter-spacing:.04em}
    .review-filters{display:flex;gap:6px;flex:0 0 auto}
    .review-filters button{min-height:36px;padding:0 11px;border:1px solid #c8d5d0;border-radius:8px;background:#fff;color:var(--teal);font-size:10px;font-weight:800}
    .review-filters button.active{border-color:var(--teal);background:var(--teal);color:#fff}
    .reviews{min-height:0;padding:11px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;scrollbar-gutter:stable}
    .review{flex:0 0 auto;display:grid;grid-template-columns:64px minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
    .review.wrong{border-color:#ecc6bf}
    .review-num{padding:12px 4px;display:grid;align-content:start;justify-items:center;gap:6px;border-right:1px solid var(--line);background:var(--greenbg);color:var(--green)}
    .review.wrong .review-num{background:var(--redbg);color:var(--red)}
    .review-num strong{font-size:22px;font-weight:800}
    .review-num span{font-size:9px;font-weight:800}
    .review-body{padding:14px 15px}
    .review-answers{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;color:var(--muted);font-size:14px;line-height:1.45}
    .review-answers b{color:var(--ink)}
    .review-answers .correct{color:var(--green);font-size:16px}
    .explain{margin:12px 0 0;padding:12px 13px;border-left:4px solid var(--teal);background:var(--soft);color:#263f3c;font-size:14px;line-height:1.65}
    .explain strong{display:block;margin-bottom:5px;color:var(--teal);font-size:11px;letter-spacing:.05em}
    .explain p{margin:0}
    .result-foot{padding:10px 12px;display:grid;grid-template-columns:1fr;gap:8px;border-top:1px solid var(--line);background:#fff}
    .secondary{min-height:52px;padding:0 14px;border:1px solid #c8d5d0;border-radius:10px;background:#fff;color:var(--teal);font-size:10px;font-weight:800}
    @media(max-width:850px){
      html,body{height:auto;min-height:100%;overflow:auto}
      .frame{height:auto;min-height:100vh;grid-template-rows:auto auto}
      .topbar{flex-wrap:wrap}
      .student{order:3;width:100%;margin:0;text-align:left}
      .progress{margin-left:auto;width:45%}
      .workspace{grid-template-columns:1fr}
      .doc-pane{height:58vh;min-height:430px}
      .right-pane{height:78vh;min-height:620px}
    }
    @media(max-width:520px){
      .frame{padding:6px;gap:6px}
      .brand-copy strong{font-size:14px}.eyebrow{font-size:8px}
      .progress{width:100%}
      .workspace{gap:6px}
      .doc-pane{height:52vh}
      .right-pane{height:82vh}
      .gate{padding:24px 16px}
      .tabs{padding:6px;gap:3px}
      .tabs button{height:39px;font-size:9px}
      .sheet-head{padding:12px}
      .rows{padding:8px;gap:7px}
      .answer-row{grid-template-columns:48px minmax(0,1fr)}
      .saved{display:none}
      .sheet-foot button{flex:1;padding:0 8px}
      .review-tools{align-items:stretch;flex-direction:column}
      .review-filters button{flex:1}
      .result-foot{grid-template-columns:1fr}
    }
  </style>

displayAnswer":"player","explanation":"Thiết bị dùng để phát đĩa là “a record player”; vì “record” đã có sẵn nên chỉ điền “player”."},{"globalNumber":5,"exerciseNumber":1,"localNumber":5,"acceptedAnswers":["musicians"],"displayAnswer":"musicians","explanation":"Câu nói đến những người nhận xét về âm thanh; MUSIC đổi thành danh từ chỉ người số nhiều “musicians”."},{"globalNumber":6,"exerciseNumber":1,"localNumber":6,"acceptedAnswers":["collectors"],"displayAnswer":"collectors","explanation":"Sau “many” cần danh từ số nhiều chỉ những người sưu tầm đĩa: COLLECT → collector → collectors."},{"globalNumber":7,"exerciseNumber":1,"localNumber":7,"acceptedAnswers":["entertainment"],"displayAnswer":"entertainment","explanation":"Cụm “a form of” cần một danh từ; ENTERTAIN đổi thành danh từ “entertainment”."},{"globalNumber":8,"exerciseNumber":1,"localNumber":8,"acceptedAnswers":["childhood"],"displayAnswer":"childhood","explanation":"Sau tính từ sở hữu “their” cần danh từ; “childhood” chỉ quãng thời gian thơ ấu mà họ nhớ lại."},{"globalNumber":9,"exerciseNumber":2,"localNumber":1,"acceptedAnswers":["is crazy about"],"displayAnswer":"is crazy about","explanation":"“Be crazy about + danh từ” nghĩa là cực kỳ yêu thích điều gì, tương đương “really likes”."},{"globalNumber":10,"exerciseNumber":2,"localNumber":2,"acceptedAnswers":["was a sailor","was a seaman","was working on a sailboat","was working aboard a sailboat"],"displayAnswer":"was a sailor","explanation":"Người làm việc trên thuyền buồm có thể được gọi là “a sailor/a seaman”. Cũng có thể viết lại sát câu gốc bằng “was working on/aboard a sailboat”; các cách này đều dùng từ WAS và không vượt quá năm từ."},{"globalNumber":11,"exerciseNumber":2,"localNumber":3,"acceptedAnswers":["feel like watching"],"displayAnswer":"feel like watching","explanation":"“Feel like + V-ing” nghĩa là muốn làm gì; vì vậy “want to watch” được đổi thành “feel like watching”."},{"globalNumber":12,"exerciseNumber":2,"localNumber":4,"acceptedAnswers":["took part"],"displayAnswer":"took part","explanation":"“Take part in” đồng nghĩa với “participate in”. Sự việc xảy ra tuần trước nên “take” đổi sang quá khứ “took”."},{"globalNumber":13,"exerciseNumber":2,"localNumber":5,"acceptedAnswers":["a game of tennis against","a tennis game against","a tennis match against"],"displayAnswer":"a game of tennis against","explanation":"Mẫu “have a game of tennis against someone” diễn tả chơi một trận quần vợt với/đấu với người đó."},{"globalNumber":14,"exerciseNumber":2,"localNumber":6,"acceptedAnswers":["used to play"],"displayAnswer":"used to play","explanation":"“Used to + động từ nguyên mẫu” diễn tả thói quen thường xuyên trong quá khứ nhưng nay không còn như trước."},{"globalNumber":15,"exerciseNumber":2,"localNumber":7,"acceptedAnswers":["really interested in","very interested in","particularly interested in","much interested in","that interested in"],"displayAnswer":"really interested in","explanation":"“Be interested in” nghĩa là quan tâm/hứng thú với. Sau “I’m not”, really, very, particularly, much hoặc that đều có thể diễn đạt tự nhiên ý “không thực sự/không mấy hứng thú”; đáp án mẫu là “really interested in”."},{"globalNumber":16,"exerciseNumber":2,"localNumber":8,"acceptedAnswers":["had fun"],"displayAnswer":"had fun","explanation":"“Have fun” nghĩa là vui vẻ, tận hưởng. Câu gốc ở quá khứ nên dùng “had fun”."},{"globalNumber":17,"exerciseNumber":2,"localNumber":9,"acceptedAnswers":["is popular with","is popular among","is popular amongst"],"displayAnswer":"is popular with","explanation":"“Be popular with/among/amongst + nhóm người” đều diễn tả được nhóm người đó yêu thích; ở đây là trẻ nhỏ."},{"globalNumber":18,"exerciseNumber":2,"localNumber":10,"acceptedAnswers":["isn't keen on","is not keen on","isn’t keen on"],"displayAnswer":"isn't keen on","explanation":"“Be keen on + V-ing” nghĩa là thích làm gì; phủ định “isn't keen on watching” tương đương “doesn't like watching”."},{"globalNumber":19,"exerciseNumber":3,"localNumber":1,"acceptedAnswers":["B"],"displayAnswer":"B — To win against someone in a game.","explanation":"“Beat someone” nghĩa là đánh bại/thắng một người trong trò chơi hoặc trận đấu."},{"globalNumber":20,"exerciseNumber":3,"localNumber":2,"acceptedAnswers":["F"],"displayAnswer":"F — To act unfairly to win or get something.","explanation":"“Cheat” là gian lận, tức hành động không công bằng để giành chiến thắng hoặc đạt được điều gì."},{"globalNumber":21,"exerciseNumber":3,"localNumber":3,"acceptedAnswers":["I"],"displayAnswer":"I — A person who makes sure a game is played fairly.","explanation":"“Referee” là trọng tài, người giám sát để trận đấu diễn ra đúng luật và công bằng."},{"globalNumber":22,"exerciseNumber":3,"localNumber":4,"acceptedAnswers":["A"],"displayAnswer":"A — A person who plays sports.","explanation":"“Athlete” là vận động viên, tức người luyện tập hoặc thi đấu thể thao."},{"globalNumber":23,"exerciseNumber":3,"localNumber":5,"acceptedAnswers":["J"],"displayAnswer":"J — Trying hard to win or be the best.","explanation":"“Competitive” miêu tả người luôn cố gắng giành chiến thắng hoặc trở thành người giỏi nhất."},{"globalNumber":24,"exerciseNumber":3,"localNumber":6,"acceptedAnswers":["D"],"displayAnswer":"D — To plan or manage an event or activity.","explanation":"“Organize” nghĩa là lên kế hoạch, sắp xếp hoặc điều hành một sự kiện/hoạt động."},{"globalNumber":25,"exerciseNumber":3,"localNumber":7,"acceptedAnswers":["C"],"displayAnswer":"C — To like or enjoy something a lot.","explanation":"“Be keen on” nghĩa là rất thích hoặc rất hứng thú với một điều hay hoạt động nào đó."},{"globalNumber":26,"exerciseNumber":3,"localNumber":8,"acceptedAnswers":["H"],"displayAnswer":"H — Doing something that might be dangerous.","explanation":"“Risk” là sự mạo hiểm/nguy cơ, gắn với việc làm điều có thể gây nguy hiểm hoặc hậu quả xấu."},{"globalNumber":27,"exerciseNumber":3,"localNumber":9,"acceptedAnswers":["G"],"displayAnswer":"G — To make people feel happy or have fun.","explanation":"“Entertain” nghĩa là làm cho người khác vui vẻ, thích thú hoặc được giải trí."},{"globalNumber":28,"exerciseNumber":3,"localNumber":10,"acceptedAnswers":["E"],"displayAnswer":"E — A person who trains and helps a team or player.","explanation":"“Coach” là huấn luyện viên, người hướng dẫn và giúp đội hoặc vận động viên luyện tập."},{"globalNumber":29,"exerciseNumber":3,"localNumber":11,"acceptedAnswers":["K"],"displayAnswer":"K — A group of people working together for a purpose.","explanation":"“Organization” là tổ chức: một nhóm người cùng làm việc để đạt một mục đích chung."},{"globalNumber":30,"exerciseNumber":3,"localNumber":12,"acceptedAnswers":["L"],"displayAnswer":"L — To help or encourage someone or something.","explanation":"“Support” nghĩa là ủng hộ, giúp đỡ hoặc động viên một người, đội hay hoạt động."},{"globalNumber":31,"exerciseNumber":4,"localNumber":1,"acceptedAnswers":["B"],"displayAnswer":"B — interested","explanation":"Cụm “be interested in sports” nghĩa là hứng thú với thể thao. Câu mới đã dùng “excited to take part” ở vế sau, nên B là lựa chọn duy nhất phù hợp với giới từ “in”."},{"globalNumber":32,"exerciseNumber":4,"localNumber":2,"acceptedAnswers":["B"],"displayAnswer":"B — coach","explanation":"Người giúp các cầu thủ luyện tập và chuẩn bị cho sự kiện là “coach” (huấn luyện viên)."},{"globalNumber":33,"exerciseNumber":4,"localNumber":3,"acceptedAnswers":["C"],"displayAnswer":"C — referee","explanation":"Người bảo đảm mọi luật lệ được tuân thủ trong trận đấu là “referee” (trọng tài)."},{"globalNumber":34,"exerciseNumber":4,"localNumber":4,"acceptedAnswers":["A"],"displayAnswer":"A — cheat","explanation":"“Cheat to win” là gian lận để thắng; hành vi này làm ảnh hưởng xấu đến danh tiếng của cầu thủ."},{"globalNumber":35,"exerciseNumber":4,"localNumber":5,"acceptedAnswers":["B"],"displayAnswer":"B — risk","explanation":"“Put something at risk” là cụm cố định, nghĩa là đặt điều gì vào tình thế có nguy cơ bị tổn hại."},{"globalNumber":36,"exerciseNumber":4,"localNumber":6,"acceptedAnswers":["C"],"displayAnswer":"C — enjoy","explanation":"“Enjoy watching” là cấu trúc đúng và phù hợp nghĩa. Phương án D hiện là “feel”, không thể đứng trực tiếp trước V-ing trong câu này."},{"globalNumber":37,"exerciseNumber":4,"localNumber":7,"acceptedAnswers":["A","B","D"],"displayAnswer":"A/B/D — entertainment / action / pleasure","explanation":"“Provide plenty of entertainment”, “provide plenty of action” và “provide plenty of pleasure” đều đúng ngữ pháp và có thể hợp nghĩa với một ngày hội thể thao; vì vậy hệ thống nhận cả A, B và D."},{"globalNumber":38,"exerciseNumber":4,"localNumber":8,"acceptedAnswers":["C"],"displayAnswer":"C — competitive","explanation":"“Competitive matches” là cách diễn đạt tự nhiên, đúng nghĩa: các trận đấu có tính cạnh tranh cao thu hút giáo viên và phụ huynh đến xem. B — “pleased” không dùng để miêu tả trận đấu; D không phù hợp mạch nghĩa."},{"globalNumber":39,"exerciseNumber":4,"localNumber":9,"acceptedAnswers":["C"],"displayAnswer":"C — support","explanation":"Câu mới có tân ngữ “their friends”: “shout and clap to support their friends” nghĩa là hò reo và vỗ tay để cổ vũ bạn bè."},{"globalNumber":40,"exerciseNumber":4,"localNumber":10,"acceptedAnswers":["A"],"displayAnswer":"A — pleasure","explanation":"Cụm “bring great pleasure” nghĩa là mang lại niềm vui lớn; tính từ “great” và ý kết đoạn khóa đáp án A."},{"globalNumber":41,"exerciseNumber":5,"localNumber":1,"acceptedAnswers":["D"],"displayAnswer":"D — a long time, but George didn't appear.","explanation":"“Wait for a long time” là cách kết hợp đúng: Tôi đợi ngoài câu lạc bộ rất lâu nhưng George không xuất hiện."},{"globalNumber":42,"exerciseNumber":5,"localNumber":2,"acceptedAnswers":["F"],"displayAnswer":"F — the middle of cleaning my football boots.","explanation":"Cụm cố định “be in the middle of + V-ing” nghĩa là đang làm dở việc gì khi một việc khác xảy ra."},{"globalNumber":43,"exerciseNumber":5,"localNumber":3,"acceptedAnswers":["C"],"displayAnswer":"C — time to see the match start.","explanation":"“Just in time to do something” nghĩa là đến vừa kịp lúc để xem trận đấu bắt đầu."},{"globalNumber":44,"exerciseNumber":5,"localNumber":4,"acceptedAnswers":["A"],"displayAnswer":"A — fun, and I don't want to do it as a job.","explanation":"“Play for fun” nghĩa là chơi để vui, đối lập hợp lý với việc chơi như một nghề nghiệp."},{"globalNumber":45,"exerciseNumber":5,"localNumber":5,"acceptedAnswers":["E"],"displayAnswer":"E — on DVD, I'll definitely get it.","explanation":"“Come out on DVD” nghĩa là được phát hành dưới dạng DVD; người nói thích phim nên chắc chắn sẽ mua/lấy nó."},{"globalNumber":46,"exerciseNumber":5,"localNumber":6,"acceptedAnswers":["B"],"displayAnswer":"B — stage, with all the audience clapping.","explanation":"Cụm đúng là “appear on stage” (xuất hiện trên sân khấu), phù hợp với việc khán giả vỗ tay."}],"reviewNeeded":[{"globalNumber":37,"exerciseNumber":4,"localNumber":7,"reason":"Sau “provides plenty of”, A (entertainment), B (action) và D (pleasure) đều có thể đúng."}],"testId":"vf1-u01"}};
    const TEST = APP.test;
    const SECTIONS = TEST.sections;
    const SOLUTIONS = TEST.answers;
    const TOTAL = TEST.total;
    const FORM_URL = APP.course.scoreSink.formResponseUrl;
    const ENTRIES = APP.course.scoreSink.entries;
    const PROFILE_KEY = "vf1:profile:v1";
    const ACTIVE_KEY = `vf1:${TEST.testId}:active:v1`;
    const HISTORY_KEY = `vf1:${TEST.testId}:history:v1`;
    const LAST_KEY = `vf1:${TEST.testId}:last:v1`;
    let answers = {};
    let current = 0;
    let attemptId = "";
    let identity = {name:"",className:""};
    let history = [];
    let graded = false;
    let submitting = false;
    let sessionUnlocked = false;
    let pendingActive = null;
    const $ = id => document.getElementById(id);
    const setSync = (message,isError=false) => { const target = $("sync"); target.textContent = message; target.classList.toggle("error",isError); };
    const questions = Array.from({length:TOTAL}, (_,index) => index + 1);
    const norm = value => String(value || "").normalize("NFKC").trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g," ");
    const contractionRules = [
      {pattern:/\bcan't\b/,replacements:["cannot"]},
      {pattern:/\bcan not\b/,replacements:["cannot"]},
      {pattern:/\bwon't\b/,replacements:["will not"]},
      {pattern:/\bshan't\b/,replacements:["shall not"]},
      {pattern:/\b([a-z]+)n't\b/,replacements:["$1 not"]},
      {pattern:/\bi'm\b/,replacements:["i am"]},
      {pattern:/\b(you|we|they)'re\b/,replacements:["$1 are"]},
      {pattern:/\b(i|you|we|they|he|she|it)'ll\b/,replacements:["$1 will"]},
      {pattern:/\b(i|you|we|they)'ve\b/,replacements:["$1 have"]},
      {pattern:/\blet's\b/,replacements:["let us"]}
    ];
    function answerForms(value){
      let forms = new Set([norm(value)]);
      contractionRules.forEach(rule => {
        const expanded = new Set(forms);
        forms.forEach(form => {
          if(rule.pattern.test(form)) rule.replacements.forEach(replacement => expanded.add(form.replace(rule.pattern,replacement)));
        });
        forms = expanded;
      });
      return forms;
    }
    function equivalent(left,right){
      const leftForms = answerForms(left);
      const rightForms = answerForms(right);
      return [...leftForms].some(form => rightForms.has(form));
    }
    function verifyAnswerNormalization(){
      const equivalentCases = [
        ["isn't keen on","is not keen on"],
        ["isn’t keen on","is not keen on"],
        ["doesn't agree","does not agree"],
        ["can't afford","cannot afford"],
        ["can't afford","can not afford"],
        ["I'm interested","I am interested"]
      ];
      if(!equivalentCases.every(([left,right]) => equivalent(left,right)) || equivalent("isn't keen on","does not like")){
        throw new Error("Answer normalization self-test failed.");
      }
    }
    const makeId = () => `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    const range = section => Array.from({length:section.count}, (_,index) => section.startGlobal + index);
    const locate = globalNumber => {
      const sectionIndex = SECTIONS.findIndex(section => globalNumber >= section.startGlobal && globalNumber < section.startGlobal + section.count);
      return {sectionIndex, exercise:SECTIONS[sectionIndex].exerciseNumber, local:globalNumber - SECTIONS[sectionIndex].startGlobal + 1};
    };
    const cleanIdentity = candidate => ({
      name:String(candidate?.name || "").trim().replace(/\s+/g," "),
      className:String(candidate?.className || "").trim()
    });
    const isValidIdentity = candidate => {
      const cleaned = cleanIdentity(candidate);
      return cleaned.name.length >= 2 && APP.course.classes.includes(cleaned.className);
    };
    const sameIdentity = (left,right) => {
      const first = cleanIdentity(left);
      const second = cleanIdentity(right);
      return first.name === second.name && first.className === second.className;
    };
    const allAnswersComplete = snapshot => Boolean(snapshot) && questions.every(number => norm(snapshot[number]));

    function initializeStaticUi(){
      document.title = `Vocabulary Foundation 1 · Unit ${String(TEST.unitNumber).padStart(2,"0")}`;
      $("unitBadge").textContent = String(TEST.unitNumber).padStart(2,"0");
      $("topic").textContent = TEST.topic;
      $("gateKicker").textContent = `PHIẾU TRẢ LỜI · ${TOTAL} CÂU`;
      $("progressCount").textContent = `0/${TOTAL}`;
      $("scoreTotal").textContent = `/${TOTAL}`;
      $("docFrame").title = `Đề kiểm tra Unit ${TEST.unitNumber}`;
      const select = $("className");
      select.innerHTML = "";
      const empty = document.createElement("option");
      empty.value = "";
      empty.textContent = "Chọn lớp";
      select.append(empty);
      APP.course.classes.forEach(className => {
        const option = document.createElement("option");
        option.value = className;
        option.textContent = className;
        select.append(option);
      });
    }

    function lockWorkspace(message=""){
      sessionUnlocked = false;
      $("workspace").classList.add("is-gated");
      $("docPane").hidden = true;
      $("docFrame").removeAttribute("src");
      $("sheet").hidden = true;
      $("result").hidden = true;
      $("student").hidden = true;
      $("progress").hidden = true;
      $("gate").hidden = false;
      $("gateNotice").textContent = message;
      $("gateNotice").hidden = !message;
    }

    function unlockWorkspace(){
      if(!isValidIdentity(identity)) return false;
      sessionUnlocked = true;
      $("workspace").classList.remove("is-gated");
      $("docPane").hidden = false;
      if(!$("docFrame").hasAttribute("src")){
        $("docFrame").src = `https://docs.google.com/document/d/${TEST.docId}/preview`;
      }
      return true;
    }

    function load(){
      initializeStaticUi();
      lockWorkspace();
      try{
        const profile = JSON.parse(localStorage.getItem(PROFILE_KEY) || "null");
        if(isValidIdentity(profile)){
          const cleanedProfile = cleanIdentity(profile);
          $("name").value = cleanedProfile.name;
          $("className").value = cleanedProfile.className;
        }
        const storedHistory = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
        history = Array.isArray(storedHistory) ? storedHistory : [];
        const active = JSON.parse(localStorage.getItem(ACTIVE_KEY) || "null");
        if(active && active.attemptId && isValidIdentity(active.identity) && active.answers && typeof active.answers === "object"){
          pendingActive = active;
        }
      }catch(_){
        localStorage.removeItem(ACTIVE_KEY);
        localStorage.removeItem(LAST_KEY);
        pendingActive = null;
      }
    }

    function save(){
      if(!sessionUnlocked || !isValidIdentity(identity) || !attemptId) return;
      localStorage.setItem(ACTIVE_KEY, JSON.stringify({attemptId,identity,answers,current}));
    }

    function startAttempt(){
      if(!sessionUnlocked || !isValidIdentity(identity)){
        lockWorkspace("Xác nhận đầy đủ họ tên và lớp trước khi làm bài.");
        return;
      }
      pendingActive = null;
      answers = {};
      current = 0;
      attemptId = makeId();
      graded = false;
      submitting = false;
      $("retry").disabled = false;
      localStorage.removeItem(LAST_KEY);
      showSheet();
    }

    function showStudent(){
      $("student").hidden = false;
      $("studentName").textContent = identity.name;
      $("studentClass").textContent = `${identity.className} · LƯỢT ${history.length + 1}`;
    }

    function showSheet(){
      if(!sessionUnlocked || !isValidIdentity(identity) || !unlockWorkspace()){
        lockWorkspace("Xác nhận đầy đủ họ tên và lớp trước khi làm bài.");
        return;
      }
      $("gate").hidden = true;
      $("result").hidden = true;
      $("sheet").hidden = false;
      $("progress").hidden = false;
      showStudent();
      renderTabs();
      renderRows();
      updateProgress();
      save();
    }

    $("gate").addEventListener("submit", event => {
      event.preventDefault();
      const candidate = cleanIdentity({name:$("name").value,className:$("className").value});
      if(!isValidIdentity(candidate)){
        $("gateNotice").textContent = "Nhập đầy đủ họ tên và lớp.";
        $("gateNotice").hidden = false;
        return;
      }
      $("gateNotice").hidden = true;
      identity = candidate;
      localStorage.setItem(PROFILE_KEY, JSON.stringify(identity));
      sessionUnlocked = true;
      if(pendingActive && sameIdentity(pendingActive.identity,identity)){
        answers = {...pendingActive.answers};
        current = Math.max(0, Math.min(SECTIONS.length - 1, Number(pendingActive.current) || 0));
        attemptId = pendingActive.attemptId;
        pendingActive = null;
        graded = false;
        submitting = false;
        showSheet();
        return;
      }
      if(pendingActive) localStorage.removeItem(ACTIVE_KEY);
      startAttempt();
    });

    function renderTabs(){
      $("tabs").innerHTML = "";
      SECTIONS.forEach((section,index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.sectionIndex = index;
        button.textContent = `EX ${section.exerciseNumber}`;
        if(index === current) button.classList.add("active");
        if(range(section).every(number => norm(answers[number]))) button.classList.add("done");
        button.onclick = () => { current = index; renderTabs(); renderRows(); save(); };
        $("tabs").append(button);
      });
    }

    function renderRows(){
      const section = SECTIONS[current];
      $("exerciseTitle").textContent = `EX ${section.exerciseNumber}`;
      $("sectionTotal").textContent = `${section.count} CÂU`;
      $("rows").innerHTML = "";
      range(section).forEach((globalNumber,localIndex) => {
        const localNumber = localIndex + 1;
        const row = document.createElement("div");
        row.className = `answer-row${norm(answers[globalNumber]) ? " answered" : ""}`;
        const number = document.createElement("div");
        number.className = "qnum";
        number.textContent = localNumber;
        row.append(number);
        if(section.inputType === "letters"){
          const letters = document.createElement("div");
          letters.className = "letters";
          letters.style.setProperty("--choice-count", Math.min((section.choices || []).length, 6));
          (section.choices || []).forEach(letter => {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = letter;
            button.setAttribute("aria-label", `Exercise ${section.exerciseNumber}, câu ${localNumber}: ${letter}`);
            if(answers[globalNumber] === letter) button.className = "selected";
            button.onclick = () => {
              setAnswer(globalNumber,letter);
              [...letters.children].forEach(choiceButton => choiceButton.classList.remove("selected"));
              button.classList.add("selected");
              row.classList.add("answered");
            };
            letters.append(button);
          });
          row.append(letters);
        }else if(section.inputType === "select"){
          const select = document.createElement("select");
          select.setAttribute("aria-label", `Exercise ${section.exerciseNumber}, câu ${localNumber}`);
          const empty = document.createElement("option");
          empty.value = "";
          empty.textContent = "—";
          select.append(empty);
          (section.choices || []).forEach(letter => {
            const option = document.createElement("option");
            option.value = letter;
            option.textContent = letter;
            select.append(option);
          });
          select.value = answers[globalNumber] || "";
          select.onchange = () => {
            setAnswer(globalNumber,select.value);
            row.classList.toggle("answered",Boolean(norm(select.value)));
          };
          row.append(select);
        }else{
          const input = document.createElement("input");
          input.setAttribute("aria-label", `Exercise ${section.exerciseNumber}, câu ${localNumber}`);
          input.autocomplete = "off";
          input.spellcheck = false;
          input.value = answers[globalNumber] || "";
          input.oninput = () => setAnswer(globalNumber,input.value);
          input.onkeydown = event => {
            if(event.key === "Enter"){
              event.preventDefault();
              const fields = [...document.querySelectorAll(".rows input")];
              fields[fields.indexOf(input) + 1]?.focus();
            }
          };
          row.append(input);
        }
        $("rows").append(row);
      });
      $("rows").scrollTop = 0;
      $("prev").disabled = current === 0;
      $("next").hidden = current === SECTIONS.length - 1;
      $("grade").hidden = current !== SECTIONS.length - 1;
      $("grade").disabled = graded;
    }

    function refreshCurrentTabStatus(){
      const tab = $("tabs").querySelector(`[data-section-index="${current}"]`);
      if(tab) tab.classList.toggle("done",range(SECTIONS[current]).every(number => norm(answers[number])));
    }

    function setAnswer(globalNumber,value){
      answers[globalNumber] = value;
      updateProgress();
      refreshCurrentTabStatus();
      save();
    }

    function updateProgress(){
      const count = questions.filter(number => norm(answers[number])).length;
      $("progressCount").textContent = `${count}/${TOTAL}`;
      $("progressBar").style.width = `${count / TOTAL * 100}%`;
    }

    $("prev").onclick = () => { if(current > 0){ current--; renderTabs(); renderRows(); save(); } };
    $("next").onclick = () => { if(current < SECTIONS.length - 1){ current++; renderTabs(); renderRows(); save(); } };
    $("grade").onclick = grade;

    function buildReview(answerSnapshot){
      let score = 0;
      const review = SOLUTIONS.map(solution => {
        const submitted = String(answerSnapshot[solution.globalNumber] || "").trim();
        const correct = solution.acceptedAnswers.some(answer => equivalent(answer,submitted));
        if(correct) score++;
        return {...solution,submitted,correct};
      });
      const wrongNumbers = review.filter(item => !item.correct).map(item => item.globalNumber);
      return {score,review,percent:Math.round(score / TOTAL * 100),wrong:wrongNumbers.length,wrongNumbers};
    }

    function formatWrongList(review){
      const groups = new Map();
      review.filter(item => !item.correct).forEach(item => {
        const place = locate(item.globalNumber);
        const label = `EX ${place.exercise}`;
        if(!groups.has(label)) groups.set(label,[]);
        groups.get(label).push(place.local);
      });
      return [...groups].map(([label,numbers]) => `${label}: ${numbers.join(", ")}`).join(" · ");
    }

    function setReviewFilter(mode){
      const wrongOnly = mode === "wrong";
      document.querySelectorAll("#reviews .review").forEach(card => {
        card.hidden = wrongOnly && card.dataset.correct === "true";
      });
      $("showWrong").classList.toggle("active",wrongOnly);
      $("showAll").classList.toggle("active",!wrongOnly);
      $("showWrong").setAttribute("aria-pressed",String(wrongOnly));
      $("showAll").setAttribute("aria-pressed",String(!wrongOnly));
      $("reviews").scrollTop = 0;
    }

    function grade(){
      if(graded) return;
      if(!sessionUnlocked || !isValidIdentity(identity)){
        lockWorkspace("Phiên làm bài chưa có họ tên và lớp hợp lệ. Vui lòng xác nhận lại.");
        return;
      }
      const missing = questions.filter(number => !norm(answers[number]));
      if(missing.length){
        const first = locate(missing[0]);
        current = first.sectionIndex;
        renderTabs();
        renderRows();
        alert(`Còn ${missing.length} câu chưa điền. Bắt đầu từ EX ${first.exercise}, câu ${first.local}.`);
        return;
      }
      graded = true;
      $("grade").disabled = true;
      const answerSnapshot = {...answers};
      const result = buildReview(answerSnapshot);
      const completedAttemptId = attemptId;
      const record = {attemptId:completedAttemptId,completedAt:new Date().toISOString(),score:result.score,percent:result.percent,answers:answerSnapshot,identity:{...identity}};
      if(!history.some(item => item.attemptId === completedAttemptId)){
        history.push({attemptId:record.attemptId,completedAt:record.completedAt,score:record.score,percent:record.percent});
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(-50)));
      }
      localStorage.setItem(LAST_KEY, JSON.stringify(record));
      localStorage.removeItem(ACTIVE_KEY);
      showResult(record,false);
      postScore({attemptId:completedAttemptId,score:result.score,percent:result.percent,wrong:result.wrong,identity:{...identity},answers:answerSnapshot});
    }

    function showResult(record,restored){
      const result = buildReview(record.answers || {});
      $("gate").hidden = true;
      $("sheet").hidden = true;
      $("result").hidden = false;
      $("progress").hidden = true;
      identity = record.identity || identity;
      showStudent();
      $("score").textContent = result.score;
      $("resultTitle").textContent = result.score === TOTAL ? `Hoàn thành ${TOTAL}/${TOTAL}` : `${result.wrong} câu cần sửa`;
      $("resultMeta").textContent = `Điểm ${result.score}/${TOTAL} · ${result.percent}%`;
      setSync(restored ? (localStorage.getItem(sentKey(record.attemptId)) ? "Đã lưu điểm" : "Điểm của lượt gần nhất") : "Đang lưu điểm…");
      $("wrongList").replaceChildren();
      const wrongLabel = document.createElement("strong");
      wrongLabel.textContent = result.wrong ? "CÂU SAI" : "KẾT QUẢ";
      $("wrongList").append(wrongLabel,document.createTextNode(result.wrong ? formatWrongList(result.review) : "Không có câu sai."));
      $("showWrong").textContent = `CÂU SAI (${result.wrong})`;
      $("showWrong").hidden = result.wrong === 0;
      $("showAll").textContent = `TẤT CẢ (${TOTAL})`;
      $("reviews").innerHTML = "";
      result.review.forEach(item => {
        const place = locate(item.globalNumber);
        const card = document.createElement("article");
        card.className = `review${item.correct ? "" : " wrong"}`;
        card.dataset.correct = String(item.correct);
        const number = document.createElement("div");
        number.className = "review-num";
        const numberStrong = document.createElement("strong");
        numberStrong.textContent = place.local;
        const exercise = document.createElement("span");
        exercise.textContent = `EX ${place.exercise}`;
        const status = document.createElement("span");
        status.textContent = item.correct ? "ĐÚNG" : "SAI";
        number.append(numberStrong,exercise,status);
        const body = document.createElement("div");
        body.className = "review-body";
        const answersLine = document.createElement("div");
        answersLine.className = "review-answers";
        const mine = document.createElement("span");
        mine.textContent = "Em: ";
        const mineAnswer = document.createElement("b");
        mineAnswer.textContent = item.submitted;
        mine.append(mineAnswer);
        const key = document.createElement("span");
        key.textContent = "Đáp án: ";
        const keyAnswer = document.createElement("b");
        keyAnswer.className = "correct";
        keyAnswer.textContent = item.displayAnswer;
        key.append(keyAnswer);
        answersLine.append(mine,key);
        const explanation = document.createElement("div");
        explanation.className = "explain";
        const explanationTitle = document.createElement("strong");
        explanationTitle.textContent = "GIẢI THÍCH";
        const explanationText = document.createElement("p");
        explanationText.textContent = item.explanation || "Chưa có giải thích cho câu này.";
        explanation.append(explanationTitle,explanationText);
        body.append(answersLine,explanation);
        card.append(number,body);
        $("reviews").append(card);
      });
      setReviewFilter(result.wrong ? "wrong" : "all");
    }

    const sentKey = id => `vf1:${TEST.testId}:sent:${id}`;

    function validateSubmission(snapshot){
      if(!sessionUnlocked || !snapshot || !snapshot.attemptId || snapshot.attemptId !== attemptId) return false;
      if(!isValidIdentity(snapshot.identity) || !sameIdentity(snapshot.identity,identity)) return false;
      if(!allAnswersComplete(snapshot.answers)) return false;
      const verified = buildReview(snapshot.answers);
      return verified.score === snapshot.score && verified.percent === snapshot.percent && verified.wrong === snapshot.wrong;
    }

    function postScore(snapshot){
      if(!validateSubmission(snapshot)){
        submitting = false;
        $("retry").disabled = false;
        setSync("Chưa lưu được điểm.",true);
        return;
      }
      const key = sentKey(snapshot.attemptId);
      if(localStorage.getItem(key)){
        setSync("Đã lưu điểm");
        return;
      }
      submitting = true;
      $("retry").disabled = true;
      const target = $("scoreTarget");
      const form = document.createElement("form");
      form.method = "POST";
      form.action = FORM_URL;
      form.target = target.name;
      form.hidden = true;
      const verified = buildReview(snapshot.answers);
      const values = {
        [ENTRIES.name]:snapshot.identity.name,
        [ENTRIES.total]:String(TOTAL),
        [ENTRIES.assignmentCode]:`Vocabulary Foundation 1 - Test Unit ${TEST.unitNumber}`,
        [ENTRIES.lesson]:`Vocabulary Foundation 1 – Unit ${TEST.unitNumber}`,
        [ENTRIES.activity]:`${TEST.topic} – Bài kiểm tra làm lại`,
        [ENTRIES.className]:snapshot.identity.className,
        [ENTRIES.percent]:String(verified.percent),
        [ENTRIES.score]:String(verified.score),
        [ENTRIES.wrong]:String(verified.wrong)
      };
      Object.entries(values).forEach(([name,value]) => {
        const input = document.createElement("input");
        input.name = name;
        input.value = value;
        form.append(input);
      });
      document.body.append(form);
      let settled = false;
      const finish = success => {
        if(settled) return;
        settled = true;
        submitting = false;
        $("retry").disabled = false;
        if(success){
          localStorage.setItem(key,new Date().toISOString());
          setSync("Đã lưu điểm");
        }else{
          setSync("Chưa lưu được điểm. Vui lòng kiểm tra mạng.",true);
        }
        form.remove();
      };
      target.addEventListener("load", () => finish(true), {once:true});
      form.submit();
      setTimeout(() => finish(false),12000);
    }

    $("retry").onclick = () => {
      if(submitting) return;
      startAttempt();
    };
    $("showWrong").onclick = () => setReviewFilter("wrong");
    $("showAll").onclick = () => setReviewFilter("all");

    verifyAnswerNormalization();
    load();
  </script>
