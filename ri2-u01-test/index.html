  <script id="ri2-unit-data" type="application/json">{"unit":1,"title":"READING INTENSIVE 2 · UNIT 1","testCode":"RI2-U01","total":64,"studentPreviewUrl":"https://docs.google.com/document/d/11IebAvlGIv3DxIN0n_ySEKiE80qFhbT2hSI7Vwc9vYI/preview","sections":[{"exercise":1,"count":15,"inputKind":"matching","choices":["A","B","C","D","E","F","G","H","I","K","L","M","O","P","Q"],"instruction":"Ex 1: Match the words in Column A with their correct definitions in Column B. Write the letter of the definition next to the corresponding word.","questions":[{"number":1,"answer":"G","context":"Majority (n)","explanation":"Giải thích của cô: majority (n) đa số\n\nMajority là danh từ, chỉ phần lớn hơn hoặc số lượng nhiều nhất trong một nhóm. Vì vậy từ này tương ứng với G, nội dung nói về ‘the larger part or the greatest number’; các định nghĩa còn lại chỉ hành động, tính chất hoặc khái niệm khác."},{"number":2,"answer":"P","context":"Efficient (a)","explanation":"Giải thích của cô: efficient (a) hiệu quả\n\nEfficient là tính từ, nghĩa là đạt năng suất/kết quả cao với ít công sức, thời gian hoặc chi phí bị lãng phí. Ý này trùng chính xác với định nghĩa P: ‘Achieving maximum productivity with minimum wasted effort or expense’."},{"number":3,"answer":"K","context":"Obvious (a)","explanation":"Giải thích của cô: obvious (a) hiển nhiên, rõ ràng\n\nObvious là tính từ chỉ điều dễ thấy hoặc dễ hiểu, không cần suy luận nhiều. Do đó K (‘clear and easily understood’) là định nghĩa trực tiếp của từ; E gần nghĩa ‘có thể nhìn thấy/hiểu được’ nhưng thuộc từ apparent trong một bộ từ khác, không phải lựa chọn ghép ở đây."},{"number":4,"answer":"O","context":"Facility (n)","explanation":"Giải thích của cô: facility (n) cơ sở vật chất\n\nFacility là danh từ chỉ địa điểm, tòa nhà, phòng hoặc thiết bị được cung cấp cho một mục đích cụ thể. Định nghĩa O nêu đúng cả ý ‘a place or amenity’ và các ví dụ ‘building, room, or equipment’, nên khớp hoàn toàn."},{"number":5,"answer":"L","context":"Solely (adv)","explanation":"Giải thích của cô: solely (adv) duy nhất\n\nSolely là trạng từ, nghĩa là chỉ, hoàn toàn do một người/vật hoặc một lý do duy nhất. L dùng các từ đồng nghĩa ‘only, exclusively’ và vì thế là định nghĩa đúng; đây không phải tính từ sole."},{"number":6,"answer":"E","context":"Extent (n)","explanation":"Giải thích của cô: extent (n) mức độ\n\nExtent là danh từ chỉ quy mô, lượng hoặc mức độ mà một điều gì đó đạt tới. Định nghĩa E liệt kê đúng ba nét nghĩa ‘size, amount, or degree’, nên ghép với extent."},{"number":7,"answer":"B","context":"Crisis (n)","explanation":"Giải thích của cô: crisis (n) cuộc khủng hoảng\n\nCrisis là danh từ chỉ tình huống cực kỳ nghiêm trọng, đòi hỏi hành động khẩn cấp. Đó chính là nội dung của B; H chỉ một loại khủng hoảng cụ thể là nạn thiếu lương thực kéo dài (famine)."},{"number":8,"answer":"Q","context":"Permanent (a)","explanation":"Giải thích của cô: permanent (a) vĩnh viễn\n\nPermanent là tính từ mang nghĩa lâu dài hoặc vĩnh viễn, đối lập với temporary. Định nghĩa Q nêu nguyên đối lập này (‘lasting ... not temporary’), nên là đáp án duy nhất chính xác."},{"number":9,"answer":"A","context":"Infer (v)","explanation":"Giải thích của cô: infer (v) suy luận\n\nInfer là động từ: đi đến một kết luận từ bằng chứng hoặc dữ kiện thay vì được nói thẳng. A diễn đạt đúng quá trình ‘draw a conclusion based on evidence’, nên ghép với infer."},{"number":10,"answer":"D","context":"Culprit (n)","explanation":"Giải thích của cô: culprit (n) thủ phạm, nguyên nhân gây ra\n\nCulprit là danh từ chỉ người gây ra việc xấu hoặc, theo nghĩa mở rộng, tác nhân chịu trách nhiệm cho một vấn đề. Định nghĩa D bao gồm cả ‘person or thing responsible for a problem’, đúng với hai cách dùng này."},{"number":11,"answer":"M","context":"Raw (a)","explanation":"Giải thích của cô: raw (a) thô, chưa qua xử lí\n\nRaw là tính từ chỉ nguyên liệu/thực phẩm ở trạng thái tự nhiên, chưa chế biến hoặc nấu. M diễn đạt đúng nét nghĩa ‘not yet processed or cooked’; vì vậy không thể ghép với các định nghĩa về thời gian hay mức độ."},{"number":12,"answer":"H","context":"Famine (n)","explanation":"Giải thích của cô: famine (n) nạn đói\n\nFamine là danh từ chỉ tình trạng thiếu lương thực nghiêm trọng và kéo dài trên diện rộng. H nêu rõ ‘a long-lasting food shortage’, khác với B là khái niệm khủng hoảng nói chung."},{"number":13,"answer":"I","context":"Continent (n)","explanation":"Giải thích của cô: continent (n) lục địa\n\nContinent là danh từ chỉ một khối đất liền rất lớn trên Trái Đất. I vừa nêu đặc điểm ‘large landmass’ vừa cho ví dụ Africa và Asia, nên nhận diện trực tiếp được từ này."},{"number":14,"answer":"C","context":"Initial (a)","explanation":"Giải thích của cô: initial (a) đầu tiên\n\nInitial là tính từ mang nghĩa thuộc giai đoạn đầu hoặc xảy ra đầu tiên. C (‘happening at the beginning, first’) là diễn giải đồng nghĩa chính xác."},{"number":15,"answer":"F","context":"Remain (v)","explanation":"Giải thích của cô: remain (v) vẫn, cứ\n\nRemain là động từ chỉ việc tiếp tục tồn tại, ở lại hoặc còn lại sau khi phần khác đã mất/được dùng. Cả ba cách dùng này đều được nêu trong F, nên F là định nghĩa đầy đủ nhất."}]},{"exercise":2,"count":10,"inputKind":"text","choices":[],"instruction":"Ex 2: Fill in the blanks with the following words: deadly; scale; quality; trade; in terms of; exist; a range of; trace; left; infer","questions":[{"number":16,"answer":"deadly","context":"The __________ disease spread quickly and caused many people to get sick.","explanation":"Deadly là tính từ, nghĩa là có thể gây chết người hoặc cực kỳ nguy hiểm. Câu hoàn chỉnh là “The deadly disease spread quickly and caused many people to get sick”; vị trí trước danh từ disease cần một tính từ, và hậu quả bệnh lan nhanh, làm nhiều người mắc bệnh tạo ngữ cảnh nguy hiểm rõ ràng."},{"number":17,"answer":"scale","context":"The impact of the storm was felt on a local __________, affecting many families and businesses.","explanation":"Scale là danh từ, trong cụm on a local scale nghĩa là ở quy mô địa phương. Câu hoàn chỉnh “The impact of the storm was felt on a local scale...” cho biết phạm vi tác động giới hạn tới các gia đình và doanh nghiệp tại địa phương; không từ nào khác trong ngân hàng tạo được cụm này."},{"number":18,"answer":"quality","context":"The __________ of the apples was checked, and they were found to be fresh and ready to sell.","explanation":"Quality là danh từ, nghĩa là chất lượng. Câu hoàn chỉnh là “The quality of the apples was checked...”; kết quả ‘fresh and ready to sell’ chính là tiêu chí đánh giá chất lượng táo, và cấu trúc the quality of + noun hoàn chỉnh về ngữ pháp."},{"number":19,"answer":"trade","context":"The company has expanded its __________ with Europe.","explanation":"Trade là danh từ, nghĩa là hoạt động thương mại/buôn bán. “The company has expanded its trade with Europe” diễn tả công ty mở rộng giao thương với châu Âu; trade with + place/partner là kết hợp từ tự nhiên sau động từ expand."},{"number":20,"answer":"in terms of","context":"We need to talk about this issue __________ cost and benefits.","explanation":"In terms of là cụm giới từ, nghĩa là xét về hoặc trên phương diện. Câu hoàn chỉnh “We need to talk about this issue in terms of cost and benefits” giới hạn hai phương diện cần bàn là chi phí và lợi ích; cụm này phải đứng trọn vẹn trước các danh từ đó."},{"number":21,"answer":"exist","context":"Some animals that used to __________ in this area are now gone because of pollution.","explanation":"Exist là động từ, nghĩa là tồn tại. Sau used to cần động từ nguyên mẫu, tạo câu “Some animals that used to exist in this area are now gone...”; sự đối lập giữa ‘từng tồn tại’ và ‘nay đã biến mất’ xác nhận lựa chọn này."},{"number":22,"answer":"a range of","context":"The garden grew __________  flowers, including roses, daisies, and tulips.","explanation":"A range of là cụm định lượng, nghĩa là nhiều loại/đa dạng. Câu hoàn chỉnh “The garden grew a range of flowers, including roses, daisies, and tulips”; danh sách ba loài hoa sau including minh họa trực tiếp cho sự đa dạng đó."},{"number":23,"answer":"trace","context":"The detective was able to __________ the criminal's movements through the security cameras.","explanation":"Trace là động từ, nghĩa là lần theo hoặc truy dấu. Sau was able to cần động từ nguyên mẫu: “The detective was able to trace the criminal's movements through the security cameras”; camera cung cấp dấu vết giúp thám tử tái dựng đường đi của tội phạm."},{"number":24,"answer":"left","context":"He was __________ working late into the night to finish the report.","explanation":"Left là quá khứ phân từ của leave, ở đây nằm trong cấu trúc bị động be left + V-ing, nghĩa là bị để/phải tiếp tục trong một tình thế. “He was left working late into the night...” cho thấy anh ấy rơi vào tình cảnh phải làm muộn để hoàn thành báo cáo."},{"number":25,"answer":"infer","context":"From the results of the study, we can __________ that eating more vegetables leads to better health.","explanation":"Infer là động từ, nghĩa là suy ra kết luận từ bằng chứng. Sau động từ khuyết thiếu can dùng nguyên mẫu: “From the results of the study, we can infer that...” và cụm mở đầu from the results nêu chính nguồn dữ kiện để suy luận."}]},{"exercise":3,"count":10,"inputKind":"mcq","choices":["A","B","C","D"],"instruction":"Ex 3: Read the passage below and choose the correct word from the options to fill in the blanks.","questions":[{"number":26,"answer":"A","context":"When there is a severe lack of rain, it leads to crop failure and can cause widespread (26) _______.","explanation":"Cụm cause widespread famine nghĩa là gây nạn đói trên diện rộng, đúng với hậu quả của hạn hán làm mùa màng thất bát. B death không phải kết hợp sát bằng trong mạch nói về thiếu lương thực; C trade và D range không tạo nghĩa hợp lý sau widespread."},{"number":27,"answer":"B","context":"Farmers may be forced to (27) ______ their crops or even leave their fields until the weather (28) ______ .","explanation":"Sau be forced to cần động từ nguyên mẫu; abandon their crops nghĩa là buộc phải bỏ cây trồng/ruộng. Trace là lần theo, contain là chứa/kiềm chế và infer là suy luận, đều không diễn tả phản ứng của nông dân khi hạn hán nghiêm trọng."},{"number":28,"answer":"B","context":"Farmers may be forced to (27) ______ their crops or even leave their fields until the weather (28) ______ .","explanation":"Mệnh đề until the weather improves nghĩa là cho đến khi thời tiết khá lên, phù hợp với việc bỏ ruộng tạm thời. Reduces và exposes cần tân ngữ hoặc cho nghĩa sai; remains phải có bổ ngữ để nói thời tiết vẫn ở trạng thái nào đó."},{"number":29,"answer":"C","context":"The impact of a drought can be felt on a/an (29) ______ scale, affecting not only the local population but also the global supply of certain food products, such as (30) ______ and wheat.","explanation":"On an international scale là cụm cố định chỉ phạm vi quốc tế. Dấu hiệu quyết định nằm ở phần sau: hạn hán ảnh hưởng không chỉ dân địa phương mà cả nguồn cung toàn cầu; personal, national hay regional đều hẹp hơn ý được triển khai."},{"number":30,"answer":"B","context":"The impact of a drought can be felt on a/an (29) ______ scale, affecting not only the local population but also the global supply of certain food products, such as (30) ______ and wheat.","explanation":"Cereal là danh từ chỉ ngũ cốc và có thể đứng song song với wheat trong ví dụ về sản phẩm lương thực. Seed quá chung, crop làm cụm ‘crop and wheat’ thiếu cân xứng, còn material không phải loại thực phẩm được nói tới."},{"number":31,"answer":"B","context":"The loss of these important crops can lead to an increase in food prices, (31) ______ affects people everywhere, not just in the drought-affected regions.","explanation":"Sau dấu phẩy cần đại từ quan hệ which để thay cho toàn bộ ý ‘the loss ... can lead to an increase in food prices’ và làm chủ ngữ của affects. That thường không mở mệnh đề quan hệ không xác định sau dấu phẩy; where chỉ nơi chốn và who chỉ người."},{"number":32,"answer":"C","context":"One of the ways to prevent such crises is to have a strong system in place for storing raw materials (32) ______ grain, which can be used when the harvest is poor.","explanation":"Like grain nghĩa là như/chẳng hạn như ngũ cốc, dùng để đưa ví dụ cho raw materials. Such một mình cần cấu trúc such + noun với nghĩa ‘loại ... như vậy’ hoặc such as để nêu ví dụ; A as và D to không nối tự nhiên ở vị trí này."},{"number":33,"answer":"B","context":"Some countries have built advanced ________ (33) to store food supplies during uncertain times.","explanation":"Facilities chỉ các cơ sở/kho được xây dựng để lưu trữ nguồn thực phẩm, khớp với động từ built và mục đích to store food supplies. Abilities không thể xây, còn devices và machines chỉ thiết bị riêng lẻ chứ không diễn tả địa điểm lưu trữ quy mô lớn."},{"number":34,"answer":"C","context":"At the heart of this issue, many experts point to the growing (34) ______ of climate change as the underlying cause of the problem.","explanation":"Cụm the growing impact of climate change nghĩa là tác động ngày càng tăng của biến đổi khí hậu; chính tác động này được xem là nguyên nhân nền tảng của hạn hán. Concern và awareness nói về thái độ/nhận thức của con người, còn result không kết hợp đúng với ý ‘underlying cause’ ở đây."},{"number":35,"answer":"C","context":"As temperatures rise, the weather patterns become more (35) ______ , leading to prolonged periods of extreme weather, including drought.","explanation":"Nhiệt độ tăng làm các kiểu thời tiết trở nên more unpredictable—khó dự đoán hơn—rồi dẫn tới những đợt thời tiết cực đoan kéo dài. Unbelievable và unthinkable đánh giá mức độ khó tin, còn unchangeable trái với việc các kiểu thời tiết đang biến đổi."}]},{"exercise":4,"count":10,"inputKind":"text","choices":[],"instruction":"Ex 4: Fill in the blanks with ONE suitable word.","questions":[{"number":36,"answer":"can/could","context":"Many scientists believe that our strong craving for sugar (36) ______ actually be an addiction, as it activates the brain’s pleasure centers and leaves us wanting more.","explanation":"Giải thích của cô: /may/might/would/will\n\nSau chủ ngữ our strong craving for sugar và trước động từ nguyên mẫu be cần một động từ khuyết thiếu. Can diễn tả khả năng cơn thèm đường thực sự là một dạng nghiện; could giảm mức độ khẳng định, phù hợp với động từ tường thuật believe."},{"number":37,"answer":"related","context":"This addictive quality of sugar is (37) ______ to health problems like high blood pressure and diabetes, with some researchers, (38) ______ as Richard Johnson, identifying sugar as a major culprit.","explanation":"Giải thích của cô: related to\n\nCấu trúc chính xác là be related to + noun, nghĩa là có liên quan đến. Điền related tạo “This addictive quality of sugar is related to health problems...”; to đã có sẵn ngay sau chỗ trống."},{"number":38,"answer":"such","context":"This addictive quality of sugar is (37) ______ to health problems like high blood pressure and diabetes, with some researchers, (38) ______ as Richard Johnson, identifying sugar as a major culprit.","explanation":"Cụm cố định such as + name/example dùng để đưa ví dụ. “Some researchers, such as Richard Johnson, ...” nêu Richard Johnson là một nhà nghiên cứu tiêu biểu; chỉ such được điền vì as đã có trong câu."},{"number":39,"answer":"as/since/because","context":"Historically, our bodies adapted to store sugar as fat (39) ______ early humans had very little food, allowing them to survive during times of scarcity.","explanation":"Giải thích của cô: scarcity (n) sự khan hiếm\n\nChỗ trống nối nguyên nhân: cơ thể người xưa thích nghi để tích đường thành mỡ vì họ có rất ít thức ăn. As, since và because đều có thể mở mệnh đề nguyên nhân early humans had very little food, dù because thể hiện quan hệ nhân quả trực tiếp nhất."},{"number":40,"answer":"However/","context":"(40) ______ , in today’s world, most people have more than enough food, and the excess sugar in our diets may now be harmful.","explanation":"Giải thích của cô: Nevertheless/Nonetheless\n\nCâu trước nói cơ chế tích mỡ từng giúp con người sống sót khi khan hiếm; câu sau chuyển sang hoàn cảnh trái ngược hiện nay, khi phần lớn mọi người có dư thức ăn. Vì vậy cần trạng từ chuyển ý tương phản như However, đặt trước dấu phẩy."},{"number":41,"answer":"have/need","context":"The solution is clear: we (41) ______ to reduce our sugar intake.","explanation":"Giải thích của cô: /ought\n\nSau chỗ trống đã có to reduce, nên have to, need to và ought to đều tạo cấu trúc chỉ sự cần thiết/khuyến nghị: chúng ta phải/cần giảm lượng đường. Ngữ cảnh mở đầu The solution is clear khiến nghĩa nghĩa vụ này phù hợp hơn một động từ miêu tả thông thường."},{"number":42,"answer":"making","context":"Unfortunately, sugar is hard to avoid in modern foods, as it is often used to replace fat in \"healthier\" options, (42) ______ it difficult to maintain a balanced diet.","explanation":"Sau dấu phẩy, making it difficult... là mệnh đề phân từ hiện tại chỉ kết quả của việc đường được dùng thay chất béo. Cấu trúc make + object + adjective cho ta making it difficult to maintain a balanced diet; dùng make hữu hạn sẽ tạo lỗi nối hai mệnh đề không có liên từ."},{"number":43,"answer":"are","context":"In response, some schools (43) ______ making efforts to promote a healthier environment (44) ______ replacing sugary desserts with options like fruit and encouraging physical activity by building exercise facilities, such as walking tracks, for students and the community.","explanation":"Cấu trúc hiện tại tiếp diễn are making efforts diễn tả các trường đang tiến hành nỗ lực. Chủ ngữ some schools số nhiều quyết định dùng are, không phải is; cụm make efforts to + verb là kết hợp từ chuẩn."},{"number":44,"answer":"by","context":"In response, some schools (43) ______ making efforts to promote a healthier environment (44) ______ replacing sugary desserts with options like fruit and encouraging physical activity by building exercise facilities, such as walking tracks, for students and the community.","explanation":"By + V-ing nêu phương thức thực hiện một hành động. Các trường thúc đẩy môi trường lành mạnh “by replacing sugary desserts...” — bằng cách thay món tráng miệng nhiều đường; replacing sau chỗ trống là dấu hiệu ngữ pháp trực tiếp."},{"number":45,"answer":"improve","context":"The battle to reduce sugar intake and (45) ______ health is ongoing.","explanation":"Liên từ and nối hai động từ song song sau the battle to: to reduce sugar intake and improve health. Improve là động từ nguyên mẫu nghĩa là cải thiện, và nêu kết quả mong muốn hợp logic của việc giảm đường."}]},{"exercise":5,"count":19,"inputKind":"mcq","choices":["A","B","C","D"],"instruction":"Ex 5: Read the following passages and answer the questions.","questions":[{"number":46,"answer":"D","context":"→ Câu hỏi tổng quát (Main Idea)","explanation":"Giải thích của cô: → Câu hỏi tổng quát (Main Idea)\n\nToàn bài lần lượt giải thích bất lợi của thú nhỏ ở tầng tán: khó điều hòa thân nhiệt, thua cạnh tranh thức ăn và khó vượt khoảng trống giữa các ngọn cây. Chuỗi lập luận ấy trả lời vì sao động vật lớn có xu hướng chiếm ưu thế ở tầng tán trên (D); A–C chỉ là chi tiết phụ hoặc vấn đề bài không tập trung giải đáp."},{"number":47,"answer":"D","context":"Loài nào ít phổ biến ở tầng tán hơn các nơi khác?","explanation":"Giải thích của cô: Loài nào ít phổ biến ở tầng tán hơn các nơi khác?\n\nĐoạn 1 nói các loài gặm nhấm như “mice and small squirrels are not as prevalent ... in high tropical canopies as ... globally”. Vì vậy mice (D) ít phổ biến hơn; monkeys, cats và porcupines được liệt kê trong nhóm thú leo cỡ vừa/lớn có nhiều ở tầng tán."},{"number":48,"answer":"C","context":"Từ \"they\" thay thế cho từ nào?","explanation":"Giải thích của cô: Từ \"they\" thay thế cho từ nào?\n\nTrong câu “Smaller species ... are not as prevalent ... as they are...”, đại từ they lặp lại chủ ngữ smaller species. Vì thế C đúng; trees, nhóm thú leo cỡ vừa và high tropical canopies không phù hợp cả số tham chiếu lẫn nghĩa so sánh."},{"number":49,"answer":"C","context":"Đặc điểm của thú nhỏ (Đoạn 2)","explanation":"Giải thích của cô: Đặc điểm của thú nhỏ (Đoạn 2)\n\nĐoạn 2 nêu điều kiện trên ngọn cây “may fluctuate” và thú nhỏ “may have trouble maintaining its body temperature”. Điều này chứng minh chúng gặp khó khăn với điều kiện thay đổi (C); đoạn không nói chúng ưa khí hậu ấy, có hình dạng thích nghi đặc biệt hay dùng cây làm nơi trú đủ hiệu quả."},{"number":50,"answer":"B","context":"Lợi thế về kích thước (Đoạn 3)","explanation":"Giải thích của cô: Lợi thế về kích thước (Đoạn 3)\n\nĐoạn 3 nói thú nhỏ dễ len giữa cành nhưng bị thú lớn vượt qua trong cạnh tranh thức ăn; sau đó mô tả gibbon kéo tán lá xuống và loài lớn bẻ/kẹp cành để lấy quả. Các ví dụ trực tiếp cho thấy kích thước lớn là lợi thế khi kiếm thức ăn (B), bác bỏ ý hai nhóm ngang nhau ở D."},{"number":51,"answer":"C","context":"Nghĩa của từ \"typify\"","explanation":"Giải thích của cô: Nghĩa của từ \"typify\"\n\nTrong “wide gaps ... that typify the high canopy”, typify nghĩa là là đặc điểm tiêu biểu/đặc trưng cho tầng tán cao. Characterize (C) giữ đúng nghĩa đó; resemble, protect và divide diễn tả các quan hệ hoàn toàn khác."},{"number":52,"answer":"A","context":"Tại sao thú nhỏ khó nhảy xa (Đoạn 4)?","explanation":"Giải thích của cô: Tại sao thú nhỏ khó nhảy xa (Đoạn 4)?\n\nĐoạn 4 nêu thẳng chuyển động về trước của thú nhỏ “is seriously reduced by the air friction against the relatively large surface area of its body”. Đây chính là A; độ dày cành, lá dày và khả năng dùng chân trước không được đưa ra làm nguyên nhân."},{"number":53,"answer":"D","context":"Nghĩa của từ \"supplement\"","explanation":"Giải thích của cô: Nghĩa của từ \"supplement\"\n\nCụm “supplement their insect diet with fruits or seeds” nghĩa là bổ sung quả hoặc hạt vào chế độ ăn côn trùng. Vì vậy add to (D) là tương đương; replace sẽ hàm ý bỏ thức ăn cũ, còn control và look for không mang nghĩa thêm vào."},{"number":54,"answer":"A","context":"Thuật ngữ được định nghĩa","explanation":"Giải thích của cô: Thuật ngữ được định nghĩa\n\nNgay câu đầu, tác giả viết “The canopy, the upper level of the trees in the rainforest,”: phần chen giữa hai dấu phẩy định nghĩa trực tiếp canopy. Các thuật ngữ warm blooded, terminal leaves và springboard chỉ được sử dụng chứ không được giải nghĩa đầy đủ trong bài."},{"number":55,"answer":"B","context":"Chủ đề chính của bài viết","explanation":"Giải thích của cô: Chủ đề chính của bài viết\n\nBài theo dõi vị trí của phụ nữ Mỹ trong sử liệu: bị bỏ qua ở thế kỷ XVII–XVIII, vẫn ít hiện diện trong thế kỷ XIX, rồi được ghi chép nhưng chủ yếu theo mô hình “great women”. Vì vậy B bao quát toàn văn; D chỉ phản ánh đoạn cuối, còn A và C quá hẹp."},{"number":56,"answer":"B","context":"Nghĩa của từ \"contemporary\"","explanation":"Giải thích của cô: Nghĩa của từ \"contemporary\"\n\nContemporary history of the American Revolution ở đây là tác phẩm lịch sử được viết vào cùng thời kỳ các sự kiện ấy diễn ra. Do đó B “written at that time” đúng; informative, thoughtful và faultfinding là nhận xét về chất lượng/thái độ, không phải thời điểm."},{"number":57,"answer":"B","context":"Tại sao Bradstreet, Warren và Adams được nhắc đến?","explanation":"Giải thích của cô: Tại sao Bradstreet, Warren và Adams được nhắc đến?\n\nBa người được nêu như những phụ nữ có đóng góp thơ ca, lịch sử và ảnh hưởng chính trị đáng kể, nhưng câu tiếp khẳng định “little or no notice was taken of these contributions”. Ví dụ chứng minh ngay cả phụ nữ xuất sắc cũng bị phớt lờ (B); bài không nói chỉ ba người được xuất bản hay thơ dễ được chấp nhận hơn."},{"number":58,"answer":"D","context":"Nghĩa của từ \"celebratory\"","explanation":"Giải thích của cô: Nghĩa của từ \"celebratory\"\n\nTác giả đối chiếu celebratory với việc các sử gia “were uncritical”, nên từ này chỉ lối viết ca ngợi, tán dương hơn là phân tích phê phán. Full of praise (D) đúng; từ không có nghĩa đơn giản là liên quan tiệc tùng, tôn giáo hay nghiêm túc."},{"number":59,"answer":"B","context":"Từ \"they\" thay thế cho từ nào?","explanation":"Giải thích của cô: Từ \"they\" thay thế cho từ nào?\n\nHai câu liền nhau có chủ ngữ “These writers ... were amateur historians. Their writings ... and they were uncritical...”. They quay lại these writers/female authors, tức authors (B), chứ không thể là efforts, counterparts hay sources."},{"number":60,"answer":"C","context":"Điểm yếu của sử học thế kỷ 19 là gì?","explanation":"Giải thích của cô: Điểm yếu của sử học thế kỷ 19 là gì?\n\nĐoạn 2 chỉ rõ các tác giả “were uncritical in their selection and use of sources”: họ không đánh giá nguồn một cách phê phán. Vì vậy thông tin làm nền cho các công trình có thể không đáng tin cậy (C); các vấn đề về hoạt động hằng ngày, tiền trong chính trị hay chất lượng giấy không được nêu."},{"number":61,"answer":"C","context":"Tổ chức phụ nữ thế kỷ 19 thường thu thập tài liệu nào?","explanation":"Giải thích của cô: Tổ chức phụ nữ thế kỷ 19 thường thu thập tài liệu nào?\n\nĐoạn 3 cho biết họ lưu “personal correspondence, newspaper clippings, and souvenirs” về hoạt động của phụ nữ. Thư một người mẹ gửi con gái về vấn đề gia đình (C) là thư từ cá nhân của phụ nữ bình thường; kết quả bầu cử, tiểu sử John Adams và sách về sinh viên nổi tiếng không phù hợp trọng tâm ấy."},{"number":62,"answer":"C","context":"Các bộ sưu tập sử liệu phụ nữ được dùng làm gì sau này?","explanation":"Giải thích của cô: Các bộ sưu tập sử liệu phụ nữ được dùng làm gì sau này?\n\nBài nói các nguồn trong hai bộ sưu tập “have provided valuable materials for later generations of historians”. Vì được thu thập ở thế kỷ XIX, chúng cung cấp thông tin quý cho các nhà nghiên cứu lịch sử thế kỷ XX về sau (C); không có bằng chứng chúng được xuất bản thành bách khoa thư, lập khóa học đương thời hay chia sẻ khắp các trường."},{"number":63,"answer":"D","context":"Vai trò nào KHÔNG được nhắc đến đối với \"những phụ nữ vĩ đại\"?","explanation":"Giải thích của cô: Vai trò nào KHÔNG được nhắc đến đối với \"những phụ nữ vĩ đại\"?\n\nĐoạn cuối liệt kê rõ reformers, activists working for women’s right to vote, và authors. Politicians không nằm trong danh sách, nên D là phương án EXCEPT; ba lựa chọn còn lại đều có bằng chứng nguyên văn."},{"number":64,"answer":"A","context":"Nghĩa của từ \"representative\"","explanation":"Giải thích của cô: Nghĩa của từ \"representative\"\n\nCác nữ lãnh đạo công chúng “were not representative ... of ordinary women”, tức đời sống của họ không điển hình cho đại đa số phụ nữ bình thường. Typical (A) giữ đúng nghĩa; satisfied, supportive và distinctive không diễn tả tính đại diện."}]}]}</script>

  <script>/* RI2 grading is deliberately deterministic: only approved keys and explicit

    fortieth: "forty", fiftieth: "fifty", sixtieth: "sixty", seventieth: "seventy",
    eightieth: "eighty", ninetieth: "ninety", hundredth: "hundred", thousandth: "thousand",
    millionth: "million", billionth: "billion" });
  const own = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
  const cardinalWord = word => own(SMALL, word) || own(TENS, word) || own(SCALES, word) || word === "hundred";
  const numericWord = word => cardinalWord(word) || own(ORDINALS, word);

  function inputText(value) {
    if (typeof value === "string") return value;
    if (typeof value === "number" && Number.isFinite(value)) return String(value);
    return "";
  }

  function basicText(value) {
    return inputText(value).normalize("NFKC").toLowerCase()
      .replace(/[\u200B-\u200D\uFEFF\u00AD]/g, "")
      .replace(/[‘’‛ʼ′]/g, "'")
      .replace(/[‐‑‒–—―−]/g, "-")
      .replace(/\s+/g, " ").trim();
  }

  function unwrap(value) {
    const pairs = { '"': '"', "'": "'", "“": "”", "‘": "’", "(": ")", "[": "]", "{": "}" };
    let result = value.trim();
    // Only a balanced wrapper is presentation punctuation, not a missing bracket.
    for (let depth = 0; depth < 4 && result.length > 1; depth += 1) {
      if (pairs[result[0]] !== result[result.length - 1]) break;
      result = result.slice(1, -1).trim();
    }
    return result;
  }

  function meridiem(value) {
    return value.replace(/(?<![a-z])([ap])\s*\.?\s*m\s*\.?(?![a-z])/g, "$1m");
  }

  function policyFor(expected, question) {
    const text = basicText(expected);
    const timeText = meridiem(text);
    const time = /\bo\s*'?\s*clock\b/.test(timeText) ? "oclock"
      : /(?<![a-z])[ap]m(?![a-z])/.test(timeText) ? "meridiem"
      : /\b\d{1,2}\s*:\s*\d{2}\b/.test(timeText) ? "clock" : "none";
    let numbers = /\d/.test(text);
    // Standalone One/First and anaphoric "the one" are grammatical keys in RI2.
    // A caller may explicitly opt in for a numeric-only word answer.
    const quantity = text.replace(/^(?:at least|more than|less than|nearly|about|approximately|over|under|up to|around)\s+/, "");
    const words = quantity.replace(/-/g, " ").split(/\s+/);
    let length = 0;
    while (length < words.length && (numericWord(words[length]) || words[length] === "and")) length += 1;
    const qualifier = quantity !== text;
    const grammaticalTail = /^(?:of|that|which|who|whom|to|by|with|for|as|than)$/;
    if (length > 0 && (qualifier || (length < words.length && !grammaticalTail.test(words[length])) || length > 1)) numbers = true;
    if (question && typeof question.numberFormatting === "boolean") numbers = question.numberFormatting;
    return { numbers, time, degrees: /°|º|˚|\bdegrees\b/.test(inputText(expected).toLowerCase()) };
  }

  function surface(value, policy) {
    let text = inputText(value);
    if (policy.degrees) text = text.replace(/[º˚]/g, "°");
    text = meridiem(basicText(unwrap(text)));
    // A single final sentence mark is harmless; internal numeric punctuation stays.
    text = text.replace(/[.!?,;:]$/, "").trim();
    text = unwrap(text)
      .replace(/(?<=[a-z])\s*-\s*(?=[a-z0-9])|(?<=[0-9])\s*-\s*(?=[a-z])/g, " ")
      .replace(/%/g, " percent ")
      .replace(/\bper\s+cent\b/g, "percent")
      .replace(/\s*\/\s*/g, "/")
      .replace(/\s*,\s*/g, ", ");
    if (policy.time === "oclock") text = text.replace(/\bo\s*'?\s*clock\b/g, "oclock");
    return text.replace(/\s+/g, " ").trim();
  }

  function parseCardinal(words) {
    let total = 0, group = 0, previous = "start", previousSmall = -1, lastScale = Infinity;
    for (const word of words) {

      const correct = node("span", "answer-key-row", "Đáp án đúng: ");
      correct.appendChild(node("b", "", plainText(result.answer)));
      key.append(mine, correct);
      const alternatives = Array.isArray(result.acceptedAnswers) ? result.acceptedAnswers.map(plainText).filter((answer) => answer && answer !== plainText(result.answer)) : [];
      if (alternatives.length) key.appendChild(node("small", "", "Cũng chấp nhận: " + alternatives.join(" · ")));
      review.appendChild(key);
      if (plainText(question.context)) {
        review.appendChild(node("p", "review-label", "Ngữ cảnh câu hỏi"));
        review.appendChild(node("p", "question-context", plainText(question.context)));
      }
      review.appendChild(node("p", "review-label", "Giải thích"));
      review.appendChild(node("p", "explanation", cleanExplanation(result.explanation) || "Chưa có giải thích cho câu này."));
      card.appendChild(review);
    }
    return card;
  }

  function cleanExplanation(value) {
    return plainText(value).replace(/^Giải thích của cô\s*:\s*/i, "");
  }

  function setReviewMode(mode, questionNumber) {
    reviewMode = mode === "all" ? "all" : "wrong";
    renderAnswers();
    $("answer-scroll").scrollTop = 0;
    if (questionNumber !== undefined) {
      const card = [...document.querySelectorAll("[data-question]")].find((item) => item.dataset.question === String(questionNumber));
      if (card) {
        card.scrollIntoView({ block: "start" });
        card.focus({ preventScroll: true });
      }
    }
  }

  function renderResultSummary() {
    const target = $("result-summary");
    target.replaceChildren();
    target.hidden = !attempt.submittedAt || !attempt.grade || !attempt.grade.complete;
    if (target.hidden) return;
    const grade = attempt.grade;
    const box = node("section", "result-summary");
    box.setAttribute("aria-labelledby", "result-heading");
    box.appendChild(node("p", "result-kicker", "KẾT QUẢ"));
    const numbers = node("div", "result-numbers");
    const score = node("div", "result-score", String(grade.score));
    score.appendChild(node("small", "", " / " + grade.total));
    numbers.append(score, node("div", "result-percent", String(grade.percent) + "%"));
    box.appendChild(numbers);
    const title = node("h3", "", grade.score === grade.total ? "Hoàn thành tất cả các câu" : grade.wrong.length + " câu cần sửa");
    title.id = "result-heading";
    box.appendChild(title);
    if (grade.wrong.length) {
      const wrongLabel = node("p", "result-wrong-label", "CÂU SAI");
      const jumps = node("div", "wrong-jumps");
      grade.wrong.forEach((result) => {
        const button = node("button", "", String(result.number));
        button.type = "button";
        button.setAttribute("aria-label", "Xem câu sai " + result.number);
        button.addEventListener("click", () => setReviewMode("wrong", result.number));
        jumps.appendChild(button);
      });
      box.append(wrongLabel, jumps);
    }
    const toggles = node("div", "review-toggle");
    const wrongButton = node("button", reviewMode === "wrong" ? "active" : "", "CÂU SAI (" + grade.wrong.length + ")");
    wrongButton.type = "button";
    wrongButton.hidden = grade.wrong.length === 0;
    wrongButton.setAttribute("aria-pressed", String(reviewMode === "wrong"));
    wrongButton.addEventListener("click", () => setReviewMode("wrong"));
    const allButton = node("button", reviewMode === "all" ? "active" : "", "TẤT CẢ (" + grade.total + ")");
    allButton.type = "button";
    allButton.setAttribute("aria-pressed", String(reviewMode === "all"));
    allButton.addEventListener("click", () => setReviewMode("all"));
    toggles.append(wrongButton, allButton);
    box.appendChild(toggles);
    target.appendChild(box);
  }

  function renderDelivery() {
    const target = $("delivery-status");
    target.replaceChildren();
    const pending = !!attempt && ["sending", "pending"].includes(attempt.delivery && attempt.delivery.state);
    $("new-attempt").disabled = pending;
    $("new-attempt").textContent = pending ? "ĐANG LƯU ĐIỂM…" : "LÀM MỘT LƯỢT MỚI ↻";
    const state = attempt.delivery && attempt.delivery.state;
    target.hidden = !attempt || !attempt.submittedAt || !["unconfirmed", "not-configured", "test-mode"].includes(state);
    if (target.hidden) return;
    const messages = {
      unconfirmed: ["Chưa lưu được điểm", "Vui lòng kiểm tra mạng hoặc báo giáo viên."],
      "not-configured": ["Chưa lưu được điểm", "Vui lòng báo giáo viên."],
      "test-mode": ["CHẾ ĐỘ KIỂM THỬ — không ghi điểm", ""]
    };
    const message = messages[state] || messages.unconfirmed;
    target.className = "delivery" + (["unconfirmed", "not-configured"].includes(state) ? " is-warning" : "");
    target.appendChild(node("strong", "", message[0]));
    if (message[1]) target.appendChild(node("span", "", message[1]));
  }

  async function withSubmissionLock(action) {
    if (navigator.locks && typeof navigator.locks.request === "function") {
      let actionStarted = false;
      try {
        return await navigator.locks.request(storageBase + ":submit:" + attempt.id, { mode: "exclusive" }, () => {
          actionStarted = true;
          return action();
        });
      } catch (error) {
        if (actionStarted) throw error;
        // Some embedded/partitioned contexts expose Web Locks but reject access.
        return action();
      }
    }
    return action();
  }

  async function submitAttempt(event) {
    event.preventDefault();
    if (!attempt || attempt.submittedAt || submitting) return;
    $("form-error").hidden = true;
    if (answeredCount() !== questions.length) {
      $("form-error").textContent = "Bạn cần trả lời đủ toàn bộ câu trước khi chấm bài.";
      $("form-error").hidden = false;
      const missing = questions.find((question) => !plainText(attempt.answers[String(question.number)]));
      const input = missing && $("answer-" + missing.number);
      if (input) input.focus();
      return;
    }
    submitting = true;
    renderAnswers();
    let shouldSend = false;
    try {
      shouldSend = await withSubmissionLock(() => {
        const saved = readStorage(attemptKey(attempt.id));
        if (validStoredAttempt(saved) && saved.submittedAt) {
          attempt = saved;
          if (["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) attempt.delivery = { state: "unconfirmed", reason: "already-submitted" };
          return false;
        }
        const grade = globalThis.RI2Grading.gradeAttempt(unit, attempt.answers);
        if (!grade.complete) throw new Error("incomplete");
        attempt.grade = grade;
        attempt.submittedAt = new Date().toISOString();
        attempt.delivery = { state: "sending", attemptedAt: attempt.submittedAt };
        persist();
        return true;
      });
    } catch (_) {
      $("form-error").textContent = "Chưa thể chấm bài. Các câu trả lời vẫn được giữ; vui lòng kiểm tra lại hoặc báo giáo viên.";
      $("form-error").hidden = false;
    } finally {
      submitting = false;
      renderAnswers();
      if (attempt.submittedAt) {
        $("answer-scroll").scrollTop = 0;
        $("answer-scroll").focus({ preventScroll: true });
      }
    }
    if (shouldSend) await sendScore(attempt.id);
  }

  function configuredFormSink() {
    if (course.testing === true) return null;
    const sink = course.scoreSink;
    if (!sink || sink.kind !== "google-form" || !sink.entries || typeof sink.formResponseUrl !== "string") return null;
    try {
      const url = new URL(sink.formResponseUrl);
      if (url.protocol !== "https:" || url.hostname !== "docs.google.com" || !/^\/forms\/d\/(?:e\/)?[^/]+\/formResponse\/?$/.test(url.pathname)) return null;
      const required = ["name", "total", "assignmentCode", "lesson", "activity", "className", "percent", "score", "wrong"];
      if (required.some((field) => !/^entry\.\d+$/.test(sink.entries[field] || ""))) return null;
      return sink;
    } catch (_) { return null; }
  }

  function scoreBody(sink, snapshot) {
    const grade = snapshot.grade;
    const values = {
      name: snapshot.identity.name,
      className: snapshot.identity.className,
      total: String(grade.total),
      assignmentCode: plainText(unit.testCode),
      lesson: unitLabel(),
      activity: "Làm lại đề · Lượt " + snapshot.number + " · Mã lượt " + snapshot.id + " · " + snapshot.submittedAt,
      percent: String(grade.percent),
      score: String(grade.score),
      wrong: grade.wrong.length ? grade.wrong.map((result) => "Câu " + result.number + ": " + plainText(result.actual) + " → " + plainText(result.answer)).join("\n") : "Không có câu sai"
    };
    const body = new URLSearchParams();
    Object.keys(values).forEach((field) => body.set(sink.entries[field], values[field]));
    // Only use additional form mappings when explicitly supplied by the course configuration.
    const optional = { attemptId: snapshot.id, attemptNumber: String(snapshot.number), submittedAt: snapshot.submittedAt, startedAt: snapshot.startedAt };
    Object.keys(optional).forEach((field) => { if (/^entry\.\d+$/.test(sink.entries[field] || "")) body.set(sink.entries[field], optional[field]); });
    return body;
  }

  async function sendScore(id) {
    if (!attempt || attempt.id !== id || !attempt.submittedAt) return;
    if (course.testing === true) {
      attempt.delivery = { state: "test-mode" };
      persist();
      renderDelivery();
      return;
    }
    const sink = configuredFormSink();
    if (!sink) {
      attempt.delivery = { state: "not-configured" };
      persist();
      renderDelivery();
      return;
    }
    const snapshot = JSON.parse(JSON.stringify(attempt));
    const controller = typeof AbortController === "function" ? new AbortController() : null;
    const timeout = controller ? setTimeout(() => controller.abort(), 25000) : null;
    try {
      // Google Forms is intentionally no-cors: an opaque response is NOT a storage confirmation.
      await fetch(sink.formResponseUrl, { method: "POST", mode: "no-cors", credentials: "omit", body: scoreBody(sink, snapshot), ...(controller ? { signal: controller.signal } : {}) });
      snapshot.delivery = { state: "sent-unverified", attemptedAt: snapshot.delivery.attemptedAt, requestFinishedAt: new Date().toISOString() };
    } catch (_) {
      snapshot.delivery = { state: "unconfirmed", attemptedAt: snapshot.delivery.attemptedAt, reason: "network" };
    } finally {
      if (timeout !== null) clearTimeout(timeout);
    }
    try { localStorage.setItem(attemptKey(id), JSON.stringify(snapshot)); } catch (_) { storageAvailable = false; }
    if (attempt && attempt.id === id) {
      attempt.delivery = snapshot.delivery;
      persist();
      renderDelivery();
    }
  }

  function startNewAttempt() {
    if (!attempt || !attempt.submittedAt || submitting || ["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) return;
    attempt = createAttempt(Number(attempt.number || 1) + 1);
    reviewMode = "wrong";
    persist({ makeCurrent: true });
    $("form-error").hidden = true;
    renderAnswers();
    $("answer-scroll").scrollTop = 0;
    const first = questions[0] && $("answer-" + questions[0].number);
    if (first) first.focus({ preventScroll: true });
  }

  function receiveStorageUpdate(event) {
    if (!attempt || !storageBase || event.key !== attemptKey(attempt.id) || !event.newValue) return;
    try {
      const saved = JSON.parse(event.newValue);
      if (!validStoredAttempt(saved) || !saved.submittedAt) return;
      attempt = saved;
      if (["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) attempt.delivery = { state: "unconfirmed", reason: "another-tab" };
      renderAnswers();
    } catch (_) { /* Ignore unrelated or incomplete browser-storage events. */ }
  }

  initialize();
}());
</script>
