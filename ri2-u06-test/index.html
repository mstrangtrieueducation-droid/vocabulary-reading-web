  <script id="ri2-unit-data" type="application/json">{"unit":6,"title":"READING INTENSIVE 2 · UNIT 6","testCode":"RI2-U06","total":63,"studentPreviewUrl":"https://docs.google.com/document/d/1_r83N_mx3gacYxuG0YVNzRiLvKsfAhkArFO9sx9fF98/preview","sections":[{"exercise":1,"count":15,"inputKind":"matching","choices":["A","B","C","D","E","F","G","H","I","K","L","M","O","P","Q"],"instruction":"Ex 1: Match the words in Column A with their correct definitions in Column B. Write the letter of the definition next to the corresponding word.","questions":[{"number":1,"answer":"Q","context":"stun (v)","explanation":"Giải thích của cô: Stun (v): Làm choáng váng, kinh ngạc đến mức không kịp phản ứng.\nStun là động từ chỉ việc làm ai sốc hoặc ngạc nhiên đến mức nhất thời không phản ứng được. Định nghĩa Q lặp đúng hai dấu hiệu ‘shock or surprise’ và ‘unable to react for a moment’."},{"number":2,"answer":"O","context":"victim (n)","explanation":"Giải thích của cô: Victim (n): Nạn nhân, người chịu thiệt hại bởi tai nạn hoặc tội phạm.\nVictim là danh từ chỉ người bị tổn hại bởi tai nạn, tội phạm hoặc sự việc xấu. Vì vậy từ này khớp trực tiếp với định nghĩa O."},{"number":3,"answer":"P","context":"shallow (a)","explanation":"Giải thích của cô: Shallow (a): Nông, cạn (về mặt nước) hoặc hời hợt (về mặt ý nghĩ).\nShallow là tính từ trái nghĩa với deep, dùng được cho độ sâu thực hoặc chiều sâu ý tưởng. Định nghĩa P nêu đúng ‘doesn't have much depth’ ở cả water, thought và idea."},{"number":4,"answer":"L","context":"encounter (v)","explanation":"Giải thích của cô: Encounter (v): Chạm trán, gặp phải một cách bất ngờ.\nEncounter là động từ chỉ gặp hoặc trải qua điều gì, thường bất ngờ. Định nghĩa L có đúng các nét nghĩa ‘meet or experience’ và ‘unexpectedly’, nên chọn L."},{"number":5,"answer":"K","context":"significant (a)","explanation":"Giải thích của cô: Significant (a): Quan trọng, đáng kể, có ý nghĩa lớn.\nSignificant là tính từ nói một điều có tầm quan trọng hoặc ý nghĩa đáng kể. Định nghĩa K đối chiếu ‘a lot of importance or meaning’ với ‘not ... small or unimportant’, nên tương ứng chính xác."},{"number":6,"answer":"M","context":"speculation (n)","explanation":"Giải thích của cô: Speculation (n): Sự suy đoán khi chưa có đầy đủ thông tin.\nSpeculation là danh từ chỉ việc hình thành phỏng đoán khi chưa có đủ sự thật. Đó chính là ‘the act of guessing or forming ideas ... without having all the facts’ trong M."},{"number":7,"answer":"H","context":"horror (n)","explanation":"Giải thích của cô: Horror (n): Sự kinh hãi, cảm giác sợ hãi tột độ.\nHorror là danh từ chỉ cảm giác sợ hãi, sốc hoặc ghê tởm rất mạnh trước điều đáng sợ. Định nghĩa H mô tả đầy đủ ba sắc thái ấy."},{"number":8,"answer":"F","context":"construct (v)","explanation":"Giải thích của cô: Construct (v): Xây dựng, lắp ráp một cách cẩn thận.\nConstruct là động từ nghĩa là xây hoặc ghép các bộ phận thành một chỉnh thể theo cách có tổ chức. Vì vậy ghép với F: ‘To build or put something together ... carefully and organized.’"},{"number":9,"answer":"I","context":"remarkable (a)","explanation":"Giải thích của cô: Remarkable (a): Đáng chú ý, khác thường hoặc gây ấn tượng mạnh.\nRemarkable là tính từ chỉ điều khác thường hoặc ấn tượng đến mức đáng được chú ý. Nội dung ấy trùng với định nghĩa I."},{"number":10,"answer":"G","context":"conserve (v)","explanation":"Giải thích của cô: Conserve (v): Bảo tồn, giữ gìn để sử dụng trong tương lai.\nConserve là động từ chỉ bảo vệ một nguồn lực khỏi bị hại, lãng phí hoặc phá hủy để còn dùng về sau. Định nghĩa G chứa đầy đủ quan hệ mục đích đó."},{"number":11,"answer":"D","context":"force (n)","explanation":"Giải thích của cô: Force (n): Lực, sức mạnh có thể làm thay đổi sự vật.\nForce ở đây là danh từ chỉ sức mạnh có thể làm một việc xảy ra hoặc làm vật thay đổi, thường theo nghĩa vật lý. Vì vậy D là định nghĩa tương ứng."},{"number":12,"answer":"A","context":"occupy (v)","explanation":"Giải thích của cô: Occupy (v): Chiếm giữ, kiểm soát một vị trí hoặc không gian.\nOccupy là động từ chỉ chiếm hoặc kiểm soát một nơi/không gian, có thể trong một khoảng thời gian. Định nghĩa A diễn đạt đúng nghĩa này."},{"number":13,"answer":"E","context":"fiction (n)","explanation":"Giải thích của cô: Fiction (n): Viễn tưởng, những câu chuyện hư cấu không có thật.\nFiction là danh từ chỉ tác phẩm/câu chuyện được tưởng tượng, không dựa trên người hoặc sự kiện có thật. Do đó ghép với E."},{"number":14,"answer":"B","context":"consequence (n)","explanation":"Giải thích của cô: Consequence (n): Hậu quả, kết quả của một hành động trước đó.\nConsequence là danh từ chỉ kết quả phát sinh từ hành động hoặc sự kiện trước. Định nghĩa B dùng đúng quan hệ nhân–quả ‘follows because of what has been done before’."},{"number":15,"answer":"C","context":"release (v)","explanation":"Giải thích của cô: Release (v): Giải phóng, thả tự do hoặc đưa ra sử dụng.\nRelease là động từ có thể là thả người/vật ra hoặc công bố, đưa thứ gì đó ra cho người khác dùng. Hai nghĩa này đều xuất hiện trong định nghĩa C."}]},{"exercise":2,"count":10,"inputKind":"text","choices":[],"instruction":"Ex 2: Fill in the blanks with the following words: state, speculate, indeed, curious, approach, temptation, horrible, consequently, conservationist, discharge.","questions":[{"number":16,"answer":"state","context":"The doctor will ________ whether the patient needs surgery after running some tests.","explanation":"Sau will phải là động từ nguyên mẫu; state nghĩa là nói/nêu rõ một kết luận. Câu hoàn chỉnh: ‘The doctor will state whether the patient needs surgery after running some tests.’ Mệnh đề whether cho biết nội dung bác sĩ sẽ xác định và phát biểu."},{"number":17,"answer":"horrible","context":"The movie was so ________ that many people left the theater before it ended.","explanation":"Sau was so cần tính từ; horrible mô tả bộ phim rất kinh khủng/tệ hại. Câu hoàn chỉnh: ‘The movie was so horrible that many people left the theater before it ended.’ Cấu trúc so + adjective + that nêu mức độ dẫn đến kết quả khán giả bỏ về."},{"number":18,"answer":"speculate","context":"We can ________ that the weather will be better tomorrow based on the current forecast.","explanation":"Sau can dùng động từ nguyên mẫu speculate, nghĩa là suy đoán khi chưa chắc chắn. Câu hoàn chỉnh: ‘We can speculate that the weather will be better tomorrow based on the current forecast.’ Dữ liệu dự báo chỉ làm cơ sở phỏng đoán, chưa phải sự thật."},{"number":19,"answer":"curious","context":"Sarah was so ________ about the new mystery novel that she finished reading it in one sitting.","explanation":"Curious là tính từ đứng sau was so; cấu trúc curious about something nghĩa là tò mò về điều gì. Câu hoàn chỉnh: ‘Sarah was so curious about the new mystery novel that she finished reading it in one sitting.’ Việc đọc hết một mạch là kết quả của sự tò mò."},{"number":20,"answer":"approach","context":"His ________ to life after being injured in the accident is quite remarkable.","explanation":"Sau tính từ sở hữu His cần danh từ; approach to life là cách một người tiếp cận/đối diện cuộc sống. Câu hoàn chỉnh: ‘His approach to life after being injured in the accident is quite remarkable.’"},{"number":21,"answer":"indeed","context":"The team arrived late, but ________ they managed to win the game.","explanation":"Indeed là trạng từ nhấn mạnh rằng một điều thực sự xảy ra, nhất là khi điều ấy đáng ngạc nhiên. Câu hoàn chỉnh: ‘The team arrived late, but indeed they managed to win the game.’ But tạo tương phản giữa đến muộn và vẫn thắng."},{"number":22,"answer":"discharge","context":"The factory was required to ________ its waste materials into a safer disposal system.","explanation":"Sau was required to phải dùng động từ nguyên mẫu discharge; discharge waste into ... nghĩa là xả chất thải vào một hệ thống/nơi tiếp nhận. Câu hoàn chỉnh: ‘The factory was required to discharge its waste materials into a safer disposal system.’"},{"number":23,"answer":"consequently","context":"The project was delayed, and ________, the deadlines were pushed forward.","explanation":"Consequently là trạng từ nối chỉ kết quả. Câu theo nguồn: ‘The project was delayed, and consequently, the deadlines were pushed forward.’ Việc thay đổi hạn chót được trình bày là hệ quả của dự án bị chậm."},{"number":24,"answer":"conservationist","context":"A passionate ________ spoke at the event, emphasizing the importance of protecting wildlife.","explanation":"Sau a passionate cần danh từ đếm được số ít chỉ người. Conservationist là nhà bảo tồn: ‘A passionate conservationist spoke at the event, emphasizing the importance of protecting wildlife.’ Nội dung bảo vệ động vật hoang dã xác nhận nghề/vai trò này."},{"number":25,"answer":"temptation","context":"They faced a strong ________ to eat the delicious cake, but decided to resist it.","explanation":"Sau a strong cần danh từ; temptation to do something là sự cám dỗ muốn làm gì. Câu hoàn chỉnh: ‘They faced a strong temptation to eat the delicious cake, but decided to resist it.’ Đại từ it cũng quy chiếu về temptation."}]},{"exercise":3,"count":10,"inputKind":"mcq","choices":["A","B","C","D"],"instruction":"Ex 3: Read the passage below and choose the correct word from the options to fill in the blanks.","questions":[{"number":26,"answer":"D","context":"Whales are some of the most awe-inspiring (26) ______ on Earth, with a number of amazing truths about them that highlight their remarkable nature.","explanation":"Sau ‘some of the most awe-inspiring’ cần danh từ số nhiều chỉ các sinh vật; creatures đáp ứng cả ngữ pháp lẫn nghĩa khi nói về cá voi. Creators là người/vật sáng tạo, creativities là khả năng sáng tạo, creations là sản phẩm được tạo ra."},{"number":27,"answer":"D","context":"The blue whale, in (27) __________ , can reach lengths of up to 100 feet and weigh as much as 200 tons—more than any dinosaur ever did.","explanation":"Đề đã có sẵn giới từ in trước ô trống, nên chọn fact để tạo trạng từ nối in fact = ‘thực tế là/quả thật’: ‘The blue whale, in fact, can reach lengths of up to 100 feet ...’. Short và general tạo những cụm có nghĩa khác; particular sẽ tạo in particular, một cách nêu trường hợp tiêu biểu, nhưng đáp án nguồn ưu tiên sắc thái khẳng định sự thật của D."},{"number":28,"answer":"B","context":"(28) __________ their massive size, these gentle giants survive primarily by consuming tiny creatures like krill, which they filter through their baleen plates.","explanation":"In spite of + noun phrase diễn tả nhượng bộ: dù có kích thước khổng lồ, cá voi lại sống chủ yếu nhờ sinh vật rất nhỏ như krill. Due to sẽ biến kích thước thành nguyên nhân, còn Instead of và According to sai quan hệ nghĩa."},{"number":29,"answer":"C","context":"They use a (29) __________ of vocalizations, including songs, clicks, and whistles, to communicate with each other.","explanation":"Collocation a variety of + danh từ số nhiều nghĩa là nhiều loại: ‘a variety of vocalizations, including songs, clicks, and whistles’. Collection có thể chỉ bộ sưu tập nhưng không tự nhiên bằng trong ngữ cảnh kỹ năng giao tiếp; sum và deal không đi trong cấu trúc này."},{"number":30,"answer":"C","context":"Some species, like the humpback whale, are famous for their long, complex songs, (30) __________ can be heard underwater over vast distances.","explanation":"Dấu phẩy mở mệnh đề quan hệ không xác định bổ sung cho danh từ songs, nên dùng which: ‘songs, which can be heard ...’. That không dùng sau dấu phẩy trong mệnh đề này; what không có tiền ngữ; whom chỉ người."},{"number":31,"answer":"A","context":"Another fascinating aspect of whales is their ability to (31) __________ long distances.","explanation":"Migrate nghĩa là di cư theo mùa trên quãng đường dài, đúng với việc các loài cá voi đi hàng nghìn dặm giữa nơi kiếm ăn và sinh sản. Communicate, adapt và reproduce không thể đi trực tiếp với ‘long distances’ theo nghĩa câu."},{"number":32,"answer":"C","context":"Many whale species, including the gray whale and humpback whale, travel thousands of miles each year (32) __________ their feeding grounds in colder waters and their breeding grounds in warmer waters.","explanation":"Cấu trúc between A and B dùng cho sự di chuyển qua lại giữa hai địa điểm: ‘between their feeding grounds ... and their breeding grounds ...’. Among dùng cho nhiều đối tượng không ghép cặp; from cần đi cùng to."},{"number":33,"answer":"B","context":"They (33) __________ behaviors such as cooperation, empathy, and even grief.","explanation":"Exhibit behaviors là collocation nghĩa là thể hiện các hành vi. Câu liệt kê cooperation, empathy và grief làm ví dụ; suggest chỉ gợi ý, reduce là giảm, allow cần tân ngữ rồi động từ."},{"number":34,"answer":"C","context":"Some studies suggest that whales have close family bonds, with mothers and their calves (34) __________ together for years.","explanation":"Sau with + danh từ có thể dùng V-ing để mô tả trạng thái đi kèm: ‘with mothers and their calves staying together for years’. To stay không phù hợp với cấu trúc hoàn cảnh này; stay dạng chia sẽ cần một mệnh đề độc lập."},{"number":35,"answer":"B","context":"Overall, whales are extraordinary animals, not only because of their immense size but also owing to their complex behaviors and incredible adaptations that (35) __________ them some of the most fascinating living forms on the planet.","explanation":"Cấu trúc make + tân ngữ + cụm danh từ/tính từ: adaptations that make them some of the most fascinating living forms. Help thường cần (to) be, let cần động từ nguyên mẫu, còn keep cần một trạng thái có thể duy trì."}]},{"exercise":4,"count":10,"inputKind":"text","choices":[],"instruction":"Ex 4: Fill in the blanks with ONE suitable word.","questions":[{"number":36,"answer":"referred","context":"Coral reefs are often (36) __________ to as “cities beneath the sea,” housing a variety of marine life.","explanation":"Cấu trúc bị động refer to A as B nghĩa là gọi A là B. Với are often phía trước, cần quá khứ phân từ referred: ‘Coral reefs are often referred to as “cities beneath the sea”.’"},{"number":37,"answer":"have","context":"Over millions of years, coral polyps (37) __________ lived and died, forming limestone structures that have been used in human construction, such as the Great Pyramids of Egypt.","explanation":"Cụm thời gian over millions of years kéo dài từ quá khứ tới hiện tại, nên dùng hiện tại hoàn thành: ‘coral polyps have lived and died’. Chủ ngữ polyps số nhiều dùng have, và trợ động từ này chi phối cả lived lẫn died."},{"number":38,"answer":"however/neverthelesss/nonetheless","context":"Reefs, (38) __________ , are much larger in scale, and some are even bigger than the most impressive human-made buildings.","explanation":"Khoảng trống là trạng từ chen giữa hai dấu phẩy để nêu tương phản: các cấu trúc đá vôi đã được dùng trong công trình của con người; tuy nhiên, rạn san hô lớn hơn rất nhiều. However, nevertheless hoặc nonetheless đều có thể đảm nhiệm chức năng nối này."},{"number":39,"answer":"are","context":"Living coral reefs, found in warm, shallow oceans, (39) __________ vital to marine ecosystems, as they occupy a small area of the ocean floor yet sustain 25% of marine life.","explanation":"Chủ ngữ Living coral reefs là số nhiều và phần sau vital là tính từ vị ngữ, nên cần are: ‘Living coral reefs ... are vital to marine ecosystems.’"},{"number":40,"answer":"many/some/certain/those/these/such","context":"Unfortunately, (40) __________ precious reefs face numerous threats.","explanation":"Khoảng trống đứng trước danh từ số nhiều precious reefs nên cần một từ hạn định. Many/some/certain nói một lượng/nhóm rạn san hô; these/those chỉ các rạn vừa được nhắc; such nhấn mạnh loại rạn quý như vậy. Tất cả các phương án nguồn liệt kê đều tạo câu đúng ngữ pháp trong những cách hiểu tương ứng."},{"number":41,"answer":"directly","context":"Human activities, such as coral extraction for jewelry-making or aquarium filling, harm reefs (41) __________ causing physical damage.","explanation":"Khoảng trống bổ nghĩa cho V-ing causing nên cần trạng từ directly: ‘harm reefs directly, causing physical damage’. Directly nhấn mạnh hoạt động khai thác san hô gây tổn hại trực tiếp chứ không qua một chuỗi trung gian."},{"number":42,"answer":"another","context":"Pollution is (42) __________ significant danger, as chemicals from floods and runoff can degrade water quality, harming reefs like the Great Barrier Reef in Australia.","explanation":"Pollution bổ sung thêm một nguy cơ sau các hoạt động gây hại đã nêu, nên dùng another + danh từ số ít: ‘Pollution is another significant danger.’ Other cần danh từ số nhiều hoặc từ hạn định khác."},{"number":43,"answer":"as","context":"Additionally, climate change causes coral bleaching, (43) __________ warmer ocean temperatures kill the reefs, leading to long-term consequences.","explanation":"As nối một mệnh đề giải thích nguyên nhân: biến đổi khí hậu gây tẩy trắng san hô vì nhiệt độ biển ấm hơn làm rạn chết. Câu hoàn chỉnh: ‘climate change causes coral bleaching, as warmer ocean temperatures kill the reefs’."},{"number":44,"answer":"there","context":"Despite these challenges, (44) __________ is hope for the future of coral reefs.","explanation":"Cấu trúc tồn tại there is + danh từ số ít: ‘there is hope for the future of coral reefs’. Despite these challenges tạo thế đối lập giữa các mối đe dọa và niềm hy vọng."},{"number":45,"answer":"will / can / could / may / might","context":"If we focus on these efforts, coral reefs (45) __________ continue to thrive, ensuring their survival for future generations.","explanation":"Sau chủ ngữ coral reefs cần một động từ khuyết thiếu rồi động từ nguyên mẫu continue. Will diễn tả kết quả dự đoán mạnh; can nói khả năng; could/may/might nói khả năng dè dặt hơn. Vì câu điều kiện không ấn định mức chắc chắn, các đáp án nguồn nêu đều có thể tạo câu đúng."}]},{"exercise":5,"count":18,"inputKind":"mcq","choices":["A","B","C","D"],"instruction":"Ex 5: Read the following passages and answer the questions.","questions":[{"number":46,"answer":"B","context":"Khía cạnh nào của cuộc sống gia đình tại Bắc Mỹ thời thuộc địa được thảo luận chính?","explanation":"Giải thích của cô: Khía cạnh nào của cuộc sống gia đình tại Bắc Mỹ thời thuộc địa được thảo luận chính?\nBài mô tả toàn bộ việc nấu ăn bằng lò sưởi: kích thước lò, thanh treo nồi, lò nướng bên cạnh và bake kettle. Vì vậy B (fireplace cooking) bao quát nhất; A và C chỉ là chi tiết, D chỉ nhắc một loại gỗ."},{"number":47,"answer":"C","context":"Tác giả nhắc đến lò sưởi ở miền Nam để minh họa điều gì?","explanation":"Giải thích của cô: Tác giả nhắc đến lò sưởi ở miền Nam để minh họa điều gì?\nLò ở Đông Bắc cao bốn hoặc năm feet, còn lò miền Nam ‘often high enough for a person to walk into’. So sánh kích thước này minh họa lò miền Nam thường lớn hơn, nên C đúng; đoạn không so vật liệu, chức năng hay độ an toàn."},{"number":48,"answer":"C","context":"Từ \"it\" ám chỉ cái gì?","explanation":"Giải thích của cô: Từ \"it\" ám chỉ cái gì?\nTrong ‘This timber might be scorched ..., but it was far enough ...’, this timber chính là the mantel tree ở câu trước. Vì vậy it quy chiếu tới mantel tree (C), không phải stonework, opening hay column of heat."},{"number":49,"answer":"D","context":"Theo đoạn văn, thực phẩm thường được nấu trong nồi bằng cách nào vào thế kỷ 17?","explanation":"Giải thích của cô: Theo đoạn văn, thực phẩm thường được nấu trong nồi bằng cách nào vào thế kỷ 17?\nĐoạn 2 nói hai đầu lug pole tựa trên gờ và ‘pots were suspended’ từ thanh này khi nấu. Do đó nồi được treo trên một thanh phía trên lửa (D), không đặt trực tiếp vào lửa hay lò nướng."},{"number":50,"answer":"D","context":"Từ \"obtain\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"obtain\" gần nghĩa nhất với từ nào?\nTrong ‘When iron became easier to obtain’, obtain nghĩa là có được/kiếm được, gần nhất với acquire (D). Maintain là duy trì, reinforce là gia cố, manufacture là sản xuất nên khác nghĩa."},{"number":51,"answer":"C","context":"Nhược điểm của lug pole bằng gỗ được nhắc đến ở đoạn 2 là gì?","explanation":"Giải thích của cô: Nhược điểm của lug pole bằng gỗ được nhắc đến ở đoạn 2 là gì?\nGỗ khô, cháy sém và yếu dần; bài nói thẳng ‘Sometimes the pole broke and the dinner fell into the fire.’ Vì vậy C đúng. Các vấn đề khan hiếm gỗ, khó xoay hoặc quá nóng để chạm không được nêu."},{"number":52,"answer":"B","context":"Có thể suy luận từ đoạn 3 rằng so với các loại củi khác, \"oven wood\" tạo ra?","explanation":"Giải thích của cô: Có thể suy luận từ đoạn 3 rằng so với các loại củi khác, \"oven wood\" tạo ra?\nOven wood được đốt thành ‘a roaring fire’ cho đến khi thành lò ‘extremely hot’; mục đích rõ ràng là tạo nhiệt lớn để nướng bánh. Vì vậy suy ra B (more heat), không có bằng chứng về ít khói, ít than hay ngọn lửa thấp."},{"number":53,"answer":"A","context":"Theo đoạn 3, mọi điều sau đây đều đúng về lò nướng thời thuộc địa, NGOẠI TRỪ?","explanation":"Giải thích của cô: Theo đoạn 3, mọi điều sau đây đều đúng về lò nướng thời thuộc địa, NGOẠI TRỪ?\nBài nói baking days chỉ ‘once or twice a week’, nên lò không được dùng sưởi bếp mỗi ngày; A là phát biểu sai cần chọn ở câu EXCEPT. B, C và D đều được xác nhận: lò là phần của fireplace, có flue vào ống khói chính và dùng brown maple sticks."},{"number":54,"answer":"C","context":"Theo đoạn văn, lợi thế của \"bake kettle\" là gì?","explanation":"Giải thích của cô: Theo đoạn văn, lợi thế của \"bake kettle\" là gì?\nĐoạn mở ‘Not all baking was done in a big oven’ rồi giới thiệu bake kettle đặt trong fireplace. Điều này cho thấy nó có thể dùng thêm hoặc thay lò nướng lớn, tức C. Bài không chứng minh nó tiết kiệm chỗ, không cần đậy kín hay nấu nhiều món cùng lúc."},{"number":55,"answer":"B","context":"Đoạn văn chủ yếu thảo luận về điều gì?","explanation":"Giải thích của cô: Đoạn văn chủ yếu thảo luận về điều gì?\nBài giải thích kiến thợ để pheromone thế nào, vì sao tín hiệu phải đặc trưng, rồi cách kiến dùng râu và dao động qua luồng hơi để bám đường. Vì vậy B, cách kiến đánh dấu và đi theo đường hóa học, bao quát nhất; A và D chỉ là phần nhỏ, C không phải trọng tâm."},{"number":56,"answer":"D","context":"obtain (v) = gain = acquire = attain","explanation":"Giải thích của cô: obtain (v) = gain = acquire = attain\nTrong câu đầu, ants forage across the countryside; forage nghĩa là đi tìm thức ăn, nên D ‘search for food’ là tương đương trực tiếp. Look up, walk toward và revolve around không chứa mục đích kiếm thức ăn."},{"number":57,"answer":"A","context":"Cụm từ \"the one\" ám chỉ cái gì?","explanation":"Giải thích của cô: Cụm từ \"the one\" ám chỉ cái gì?\nCấu trúc ‘Unlike some other messages, such as the one arising from a dead ant’ cho thấy the one thay cho một message. Dead ant chỉ là nguồn phát sinh thông điệp; food trail và species không khớp cấu trúc so sánh."},{"number":58,"answer":"C","context":"Tại sao kiến sử dụng các hợp chất khác nhau làm pheromone đường mòn?","explanation":"Giải thích của cô: Tại sao kiến sử dụng các hợp chất khác nhau làm pheromone đường mòn?\nBài nói đường thức ăn ‘has to be kept secret from members of other species’, rồi ngay sau đó giải thích các loài kiến dùng nhiều hợp chất khác nhau. Vì vậy C đúng: bảo vệ/che giấu đường đi khỏi loài khác; bài không nói giảm độ nhạy, hút loại kiến khác hay báo khoảng cách."},{"number":59,"answer":"A","context":"Tác giả nhắc đến pheromone của kiến cắt lá ở dòng 11 để chỉ ra điều gì?","explanation":"Giải thích của cô: Tác giả nhắc đến pheromone của kiến cắt lá ở dòng 11 để chỉ ra điều gì?\nChỉ một milligram pheromone của Atta texana đã đủ dẫn một hàng kiến vòng quanh Trái Đất ba lần. Con số này minh họa lượng hóa chất cần để đánh dấu đường cực nhỏ (A), không phải kiến tạo tới một milligram hay phân bố của loài."},{"number":60,"answer":"D","context":"Kiến được dẫn đường bởi pheromone như thế nào?","explanation":"Giải thích của cô: Kiến được dẫn đường bởi pheromone như thế nào?\nĐoạn 3 nói kiến phát hiện hơi pheromone ‘with receptors in its antennae’ rồi luân phiên đưa hai râu vào vapor space. Vì vậy D đúng; kiến không chỉ ngửi thức ăn, không theo một con dẫn đường và cũng không tránh luồng hơi."},{"number":61,"answer":"B","context":"Từ \"furnish\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"furnish\" gần nghĩa nhất với từ nào?\nTrong ‘evaporate to furnish the highest concentration of vapor’, furnish nghĩa là tạo ra/cung cấp, gần nhất với provide (B). Include, cover và select không diễn đạt việc hơi bay lên tạo nồng độ cao."},{"number":62,"answer":"C","context":"Từ \"oscillating\" gần nghĩa nhất với từ nào?","explanation":"Giải thích của cô: Từ \"oscillating\" gần nghĩa nhất với từ nào?\nNgay sau từ này tác giả diễn giải ‘from side to side’ và mô tả kiến swing sang trái rồi sang phải. Vì vậy oscillating gần nghĩa với swinging (C), không phải falling, depositing hay starting."},{"number":63,"answer":"B","context":"Lượng hơi pheromone cao nhất được tìm thấy ở đâu?","explanation":"Giải thích của cô: Lượng hơi pheromone cao nhất được tìm thấy ở đâu?\nBài nêu trực tiếp pheromone tạo ‘the highest concentration of vapor right over the trail’, trong vapor space. Do đó B ‘just above the trail’ đúng; các thụ thể chỉ nhận tín hiệu, còn thức ăn và đất dưới đường không phải nơi nồng độ hơi cao nhất."}]}]}</script>

  <script>/* RI2 grading is deliberately deterministic: only approved keys and explicit

(function (root, factory) {

  else root.RI2Grading = factory();
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  const SMALL = Object.freeze({ zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5,

    thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17,
    eighteen: 18, nineteen: 19 });
  const TENS = Object.freeze({ twenty: 20, thirty: 30, forty: 40, fifty: 50,
    sixty: 60, seventy: 70, eighty: 80, ninety: 90 });
  const SCALES = Object.freeze({ thousand: 1000, million: 1000000, billion: 1000000000 });
  const ORDINALS = Object.freeze({ zeroth: "zero", first: "one", second: "two", third: "three",
    fourth: "four", fifth: "five", sixth: "six", seventh: "seven", eighth: "eight",
    ninth: "nine", tenth: "ten", eleventh: "eleven", twelfth: "twelve", thirteenth: "thirteen",
    fourteenth: "fourteen", fifteenth: "fifteen", sixteenth: "sixteen", seventeenth: "seventeen",
    eighteenth: "eighteen", nineteenth: "nineteen", twentieth: "twenty", thirtieth: "thirty",
    fortieth: "forty", fiftieth: "fifty", sixtieth: "sixty", seventieth: "seventy",
    eightieth: "eighty", ninetieth: "ninety", hundredth: "hundred", thousandth: "thousand",
    millionth: "million", billionth: "billion" });
  const own = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
  const cardinalWord = word => own(SMALL, word) || own(TENS, word) || own(SCALES, word) || word === "hundred";
  const numericWord = word => cardinalWord(word) || own(ORDINALS, word);

  function inputText(value) {
    if (typeof value === "string") return value;
    if (typeof value === "number" && Number.isFinite(value)) return String(value);
    return "";
  }

  function basicText(value) {
    return inputText(value).normalize("NFKC").toLowerCase()
      .replace(/[\u200B-\u200D\uFEFF\u00AD]/g, "")
      .replace(/[‘’‛ʼ′]/g, "'")
      .replace(/[‐‑‒–—―−]/g, "-")
      .replace(/\s+/g, " ").trim();
  }

  function unwrap(value) {
    const pairs = { '"': '"', "'": "'", "“": "”", "‘": "’", "(": ")", "[": "]", "{": "}" };
    let result = value.trim();
    // Only a balanced wrapper is presentation punctuation, not a missing bracket.
    for (let depth = 0; depth < 4 && result.length > 1; depth += 1) {
      if (pairs[result[0]] !== result[result.length - 1]) break;
      result = result.slice(1, -1).trim();
    }
    return result;
  }

  function meridiem(value) {
    return value.replace(/(?<![a-z])([ap])\s*\.?\s*m\s*\.?(?![a-z])/g, "$1m");
  }

  function policyFor(expected, question) {
    const text = basicText(expected);
    const timeText = meridiem(text);
    const time = /\bo\s*'?\s*clock\b/.test(timeText) ? "oclock"
      : /(?<![a-z])[ap]m(?![a-z])/.test(timeText) ? "meridiem"
      : /\b\d{1,2}\s*:\s*\d{2}\b/.test(timeText) ? "clock" : "none";
    let numbers = /\d/.test(text);
    // Standalone One/First and anaphoric "the one" are grammatical keys in RI2.
    // A caller may explicitly opt in for a numeric-only word answer.
    const quantity = text.replace(/^(?:at least|more than|less than|nearly|about|approximately|over|under|up to|around)\s+/, "");
    const words = quantity.replace(/-/g, " ").split(/\s+/);
    let length = 0;
    while (length < words.length && (numericWord(words[length]) || words[length] === "and")) length += 1;
    const qualifier = quantity !== text;
    const grammaticalTail = /^(?:of|that|which|who|whom|to|by|with|for|as|than)$/;
    if (length > 0 && (qualifier || (length < words.length && !grammaticalTail.test(words[length])) || length > 1)) numbers = true;
    if (question && typeof question.numberFormatting === "boolean") numbers = question.numberFormatting;
    return { numbers, time, degrees: /°|º|˚|\bdegrees\b/.test(inputText(expected).toLowerCase()) };
  }

  function surface(value, policy) {
    let text = inputText(value);
    if (policy.degrees) text = text.replace(/[º˚]/g, "°");
    text = meridiem(basicText(unwrap(text)));
    // A single final sentence mark is harmless; internal numeric punctuation stays.
    text = text.replace(/[.!?,;:]$/, "").trim();
    text = unwrap(text)
      .replace(/(?<=[a-z])\s*-\s*(?=[a-z0-9])|(?<=[0-9])\s*-\s*(?=[a-z])/g, " ")
      .replace(/%/g, " percent ")
      .replace(/\bper\s+cent\b/g, "percent")
      .replace(/\s*\/\s*/g, "/")
      .replace(/\s*,\s*/g, ", ");
    if (policy.time === "oclock") text = text.replace(/\bo\s*'?\s*clock\b/g, "oclock");
    return text.replace(/\s+/g, " ").trim();
  }

  function parseCardinal(words) {
    let total = 0, group = 0, previous = "start", previousSmall = -1, lastScale = Infinity;
    for (const word of words) {
      if (word === "and") {
        if (previous !== "hundred" && previous !== "scale") return null;
        previous = "and";
      } else if (own(SMALL, word)) {
        const number = SMALL[word];
        if (number === 0 ? words.length !== 1 : number < 10
          ? !["start", "tens", "hundred", "scale", "and"].includes(previous)
          : !["start", "hundred", "scale", "and"].includes(previous)) return null;
        group += number;
        previous = number < 10 ? "small" : "teen";
        previousSmall = number;
      } else if (own(TENS, word)) {
        if (!["start", "hundred", "scale", "and"].includes(previous)) return null;
        group += TENS[word]; previous = "tens"; previousSmall = -1;
      } else if (word === "hundred") {
        if (previous !== "small" || previousSmall < 1 || previousSmall > 9 || group > 9) return null;
        group *= 100; previous = "hundred"; previousSmall = -1;
      } else {
        const scale = SCALES[word];
        if (!scale || !group || previous === "and" || scale >= lastScale) return null;
        total += group * scale; group = 0; previous = "scale"; previousSmall = -1; lastScale = scale;
      }
    }
    const number = total + group;
    return previous !== "start" && previous !== "and" && Number.isSafeInteger(number) ? number : null;
  }

  function suffix(number) {
    const tail = number % 100;
    return tail >= 11 && tail <= 13 ? "th" : number % 10 === 1 ? "st" : number % 10 === 2 ? "nd" : number % 10 === 3 ? "rd" : "th";
  }

  function parseWords(words) {
    const final = words[words.length - 1];
    if (!own(ORDINALS, final)) {
      const number = parseCardinal(words);
      return number === null ? null : String(number);
    }
    if (words.slice(0, -1).some(word => own(ORDINALS, word))) return null;
    const cardinal = ORDINALS[final];
    const number = words.length === 1 && (cardinal === "hundred" || own(SCALES, cardinal))
      ? (cardinal === "hundred" ? 100 : SCALES[cardinal])
      : parseCardinal(words.slice(0, -1).concat(cardinal));

    box.appendChild(node("p", "result-kicker", "KẾT QUẢ"));
    const numbers = node("div", "result-numbers");
    const score = node("div", "result-score", String(grade.score));
    score.appendChild(node("small", "", " / " + grade.total));
    numbers.append(score, node("div", "result-percent", String(grade.percent) + "%"));
    box.appendChild(numbers);
    const title = node("h3", "", grade.score === grade.total ? "Hoàn thành tất cả các câu" : grade.wrong.length + " câu cần sửa");
    title.id = "result-heading";
    box.appendChild(title);
    if (grade.wrong.length) {
      const wrongLabel = node("p", "result-wrong-label", "CÂU SAI");
      const jumps = node("div", "wrong-jumps");
      grade.wrong.forEach((result) => {
        const button = node("button", "", String(result.number));
        button.type = "button";
        button.setAttribute("aria-label", "Xem câu sai " + result.number);
        button.addEventListener("click", () => setReviewMode("wrong", result.number));
        jumps.appendChild(button);
      });
      box.append(wrongLabel, jumps);
    }
    const toggles = node("div", "review-toggle");
    const wrongButton = node("button", reviewMode === "wrong" ? "active" : "", "CÂU SAI (" + grade.wrong.length + ")");
    wrongButton.type = "button";
    wrongButton.hidden = grade.wrong.length === 0;
    wrongButton.setAttribute("aria-pressed", String(reviewMode === "wrong"));
    wrongButton.addEventListener("click", () => setReviewMode("wrong"));
    const allButton = node("button", reviewMode === "all" ? "active" : "", "TẤT CẢ (" + grade.total + ")");
    allButton.type = "button";
    allButton.setAttribute("aria-pressed", String(reviewMode === "all"));
    allButton.addEventListener("click", () => setReviewMode("all"));
    toggles.append(wrongButton, allButton);
    box.appendChild(toggles);
    target.appendChild(box);
  }

  function renderDelivery() {
    const target = $("delivery-status");
    target.replaceChildren();
    const pending = !!attempt && ["sending", "pending"].includes(attempt.delivery && attempt.delivery.state);
    $("new-attempt").disabled = pending;
    $("new-attempt").textContent = pending ? "ĐANG LƯU ĐIỂM…" : "LÀM MỘT LƯỢT MỚI ↻";
    const state = attempt.delivery && attempt.delivery.state;
    target.hidden = !attempt || !attempt.submittedAt || !["unconfirmed", "not-configured", "test-mode"].includes(state);
    if (target.hidden) return;
    const messages = {
      unconfirmed: ["Chưa lưu được điểm", "Vui lòng kiểm tra mạng hoặc báo giáo viên."],
      "not-configured": ["Chưa lưu được điểm", "Vui lòng báo giáo viên."],
      "test-mode": ["CHẾ ĐỘ KIỂM THỬ — không ghi điểm", ""]
    };
    const message = messages[state] || messages.unconfirmed;
    target.className = "delivery" + (["unconfirmed", "not-configured"].includes(state) ? " is-warning" : "");
    target.appendChild(node("strong", "", message[0]));
    if (message[1]) target.appendChild(node("span", "", message[1]));
  }

  async function withSubmissionLock(action) {
    if (navigator.locks && typeof navigator.locks.request === "function") {
      let actionStarted = false;
      try {
        return await navigator.locks.request(storageBase + ":submit:" + attempt.id, { mode: "exclusive" }, () => {
          actionStarted = true;
          return action();
        });
      } catch (error) {
        if (actionStarted) throw error;
        // Some embedded/partitioned contexts expose Web Locks but reject access.
        return action();
      }
    }
    return action();
  }

  async function submitAttempt(event) {
    event.preventDefault();
    if (!attempt || attempt.submittedAt || submitting) return;
    $("form-error").hidden = true;
    if (answeredCount() !== questions.length) {
      $("form-error").textContent = "Bạn cần trả lời đủ toàn bộ câu trước khi chấm bài.";
      $("form-error").hidden = false;
      const missing = questions.find((question) => !plainText(attempt.answers[String(question.number)]));
      const input = missing && $("answer-" + missing.number);
      if (input) input.focus();
      return;
    }
    submitting = true;
    renderAnswers();
    let shouldSend = false;
    try {
      shouldSend = await withSubmissionLock(() => {
        const saved = readStorage(attemptKey(attempt.id));
        if (validStoredAttempt(saved) && saved.submittedAt) {
          attempt = saved;
          if (["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) attempt.delivery = { state: "unconfirmed", reason: "already-submitted" };
          return false;
        }
        const grade = globalThis.RI2Grading.gradeAttempt(unit, attempt.answers);
        if (!grade.complete) throw new Error("incomplete");
        attempt.grade = grade;
        attempt.submittedAt = new Date().toISOString();
        attempt.delivery = { state: "sending", attemptedAt: attempt.submittedAt };
        persist();
        return true;
      });
    } catch (_) {
      $("form-error").textContent = "Chưa thể chấm bài. Các câu trả lời vẫn được giữ; vui lòng kiểm tra lại hoặc báo giáo viên.";
      $("form-error").hidden = false;
    } finally {
      submitting = false;
      renderAnswers();
      if (attempt.submittedAt) {
        $("answer-scroll").scrollTop = 0;
        $("answer-scroll").focus({ preventScroll: true });
      }
    }
    if (shouldSend) await sendScore(attempt.id);
  }

  function configuredFormSink() {
    if (course.testing === true) return null;
    const sink = course.scoreSink;
    if (!sink || sink.kind !== "google-form" || !sink.entries || typeof sink.formResponseUrl !== "string") return null;
    try {
      const url = new URL(sink.formResponseUrl);
      if (url.protocol !== "https:" || url.hostname !== "docs.google.com" || !/^\/forms\/d\/(?:e\/)?[^/]+\/formResponse\/?$/.test(url.pathname)) return null;
      const required = ["name", "total", "assignmentCode", "lesson", "activity", "className", "percent", "score", "wrong"];
      if (required.some((field) => !/^entry\.\d+$/.test(sink.entries[field] || ""))) return null;
      return sink;
    } catch (_) { return null; }
  }

  function scoreBody(sink, snapshot) {
    const grade = snapshot.grade;
    const values = {
      name: snapshot.identity.name,
      className: snapshot.identity.className,
      total: String(grade.total),
      assignmentCode: plainText(unit.testCode),
      lesson: unitLabel(),
      activity: "Làm lại đề · Lượt " + snapshot.number + " · Mã lượt " + snapshot.id + " · " + snapshot.submittedAt,
      percent: String(grade.percent),
      score: String(grade.score),
      wrong: grade.wrong.length ? grade.wrong.map((result) => "Câu " + result.number + ": " + plainText(result.actual) + " → " + plainText(result.answer)).join("\n") : "Không có câu sai"
    };
    const body = new URLSearchParams();
    Object.keys(values).forEach((field) => body.set(sink.entries[field], values[field]));
    // Only use additional form mappings when explicitly supplied by the course configuration.
    const optional = { attemptId: snapshot.id, attemptNumber: String(snapshot.number), submittedAt: snapshot.submittedAt, startedAt: snapshot.startedAt };
    Object.keys(optional).forEach((field) => { if (/^entry\.\d+$/.test(sink.entries[field] || "")) body.set(sink.entries[field], optional[field]); });
    return body;
  }

  async function sendScore(id) {
    if (!attempt || attempt.id !== id || !attempt.submittedAt) return;
    if (course.testing === true) {
      attempt.delivery = { state: "test-mode" };
      persist();
      renderDelivery();
      return;
    }
    const sink = configuredFormSink();
    if (!sink) {
      attempt.delivery = { state: "not-configured" };
      persist();
      renderDelivery();
      return;
    }
    const snapshot = JSON.parse(JSON.stringify(attempt));
    const controller = typeof AbortController === "function" ? new AbortController() : null;
    const timeout = controller ? setTimeout(() => controller.abort(), 25000) : null;
    try {
      // Google Forms is intentionally no-cors: an opaque response is NOT a storage confirmation.
      await fetch(sink.formResponseUrl, { method: "POST", mode: "no-cors", credentials: "omit", body: scoreBody(sink, snapshot), ...(controller ? { signal: controller.signal } : {}) });
      snapshot.delivery = { state: "sent-unverified", attemptedAt: snapshot.delivery.attemptedAt, requestFinishedAt: new Date().toISOString() };
    } catch (_) {
      snapshot.delivery = { state: "unconfirmed", attemptedAt: snapshot.delivery.attemptedAt, reason: "network" };
    } finally {
      if (timeout !== null) clearTimeout(timeout);
    }
    try { localStorage.setItem(attemptKey(id), JSON.stringify(snapshot)); } catch (_) { storageAvailable = false; }
    if (attempt && attempt.id === id) {
      attempt.delivery = snapshot.delivery;
      persist();
      renderDelivery();
    }
  }

  function startNewAttempt() {
    if (!attempt || !attempt.submittedAt || submitting || ["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) return;
    attempt = createAttempt(Number(attempt.number || 1) + 1);
    reviewMode = "wrong";
    persist({ makeCurrent: true });
    $("form-error").hidden = true;
    renderAnswers();
    $("answer-scroll").scrollTop = 0;
    const first = questions[0] && $("answer-" + questions[0].number);
    if (first) first.focus({ preventScroll: true });
  }

  function receiveStorageUpdate(event) {
    if (!attempt || !storageBase || event.key !== attemptKey(attempt.id) || !event.newValue) return;
    try {
      const saved = JSON.parse(event.newValue);
      if (!validStoredAttempt(saved) || !saved.submittedAt) return;
      attempt = saved;
      if (["sending", "pending"].includes(attempt.delivery && attempt.delivery.state)) attempt.delivery = { state: "unconfirmed", reason: "another-tab" };
      renderAnswers();
    } catch (_) { /* Ignore unrelated or incomplete browser-storage events. */ }
  }

  initialize();
}());
</script>
